const isSameDay = (date, target) => {
  const p = parseD(date);
  const t = localDayStart(target);
  return !!(p && t && localDayStart(p).getTime() === t.getTime());
};

function isDesktopMode() {
  return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(min-width: 768px)').matches;
}

function desktopEmpty(icon, title, sub) {
  return `<div class="desktop-empty"><div class="desktop-empty-icon">${icon}</div><div style="font-weight:900;color:var(--text);margin-bottom:3px">${title}</div><div>${sub||''}</div></div>`;
}

function desktopKpi(label, value, sub, tone) {
  const color = tone === 'danger' ? 'var(--danger)' : tone === 'warn' ? 'var(--amber)' : tone === 'info' ? 'var(--info)' : 'var(--accent)';
  return `<div class="desktop-kpi">
    <div class="desktop-kpi-label">${label}</div>
    <div class="desktop-kpi-value" style="color:${color}">${value}</div>
    <div class="desktop-kpi-sub">${sub||''}</div>
  </div>`;
}

function desktopStatus(label, tone) {
  return `<span class="desktop-status ${tone||'neutral'}">${label}</span>`;
}

function desktopPageHead(title, subtitle, actions) {
  return `<div class="desktop-page-head">
    <div><h1 class="display desktop-title">${title}</h1><div class="desktop-subtitle">${subtitle||''}</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${actions||''}</div>
  </div>`;
}

function desktopPaymentStatusText(item) {
  const method = item.method || '';
  const status = item.paymentStatus || '';
  if (item.checkId || method.includes("צ'ק") || status.includes('פירעון')) return ['צ׳ק ממתין', 'warn'];
  if (method.includes('העברה')) return ['העברה לתשלום', 'info'];
  if (method.includes('מזומן')) return ['מזומן לתשלום', 'warn'];
  if (status.includes('שולם')) return ['שולם', 'ok'];
  return [status || 'ממתין לתשלום', item.isOverdue ? 'danger' : 'neutral'];
}

function desktopPaymentsData() {
  const today = pvTodayISO();
  const activeDebts = ((pv && pv.debts) || []).filter(d => !['paid','cancelled'].includes(d.status) && (typeof pvIsOpenStatus !== 'function' || pvIsOpenStatus(d.paymentStatus)));
  const openChecks = (DB.checks || []).filter(c => !c.cleared);
  const linkedOpenDebtIds = new Set(openChecks.map(c => c.linkedDebtId).filter(Boolean));
  const payments = [];
  activeDebts.forEach(d => {
    if (linkedOpenDebtIds.has(d.id)) return;
    const amount = (+d.amount || 0) - (+d.paidAmount || 0);
    payments.push({
      id: d.id, type: 'debt', date: pvDateISO(d.dueDate || d.date), supplier: d.supplierName || '',
      amount, method: d.paymentMethod || '', paymentStatus: d.paymentStatus || 'ממתין לתשלום',
      invoiceNumber: d.invoiceNumber || '', isOverdue: pvDateISO(d.dueDate || d.date) < today
    });
  });
  openChecks.forEach(c => {
    const date = pvDateISO(c.clearDate);
    payments.push({
      id: c.id, type: 'check', date, supplier: c.supplier || '', amount: +c.amount || 0,
      method: "צ'ק", paymentStatus: 'ממתין לפירעון', checkNumber: c.checkNum || '',
      isOverdue: date && date < today
    });
  });
  return payments.sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
    return a.date.localeCompare(b.date);
  });
}

function renderDashboard() {
  if (isDesktopMode()) return renderDesktopDashboard();
  const now = new Date();
  const h = now.getHours();
  const DAY_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const greeting = h<12?'בוקר טוב':h<17?'צהריים טובים':'ערב טוב';

  // ── Stats ────────────────────────────────────────────────────────
  const todayExpTotal = DB.expenses.filter(e=>isToday(e.date)).reduce((s,e)=>s+(+e.total_amount||0),0);

  const monthTotal    = DB.expenses.filter(e=>isMonth(e.date)).reduce((s,e)=>s+(+e.total_amount||0),0);
  const pendingAcc    = DB.expenses.filter(e=>['חשבונית מס','חשבונית מס קבלה'].includes(e.document_type)&&!e.sentToAccountant).length;
  const openChecks    = (DB.checks||[]).filter(c=>!c.cleared).sort((a,b)=>parseD(a.clearDate)-parseD(b.clearDate));
  const openChecksTotal = openChecks.reduce((s,c)=>s+(+c.amount||0),0);
  const overdueChecks = openChecks.filter(c=>checkUrgency(c.clearDate)==='overdue');

function handleFile(file, autoScan) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const full = e.target.result;
    downscaleScanImage(full, file.type).then(({dataUrl, mime}) => {
      setState({scanImg:dataUrl,scanB64:dataUrl.split(',')[1],scanMime:mime,scanStage:'preview',scanErr:'',scanNotice:''});
      if (autoScan) setTimeout(runScan, 80);
    }).catch(() => {
      setState({scanImg:full,scanB64:full.split(',')[1],scanMime:file.type,scanStage:'preview',scanErr:'',scanNotice:''});
      if (autoScan) setTimeout(runScan, 80);
    });
  };
  rd.readAsDataURL(file);
}

function downscaleScanImage(dataUrl, mime) {
  return new Promise((resolve, reject) => {
    if (!String(mime || '').startsWith('image/')) return resolve({dataUrl, mime});
    const img = new Image();
    img.onload = () => {
      const maxSide = 1400;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      if (scale >= 1 && dataUrl.length < 900000) return resolve({dataUrl, mime});
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const out = canvas.toDataURL('image/jpeg', 0.72);
      resolve({dataUrl: out, mime: 'image/jpeg'});
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Load multiple files — process first, queue the rest
function handleMultipleFiles(files, autoScanBatch) {
  if (!files || files.length === 0) return;
  const arr = Array.from(files);
  state.batchAutoScan = !!autoScanBatch;
  if (arr.length === 1) { state.batchTotal = 0; state.batchQueue = []; handleFile(arr[0], !!autoScanBatch); return; }
  state.batchQueue = arr.slice(1);
  state.batchTotal = arr.length;
  handleFile(arr[0], !!autoScanBatch);
}

// Skip current file, load next from queue
function skipBatchFile() {
  if (state.batchQueue && state.batchQueue.length > 0) {
    const next = state.batchQueue.shift();
    handleFile(next, state.batchAutoScan);
  } else {
    exitBatch();
  }
}

// Exit batch mode entirely
function exitBatch() {
  setState({scanStage:'idle', scanImg:null, scanErr:'', scanNotice:'', scanForm:null, batchQueue:[], batchTotal:0, batchAutoScan:false});
}

// Multiple checks — process first, queue the rest
function handleMultipleCheckFiles(files) {
  if (!files || files.length === 0) return;
  const arr = Array.from(files);
  if (arr.length === 1) { handleCheckScanFile(arr[0]); return; }
  state.checkBatchQueue = arr.slice(1);
  state.checkBatchTotal = arr.length;
  handleCheckScanFile(arr[0]);
}


async function runScan() {
  setState({scanStage:'scanning',scanErr:'',scanNotice:''});
  try {
    const data = await scanInvoice(state.scanB64, state.scanMime);
    setState({
      scanStage:'confirm',
      scanForm: {
        id: uid(), image: state.scanImg,
        date: data.date||todayStr(), supplier: data.supplier||'',
        total_amount: +data.total_amount||0, vat_amount: +data.vat_amount||0,
        amount_before_vat: +data.amount_before_vat||0,
        category: data.category||'אחר', document_type: data.document_type||'חשבונית מס',
        document_number: data.document_number||'', notes: data.notes||'',
        linkedOrderId: '',
        line_items: Array.isArray(data.line_items) ? data.line_items : [],
      }
    });
  } catch(e) {
    if (isQuotaError(e)) {
      const msg = 'מכסת ה-AI נגמרה זמנית. פתחתי טופס ידני עם התמונה כדי שתוכל לשמור בלי להיתקע.';
      toast(msg, 'info');
      setState({
        scanStage:'confirm',
        scanErr: '',
        scanNotice: msg,
        scanForm: {
          id: uid(), image: state.scanImg,
          date: todayStr(), supplier: addForm.supplier || '',
          total_amount:0, vat_amount:0, amount_before_vat:0,
          category: CATS[0]||'אחר', document_type:'חשבונית מס',
          document_number:'', notes: addForm.notes || '',
          linkedOrderId: addForm.linkedOrderId || '',
          line_items: [],
        }
      });
    } else {
      setState({scanErr:e.message,scanStage:'preview'});
    }
  }
}

    total_amount:0, vat_amount:0, amount_before_vat:0, category: CATS[0]||'אחר',
    document_type:'חשבונית מס', document_number:'', line_items: [],
    linkedOrderId: addForm.linkedOrderId || '',
    notes: addForm.notes || ''          // use pre-filled notes if came from orders
  }});
}

// ─── Duplicate detection ───────────────────────────────────────────────────
function findDuplicate(item) {
  const dn = item.document_number ? String(item.document_number).trim() : '';
  const exact = DB.expenses.find(e =>
    e.id !== item.id &&
    String(e.supplier || '').trim() === String(item.supplier || '').trim() &&
    String(e.document_type || '').trim() === String(item.document_type || '').trim() &&
    String(e.document_number || '').trim() === dn &&
    String(e.date || '').trim() === String(item.date || '').trim() &&
    Math.abs((+e.total_amount || 0) - (+item.total_amount || 0)) < 0.01
  );
  if (dn && exact) return { strength: 'exact', match: exact };

  // Strong: same non-empty document number + same supplier
  if (dn) {
    const byDoc = DB.expenses.find(e =>
      e.id !== item.id &&
      e.supplier === item.supplier &&
      e.document_number && String(e.document_number).trim() === dn
    );
    if (byDoc) return { strength: 'strong', match: byDoc };
  }
  // Soft: same supplier + same total amount + same date
  if (item.total_amount && item.supplier) {
    const byAmt = DB.expenses.find(e =>
      e.id !== item.id &&
      e.supplier === item.supplier &&
      Math.abs((+e.total_amount || 0) - (+item.total_amount || 0)) < 0.01 &&
      String(e.date) === String(item.date)
    );
    if (byAmt) return { strength: 'soft', match: byAmt };
  }
  return null;
}

function warnDuplicate(dup) {
  const m = dup.match;
  const d = fmtDate(m.date);
  const a = fmtCurr(m.total_amount);
  if (dup.strength === 'exact') {
    toast('התעודה הזו כבר קיימת — לא נשמרה כפילות', 'error');
    return false;
  }
  if (dup.strength === 'strong') {
    return confirm(
      `⚠️ מסמך כפול!\n\nמספר מסמך ${m.document_number} מ"${m.supplier}" כבר קיים:\nתאריך: ${d} | סכום: ${a}\n\nלשמור בכל זאת?`
    );
  }
  return confirm(
    `⚠️ הוצאה דומה קיימת!\n\nנמצאה הוצאה מ"${m.supplier}" מתאריך ${d} בסכום ${a}.\nייתכן שמדובר בהוצאה כפולה.\n\nלשמור בכל זאת?`
  );
}

function expenseExactDedupeKey(item) {
  const dn = String(item?.document_number || '').trim();
  if (!dn) return '';
  const amount = Number(item?.total_amount || 0).toFixed(2);
  return [
    String(item?.supplier || '').trim(),
    String(item?.document_type || '').trim(),
    dn,
    String(item?.date || '').trim(),
    amount
  ].join('|').toLowerCase();
}

function dedupeExactExpenses() {
  if (!Array.isArray(DB.expenses) || DB.expenses.length < 2) return 0;
  const seen = new Map();
  const cleaned = [];
  let removed = 0;
  DB.expenses.forEach(item => {
    const key = expenseExactDedupeKey(item);
    if (!key) {
      cleaned.push(item);
      return;
    }
    const existing = seen.get(key);
    if (existing) {
      if (!existing.image && item.image) existing.image = item.image;
      removed++;
      return;
    }
    seen.set(key, item);
    cleaned.push(item);
  });
  if (removed) {
    DB.expenses = cleaned;
    markDataStateDirty();
    persistLocal();
  }
  return removed;
}

let scanSaveInFlight = false;

function normalizeScanExpenseItem(raw) {
  if (!raw) throw new Error('אין נתוני חשבונית לשמירה');
  const item = {...raw};
  item.id = item.id || uid();
  item.supplier = String(item.supplier || '').trim();
  item.category = item.category || CATS[0] || 'אחר';
  item.document_type = item.document_type || 'חשבונית מס';
  item.document_number = String(item.document_number || '').trim();
  item.notes = String(item.notes || '').trim();
  const parsedDate = parseD(item.date || todayStr());
  if (!parsedDate || Number.isNaN(parsedDate.getTime())) throw new Error('תאריך לא תקין');
  item.date = isoToHe(toISO(parsedDate));
  item.total_amount = Number(item.total_amount || 0);
  item.vat_amount = Number(item.vat_amount || 0);
  item.amount_before_vat = Number(item.amount_before_vat || 0);
  if (item.paymentDueDate) item.paymentDueDate = heToISO(item.paymentDueDate);
  if (!item.supplier) throw new Error('חסר ספק');
  if (!Number.isFinite(item.total_amount) || item.total_amount <= 0) throw new Error('סכום כולל חייב להיות גדול מ-0');
  if (!Number.isFinite(item.vat_amount)) throw new Error('מע"מ לא תקין');
  if (!Number.isFinite(item.amount_before_vat)) throw new Error('סכום לפני מע"מ לא תקין');
  return item;
}

function syncScannedExpenseInBackground(item) {
  if (!CFG.webAppUrl) {
    console.info('[scan-save] saved locally only: no Google Sheets Web App URL configured', {id:item.id});
    return;
  }
  console.info('[scan-save] sending expense to Google Sheets', {
    id:item.id,
    supplier:item.supplier,
    document_type:item.document_type,
    document_number:item.document_number,
    total_amount:item.total_amount,
    date:item.date
  });
  setSyncStatus('syncing');
  pushExpenseAdd(item).then(() => {
    console.info('[scan-save] Google Sheets sync succeeded', {id:item.id});
    setSyncStatus('ok');
  }).catch(e => {
    console.error('[scan-save] Google Sheets sync failed; queued for retry', {
      message:e?.message || String(e),
      expense:item
    });
    queueExpenseAdd(item);
    if (isQuotaError(e)) {
      pauseSyncForQuota(e);
    } else {
      setSyncStatus('offline');
      toast('נשמר מקומית, אבל הסנכרון לענן נכשל וינוסה שוב', 'info');
    }
  });
}

async function saveScanResult() {
  if (scanSaveInFlight) return;
  scanSaveInFlight = true;
  setState({scanSaving:true, scanErr:'', scanNotice:''});
  try {
    const item = normalizeScanExpenseItem(state.scanForm);
    const supplier = findApprovedSupplier(item.supplier);
    if (supplier) item.supplier = supplier.name;
    else item.supplier_match_status = 'requires_manual_link';
    if (supplier?.defaultCategory) item.category = supplier.defaultCategory;
    const dup = findDuplicate(item);
    if (dup && !warnDuplicate(dup)) return;
    const localItem = {...item};
    // ── Synchronous: apply locally + navigate in the SAME JS tick ──
    DB.expenses.unshift(localItem);
    applyExpenseOrderLink(localItem);
    if (['חשבונית מס','חשבונית מס קבלה'].includes(localItem.document_type)) {
      pvCreateDraftSupplierInvoiceFromExpense(localItem);
    } else if (localItem.document_type === 'תעודת משלוח') {
      pvRegisterDeliveryNoteFromExpense(localItem);
    }
    processInvoiceLineItems(localItem);
    dedupeExactExpenses();
    markDataStateDirty();
    persistLocal();
    console.info('[scan-save] local save succeeded', {id:localItem.id, supplier:localItem.supplier, total_amount:localItem.total_amount});

    // If batch mode: load next file instead of navigating away
    if (state.batchQueue && state.batchQueue.length > 0) {
      const next = state.batchQueue.shift();
      const remaining = state.batchQueue.length;
      const done = state.batchTotal - remaining - 1;
      toast(`✓ נשמר (${done}/${state.batchTotal}) · עוד ${remaining} מסמכים`, 'success');
      handleFile(next, state.batchAutoScan); // loads next file, and auto-scans in multi-scan mode
    } else {
      const wasInBatch = state.batchTotal > 1;
      const total = state.batchTotal;
      toast(wasInBatch ? `✓ כל ${total} המסמכים נשמרו` : 'נשמר בהצלחה ✓', 'success');
      setState({tab:'list', scanStage:'idle', scanImg:null, scanForm:null, scanErr:'', scanNotice:'', scanSaving:false, batchQueue:[], batchTotal:0, batchAutoScan:false});
    }
    // ── Cloud sync runs in background and never blocks the save button ──
    syncScannedExpenseInBackground(localItem);
  } catch(e) {
    console.error('[scan-save] save failed', {
      message:e?.message || String(e),
      form: state.scanForm
    });
    setState({scanErr:e.message || 'שמירה נכשלה', scanSaving:false});
    toast('שמירה נכשלה: ' + (e.message || 'שגיאה לא ידועה'), 'error');
  } finally {
    scanSaveInFlight = false;
    if (state.scanSaving) setState({scanSaving:false});
  }
}

// Standalone filter — used by renderList AND surgical search update
function filterExpenseRows() {
  return DB.expenses.filter(e => {
    const mq = !state.listSearch || [e.supplier,e.document_number,e.notes].join(' ').toLowerCase().includes(state.listSearch.toLowerCase());
    const mc = state.listCat==='הכל' || e.category===state.listCat;
    const mp = state.listPer==='הכל' || (state.listPer==='היום'&&isToday(e.date)) || (state.listPer==='שבוע'&&isWeek(e.date)) || (state.listPer==='חודש'&&isMonth(e.date));
    return mq && mc && mp;
  }).sort((a,b)=>{
    const tb = parseD(b.date)?.getTime() || 0;
    const ta = parseD(a.date)?.getTime() || 0;
    return tb !== ta ? tb - ta : String(b.id).localeCompare(String(a.id));
  });
}

async function saveEditExpense() {
  if (!state.editForm || !state.editId) return;
  const f = state.editForm;
  const supplier = requireApprovedSupplier(f.supplier);
  if (!supplier) return;
  f.supplier = supplier.name;
  if (supplier.defaultCategory) f.category = supplier.defaultCategory;
  const editId = state.editId;
  const updated = {
    ...(DB.expenses.find(e => e.id === editId) || {}),
    supplier: f.supplier, date: f.date, category: f.category,
    document_type: f.document_type, document_number: f.document_number,
    total_amount: +f.total_amount||0, vat_amount: +f.vat_amount||0,
    amount_before_vat: (+f.total_amount||0)-(+f.vat_amount||0), notes: f.notes,
    paymentDueDate: f.paymentDueDate||'', paymentTerms: f.paymentTerms||'',
    linkedOrderId: f.linkedOrderId || '',
  };
  // ── Synchronous: apply locally + close modal in the SAME JS tick ──
  DB.expenses = DB.expenses.map(e => e.id === editId ? updated : e);
  applyExpenseOrderLink(updated);
  markDataStateDirty();
  persistLocal();
  setState({editId: null, editForm: null, listOpen: null}); // modal gone before first await
  toast('עודכן ✓', 'success');
  // ── Async: sequential cloud calls in background (no race conditions) ──
  if (!CFG.webAppUrl) return;
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id: editId});
    await pushExpenseAdd(updated);
    setSyncStatus('ok');
  } catch(e) {
    console.error('sync edit:', e);
    PENDING.push({action:'delete_expense', payload:{id: editId}});
    queueExpenseAdd(updated);
    setSyncStatus('offline');
  }
}

async function deleteExpense(id) {
  await queueAndSync('delete_expense', {id}, () => {
    DB.expenses = DB.expenses.filter(e=>e.id!==id);
  });
  setState({listOpen:null});
  toast('נמחק', 'success');
}

async function toggleSentToAccountant(id) {
  const e = DB.expenses.find(x => x.id === id);
  if (!e) return;
  e.sentToAccountant = !e.sentToAccountant;
  // Persist flag separately so it survives cloud sync overwrites
  if (e.sentToAccountant) ACC_FLAGS[id] = true;
  else delete ACC_FLAGS[id];
  saveAccFlags();
  markDataStateDirty();
  persistLocal();
  render();
  toast(e.sentToAccountant ? '✓ סומן כהועבר להנה"ח' : 'הסימון בוטל', e.sentToAccountant ? 'success' : 'info');
  if (!CFG.webAppUrl) return;
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id});
    await pushExpenseAdd(e);
    setSyncStatus('ok');
  } catch(err) {
    PENDING.push({action:'delete_expense', payload:{id}});
    queueExpenseAdd(e);
    setSyncStatus('offline');
  }
}

async function pushExpenseToCloud(id) {
  const e = DB.expenses.find(x => x.id === id);
  if (!e) return;
  if (!CFG.webAppUrl) { toast('אין חיבור לענן', 'info'); return; }
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id});
    markDataStateDirty();
    await pushExpenseAdd(e);
    setSyncStatus('ok');
    toast('נשמר בענן ✓', 'success');
  } catch(err) {
    PENDING.push({action:'delete_expense', payload:{id}});
    queueExpenseAdd(e);
    setSyncStatus('offline');
    toast('ישמר בהמשך', 'info');
  }
}

// ═══════════════════════════════════════════════════════════════════════════
let addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:"",linkedOrderId:""};

function renderAdd() {
  return `
    <div style="padding:20px 20px 100px" class="fade-up">
      <h2 class="display" style="font-size:24px;margin:0 0 18px">הוספה ידנית</h2>
      <div class="field"><label class="label">ספק *</label>${supplierInput('addForm','supplier',addForm.supplier||'','category')}</div>
      <div class="field"><label class="label">תאריך</label><input class="input" type="date" value="${heToISO(addForm.date)}" oninput="addForm.date=isoToHe(this.value)"></div>
      <div class="row">
        <div class="field"><label class="label">סכום כולל ₪ *</label><input class="input" type="number" placeholder="0.00" value="${addForm.total_amount}" oninput="addTotal(this.value)" onkeydown="if(event.key==='Enter')submitAdd()"></div>
        <div class="field"><label class="label">מע"מ</label><input id="add-vat-inp" class="input" type="number" placeholder="אוטו" value="${addForm.vat_amount}" oninput="addForm.vat_amount=this.value"></div>
      </div>
      <div class="field"><label class="label">קטגוריה</label><select class="input" onchange="addForm.category=this.value">${CATS.map(c=>`<option ${c===addForm.category?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="label">סוג מסמך</label><select class="input" onchange="addForm.document_type=this.value">${DTYPES.map(d=>`<option ${d===addForm.document_type?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label class="label">מספר מסמך</label><input class="input" value="${esc(addForm.document_number)}" oninput="addForm.document_number=this.value" onkeydown="if(event.key==='Enter')submitAdd()"></div>
      <div class="field"><label class="label">הערות</label><input class="input" value="${esc(addForm.notes)}" oninput="addForm.notes=this.value" onkeydown="if(event.key==='Enter')submitAdd()"></div>
      ${renderExpenseOrderLinkSelect('addForm', addForm)}
      ${['חשבונית מס','חשבונית מס קבלה'].includes(addForm.document_type)?`
      <div style="padding:12px 14px;border-radius:12px;background:var(--accentSoft);border:1px solid rgba(110,198,58,0.2);margin-bottom:12px">
        <div style="font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">טיוטת חשבונית ספק</div>
        <div style="font-size:12px;color:var(--textDim);line-height:1.45;margin-bottom:10px">החשבונית תישמר כטיוטה לבדיקה בטאב ספקים. היא לא תיכנס לחובות פתוחים עד אישור ידני.</div>
        <div class="row">
          <div class="field"><label class="label">תאריך לתשלום</label><input class="input" type="date" value="${addForm.paymentDueDate||''}" oninput="addForm.paymentDueDate=this.value"></div>
          <div class="field"><label class="label">תנאי תשלום</label><input class="input" placeholder="שוטף+30..." value="${esc(addForm.paymentTerms||'')}" oninput="addForm.paymentTerms=this.value"></div>
        </div>
      </div>`:''}
      ${addForm.document_type==='תעודת משלוח'?`<div style="padding:12px 14px;border-radius:12px;background:var(--surfaceHi);border:1px solid var(--border);margin-bottom:12px;font-size:12px;color:var(--textDim);line-height:1.45">תעודת משלוח תישמר בנפרד ותהיה זמינה לשיוך עתידי לחשבונית. היא לא תהפוך לחוב פתוח.</div>`:''}
      <button class="btn-primary" onclick="submitAdd()">שמור הוצאה</button>
    </div>`;
}

function addTotal(v) {
  addForm.total_amount = v;
  if (v) {
    const t = +v; const vat = Math.round(t/1.17*0.17*100)/100;
    addForm.vat_amount = vat; addForm.amount_before_vat = Math.round((t-vat)*100)/100;
    const vatEl = document.getElementById('add-vat-inp');
    if (vatEl) vatEl.value = vat; // update VAT field without re-rendering (prevents focus jump)
  }
}

async function submitAdd() {
  if (!addForm.supplier) { toast('נא להזין ספק', 'error'); return; }
  if (!addForm.total_amount) { toast('נא להזין סכום', 'error'); return; }
  const supplier = requireApprovedSupplier(addForm.supplier);
  if (!supplier) return;
  addForm.supplier = supplier.name;
  if (supplier.defaultCategory) addForm.category = supplier.defaultCategory;
  const item = {...addForm, id:uid(), total_amount:+addForm.total_amount, vat_amount:+addForm.vat_amount||0, amount_before_vat:+addForm.amount_before_vat||0};
  const dup = findDuplicate(item);
  if (dup && !warnDuplicate(dup)) return;
  await queueAndSync('add_expense', {payload: item}, () => {
    DB.expenses.unshift(item);
    applyExpenseOrderLink(item);
    if (['חשבונית מס','חשבונית מס קבלה'].includes(item.document_type)) pvCreateDraftSupplierInvoiceFromExpense(item);
    else if (item.document_type === 'תעודת משלוח') pvRegisterDeliveryNoteFromExpense(item);
    processInvoiceLineItems(item);
  });
  addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:"",paymentDueDate:"",paymentTerms:"",isOpenDebt:true,linkedOrderId:""};
  toast('נשמר!', 'success');
  setState({tab:'list'});
}

        <button onclick="editFixed('${x.id}')" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:9px;font-size:12px;font-weight:600;background:transparent;color:var(--text);cursor:pointer;font-family:inherit">✏️ ערוך</button>
        <button onclick="delFixed('${x.id}','${esc(x.name).replace(/'/g,'')}')" style="flex:1;padding:8px;border:1px solid rgba(220,98,98,0.2);border-radius:9px;font-size:12px;font-weight:600;background:rgba(220,98,98,0.05);color:var(--danger);cursor:pointer;font-family:inherit">🗑️ מחק</button>
      </div>

  const fixedContent = `
    <div style="padding:0 16px 24px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">

          <div style="font-size:10px;color:var(--textDim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">שנתי</div>

function startFixed() { setState({fixedAdding:true, fixedForm:{name:"",amount:"",category:"שכירות",frequency:"חודשי",day:"1",supplier:"",notes:"",active:true}}); }
function editFixed(id) { const item = DB.fixed.find(x=>x.id===id); if(item) setState({fixedAdding:true, fixedForm:{...item,amount:String(item.amount)}}); }

async function saveFixed() {
  const f = state.fixedForm;
  if (!f.name) { toast('נא למלא שם הוצאה', 'error'); return; }
  if (f.amount===''||f.amount===null||f.amount===undefined) { toast('נא למלא סכום', 'error'); return; }
  if (f.supplier) {
    const supplier = requireApprovedSupplier(f.supplier);
    if (!supplier) return;
    f.supplier = supplier.name;
  }
  const item = {...f, amount:+f.amount};
  if (f.id) {
    await queueAndSync('update_fixed', {payload: item}, () => DB.fixed = DB.fixed.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_fixed', {payload: item}, () => DB.fixed.unshift(item));
  }
  setState({fixedAdding:false, fixedForm:null});
  toast('נשמר', 'success');
}

async function toggleFixed(id) {
  const item = DB.fixed.find(x=>x.id===id);
  if (!item) return;
  const updated = {...item, active: !item.active};
  await queueAndSync('update_fixed', {payload: updated}, () => DB.fixed = DB.fixed.map(x=>x.id===id?updated:x));
}

async function delFixed(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_fixed', {id}, () => DB.fixed = DB.fixed.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

  if (state.installAdding) {

    return `
      <div style="padding:20px 20px 100px" class="fade-up">

        <div class="field"><label class="label">שם ההשקעה *</label><input class="input" placeholder="למשל: מקרר תעשייתי" value="${esc(f.name)}" oninput="state.installForm.name=this.value"></div>
        <div class="row">
          <div class="field"><label class="label">סכום כולל ₪ *</label><input class="input" type="number" placeholder="12000" value="${f.total}" oninput="state.installForm.total=this.value;updatePerInstall()"></div>
          <div class="field"><label class="label">מספר תשלומים *</label><input class="input" type="number" placeholder="12" value="${f.installments}" oninput="state.installForm.installments=this.value;updatePerInstall()"></div>
        </div>
        <div id="per-install-display" style="padding:10px 14px;margin-bottom:14px;background:rgba(143,198,80,0.07);border:1px solid rgba(143,198,80,0.2);border-radius:10px;font-size:13px;color:var(--accent);${perInstall?'':'display:none'}">💡 תשלום חודשי: <span id="per-install-val">${perInstall?fmtCurr(perInstall):''}</span></div>
        <div class="field"><label class="label">תשלומים ששולמו</label><input class="input" type="number" value="${f.paid}" oninput="state.installForm.paid=this.value"></div>
        <div class="field"><label class="label">תאריך תשלום ראשון</label><input class="input" type="date" value="${heToISO(f.first_date)}" oninput="state.installForm.first_date=isoToHe(this.value)"></div>
        <div class="field"><label class="label">ספק</label>${approvedSupplierInput('state.installForm.supplier', f.supplier||'', 'בחר ספק מאושר...')}</div>
        <div class="field"><label class="label">הערות</label><input class="input" value="${esc(f.notes)}" oninput="state.installForm.notes=this.value"></div>
        <button class="btn-primary" onclick="saveInstall()">💾 שמור</button>
        <button class="btn-ghost" onclick="setState({installAdding:false,installForm:null})">ביטול</button>
      </div>`;
  }
  const totalInvested = DB.installments.reduce((s,x)=>s+(+x.total||0),0);
  const totalPaidAmount = DB.installments.reduce((s,x)=>s+(+x.total/(+x.installments||1)*(+x.paid||0)),0);
  const monthlyBurden = DB.installments.filter(x=>+x.paid<+x.installments).reduce((s,x)=>s+(+x.total/(+x.installments||1)),0);

  return `
    <div style="padding:16px 16px 90px" class="fade-up">
      <div style="padding:22px 20px;margin-bottom:12px;border-radius:18px;background:linear-gradient(135deg,var(--surface),var(--surfaceHi));border:1px solid var(--border);position:relative;overflow:hidden">
        <div style="position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(244,185,66,0.13),transparent 70%)"></div>
        <div style="font-size:11px;color:var(--textDim);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;position:relative">סך השקעות</div>
        <div class="display" style="font-size:34px;color:var(--text);margin-bottom:8px;position:relative">${fmtCurr(totalInvested)}</div>
        <div style="display:flex;gap:16px;position:relative;flex-wrap:wrap">
          <div><div style="font-size:10px;color:var(--textDim)">שולם</div><div style="font-size:14px;color:var(--accent);font-weight:700">${fmtCurr(totalPaidAmount)}</div></div>
          <div><div style="font-size:10px;color:var(--textDim)">נותר</div><div style="font-size:14px;color:var(--amber);font-weight:700">${fmtCurr(totalInvested-totalPaidAmount)}</div></div>
          <div><div style="font-size:10px;color:var(--textDim)">חודשי</div><div style="font-size:14px;color:var(--accent2);font-weight:700">${fmtCurr(monthlyBurden)}</div></div>
        </div>
      </div>
      <button class="btn-primary" onclick="startInstall()">+ &nbsp;השקעה חדשה</button>
      ${DB.installments.length===0 ? `<div style="text-align:center;padding:40px 20px;color:var(--textMuted)"><div style="font-size:48px;margin-bottom:10px;opacity:0.4">💳</div><div style="font-size:14px">אין השקעות בתשלומים</div></div>` : ''}
      ${DB.installments.map(x=>{
        const perInstall = (+x.total)/(+x.installments||1);
        const paid = +x.paid||0;
        const paidAmount = perInstall*paid;
        const pct = (paid/(+x.installments||1))*100;
        const done = paid >= +x.installments;
        const isOpen = state.installOpen===x.id;
        const c = done ? 'var(--accent)' : 'var(--amber)';
        return `
          <div style="margin-bottom:10px" class="fade-up">
            <div onclick="setState({installOpen: state.installOpen==='${x.id}'?null:'${x.id}'})" style="background:var(--surface);border:1px solid ${isOpen?'rgba(244,185,66,0.4)':'var(--border)'};border-radius:${isOpen?'14px 14px 0 0':'14px'};padding:16px;cursor:pointer;position:relative;overflow:hidden">
              <div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:${c}"></div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
                <div style="flex:1;min-width:0;margin-right:8px">
                  <div style="font-weight:600;color:var(--text);font-size:15px;margin-bottom:5px">${esc(x.name)}</div>
                  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                    ${done ? `<span style="background:rgba(143,198,80,0.13);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">✓ שולם במלואו</span>` : `<span style="background:rgba(244,185,66,0.13);color:var(--amber);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${paid}/${x.installments}</span>`}
                  </div>
                </div>
                <div style="text-align:left;flex-shrink:0">
                  <div class="display" style="color:var(--text);font-size:17px">${fmtCurr(x.total)}</div>
                  <div style="font-size:10px;color:var(--textDim);margin-top:2px">${fmtCurr(perInstall)}/חודש</div>
                </div>
              </div>
              <div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${done?'linear-gradient(90deg,var(--accent),#6fa83a)':'linear-gradient(90deg,var(--amber),var(--accent2))'}"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:6px">
                <span style="font-size:10px;color:var(--textDim)">שולם: ${fmtCurr(paidAmount)}</span>
                <span style="font-size:10px;color:var(--textDim)">נותר: ${fmtCurr((+x.total)-paidAmount)}</span>
              </div>
            </div>
            ${isOpen ? `
              <div class="fade-up" style="background:var(--surface);border:1px solid rgba(244,185,66,0.4);border-top:none;border-radius:0 0 14px 14px;padding:16px;position:relative">
                <div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:${c}"></div>
                <div style="display:flex;gap:8px;margin-bottom:8px">
                  <button onclick="markPaid('${x.id}',-1)" ${paid===0?'disabled':''} style="flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;background:transparent;color:${paid===0?'var(--textMuted)':'var(--text)'};cursor:${paid===0?'not-allowed':'pointer'};font-family:inherit">− הסר תשלום</button>
                  <button onclick="markPaid('${x.id}',1)" ${done?'disabled':''} style="flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:700;background:${done?'var(--border)':'linear-gradient(135deg,var(--accent),#6fa83a)'};color:${done?'var(--textMuted)':'#0a1505'};cursor:${done?'not-allowed':'pointer'};font-family:inherit">+ סמן תשלום</button>
                </div>
                <div style="display:flex;gap:8px">
                  <button onclick="editInstall('${x.id}')" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;background:transparent;color:var(--text);cursor:pointer;font-family:inherit">✏️ ערוך</button>
                  <button onclick="delInstall('${x.id}','${esc(x.name).replace(/'/g,'')}')" style="flex:1;padding:8px;border:1px solid rgba(220,98,98,0.2);border-radius:8px;font-size:12px;font-weight:600;background:rgba(220,98,98,0.05);color:var(--danger);cursor:pointer;font-family:inherit">🗑️ מחק</button>
                </div>
              </div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

function startInstall() { setState({installAdding:true, installForm:{name:"",total:"",installments:"",paid:"0",first_date:todayStr(),supplier:"",notes:""}}); }
function editInstall(id) { const item = DB.installments.find(x=>x.id===id); if(item) setState({installAdding:true, installForm:{...item,total:String(item.total),installments:String(item.installments),paid:String(item.paid)}}); }

function updatePerInstall() {
  const f = state.installForm;
  const per = (+f.total && +f.installments) ? (+f.total)/(+f.installments) : 0;
  const box = document.getElementById('per-install-display');
  const val = document.getElementById('per-install-val');
  if (!box) return;
  box.style.display = per ? '' : 'none';
  if (val && per) val.textContent = fmtCurr(per);
}

async function saveInstall() {
  const f = state.installForm;
  if (!f.name) { toast('נא למלא שם', 'error'); return; }
  if (!f.total) { toast('נא למלא סכום', 'error'); return; }
  if (!f.installments) { toast('נא למלא מספר תשלומים', 'error'); return; }
  if (f.supplier) {
    const supplier = requireApprovedSupplier(f.supplier);
    if (!supplier) return;
    f.supplier = supplier.name;
  }
  const item = {...f, total:+f.total, installments:+f.installments, paid:+f.paid||0};
  if (f.id) {
    await queueAndSync('update_installment', {payload: item}, () => DB.installments = DB.installments.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_installment', {payload: item}, () => DB.installments.unshift(item));
  }
  setState({installAdding:false, installForm:null});
  toast('נשמר', 'success');
}

async function markPaid(id, delta) {
  const item = DB.installments.find(x=>x.id===id);
  if (!item) return;
  const np = Math.max(0, Math.min(+item.installments, (+item.paid||0)+delta));
  const updated = {...item, paid: np};
  await queueAndSync('update_installment', {payload: updated}, () => DB.installments = DB.installments.map(x=>x.id===id?updated:x));
}

async function delInstall(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_installment', {id}, () => DB.installments = DB.installments.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

const SALARY_TYPES = ['חודשי','שעתי','יומי'];
const WORKER_ROLES = ['מוכר/ת','קופאי/ת','מחסנאי/ת','נהג/ת','מנהל/ת','אחר'];

  const workers = DB.workers || [];

          <label class="label">סוג</label>
          <select class="input" id="wf-stype" onchange="state.workerForm=state.workerForm||{}; state.workerForm.salary_type=this.value">

          </select>
        </div>
      </div>
      <div class="field">
        <label class="label">הערות</label>
        <input class="input" id="wf-notes" placeholder="ימי עבודה, פרטים נוספים..." value="${esc(wf?wf.notes:'')}" oninput="state.workerForm=state.workerForm||{}; state.workerForm.notes=this.value">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="saveWorker()" style="flex:1;margin-bottom:0">💾 שמור</button>
        <button onclick="setState({workerAdding:false,workerForm:null})" style="flex:0 0 auto;padding:13px 18px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--textDim);font-size:14px;font-family:inherit;cursor:pointer">ביטול</button>
      </div>
    </div>` : `
    <button class="btn-primary" onclick="setState({workerAdding:true,workerForm:{name:'',role:'מוכר/ת',salary:'',salary_type:'חודשי',notes:''}})" style="margin-bottom:16px">+ הוסף עובד</button>`;

  const summaryHtml = active.length > 0 ? `
    <div style="display:grid;grid-template-columns:1fr 1fr${hasAdvances?' 1fr':''};gap:10px;margin-bottom:12px">

        <div style="font-size:10px;color:var(--textDim);font-weight:600;margin-bottom:4px">פעיל</div>

    ${hasPrevAdv ? `<button onclick="clearPrevMonthAdvances()" style="width:100%;margin-bottom:12px;padding:10px 16px;border:1px solid rgba(224,82,82,0.3);border-radius:12px;background:var(--dangerSoft);color:var(--danger);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">🗑 נקה מפרעות ${prevLabel}</button>` : ''}` : '';

  const listHtml = workers.length === 0
    ? `<div style="text-align:center;padding:44px 20px;color:var(--textMuted)"><div style="font-size:44px;margin-bottom:10px;opacity:0.4">👷</div><div style="font-size:14px">אין עובדים ברשימה</div><div style="font-size:12px;margin-top:6px">לחץ "+ הוסף עובד" כדי להתחיל</div></div>`

                value="${inp.amount||''}"
                oninput="state.advanceInputs['${wid}']={...(state.advanceInputs['${wid}']||{}),amount:this.value}"

async function saveWorker() {
  const wf = state.workerForm;
  if (!wf || !wf.name) { toast('נא להזין שם עובד', 'error'); return; }
  const item = {
    ...wf,
    salary: +wf.salary || 0,
    salary_type: wf.salary_type || 'חודשי',
    active: wf.active !== false,
  };
  if (item.id) {
    await queueAndSync('update_worker', {payload: item}, () => {
      DB.workers = DB.workers.map(w => w.id === item.id ? item : w);
    });
    toast('עודכן ✓', 'success');
  } else {
    item.id = uid();
    await queueAndSync('add_worker', {payload: item}, () => DB.workers.unshift(item));
    toast('עובד נוסף ✓', 'success');
  }
  setState({workerAdding: false, workerForm: null});
}

function editWorker(id) {
  const w = DB.workers.find(x => x.id === id);
  if (!w) return;
  setState({workerAdding: false, workerForm: {...w}});
}

async function toggleWorkerActive(id) {
  const w = DB.workers.find(x => x.id === id);
  if (!w) return;
  const updated = {...w, active: w.active === false};
  await queueAndSync('update_worker', {payload: updated}, () => {
    DB.workers = DB.workers.map(x => x.id === id ? updated : x);
  });
}

async function deleteWorker(id, name) {
  if (!confirm(`למחוק את ${name}?`)) return;
  await queueAndSync('delete_worker', {id}, () => {
    DB.workers = DB.workers.filter(x => x.id !== id);
  });
  toast('נמחק', 'success');
}

// ─── Advances (מפרעות) ──────────────────────────────────────────────────────
function currentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function getWorkerMonthAdv(workerId, month) {
  return (DB.advances||[]).filter(a => a.workerId === workerId && a.month === (month||currentMonth()));
}
function saveAdvance(workerId, workerName) {
  if (!state.advanceInputs) state.advanceInputs = {};
  const inp = state.advanceInputs[workerId] || {};
  const amount = +(inp.amount||0);
  if (!amount || amount <= 0) { toast('נא להזין סכום', 'error'); return; }
  const date = inp.date || todayISO();
  const month = date.substring(0,7);
  const item = { id: uid(), workerId, workerName, amount, date, month, image: null };
  DB.advances = [item, ...(DB.advances||[])];
  persistLocal();
  state.advanceInputs[workerId] = { amount: '', date: todayISO() };
  render();
  toast('מפרעה נרשמה ✓', 'success');
  if (CFG.webAppUrl) {
    cloudCall('add_advance', {payload: item}).then(()=>setSyncStatus('ok')).catch(()=>{
      PENDING.push({action:'add_advance', payload:{payload: item}});
      localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
      setSyncStatus('offline');
    });
  }
}
async function deleteAdvance(id) {
  if (!confirm('למחוק את המפרעה?')) return;
  await queueAndSync('delete_advance', {id}, () => {
    DB.advances = (DB.advances||[]).filter(a => a.id !== id);
  });
  toast('נמחק', 'success');
}
function uploadAdvanceImage(advId) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const adv = (DB.advances||[]).find(a=>a.id===advId);
      if (adv) { adv.image = e.target.result; persistLocal(); render(); toast('תמונה נשמרה ✓','success'); }
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function viewAdvanceImage(advId) {
  const adv = (DB.advances||[]).find(a=>a.id===advId);
  if (!adv?.image) return;
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${adv.image}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);
  win.document.close();
}
function clearPrevMonthAdvances() {
  const d = new Date(); d.setMonth(d.getMonth()-1);
  const prevMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const prevLabel = d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const count = (DB.advances||[]).filter(a=>a.month===prevMonth).length;
  if (!count) { toast('אין מפרעות מחודש קודם','error'); return; }
  if (!confirm(`למחוק ${count} מפרעות מחודש ${prevLabel}?\nפעולה זו לא ניתנת לביטול.`)) return;
  DB.advances = (DB.advances||[]).filter(a=>a.month!==prevMonth);
  persistLocal(); render();
  toast(`מפרעות ${prevLabel} נמחקו ✓`,'success');
}

// VIEWS — CHECKS

function checkUrgency(clearDate) {
  // Returns 'overdue'|'soon'|'normal' based on clearing date proximity
  if (!clearDate) return 'normal';
  const d = parseD(clearDate);
  if (!d) return 'normal';
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((d - now) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 7) return 'soon';
  return 'normal';
}

function addCheck() {
  const cf = state.checkForm;
  if (!cf.supplier.trim()) { toast('נא להזין ספק', 'error'); return; }
  if (!cf.amount) { toast('נא להזין סכום', 'error'); return; }
  if (!cf.clearDate) { toast('נא להזין תאריך פירעון', 'error'); return; }
  const supplier = requireApprovedSupplier(cf.supplier);
  if (!supplier) return;
  cf.supplier = supplier.name;
  const item = {
    id: uid(),
    supplier: cf.supplier.trim(),
    amount: +cf.amount,
    checkNum: cf.checkNum.trim(),
    issueDate: cf.issueDate ? isoToHe(cf.issueDate) : todayStr(),
    clearDate: isoToHe(cf.clearDate),
    note: cf.note.trim(),
    cleared: false,
    createdAt: new Date().toISOString(),
  };
  DB.checks.push(item);
  persistLocal();
  // Cloud sync
  if (CFG.webAppUrl) {
    setSyncStatus('syncing');
    cloudCall('add_check', {payload: item}).then(()=>setSyncStatus('ok')).catch(()=>{
      PENDING.push({action:'add_check', payload:{payload: item}});
      localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
      setSyncStatus('offline');
    });
  }
  state.checkForm = {supplier:'', amount:'', checkNum:'', issueDate:'', clearDate:'', note:''};
  state.checkScanStage = 'idle';

  // Batch: load next check scan if queued
  if (state.checkBatchQueue && state.checkBatchQueue.length > 0) {
    const next = state.checkBatchQueue.shift();
    const done = state.checkBatchTotal - state.checkBatchQueue.length;
    render();
    toast(`✓ צ'ק נשמר (${done}/${state.checkBatchTotal}) · סורק את הבא...`, 'success');
    handleCheckScanFile(next);
    return;
  }

  const wasInBatch = state.checkBatchTotal > 1;
  const total = state.checkBatchTotal;
  if (wasInBatch) { state.checkBatchTotal = 0; }
  render();
  toast(wasInBatch ? `✓ כל ${total} הצ'קים נשמרו` : "צ'ק נוסף ✓", 'success');
}

function toggleCheckCleared(id) {
  const c = DB.checks.find(x => x.id === id);
  if (!c) return;
  c.cleared = !c.cleared;
  if (c.cleared) c.clearedDate = pvTodayISO();
  else delete c.clearedDate;
  // Phase 4: auto-update linked debt
  if (c.cleared && c.linkedDebtId) {
    const debt = pv.debts.find(d => d.id === c.linkedDebtId);
    if (debt && !['paid','cancelled'].includes(debt.status)) {
      debt.paidAmount = (+debt.paidAmount||0) + (+c.amount||0);
      pvUpdateDebtStatus(debt);
      if (!debt.payments) debt.payments = [];
      debt.payments.push({ id: uid(), amount: +c.amount||0, date: todayISO(), method: "צ'ק", reference: c.checkNum||'', notes: 'אוטומטי מצ\'ק', createdAt: Date.now() });
      if (debt.status === 'paid') {
        debt.paymentStatus = 'שולם';
        debt.paidDate = c.clearedDate || pvTodayISO();
        debt.closedAt = Date.now();
      }
      savePv(true);
    }
  }
  persistLocal();
  render();
  toast(c.cleared ? '✓ התשלום סומן כשולם' : 'סימון בוטל', c.cleared ? 'success' : 'info');
  if (CFG.webAppUrl) {
    setSyncStatus('syncing');
    (async () => {
      try {
        await cloudCall('delete_check', {id});
        await cloudCall('add_check', {payload: c});
        setSyncStatus('ok');
      } catch(e) {
        PENDING.push({action:'delete_check', payload:{id}});
        PENDING.push({action:'add_check', payload:{payload: c}});
        localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
        setSyncStatus('offline');
      }
    })();
  }
}

function openCreditImage(id) {
  const c = DB.credits.find(x => x.id === id);
  if (c && c.image) setState({viewCreditImage: c.image});
}

function openExpenseImage(id) {
  const e = DB.expenses.find(x => x.id === id);
  if (e && e.image) setState({viewCreditImage: e.image});
}

async function shareCreditImage() {
  const src = state.viewCreditImage;
  if (!src) return;
  if (!navigator.share || !navigator.canShare) {
    toast('שיתוף לא נתמך בדפדפן זה — השתמש בכפתור שמור', 'error');
    return;
  }
  try {
    const res = await fetch(src);
    const blob = await res.blob();
    const file = new File([blob], 'document-image.jpg', {type: blob.type});
    if (navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: 'צילום מסמך'});
    } else {
      await navigator.share({url: src, title: 'צילום מסמך'});
    }
  } catch(e) {
    if (e.name !== 'AbortError') toast('שיתוף נכשל', 'error');
  }
}

// Dynamic file picker — more reliable on iOS than hidden input
function pickCreditImage() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = () => { handleCreditImage(inp.files[0]); document.body.removeChild(inp); };
  inp.click();
}

function handleCreditImage(file) {
  if (!file) return;
  const MAX = 900;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = img.width > MAX ? MAX / img.width : 1;
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.creditForm.image = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

async function addCredit() {
  const cf = state.creditForm;
  if (!cf.supplier) { toast('נא להזין ספק', 'error'); return; }
  if (!cf.amount) { toast('נא להזין סכום', 'error'); return; }
  if (!cf.reason) { toast('נא להזין סיבת הזיכוי', 'error'); return; }
  const supplier = requireApprovedSupplier(cf.supplier);
  if (!supplier) return;
  cf.supplier = supplier.name;
  const dateEl = document.getElementById('credit-date-inp');
  const item = {
    id: uid(), date: state.creditForm.date || (dateEl ? isoToHe(dateEl.value) : todayStr()),
    supplier: cf.supplier.trim(), amount: +cf.amount,
    reason: cf.reason.trim(), image: cf.image || null
  };
  // Send to cloud without image (too large; stored locally only)
  const itemForCloud = {...item, image: null};
  await queueAndSync('add_credit', {payload: itemForCloud}, () => DB.credits.unshift(item));
  state.creditForm = {supplier: '', amount: '', reason: '', image: null};
  toast('בקשת זיכוי נשמרה ✓', 'success');
}

async function receiveCredit(id) {
  const c = DB.credits.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`לסמן שקיבלת זיכוי מ-${c.supplier} בסך ${fmtCurr(c.amount)}?\n\nהבקשה תימחק מהרשימה.`)) return;
  await queueAndSync('delete_credit', {id}, () => { DB.credits = DB.credits.filter(x => x.id !== id); });
  toast('זיכוי התקבל ✓ 🎉', 'success');
}

async function deleteCreditRequest(id) {
  if (!confirm('למחוק בקשת זיכוי זו?')) return;
  await queueAndSync('delete_credit', {id}, () => { DB.credits = DB.credits.filter(x => x.id !== id); });
  toast('נמחק', 'success');
}

    </div>`;
}

async function addIncome() {
  const f = state.incomeForm;
  if (!f.amount) { toast('הזן סכום', 'error'); return; }
  const defaultDate = isoToHe(weekOffsetDefaultDate(state.incomeWeekOffset||0));
  const date = f.date || defaultDate;
  const item = { id: uid(), date, type: f.type, amount: +f.amount, notes: f.notes || '' };
  DB.income.unshift(item);
  markDataStateDirty();
  persistLocal();
  state.incomeForm = { type: f.type, amount: '', date: null, notes: '' };
  render();
  toast('הכנסה נשמרה ✓', 'success');
  if (CFG.webAppUrl) {
    setSyncStatus('syncing');
    cloudCall('add_income', {payload: item}).then(async ()=>{
      await pushDataAppStateIfDirty();
      setSyncStatus('ok');
    }).catch(()=>{
      PENDING.push({action:'add_income', payload:{payload: item}});
      localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
      setSyncStatus('offline');
    });
  }
}

async function syncAllIncomeToCloud() {
  if (!CFG.webAppUrl) { toast('אין חיבור לענן', 'error'); return; }
  const rows = dedup(withStableIds(DB.income || [], 'income'));
  if (!rows.length) { toast('אין הכנסות מקומיות לסנכרון', 'info'); return; }
  setSyncStatus('syncing');
  try {
    for (const item of rows) await cloudCall('add_income', {payload:item});
    DB.income = rows;
    markDataStateDirty();
    persistLocal();
    await pushDataAppStateIfDirty();
    setSyncStatus('ok');
    toast(`סונכרנו ${rows.length} הכנסות`, 'success');
    render();
  } catch(e) {
    rows.forEach(item => PENDING.push({action:'add_income', payload:{payload:item}}));
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
    toast('ההכנסות יעלו בסנכרון הבא', 'info');
  }
}

async function deleteIncome(id) {
  if (!confirm('למחוק הכנסה זו?')) return;
  await queueAndSync('delete_income', {id}, () => {
    DB.income = DB.income.filter(e => e.id !== id);
  });
  toast('נמחק', 'success');
}

function renderReports() {
  function reportFilter(date) {
    const p = state.reportPer;
    if(p==='הכל') return true;
    if(p==='היום') return isToday(date);
    if(p==='שבוע') return isWeek(date);
    if(p==='שבוע שעבר') return isInWeekOffset(date, -1);
    if(p==='חודש') return isMonth(date);
    if(p==='שנה') return isYear(date);
    if(p==='מותאם'){const d=parseD(date);if(!d)return false;const from=state.reportDateFrom?new Date(state.reportDateFrom):null;const to=state.reportDateTo?new Date(state.reportDateTo):null;return(!from||d>=from)&&(!to||d<=to);}
    return true;
  }
  const rows = DB.expenses.filter(e=>reportFilter(e.date));
  const total = rows.reduce((s,e)=>s+(+e.total_amount||0),0);
  const totalVat = rows.reduce((s,e)=>s+(+e.vat_amount||0),0);
  const incomeRows = DB.income.filter(e=>reportFilter(e.date));
  const totalIncome = incomeRows.reduce((s,e)=>s+(+e.amount||0),0);
  const profit = totalIncome - total;

  const byCat = CATS.map(c=>({name:c,v:rows.filter(e=>e.category===c).reduce((s,e)=>s+(+e.total_amount||0),0)})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  const suppMap = {};
  rows.forEach(e=>{const s=e.supplier||"לא ידוע"; suppMap[s]=(suppMap[s]||0)+(+e.total_amount||0);});
  const bySupp = Object.entries(suppMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxC = byCat[0]?.v||1;
  const maxS = bySupp[0]?.[1]||1;
  const _today = new Date();
  const _fmt = d => d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
  const _fmtS = d => d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  let dateLabel = '';
  if(state.reportPer==='היום') dateLabel = _fmt(_today);
  else if(state.reportPer==='שבוע'){const {sun,sat}=getWeekBounds(0);dateLabel=_fmtS(sun)+' — '+_fmt(_today);}
  else if(state.reportPer==='שבוע שעבר'){const {sun,sat}=getWeekBounds(-1);dateLabel=_fmtS(sun)+' — '+_fmtS(sat);}
  else if(state.reportPer==='חודש') dateLabel = _today.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  else if(state.reportPer==='שנה') dateLabel = _today.getFullYear().toString();

  const PERIODS = ['היום','שבוע','שבוע שעבר','חודש','שנה','הכל','מותאם'];

  const isDesk = window.innerWidth >= 768;
  const periodBar = `<div style="display:flex;flex-wrap:wrap;gap:6px">
    ${PERIODS.map(p=>`<button onclick="setState({reportPer:'${p}'})" style="padding:${isDesk?'8px 16px':'7px 10px'};border-radius:9px;border:1px solid ${state.reportPer===p?'transparent':'var(--border)'};cursor:pointer;font-size:${isDesk?'13':'11.5'}px;font-weight:600;font-family:inherit;background:${state.reportPer===p?'#15803D':'var(--surfaceHi)'};color:${state.reportPer===p?'#fff':'var(--textDim)'};transition:all var(--t-fast);white-space:nowrap">${p}</button>`).join('')}
  </div>`;
  const customRange = state.reportPer==='מותאם'?`<div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1"><div class="label">מ-</div><input type="date" value="${state.reportDateFrom}" onchange="setState({reportDateFrom:this.value})" class="input" style="padding:8px 10px;font-size:14px"></div><div style="flex:1"><div class="label">עד-</div><input type="date" value="${state.reportDateTo}" onchange="setState({reportDateTo:this.value})" class="input" style="padding:8px 10px;font-size:14px"></div></div>`:'';

  if (isDesk) {
    // Desktop: 4-stat header + 2-column body
    const statCard = (icon, title, val, col) => `<div class="scard" style="cursor:default">
      <div style="font-size:11px;color:#64748B;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px">${icon} ${title}</div>
      <div class="display" style="font-size:28px;color:${col};line-height:1;letter-spacing:-0.02em">${val}</div>
    </div>`;
    const catBar = (name, val, max, color) => `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:13px;color:#374151;font-weight:500">${name}</span>
        <span style="font-size:13px;font-weight:700;color:#0F172A">${fmtCurr(val)}</span>
      </div>
      <div style="height:7px;background:#F1F5F9;border-radius:4px;overflow:hidden"><div style="height:100%;width:${(val/max)*100}%;background:${color};border-radius:4px"></div></div>
    </div>`;
    return `<div style="padding:24px 28px 32px" class="fade-up">
      <!-- Filter bar -->
      <div class="scard" style="padding:16px 20px;margin-bottom:20px">
        ${periodBar}${customRange}
        ${dateLabel?`<div style="margin-top:8px;font-size:12px;color:#64748B">${dateLabel}</div>`:''}
      </div>
      <!-- KPI row -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">
        ${statCard('📉','סה״כ הוצאות',fmtCurr(total),'#0F172A')}
        ${statCard('💰','הכנסות',fmtCurr(totalIncome),totalIncome>0?'#15803D':'#94A3B8')}
        ${statCard(profit>=0?'📈':'📊','רווח גולמי',(profit>=0?'+':'')+fmtCurr(profit),profit>=0?'#15803D':'#DC2626')}
        ${statCard('🧾','מע"מ',fmtCurr(totalVat),'#D97706')}
      </div>
      <!-- 2-column body -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <!-- By category -->
        <div class="scard">
          <div style="font-size:14px;font-weight:700;color:#0F172A;margin-bottom:16px">לפי קטגוריה</div>
          ${byCat.length>0?byCat.map(c=>{const color=getCatColor(c.name);return catBar(c.name,c.v,maxC,color);}).join(''):
            '<div style="text-align:center;padding:24px;color:#94A3B8;font-size:13px">אין נתונים</div>'}
        </div>
        <!-- By supplier -->
        <div class="scard">
          <div style="font-size:14px;font-weight:700;color:#0F172A;margin-bottom:16px">ספקים מובילים</div>
          ${bySupp.length>0?bySupp.map(([name,v],i)=>catBar(`<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#F1F5F9;font-size:10px;font-weight:700;color:#64748B;margin-left:6px">${i+1}</span>${esc(name)}`,v,maxS,'#15803D')).join(''):
            '<div style="text-align:center;padding:24px;color:#94A3B8;font-size:13px">אין נתונים</div>'}
        </div>
        ${totalIncome>0?`
        <!-- Income vs expenses -->
        <div class="scard" style="grid-column:1/-1">
          <div style="font-size:14px;font-weight:700;color:#0F172A;margin-bottom:16px">הכנסות מול הוצאות</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px">
            <div style="padding:14px;border-radius:12px;background:#DCFCE7;border:1px solid #BBF7D0">
              <div style="font-size:10px;color:#15803D;font-weight:700;text-transform:uppercase;margin-bottom:6px">הכנסות</div>
              <div class="display" style="font-size:22px;color:#15803D">${fmtCurr(totalIncome)}</div>
              <div style="font-size:11px;color:#16A34A;margin-top:3px">${incomeRows.length} רשומות</div>
            </div>
            <div style="padding:14px;border-radius:12px;background:#FEE2E2;border:1px solid #FECACA">
              <div style="font-size:10px;color:#DC2626;font-weight:700;text-transform:uppercase;margin-bottom:6px">הוצאות</div>
              <div class="display" style="font-size:22px;color:#DC2626">${fmtCurr(total)}</div>
              <div style="font-size:11px;color:#EF4444;margin-top:3px">${rows.length} רשומות</div>
            </div>
            <div style="padding:14px;border-radius:12px;background:${profit>=0?'#DCFCE7':'#FEE2E2'};border:1px solid ${profit>=0?'#BBF7D0':'#FECACA'}">
              <div style="font-size:10px;color:${profit>=0?'#15803D':'#DC2626'};font-weight:700;text-transform:uppercase;margin-bottom:6px">רווח גולמי</div>
              <div class="display" style="font-size:22px;color:${profit>=0?'#15803D':'#DC2626'}">${profit>=0?'+':''}${fmtCurr(profit)}</div>
              ${totalIncome>0?`<div style="font-size:11px;color:${profit>=0?'#16A34A':'#EF4444'};margin-top:3px">${Math.round(Math.abs(profit/totalIncome)*100)}% מרווח</div>`:''}
            </div>
          </div>
          <div>${INCOME_TYPES.filter(t=>incomeRows.some(e=>e.type===t)).map(t=>{const v=incomeRows.filter(e=>e.type===t).reduce((s,e)=>s+(+e.amount||0),0);const color=INCOME_COLORS[t]||'var(--accent)';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1F5F9"><span style="font-size:13px;color:#64748B">${INCOME_ICONS[t]} ${t}</span><span style="font-size:14px;font-weight:700;color:${color}">${fmtCurr(v)}</span></div>`;}).join('')}</div>
        </div>`:''}
      </div>
    </div>`;
  }

  return `
    <div style="padding:16px 16px 24px" class="fade-up">
      <div style="margin-bottom:${state.reportPer==='מותאם'?'8px':'14px'}">${periodBar}</div>

function addCat() {
  const inp = document.getElementById('new-cat-inp');
  const name = (inp?.value || '').trim();
  if (!name) { inp?.focus(); return; }
  if (CATS.includes(name)) { toast('קטגוריה כבר קיימת', 'error'); return; }
  const otherIdx = CATS.indexOf('אחר');
  if (otherIdx >= 0) CATS.splice(otherIdx, 0, name);
  else CATS.push(name);
  saveCategories();
  render();
  toast('קטגוריה נוספה ✓', 'success');
  setTimeout(()=>{ const el=document.getElementById('new-cat-inp'); if(el) el.focus(); }, 50);
}

function deleteCat(idx) {
  const name = CATS[idx];
  if (!name || name === 'אחר') return;
  const inUse = DB.expenses.filter(e => e.category === name).length;
  const inUseProducts = (pdb.products || []).filter(p => p.category === name).length;
  if ((inUse > 0 || inUseProducts > 0) && !confirm(`הקטגוריה "${name}" בשימוש ב-${inUse} הוצאות ו-${inUseProducts} מוצרים.\nלמחוק בכל זאת? המוצרים יעברו ל"ללא קטגוריה".`)) return;
  (pdb.products || []).forEach(p => { if (p.category === name) p.category = ''; });
  if (inUseProducts > 0) savePdb(true);
  CATS.splice(idx, 1);
  saveCategories();
  render();
  toast('נמחקה');
}

function renameCat(idx) {
  const name = CATS[idx];
  const newName = prompt('שם חדש לקטגוריה:', name);
  if (!newName || !newName.trim() || newName.trim() === name) return;
  const n = newName.trim();
  if (CATS.includes(n)) { toast('שם כבר קיים', 'error'); return; }
  DB.expenses.forEach(e => { if (e.category === name) e.category = n; });
  let productsChanged = false;
  (pdb.products || []).forEach(p => { if (p.category === name) { p.category = n; productsChanged = true; } });
  if (productsChanged) savePdb(true);
  persistLocal();
  CATS[idx] = n;
  saveCategories();
  render();
  toast('עודכן ✓', 'success');
}

function resetCats() {
  if (!confirm('לאפס את הקטגוריות לברירת המחדל?')) return;
  CATS = CATS_DEFAULT.slice();
  saveCategories();
  render();
  toast('קטגוריות אופסו ✓', 'success');
}

async function runSyncDiagnose() {
  if (!CFG.webAppUrl) { toast('אין כתובת GAS', 'error'); return; }
  const el = document.getElementById('sync-diagnose-result');
  if (el) el.innerHTML = '<div style="padding:10px;color:var(--textDim)">בודק...</div>';

  const tests = [
    {name:'ping',             action:'ping',             payload:{}},
    {name:'list_expenses',    action:'list_expenses',    payload:{}},
    {name:'list_fixed',       action:'list_fixed',       payload:{}},
    {name:'list_credits',     action:'list_credits',     payload:{}},
    {name:'list_workers',     action:'list_workers',     payload:{}},
    {name:'list_checks',      action:'list_checks',      payload:{}},
    {name:'list_income',      action:'list_income',      payload:{}},
    {name:'list_advances',    action:'list_advances',    payload:{}},
    {name:'list_installments',action:'list_installments',payload:{}},
  ];

  const results = [];
  for (const t of tests) {
    try {
      const data = await cloudCall(t.action, t.payload);
      const count = Array.isArray(data) ? data.length : '✓';
      results.push({name: t.name, ok: true, msg: `${count} רשומות`});
    } catch(e) {
      results.push({name: t.name, ok: false, msg: e.message.slice(0,60)});
    }
  }

  const html = results.map(r => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span style="width:14px;height:14px;border-radius:50%;background:${r.ok?'#15803D':'#DC2626'};flex-shrink:0"></span>
      <code style="font-size:11px;flex:1;color:var(--textDim)">${r.name}</code>
      <span style="font-size:11px;color:${r.ok?'var(--accent)':'var(--danger)'}">${r.msg}</span>
    </div>`).join('');

  const failCount = results.filter(r=>!r.ok).length;
  if (el) el.innerHTML = `
    <div style="margin-top:10px;padding:12px;background:var(--surfaceHi);border-radius:10px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:700;color:${failCount?'var(--danger)':'var(--accent)'};margin-bottom:8px">
        ${failCount===0?'✅ הכל עובד!':'⚠️ '+failCount+' endpoints לא עובדים — עדכן את ה-GAS'}
      </div>
      ${html}
      ${failCount>0?'<div style="margin-top:10px;font-size:11px;color:var(--textDim);line-height:1.6">פתח את הקובץ <b>google-apps-script.txt</b> בתיקיית הפרויקט, העתק את כל התוכן, ועדכן ב-<a href="https://script.google.com" target="_blank" style="color:var(--accent)">script.google.com</a> → Deploy → New version</div>':''}
    </div>`;
}

async function clearCacheAndReload() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  location.reload(true);
}

function exportJSON() {

  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');

  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);

function exportCSV() {
  const headers = ['תאריך','ספק','סכום כולל','מע"מ','לפני מע"מ','קטגוריה','סוג מסמך','מספר מסמך','הערות'];
  const rows = DB.expenses.map(e => [
    e.date, e.supplier, e.total_amount, e.vat_amount, e.amount_before_vat,
    e.category, e.document_type, e.document_number, e.notes
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`));
  const csv = '﻿' + [headers.join(','), ...rows.map(r=>r.join(','))].join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ייצוא CSV הושלם', 'success');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.expenses || !Array.isArray(data.expenses)) throw new Error('קובץ לא תקין');
      if (!confirm(`ייבוא יחליף את הנתונים הקיימים. יש ${data.expenses.length} הוצאות בקובץ. להמשיך?`)) return;
      DB.expenses = data.expenses || [];
      DB.fixed = data.fixed || [];
      DB.installments = data.installments || [];
      persistLocal();
      render();
      toast(`יובאו ${DB.expenses.length} הוצאות`, 'success');
    } catch(err) {
      toast('שגיאת ייבוא: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function render() {
  enforceStateAccess();
  // Guard: redirect to first allowed tab if current is not permitted
  if (!canAccessTab(state.tab)) {
    state.tab = getAllowedTabs()[0] || 'scan';
  }
  const isOrderEntryView = state.tab === 'orders' && state.ordersView === 'order';
  document.body.classList.toggle('orders-focus', isOrderEntryView);
  if (!isOrderEntryView) document.body.classList.remove('orders-input-focus');
  const main = document.getElementById('main');
  const tabChanged = state.tab !== _prevTab;
  const savedScroll = tabChanged ? 0 : main.scrollTop; // preserve scroll on same-tab renders

  let content = '';
  switch(state.tab) {
    case 'dashboard': content = renderDashboard(); break;
    case 'scan': content = renderScan(); break;
    case 'list': content = renderList(); break;
    case 'fixed': case 'workers': content = renderFixedAndWorkers(); break;
    case 'installments': content = renderInstallments(); break;
    case 'reports': content = renderReports(); break;
    case 'income': content = renderIncome(); break;
    case 'credits': content = renderCredits(); break;
    case 'workers': content = renderWorkers(); break;
    case 'checks': content = renderChecks(); break;
    case 'payables': content = renderPayables(); break;
    case 'products': content = renderProductsTab(); break;
    case 'orders': content = renderOrdersTab(); break;
    case 'add': content = renderAdd(); break;
    case 'settings': content = renderSettings(); break;
  }

  // Tab change → allow fade-up animations; same-tab → suppress them (no flash)
  if (tabChanged) {
    main.classList.remove('no-anim');
    _prevTab = state.tab;
  } else {
    main.classList.add('no-anim');
  }

  main.innerHTML = content;
  main.scrollTop = savedScroll; // restore scroll after innerHTML replace

  // Update orders counter synchronously after DOM is set
  if (state.tab === 'orders' && state.ordersView === 'order') {
    ordersUpdateOrderCounter();
  }

  document.getElementById('modal-container').innerHTML = state.viewCreditImage ? renderImageLightbox() : (state.editId ? renderEditModal() : (state.payablesModal ? renderPayablesModal() : (state.productsModal ? renderProductsModal() : (state.ordersModal ? renderOrdersModals() : ''))));
  renderNav();
  updateHeader();
  updateDesktopHeader();
  const desktopShell = document.getElementById('desktop-shell-container');
  if (desktopShell) desktopShell.innerHTML = renderDesktopShell();
  applyRoleUI();
  // Auto-focus supplier edit input if in edit mode
  if (state.supplierEditId) {
    const el = document.getElementById('sup-edit-inp');
    if (el) { el.focus(); el.select(); }
  }
}

  localStorage.setItem('tari_users_v1', JSON.stringify(users));
  markCoreStateDirty();
}

function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('google-user') || 'null'); } catch(e) { return null; }
}
function isAllowed(email) {
  const e = (email||'').trim().toLowerCase();
  const users = getDynamicUsers();
  return users.some(u => u.email === e) || ALLOWED_EMAILS.some(a => a.trim().toLowerCase() === e);
}
function isAdmin() { return getUserRole() === 'admin'; }
function canRunFullSync() {
  const role = getUserRole();
  return role === 'admin' || role === 'user';
}
function canRunOrdersSync() {
  return canRunFullSync() || getUserRole() === 'orders';
}
function addUser() {
  const emailEl = document.getElementById('new-user-email');
  const roleEl = document.getElementById('new-user-role');
  const email = (emailEl?.value || '').trim().toLowerCase();

function removeUser(idx) {

  if (ALLOWED_EMAILS[0].trim().toLowerCase() === u.email) { toast('לא ניתן למחוק את המנהל הראשי', 'error'); return; }

}
function toggleUserRole(idx) {
  const users = getDynamicUsers();
  const u = users[idx];
  if (!u) return;
  if (ALLOWED_EMAILS[0].trim().toLowerCase() === u.email) { toast('לא ניתן לשנות הרשאות המנהל הראשי', 'error'); return; }
  const cycle = ['user', 'scanner', 'admin'];
  const cur = cycle.indexOf(u.role) >= 0 ? cycle.indexOf(u.role) : 0;
  u.role = cycle[(cur + 1) % cycle.length];

  render();
