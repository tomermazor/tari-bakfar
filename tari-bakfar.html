<style>
/* ── Design tokens ───────────────────────────────────────────────── */
:root {
  --bg:#080c0a; --surface:#0e1410; --surfaceHi:#162018; --surfaceMid:#111912;
  --border:#1c2b1e; --borderHi:#2a3e2c;
  --text:#e2ece0; --textDim:#66806a; --textMuted:#384e3c;
  --accent:#7ecb42; --accentSoft:rgba(126,203,66,0.11); --accentGlow:rgba(126,203,66,0.24);
  --accent2:#d4956a; --accent2Soft:rgba(212,149,106,0.11);
  --amber:#f5b42a; --amberSoft:rgba(245,180,42,0.11);
  --danger:#e05252; --dangerSoft:rgba(224,82,82,0.11);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --shadow:0 2px 10px rgba(0,0,0,0.35); --shadow-lg:0 8px 32px rgba(0,0,0,0.55);
  --shadow-accent:0 6px 22px rgba(126,203,66,0.22);
  --t-fast:0.13s ease; --t-med:0.22s ease;
}
[data-theme="light"] {
  --bg:#f1f7ed; --surface:#ffffff; --surfaceHi:#e4f0dc; --surfaceMid:#eaf4e4;
  --border:#bdd4b4; --borderHi:#94be88;
  --text:#172314; --textDim:#45603e; --textMuted:#729670;
  --accent:#368010; --accentSoft:rgba(54,128,16,0.09); --accentGlow:rgba(54,128,16,0.2);
  --accent2:#884a18; --accent2Soft:rgba(136,74,24,0.09);
  --amber:#896200; --amberSoft:rgba(137,98,0,0.09);
  --danger:#aa1e1e; --dangerSoft:rgba(170,30,30,0.09);
  --shadow:0 2px 10px rgba(0,0,0,0.08); --shadow-lg:0 8px 32px rgba(0,0,0,0.14);
  --shadow-accent:0 6px 22px rgba(54,128,16,0.2);
}
[data-theme="light"] .app-switcher { background:rgba(240,248,236,0.97); padding-top:calc(6px + env(safe-area-inset-top,0px)); }
[data-theme="light"] .header { background:rgba(241,247,237,0.96); }
[data-theme="light"] .nav { background:rgba(241,247,237,0.97); }
[data-theme="light"] select.input { background-color:#fff; }

/* ── Reset & base ────────────────────────────────────────────────── */
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Heebo',-apple-system,sans-serif; overscroll-behavior:none; overflow-x:hidden; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
select { appearance:none; -webkit-appearance:none; background-color:var(--surface); color:var(--text); background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1.5l6 5 6-5' stroke='%23889' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-position:left 12px center; background-size:14px 8px; background-repeat:no-repeat; padding-left:36px !important; }
select.input { background-color:#1c1e22; border-color:var(--borderHi); }
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }

/* ── Typography ──────────────────────────────────────────────────── */
.display { font-family:'Frank Ruhl Libre',serif; font-weight:700; letter-spacing:-0.02em; }

/* ── Shell ───────────────────────────────────────────────────────── */
.app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
.main { flex:1; overflow-y:auto; padding-bottom:80px; }

/* ── App-switcher ────────────────────────────────────────────────── */
.app-switcher { display:flex; gap:5px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top,0px)); background:rgba(8,12,10,0.97); backdrop-filter:blur(24px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
.sw-btn { flex:1; text-align:center; padding:9px 8px; border-radius:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--textDim); border:1px solid transparent; display:block; transition:color var(--t-fast),background var(--t-fast); }
.sw-btn.active { background:var(--accent2Soft); color:var(--accent2); border-color:rgba(212,149,106,0.22); }
.sw-icon-btn { background:transparent; border:none; padding:7px 8px; cursor:pointer; font-size:16px; flex-shrink:0; border-radius:10px; line-height:1; color:var(--textDim); transition:background var(--t-fast); }
.sw-icon-btn:active { background:rgba(255,255,255,0.08); }
[data-theme="light"] .sw-icon-btn:active { background:rgba(0,0,0,0.05); }
.sw-icon-btn.spinning { animation:spin 0.8s linear infinite; display:inline-block; }
.theme-toggle-btn { background:transparent; border:none; padding:7px 10px; cursor:pointer; font-size:17px; flex-shrink:0; border-radius:10px; line-height:1; }

/* ── Header ──────────────────────────────────────────────────────── */
.header { padding:12px 18px; position:sticky; top:calc(44px + env(safe-area-inset-top,0px)); z-index:10; background:rgba(8,12,10,0.96); backdrop-filter:blur(24px); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; }
.logo { width:44px; height:44px; border-radius:13px; background:linear-gradient(145deg,#192a12,#0e1c0e); border:1px solid rgba(126,203,66,0.22); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 2px 14px rgba(126,203,66,0.14); }
.sync-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:10px; font-weight:700; letter-spacing:0.02em; transition:all var(--t-med); }
.sync-badge.ok { background:var(--accentSoft); color:var(--accent); border:1px solid rgba(126,203,66,0.24); }
.sync-badge.syncing { background:var(--amberSoft); color:var(--amber); border:1px solid rgba(245,180,42,0.24); }
.sync-badge.offline { background:var(--dangerSoft); color:var(--danger); border:1px solid rgba(224,82,82,0.24); }
.sync-badge.local { background:rgba(102,128,106,0.08); color:var(--textDim); border:1px solid var(--border); }

/* ── Bottom nav ──────────────────────────────────────────────────── */
.nav { position:fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto; background:rgba(8,12,10,0.97); backdrop-filter:blur(24px); border-top:1px solid var(--border); display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom,0px); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.nav::-webkit-scrollbar { display:none; }
.nav button { flex:0 0 66px; padding:7px 3px 5px; border:none; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-family:inherit; position:relative; color:var(--textDim); transition:color var(--t-med); }
.nav button.active { color:var(--accent); }
.nav-icon-wrap { width:40px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:12px; transition:background var(--t-med),transform var(--t-fast); }
.nav button.active .nav-icon-wrap { background:var(--accentSoft); }
.nav button:active .nav-icon-wrap { transform:scale(0.9); }
.nav button span { font-size:9px; font-weight:700; letter-spacing:0.01em; transition:color var(--t-med); }

/* ── Form elements ───────────────────────────────────────────────── */
.input { width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r-md); padding:13px 14px; color:var(--text); font-size:15px; font-family:inherit; outline:none; box-sizing:border-box; transition:border-color var(--t-fast),box-shadow var(--t-fast); }
.input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accentGlow); }
.label { font-size:11px; color:var(--textDim); margin-bottom:6px; display:block; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.field { margin-bottom:14px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row > * { min-width:0; }
input[type="date"] { min-width:0; max-width:100%; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn-primary { width:100%; border:none; border-radius:var(--r-md); padding:15px 20px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:linear-gradient(150deg,#8ed84a 0%,#5eab30 100%); color:#071302; box-shadow:var(--shadow-accent),0 1px 0 rgba(255,255,255,0.18) inset; margin-bottom:10px; transition:transform var(--t-fast),box-shadow var(--t-fast),opacity var(--t-fast); }
.btn-primary:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(126,203,66,0.15); }
.btn-primary:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.btn-secondary { width:100%; border:1.5px solid var(--border); border-radius:var(--r-md); padding:14px 20px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; background:var(--surface); color:var(--text); margin-bottom:10px; transition:background var(--t-fast),border-color var(--t-fast); }
.btn-secondary:active { background:var(--surfaceHi); border-color:var(--borderHi); }
.btn-ghost { width:100%; border:none; border-radius:var(--r-sm); padding:12px; font-size:13px; font-family:inherit; cursor:pointer; background:transparent; color:var(--textDim); transition:background var(--t-fast); }
.btn-ghost:active { background:var(--surfaceHi); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; box-shadow:var(--shadow); }
.pill { padding:6px 14px; border-radius:100px; border:1.5px solid var(--border); cursor:pointer; font-size:12px; font-weight:700; font-family:inherit; white-space:nowrap; background:transparent; color:var(--textDim); transition:all var(--t-fast); }
.pill.active { background:var(--accentSoft); color:var(--accent); border-color:rgba(126,203,66,0.38); }
.pill:active { transform:scale(0.96); }
.err { background:var(--dangerSoft); border:1px solid rgba(224,82,82,0.3); border-radius:var(--r-md); padding:14px; color:var(--danger); font-size:13px; margin-bottom:14px; line-height:1.5; }
.ok { background:var(--accentSoft); border:1px solid rgba(126,203,66,0.38); border-radius:var(--r-md); padding:14px; color:var(--accent); font-size:14px; font-weight:700; margin-bottom:14px; text-align:center; }

/* ── Animations ──────────────────────────────────────────────────── */
.fade-up { animation:fadeUp 0.28s cubic-bezier(0.22,1,0.36,1) backwards; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.spin { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.pulse { animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

/* ── Toast ───────────────────────────────────────────────────────── */
.toast { position:fixed; top:74px; left:50%; transform:translateX(-50%); background:var(--surfaceHi); border:1px solid var(--border); border-radius:var(--r-md); padding:11px 20px; color:var(--text); font-weight:600; font-size:13px; z-index:9999; box-shadow:var(--shadow-lg); animation:fadeUp 0.25s cubic-bezier(0.22,1,0.36,1); max-width:88vw; transition:opacity 0.4s ease; white-space:nowrap; }
.toast.success { background:rgba(8,16,6,0.98); border-color:rgba(126,203,66,0.38); color:var(--accent); }
[data-theme="light"] .toast.success { background:rgba(238,252,232,0.99); }
.toast.error { background:rgba(18,6,6,0.98); border-color:rgba(224,82,82,0.38); color:var(--danger); }
[data-theme="light"] .toast.error { background:rgba(254,240,240,0.99); }

/* ── Login ───────────────────────────────────────────────────────── */
.login-screen { position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; }
.login-logo { width:82px; height:82px; border-radius:26px; background:linear-gradient(145deg,#192a12,#0e1c0e); border:1px solid rgba(126,203,66,0.28); display:flex; align-items:center; justify-content:center; font-size:46px; margin-bottom:22px; box-shadow:0 14px 48px rgba(126,203,66,0.22),0 0 0 1px rgba(126,203,66,0.1); }
.login-title { font-size:30px; font-weight:800; font-family:'Frank Ruhl Libre',serif; margin-bottom:4px; text-align:center; }
.login-sub { font-size:14px; color:var(--textDim); margin-bottom:28px; text-align:center; }
.login-err { color:var(--danger); font-size:13px; text-align:center; margin-top:14px; min-height:20px; font-weight:600; }
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-logo">🌿</div>
  <div class="login-title">טרי בכפר</div>
  <div class="login-sub">ניהול הוצאות ועובדים</div>
  <div id="google-signin-btn"></div>
  <div class="login-err" id="login-err"></div>
</div>

<div class="app" id="app" hidden>

  <div class="app-switcher">
    <a href="orders.html" class="sw-btn">📦 הזמנות</a>
    <span class="sw-btn active">💰 הוצאות</span>
    <button class="sw-icon-btn" id="sync-top-btn" onclick="triggerTopSync()" title="סנכרן עכשיו">🔄</button>
    <button class="sw-icon-btn" id="settings-sw-btn" onclick="setState({tab:'settings'})" title="הגדרות">⚙️</button>
    <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="עיצוב"></button>
    <button class="sw-icon-btn" onclick="logout()" title="התנתק">🔒</button>
  </div>

  <header class="header">
    <div class="logo">🌿</div>
    <div style="flex:1;min-width:0">
      <h1 class="display" style="font-size:17px;color:var(--text);margin:0;line-height:1.1">טרי בכפר</h1>
      <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
        <div id="sync-badge" class="sync-badge local">⚠ לא מחובר</div>
      </div>
    </div>
    <div style="text-align:left;flex-shrink:0">
      <div style="font-size:10px;color:var(--textDim);font-weight:600;letter-spacing:0.05em;text-transform:uppercase">השבוע</div>
      <div class="display" id="month-total" style="font-size:16px;color:var(--accent);line-height:1.1">₪0.00</div>
    </div>
  </header>
  <main class="main" id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="toast-container"></div>
<div id="modal-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const CFG = {
  webAppUrl: localStorage.getItem('tari_webapp_url') || 'https://script.google.com/macros/s/AKfycbxdXp4ZXpt2EAXYXHSKdjrNZRNFuAIiOEdyXktShtnSlRSYHXLoNlSyOf-LJYJkS7ndjw/exec',
  apiKey: localStorage.getItem('tari_apikey_v1') || '',
};

// ═══════════════════════════════════════════════════════════════════════════
// DATA LAYER — local cache + cloud sync
// ═══════════════════════════════════════════════════════════════════════════
const DB = {
  expenses: JSON.parse(localStorage.getItem('tari_expenses_v2')||'[]'),
  fixed: JSON.parse(localStorage.getItem('tari_fixed_v1')||'[]'),
  installments: JSON.parse(localStorage.getItem('tari_installments_v1')||'[]'),
  income: JSON.parse(localStorage.getItem('tari_income_v1')||'[]'),
  credits: JSON.parse(localStorage.getItem('tari_credits_v1')||'[]'),
  workers:  JSON.parse(localStorage.getItem('tari_workers_v1')||'[]'),
  advances: JSON.parse(localStorage.getItem('tari_advances_v1')||'[]'),
  checks:    JSON.parse(localStorage.getItem('tari_checks_v1')||'[]'),
  suppliers: JSON.parse(localStorage.getItem('tari_suppliers_v1')||'[]'),
};

const PENDING = JSON.parse(localStorage.getItem('tari_pending_v1')||'[]'); // pending sync operations

// Persistent accountant flags — survives cloud sync (cloud may not store this field)
// Map of expense-id → true; never overwritten by syncAll
const ACC_FLAGS = JSON.parse(localStorage.getItem('tari_acc_flags_v1')||'{}');
function saveAccFlags() { localStorage.setItem('tari_acc_flags_v1', JSON.stringify(ACC_FLAGS)); }
function mergeAccFlags(expenses) {
  // After every cloud pull: restore sentToAccountant from the local flags store
  (expenses||[]).forEach(e => {
    if (ACC_FLAGS[e.id]) e.sentToAccountant = true;
    else if (e.sentToAccountant) ACC_FLAGS[e.id] = true; // cloud already has it → keep flag
  });
  saveAccFlags();
}

function persistLocal() {
  localStorage.setItem('tari_expenses_v2', JSON.stringify(DB.expenses));
  localStorage.setItem('tari_fixed_v1', JSON.stringify(DB.fixed));
  localStorage.setItem('tari_installments_v1', JSON.stringify(DB.installments));
  localStorage.setItem('tari_income_v1', JSON.stringify(DB.income));
  localStorage.setItem('tari_credits_v1', JSON.stringify(DB.credits));
  localStorage.setItem('tari_workers_v1', JSON.stringify(DB.workers));
  localStorage.setItem('tari_advances_v1', JSON.stringify(DB.advances));
  localStorage.setItem('tari_checks_v1', JSON.stringify(DB.checks));
  localStorage.setItem('tari_suppliers_v1', JSON.stringify(DB.suppliers));
  localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
  updateHeader();
}

let SYNC_STATUS = 'local'; // local | syncing | ok | offline
function setSyncStatus(s) {
  SYNC_STATUS = s;
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  badge.className = 'sync-badge ' + s;
  badge.innerHTML = {
    local: '⚠ לא מחובר',
    syncing: '<div class="spin" style="width:8px;height:8px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%"></div> מסנכרן',
    ok: '<div style="width:6px;height:6px;border-radius:50%;background:currentColor"></div> מסונכרן',
    offline: '⚠ אופליין',
  }[s] || s;
}

// ═══════════════════════════════════════════════════════════════════════════
// CLOUD SYNC
// ═══════════════════════════════════════════════════════════════════════════
async function cloudCall(action, payload) {
  if (!CFG.webAppUrl) throw new Error('לא הוגדר חיבור ל-Google Sheets');

  // Use text/plain to avoid CORS preflight
  const res = await fetch(CFG.webAppUrl, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload}),
    redirect: 'follow'
  });

  if (!res.ok) throw new Error(`Server ${res.status}`);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch(e) { throw new Error('תשובה לא תקינה מהשרת: ' + text.slice(0,200)); }

  if (!data.ok) throw new Error(data.error || 'שגיאה לא ידועה');
  return data.data;
}

async function triggerTopSync() {
  const btn = document.getElementById('sync-top-btn');
  if (btn) btn.classList.add('spinning');
  await syncAll();
  if (btn) { btn.classList.remove('spinning'); btn.textContent = '✓'; setTimeout(() => { btn.textContent = '🔄'; }, 1500); }
}

async function syncAll() {
  if (!CFG.webAppUrl) { setSyncStatus('local'); return; }
  setSyncStatus('syncing');
  try {
    // 1. Push pending changes — skip "Row not found" errors (row already gone or was never synced)
    while (PENDING.length > 0) {
      const op = PENDING[0];
      try {
        await cloudCall(op.action, op.payload);
      } catch(opErr) {
        const msg = (opErr.message || '').toLowerCase();
        if (msg.includes('row not found') || msg.includes('not found')) {
          console.warn('Skipped pending op (row not found):', op.action);
        } else {
          throw opErr; // re-throw real errors
        }
      }
      PENDING.shift();
      localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    }

    // 2. Pull fresh data — only replace local if cloud has more records or local is empty
    const [exp, fix, ins, cred, wrk] = await Promise.all([
      cloudCall('list_expenses', {}),
      cloudCall('list_fixed', {}),
      cloudCall('list_installments', {}),
      cloudCall('list_credits', {}),
      cloudCall('list_workers', {}),
    ]);
    if ((exp||[]).length > 0 || DB.expenses.length === 0) {
      DB.expenses = exp || [];
      mergeAccFlags(DB.expenses); // restore sentToAccountant flags that cloud may not store
    }
    if ((fix||[]).length > 0 || DB.fixed.length === 0) DB.fixed = fix || [];
    if ((ins||[]).length > 0 || DB.installments.length === 0) DB.installments = ins || [];
    // Credits: merge cloud (authoritative) with local images (stored locally only)
    if ((cred||[]).length > 0 || DB.credits.length === 0) {
      const localImgMap = {};
      DB.credits.forEach(c => { if (c.image) localImgMap[c.id] = c.image; });
      DB.credits = (cred || []).map(c => localImgMap[c.id] ? {...c, image: localImgMap[c.id]} : c);
    }
    if ((wrk||[]).length > 0 || DB.workers.length === 0) DB.workers = wrk || [];
    persistLocal();
    setSyncStatus('ok');
    render();
  } catch(e) {
    console.error('Sync failed:', e);
    setSyncStatus('offline');
    toast('סנכרון נכשל: ' + e.message, 'error');
  }
}

async function queueAndSync(action, payload, optimisticLocal) {
  // 1. Apply optimistically to local DB
  if (optimisticLocal) optimisticLocal();
  persistLocal();
  render();

  // 2. If no cloud configured, stop here
  if (!CFG.webAppUrl) return;

  // 3. Try to push to cloud
  setSyncStatus('syncing');
  try {
    await cloudCall(action, payload);
    setSyncStatus('ok');
  } catch(e) {
    console.error('Push failed:', e);
    // Queue for later
    PENDING.push({action, payload});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
  }
}

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);

// ── Date helpers ──────────────────────────────────────────────────
// todayStr()  → "27/05/2026"   (stored format)
// todayISO()  → "2026-05-27"   (HTML date-input value)
// heToISO(d)  → "2026-05-27"   (any stored/ISO → input value)
// isoToHe(d)  → "27/05/2026"   (input value / ISO → stored format)
// fmtDate(d)  → "27/05/2026"   (display — handles ALL formats)
const todayStr = () => { const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const isoToHe = iso => { if(!iso) return todayStr(); const s=String(iso).slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(iso); const [y,m,day]=s.split('-'); return `${day}/${m}/${y}`; };
const heToISO = d => { if(!d) return todayISO(); const s=String(d); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); const p=s.split(/[\/\.]/); return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:todayISO(); };
function fmtDate(d) { if(!d) return ''; const s=String(d); if(s.includes('T')||/^\d{4}-\d{2}-\d{2}$/.test(s)) return isoToHe(s); return s.replace(/\./g,'/'); }

const fmt = n => Number(n||0).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtCurr = n => "₪" + fmt(n);
const parseD = d => { try { const s=String(d); if(s.includes('T')||/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s); return new Date(s.split(/[\/\.]/).reverse().join('-')); } catch { return null; } };
const isToday = d => { const p=parseD(d); const n=new Date(); return p && p.toDateString()===n.toDateString(); };
const isWeek = d => { const p=parseD(d); if(!p) return false; const sun=new Date(); sun.setDate(sun.getDate()-sun.getDay()); sun.setHours(0,0,0,0); return p>=sun && p<=new Date(); };
const isMonth = d => { const p=parseD(d); const n=new Date(); return p && p.getMonth()===n.getMonth() && p.getFullYear()===n.getFullYear(); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.style.opacity='0', 2500);
  setTimeout(()=>el.remove(), 3000);
}

// Returns the <datalist> element + an <input> wired to it.
// formStateRef  – e.g. 'state.scanForm'
// fieldName     – e.g. 'supplier'
// currentVal    – current value to pre-fill
// categoryField – e.g. 'category' – auto-filled when a known supplier is chosen
function supplierInput(formStateRef, fieldName, currentVal, categoryField) {
  const listId = 'sup-dl-' + fieldName.replace('.','_');
  return `
    <datalist id="${listId}">
      ${DB.suppliers.map(s=>`<option value="${esc(s.name)}">`).join('')}
    </datalist>
    <input class="input" list="${listId}" placeholder="שם הספק" value="${esc(currentVal)}"
      oninput="${formStateRef}.${fieldName}=this.value"
      onchange="applySupplierDefaults(this.value,'${formStateRef}','${categoryField}')">`;
}

// Called onchange — fills category if supplier matches a known entry
function applySupplierDefaults(nameVal, formStateRef, categoryField) {
  if (!nameVal || !categoryField) return;
  const sup = DB.suppliers.find(s => s.name.trim().toLowerCase() === nameVal.trim().toLowerCase());
  if (!sup || !sup.defaultCategory) return;
  try {
    // Walk dotted path: 'state.scanForm' → window['state']['scanForm']
    const parts = formStateRef.split('.');
    let obj = window;
    parts.forEach(p => { obj = obj[p]; });
    if (obj && categoryField in obj) {
      obj[categoryField] = sup.defaultCategory;
      render();
    }
  } catch(e) { /* ignore */ }
}

// Seed DB.suppliers from existing expenses (run once on init)
function migrateCategoryNames() {
  if (localStorage.getItem('tari_cat_migrated_v1')) return;
  const CAT_MAP = {'ירקות': 'פירות וירקות', 'פירות': 'פירות וירקות'};
  const changed = [];
  DB.expenses.forEach(function(e) {
    if (CAT_MAP[e.category]) { e.category = CAT_MAP[e.category]; changed.push(e); }
  });
  DB.suppliers.forEach(function(s) {
    if (CAT_MAP[s.defaultCategory]) s.defaultCategory = CAT_MAP[s.defaultCategory];
  });
  if (changed.length) {
    persistLocal();
    // Use delete+add pairs; syncAll will skip "Row not found" gracefully if row never existed in cloud
    changed.forEach(function(e) {
      PENDING.push({action:'delete_expense', payload:{id: e.id}});
      PENDING.push({action:'add_expense', payload:{payload: e}});
    });
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
  }
  localStorage.setItem('tari_cat_migrated_v1', '1');
}

function seedSuppliersFromExpenses() {
  if (!DB.suppliers) DB.suppliers = [];
  const supMap = new Map(); // name → {cat: count}
  (DB.expenses || []).forEach(function(e) {
    const name = (e.supplier || '').trim();
    if (!name) return;
    if (!supMap.has(name)) supMap.set(name, {});
    const cats = supMap.get(name);
    const cat = e.category || 'אחר';
    cats[cat] = (cats[cat] || 0) + 1;
  });
  let changed = false;
  supMap.forEach(function(cats, name) {
    const exists = DB.suppliers.some(function(s) {
      return s.name.trim().toLowerCase() === name.toLowerCase();
    });
    if (exists) return;
    const defaultCategory = Object.entries(cats).sort(function(a,b){return b[1]-a[1];})[0]?.[0] || (CATS[0] || 'אחר');
    DB.suppliers.push({ id: uid(), name: name, defaultCategory: defaultCategory });
    changed = true;
  });
  if (changed) persistLocal();
}

async function scanInvoice(base64, mime) {
  if (!CFG.apiKey) throw new Error("חסר API Key — הכנס אותו בהגדרות");
  if (!CFG.apiKey.startsWith("sk-")) throw new Error("מפתח לא תקין — חייב להתחיל ב-sk-");

  const knownSuppliers = DB.suppliers.length > 0
    ? `\nספקים ידועים במערכת — אם הספק על המסמך תואם אחד מהם, השתמש בשם המדויק:\n${DB.suppliers.map(s=>`• ${s.name}${s.defaultCategory?' ('+s.defaultCategory+')':''}`).join('\n')}\n`
    : '';
  const prompt = `אתה מערכת OCR לירקניה בכפר מעש.
קרא את המסמך והחזר JSON בלבד, בלי טקסט נוסף, בלי backticks.
${knownSuppliers}
{"date":"DD/MM/YYYY","supplier":"שם הספק","total_amount":0.00,"vat_amount":0.00,"amount_before_vat":0.00,"category":"פירות וירקות","document_type":"חשבונית מס","document_number":"","notes":""}

קטגוריות: פירות וירקות, מוצרי חלב, פיצוחים, סחורה יבשה, הוצאות שוטפות, הוצאות משרד, אחר
סוגי מסמך: חשבונית מס, חשבונית מס קבלה, תעודת משלוח, קבלה.`;

  let r;
  try {
    r = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.apiKey},
      body: JSON.stringify({
        model:"gpt-4o", max_tokens:600,
        messages:[{role:"user",content:[
          {type:"text",text:prompt},
          {type:"image_url",image_url:{url:`data:${mime};base64,${base64}`}}
        ]}]
      })
    });
  } catch(netErr) {
    throw new Error("בעיית רשת: "+netErr.message);
  }

  if (!r.ok) {
    let errMsg;
    try { errMsg = (await r.json()).error?.message || 'unknown'; } catch { errMsg = await r.text(); }
    if (r.status === 401) throw new Error("מפתח שגוי (401)");
    if (r.status === 429) throw new Error("חרגת ממכסה (429)");
    if (errMsg.includes("quota") || errMsg.includes("billing")) throw new Error("אין יתרה ב-OpenAI");
    throw new Error(`OpenAI ${r.status}: ${errMsg.slice(0,150)}`);
  }

  const d = await r.json();
  const txt = (d.choices?.[0]?.message?.content || "").trim();
  if (!txt) throw new Error("תשובה ריקה");

  let depth=0, start=-1;
  for (let i=0;i<txt.length;i++) {
    if(txt[i]==="{"){if(start<0)start=i; depth++;}
    else if(txt[i]==="}"){depth--;if(depth===0)return JSON.parse(txt.slice(start,i+1));}
  }
  throw new Error("לא נמצא JSON: "+txt.slice(0,80));
}

function handleCheckScanFile(file) {
  if (!file) return;
  const MAX = 1400;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const scale = img.width > MAX ? MAX / img.width : 1;
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      setState({checkScanStage:'scanning', checkScanErr:''});
      try {
        const data = await scanCheck(b64, 'image/jpeg');
        const cf = state.checkForm;
        state.checkForm = {
          supplier:  (data.supplier  || '').trim() || cf.supplier,
          amount:    data.amount     || cf.amount,
          checkNum:  (data.checkNum  || '').trim() || cf.checkNum,
          issueDate: data.issueDate  ? heToISO(data.issueDate) : cf.issueDate,
          clearDate: cf.clearDate,
          note:      (data.note      || '').trim() || cf.note,
        };
        setState({checkScanStage:'done', checkScanErr:''});
        toast("פרטי הצ'ק חולצו ✓", 'success');
      } catch(e) {
        setState({checkScanStage:'error', checkScanErr: e.message});
      }
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

function handleFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const full = e.target.result;
    setState({scanImg:full,scanB64:full.split(',')[1],scanMime:file.type,scanStage:'preview',scanErr:''});
  };
  rd.readAsDataURL(file);
}

// Load multiple files — process first, queue the rest
function handleMultipleFiles(files) {
  if (!files || files.length === 0) return;
  const arr = Array.from(files);
  if (arr.length === 1) { handleFile(arr[0]); return; }
  state.batchQueue = arr.slice(1);
  state.batchTotal = arr.length;
  handleFile(arr[0]);
}

// Skip current file, load next from queue
function skipBatchFile() {
  if (state.batchQueue && state.batchQueue.length > 0) {
    const next = state.batchQueue.shift();
    handleFile(next);
  } else {
    exitBatch();
  }
}

// Exit batch mode entirely
function exitBatch() {
  setState({scanStage:'idle', scanImg:null, scanErr:'', scanForm:null, batchQueue:[], batchTotal:0});
}

// Multiple checks — process first, queue the rest
function handleMultipleCheckFiles(files) {
  if (!files || files.length === 0) return;
  const arr = Array.from(files);
  if (arr.length === 1) { handleCheckScanFile(arr[0]); return; }
  state.checkBatchQueue = arr.slice(1);
  state.checkBatchTotal = arr.length;
  handleCheckScanFile(arr[0]);
}

// ─── Duplicate detection ───────────────────────────────────────────────────
function findDuplicate(item) {
  const dn = item.document_number ? String(item.document_number).trim() : '';
  // Strong: same non-empty document number + same supplier
  if (dn) {
    const byDoc = DB.expenses.find(e =>
      e.id !== item.id &&
      e.supplier === item.supplier &&
      e.document_number && String(e.document_number).trim() === dn
    );
    if (byDoc) return { strength: 'strong', match: byDoc };
  }
  // Soft: same supplier + same total amount + same date
  if (item.total_amount && item.supplier) {
    const byAmt = DB.expenses.find(e =>
      e.id !== item.id &&
      e.supplier === item.supplier &&
      Math.abs((+e.total_amount || 0) - (+item.total_amount || 0)) < 0.01 &&
      String(e.date) === String(item.date)
    );
    if (byAmt) return { strength: 'soft', match: byAmt };
  }
  return null;
}

function warnDuplicate(dup) {
  const m = dup.match;
  const d = fmtDate(m.date);
  const a = fmtCurr(m.total_amount);
  if (dup.strength === 'strong') {
    return confirm(
      `⚠️ מסמך כפול!\n\nמספר מסמך ${m.document_number} מ"${m.supplier}" כבר קיים:\nתאריך: ${d} | סכום: ${a}\n\nלשמור בכל זאת?`
    );
  }
  return confirm(
    `⚠️ הוצאה דומה קיימת!\n\nנמצאה הוצאה מ"${m.supplier}" מתאריך ${d} בסכום ${a}.\nייתכן שמדובר בהוצאה כפולה.\n\nלשמור בכל זאת?`
  );
}

async function saveScanResult() {
  const item = state.scanForm;
  const dup = findDuplicate(item);
  if (dup && !warnDuplicate(dup)) return;
  const localItem = {...item, image: item.image?.startsWith('data:') ? '' : (item.image || '')};
  // ── Synchronous: apply locally + navigate in the SAME JS tick ──
  DB.expenses.unshift(localItem);
  persistLocal();

  // If batch mode: load next file instead of navigating away
  if (state.batchQueue && state.batchQueue.length > 0) {
    const next = state.batchQueue.shift();
    const remaining = state.batchQueue.length;
    const done = state.batchTotal - remaining - 1;
    toast(`✓ נשמר (${done}/${state.batchTotal}) · עוד ${remaining} מסמכים`, 'success');
    handleFile(next); // loads preview of next file
  } else {
    const wasInBatch = state.batchTotal > 1;
    const total = state.batchTotal;
    toast(wasInBatch ? `✓ כל ${total} המסמכים נשמרו` : 'נשמר בהצלחה ✓', 'success');
    setState({tab:'list', scanStage:'idle', scanImg:null, scanForm:null, batchQueue:[], batchTotal:0});
  }
  // ── Async: cloud sync in background ──
  if (!CFG.webAppUrl) return;
  setSyncStatus('syncing');
  try {
    await cloudCall('add_expense', {payload: item});
    setSyncStatus('ok');
  } catch(e) {
    console.error('sync scan:', e);
    PENDING.push({action:'add_expense', payload:{payload: item}});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
  }
}

async function saveEditExpense() {
  if (!state.editForm || !state.editId) return;
  const f = state.editForm;
  const editId = state.editId;
  const updated = {
    ...(DB.expenses.find(e => e.id === editId) || {}),
    supplier: f.supplier, date: f.date, category: f.category,
    document_type: f.document_type, document_number: f.document_number,
    total_amount: +f.total_amount||0, vat_amount: +f.vat_amount||0,
    amount_before_vat: (+f.total_amount||0)-(+f.vat_amount||0), notes: f.notes
  };
  // ── Synchronous: apply locally + close modal in the SAME JS tick ──
  DB.expenses = DB.expenses.map(e => e.id === editId ? updated : e);
  persistLocal();
  setState({editId: null, editForm: null, listOpen: null}); // modal gone before first await
  toast('עודכן ✓', 'success');
  // ── Async: sequential cloud calls in background (no race conditions) ──
  if (!CFG.webAppUrl) return;
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id: editId});
    await cloudCall('add_expense', {payload: updated});
    setSyncStatus('ok');
  } catch(e) {
    console.error('sync edit:', e);
    PENDING.push({action:'delete_expense', payload:{id: editId}});
    PENDING.push({action:'add_expense', payload:{payload: updated}});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
  }
}

async function deleteExpense(id) {
  await queueAndSync('delete_expense', {id}, () => {
    DB.expenses = DB.expenses.filter(e=>e.id!==id);
  });
  setState({listOpen:null});
  toast('נמחק', 'success');
}

async function toggleSentToAccountant(id) {
  const e = DB.expenses.find(x => x.id === id);
  if (!e) return;
  e.sentToAccountant = !e.sentToAccountant;
  // Persist flag separately so it survives cloud sync overwrites
  if (e.sentToAccountant) ACC_FLAGS[id] = true;
  else delete ACC_FLAGS[id];
  saveAccFlags();
  persistLocal();
  render();
  toast(e.sentToAccountant ? '✓ סומן כהועבר להנה"ח' : 'הסימון בוטל', e.sentToAccountant ? 'success' : 'info');
  if (!CFG.webAppUrl) return;
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id});
    await cloudCall('add_expense', {payload: e});
    setSyncStatus('ok');
  } catch(err) {
    PENDING.push({action:'delete_expense', payload:{id}});
    PENDING.push({action:'add_expense', payload:{payload: e}});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
  }
}

async function pushExpenseToCloud(id) {
  const e = DB.expenses.find(x => x.id === id);
  if (!e) return;
  if (!CFG.webAppUrl) { toast('אין חיבור לענן', 'info'); return; }
  setSyncStatus('syncing');
  try {
    await cloudCall('delete_expense', {id});
    await cloudCall('add_expense', {payload: e});
    setSyncStatus('ok');
    toast('נשמר בענן ✓', 'success');
  } catch(err) {
    PENDING.push({action:'delete_expense', payload:{id}});
    PENDING.push({action:'add_expense', payload:{payload: e}});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
    toast('ישמר בהמשך', 'info');
  }
}

let addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:""};

function renderAdd() {
  return `

      <h2 class="display" style="font-size:24px;margin:0 0 18px">הוספה ידנית</h2>

      <div class="field"><label class="label">תאריך</label><input class="input" type="date" value="${heToISO(addForm.date)}" oninput="addForm.date=isoToHe(this.value)"></div>
      <div class="row">
        <div class="field"><label class="label">סכום כולל ₪ *</label><input class="input" type="number" placeholder="0.00" value="${addForm.total_amount}" oninput="addTotal(this.value)" onkeydown="if(event.key==='Enter')submitAdd()"></div>
        <div class="field"><label class="label">מע"מ</label><input id="add-vat-inp" class="input" type="number" placeholder="אוטו" value="${addForm.vat_amount}" oninput="addForm.vat_amount=this.value"></div>
      </div>
      <div class="field"><label class="label">קטגוריה</label><select class="input" onchange="addForm.category=this.value">${CATS.map(c=>`<option ${c===addForm.category?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="label">סוג מסמך</label><select class="input" onchange="addForm.document_type=this.value">${DTYPES.map(d=>`<option ${d===addForm.document_type?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label class="label">מספר מסמך</label><input class="input" value="${esc(addForm.document_number)}" oninput="addForm.document_number=this.value" onkeydown="if(event.key==='Enter')submitAdd()"></div>
      <div class="field"><label class="label">הערות</label><input class="input" value="${esc(addForm.notes)}" oninput="addForm.notes=this.value" onkeydown="if(event.key==='Enter')submitAdd()"></div>
      <button class="btn-primary" onclick="submitAdd()">שמור הוצאה</button>
    </div>`;
}

function addTotal(v) {
  addForm.total_amount = v;
  if (v) {
    const t = +v; const vat = Math.round(t/1.17*0.17*100)/100;
    addForm.vat_amount = vat; addForm.amount_before_vat = Math.round((t-vat)*100)/100;
    const vatEl = document.getElementById('add-vat-inp');
    if (vatEl) vatEl.value = vat; // update VAT field without re-rendering (prevents focus jump)
  }
}

async function submitAdd() {
  if (!addForm.supplier) { toast('נא להזין ספק', 'error'); return; }
  if (!addForm.total_amount) { toast('נא להזין סכום', 'error'); return; }
  const item = {...addForm, id:uid(), total_amount:+addForm.total_amount, vat_amount:+addForm.vat_amount||0, amount_before_vat:+addForm.amount_before_vat||0};
  const dup = findDuplicate(item);
  if (dup && !warnDuplicate(dup)) return;
  await queueAndSync('add_expense', {payload: item}, () => DB.expenses.unshift(item));
  addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:""};
  toast('נשמר!', 'success');
  setState({tab:'list'});
}

function startFixed() { setState({fixedAdding:true, fixedForm:{name:"",amount:"",category:"שכירות",frequency:"חודשי",day:"1",supplier:"",notes:"",active:true}}); }
function editFixed(id) { const item = DB.fixed.find(x=>x.id===id); if(item) setState({fixedAdding:true, fixedForm:{...item,amount:String(item.amount)}}); }

async function saveFixed() {
  const f = state.fixedForm;
  if (!f.name) { toast('נא למלא שם הוצאה', 'error'); return; }
  if (f.amount===''||f.amount===null||f.amount===undefined) { toast('נא למלא סכום', 'error'); return; }
  const item = {...f, amount:+f.amount};
  if (f.id) {
    await queueAndSync('update_fixed', {payload: item}, () => DB.fixed = DB.fixed.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_fixed', {payload: item}, () => DB.fixed.unshift(item));
  }
  setState({fixedAdding:false, fixedForm:null});
  toast('נשמר', 'success');
}

async function toggleFixed(id) {
  const item = DB.fixed.find(x=>x.id===id);
  if (!item) return;
  const updated = {...item, active: !item.active};
  await queueAndSync('update_fixed', {payload: updated}, () => DB.fixed = DB.fixed.map(x=>x.id===id?updated:x));
}

async function delFixed(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_fixed', {id}, () => DB.fixed = DB.fixed.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

function startInstall() { setState({installAdding:true, installForm:{name:"",total:"",installments:"",paid:"0",first_date:todayStr(),supplier:"",notes:""}}); }
function editInstall(id) { const item = DB.installments.find(x=>x.id===id); if(item) setState({installAdding:true, installForm:{...item,total:String(item.total),installments:String(item.installments),paid:String(item.paid)}}); }

function updatePerInstall() {
  const f = state.installForm;
  const per = (+f.total && +f.installments) ? (+f.total)/(+f.installments) : 0;
  const box = document.getElementById('per-install-display');
  const val = document.getElementById('per-install-val');
  if (!box) return;
  box.style.display = per ? '' : 'none';
  if (val && per) val.textContent = fmtCurr(per);
}

async function saveInstall() {
  const f = state.installForm;
  if (!f.name) { toast('נא למלא שם', 'error'); return; }
  if (!f.total) { toast('נא למלא סכום', 'error'); return; }
  if (!f.installments) { toast('נא למלא מספר תשלומים', 'error'); return; }
  const item = {...f, total:+f.total, installments:+f.installments, paid:+f.paid||0};
  if (f.id) {
    await queueAndSync('update_installment', {payload: item}, () => DB.installments = DB.installments.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_installment', {payload: item}, () => DB.installments.unshift(item));
  }
  setState({installAdding:false, installForm:null});
  toast('נשמר', 'success');
}

async function markPaid(id, delta) {
  const item = DB.installments.find(x=>x.id===id);
  if (!item) return;
  const np = Math.max(0, Math.min(+item.installments, (+item.paid||0)+delta));
  const updated = {...item, paid: np};
  await queueAndSync('update_installment', {payload: updated}, () => DB.installments = DB.installments.map(x=>x.id===id?updated:x));
}

async function delInstall(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_installment', {id}, () => DB.installments = DB.installments.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

async function saveWorker() {
  const wf = state.workerForm;
  if (!wf || !wf.name) { toast('נא להזין שם עובד', 'error'); return; }
  const item = {
    ...wf,
    salary: +wf.salary || 0,
    salary_type: wf.salary_type || 'חודשי',
    active: wf.active !== false,
  };
  if (item.id) {
    await queueAndSync('update_worker', {payload: item}, () => {
      DB.workers = DB.workers.map(w => w.id === item.id ? item : w);
    });
    toast('עודכן ✓', 'success');
  } else {
    item.id = uid();
    await queueAndSync('add_worker', {payload: item}, () => DB.workers.unshift(item));
    toast('עובד נוסף ✓', 'success');
  }
  setState({workerAdding: false, workerForm: null});
}

function editWorker(id) {
  const w = DB.workers.find(x => x.id === id);
  if (!w) return;
  setState({workerAdding: false, workerForm: {...w}});
}

async function toggleWorkerActive(id) {
  const w = DB.workers.find(x => x.id === id);
  if (!w) return;
  const updated = {...w, active: w.active === false};
  await queueAndSync('update_worker', {payload: updated}, () => {
    DB.workers = DB.workers.map(x => x.id === id ? updated : x);
  });
}

async function deleteWorker(id, name) {
  if (!confirm(`למחוק את ${name}?`)) return;
  await queueAndSync('delete_worker', {id}, () => {
    DB.workers = DB.workers.filter(x => x.id !== id);
  });
  toast('נמחק', 'success');
}

// ─── Advances (מפרעות) ──────────────────────────────────────────────────────
function currentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function getWorkerMonthAdv(workerId, month) {
  return (DB.advances||[]).filter(a => a.workerId === workerId && a.month === (month||currentMonth()));
}
function saveAdvance(workerId, workerName) {
  if (!state.advanceInputs) state.advanceInputs = {};
  const inp = state.advanceInputs[workerId] || {};
  const amount = +(inp.amount||0);
  if (!amount || amount <= 0) { toast('נא להזין סכום', 'error'); return; }
  const date = inp.date || todayISO(); // ISO format for type="date" inputs
  const month = date.substring(0,7); // YYYY-MM from ISO date
  const item = { id: uid(), workerId, workerName, amount, date, month, image: null };
  DB.advances = [item, ...(DB.advances||[])];
  persistLocal();
  state.advanceInputs[workerId] = { amount: '', date: todayISO() };
  render();
  toast('מפרעה נרשמה ✓', 'success');
}
function deleteAdvance(id) {
  if (!confirm('למחוק את המפרעה?')) return;
  DB.advances = (DB.advances||[]).filter(a => a.id !== id);
  persistLocal();
  render();
  toast('נמחק', 'success');
}
function uploadAdvanceImage(advId) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const adv = (DB.advances||[]).find(a=>a.id===advId);
      if (adv) { adv.image = e.target.result; persistLocal(); render(); toast('תמונה נשמרה ✓','success'); }
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function viewAdvanceImage(advId) {
  const adv = (DB.advances||[]).find(a=>a.id===advId);
  if (!adv?.image) return;
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${adv.image}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);
  win.document.close();
}
function clearPrevMonthAdvances() {
  const d = new Date(); d.setMonth(d.getMonth()-1);
  const prevMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const prevLabel = d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const count = (DB.advances||[]).filter(a=>a.month===prevMonth).length;
  if (!count) { toast('אין מפרעות מחודש קודם','error'); return; }
  if (!confirm(`למחוק ${count} מפרעות מחודש ${prevLabel}?\nפעולה זו לא ניתנת לביטול.`)) return;
  DB.advances = (DB.advances||[]).filter(a=>a.month!==prevMonth);
  persistLocal(); render();
  toast(`מפרעות ${prevLabel} נמחקו ✓`,'success');
}

// ═══════════════════════════════════════════════════════════════════════════
// VIEWS — CHECKS
// ═══════════════════════════════════════════════════════════════════════════
function checkUrgency(clearDate) {
  // Returns 'overdue'|'soon'|'normal' based on clearing date proximity
  if (!clearDate) return 'normal';
  const d = parseD(clearDate);
  if (!d) return 'normal';
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((d - now) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 7) return 'soon';
  return 'normal';
}

function addCheck() {
  const cf = state.checkForm;
  if (!cf.supplier.trim()) { toast('נא להזין ספק', 'error'); return; }
  if (!cf.amount) { toast('נא להזין סכום', 'error'); return; }
  if (!cf.clearDate) { toast('נא להזין תאריך פירעון', 'error'); return; }
  const item = {
    id: uid(),
    supplier: cf.supplier.trim(),
    amount: +cf.amount,
    checkNum: cf.checkNum.trim(),
    issueDate: cf.issueDate ? isoToHe(cf.issueDate) : todayStr(),
    clearDate: isoToHe(cf.clearDate),
    note: cf.note.trim(),
    cleared: false,
    createdAt: new Date().toISOString(),
  };
  DB.checks.push(item);
  persistLocal();
  state.checkForm = {supplier:'', amount:'', checkNum:'', issueDate:'', clearDate:'', note:''};
  state.checkScanStage = 'idle';

  // Batch: load next check scan if queued
  if (state.checkBatchQueue && state.checkBatchQueue.length > 0) {
    const next = state.checkBatchQueue.shift();
    const done = state.checkBatchTotal - state.checkBatchQueue.length;
    render();
    toast(`✓ צ'ק נשמר (${done}/${state.checkBatchTotal}) · סורק את הבא...`, 'success');
    handleCheckScanFile(next);
    return;
  }

  const wasInBatch = state.checkBatchTotal > 1;
  const total = state.checkBatchTotal;
  if (wasInBatch) { state.checkBatchTotal = 0; }
  render();
  toast(wasInBatch ? `✓ כל ${total} הצ'קים נשמרו` : "צ'ק נוסף ✓", 'success');
}

function toggleCheckCleared(id) {
  const c = DB.checks.find(x => x.id === id);
  if (!c) return;
  c.cleared = !c.cleared;
  persistLocal();
  render();
  toast(c.cleared ? '✓ צ\'ק סומן כמומש' : 'סימון בוטל', c.cleared ? 'success' : 'info');
}

function deleteCheck(id) {
  DB.checks = DB.checks.filter(x => x.id !== id);
  persistLocal();
  render();
  toast('צ\'ק נמחק', 'info');
}

function openCreditImage(id) {

async function shareCreditImage() {
  const src = state.viewCreditImage;
  if (!src) return;
  if (!navigator.share || !navigator.canShare) {
    toast('שיתוף לא נתמך בדפדפן זה — השתמש בכפתור שמור', 'error');
    return;
  }
  try {
    const res = await fetch(src);
    const blob = await res.blob();
    const file = new File([blob], 'credit-proof.jpg', {type: blob.type});
    if (navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: 'הוכחת זיכוי'});
    } else {
      await navigator.share({url: src, title: 'הוכחת זיכוי'});
    }
  } catch(e) {
    if (e.name !== 'AbortError') toast('שיתוף נכשל', 'error');
  }
}

function handleCreditImage(file) {
  if (!file) return;
  const MAX = 900;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = img.width > MAX ? MAX / img.width : 1;
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.creditForm.image = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

async function addCredit() {
  const cf = state.creditForm;
  if (!cf.supplier) { toast('נא להזין ספק', 'error'); return; }
  if (!cf.amount) { toast('נא להזין סכום', 'error'); return; }
  if (!cf.reason) { toast('נא להזין סיבת הזיכוי', 'error'); return; }
  const dateEl = document.getElementById('credit-date-inp');
  const item = {
    id: uid(), date: state.creditForm.date || (dateEl ? isoToHe(dateEl.value) : todayStr()),
    supplier: cf.supplier.trim(), amount: +cf.amount,
    reason: cf.reason.trim(), image: cf.image || null
  };
  // Send to cloud without image (too large; stored locally only)
  const itemForCloud = {...item, image: null};
  await queueAndSync('add_credit', {payload: itemForCloud}, () => DB.credits.unshift(item));
  state.creditForm = {supplier: '', amount: '', reason: '', image: null};
  toast('בקשת זיכוי נשמרה ✓', 'success');
}

async function receiveCredit(id) {
  const c = DB.credits.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`לסמן שקיבלת זיכוי מ-${c.supplier} בסך ${fmtCurr(c.amount)}?\n\nהבקשה תימחק מהרשימה.`)) return;
  await queueAndSync('delete_credit', {id}, () => { DB.credits = DB.credits.filter(x => x.id !== id); });
  toast('זיכוי התקבל ✓ 🎉', 'success');
}

async function deleteCreditRequest(id) {
  if (!confirm('למחוק בקשת זיכוי זו?')) return;
  await queueAndSync('delete_credit', {id}, () => { DB.credits = DB.credits.filter(x => x.id !== id); });
  toast('נמחק', 'success');
}

function addIncome() {
  const f = state.incomeForm;
  if (!f.amount) { toast('הזן סכום', 'error'); return; }
  const item = { id: uid(), date: f.date || todayStr(), type: f.type, amount: +f.amount, notes: f.notes || '' };
  DB.income.unshift(item);
  persistLocal();
  state.incomeForm = { type: f.type, amount: '', date: null, notes: '' };
  render();
  toast('הכנסה נשמרה ✓', 'success');
}

function deleteIncome(id) {
  if (!confirm('למחוק הכנסה זו?')) return;
  DB.income = DB.income.filter(e => e.id !== id);
  persistLocal();
  render();
  toast('נמחק', 'success');
}

function resetWeek() {
  const wInc  = DB.income.filter(e => isWeek(e.date));
  const wExp  = DB.expenses.filter(e => isWeek(e.date));
  const totI  = wInc.reduce((s,e) => s+(+e.amount||0), 0);
  const totE  = wExp.reduce((s,e) => s+(+e.total_amount||0), 0);
  const prof  = totI - totE;
  const msg = `סיכום שבוע:\n💰 הכנסות: ${fmtCurr(totI)}\n📉 הוצאות: ${fmtCurr(totE)}\n${prof>=0?'✅':'❌'} רווח: ${prof>=0?'+':''}${fmtCurr(prof)}\n\nלאפס את הכנסות השבוע?`;
  if (!confirm(msg)) return;
  DB.income = DB.income.filter(e => !isWeek(e.date));
  persistLocal();
  render();
  toast('השבוע אופס — שבוע טוב! 🌿', 'success');
}

// ═══════════════════════════════════════════════════════════════════════════
// CATEGORY MANAGEMENT
// ═══════════════════════════════════════════════════════════════════════════
function addCat() {
  const inp = document.getElementById('new-cat-inp');
  const name = (inp?.value || '').trim();
  if (!name) { inp?.focus(); return; }
  if (CATS.includes(name)) { toast('קטגוריה כבר קיימת', 'error'); return; }
  const otherIdx = CATS.indexOf('אחר');
  if (otherIdx >= 0) CATS.splice(otherIdx, 0, name);
  else CATS.push(name);
  saveCategories();
  render();
  toast('קטגוריה נוספה ✓', 'success');
  setTimeout(()=>{ const el=document.getElementById('new-cat-inp'); if(el) el.focus(); }, 50);
}

function deleteCat(idx) {
  const name = CATS[idx];
  if (!name || name === 'אחר') return;
  const inUse = DB.expenses.filter(e => e.category === name).length;
  if (inUse > 0 && !confirm(`הקטגוריה "${name}" בשימוש ב-${inUse} הוצאות.\nלמחוק בכל זאת?`)) return;
  CATS.splice(idx, 1);
  saveCategories();
  render();
  toast('נמחקה');
}

function renameCat(idx) {
  const name = CATS[idx];
  const newName = prompt('שם חדש לקטגוריה:', name);
  if (!newName || !newName.trim() || newName.trim() === name) return;
  const n = newName.trim();
  if (CATS.includes(n)) { toast('שם כבר קיים', 'error'); return; }
  DB.expenses.forEach(e => { if (e.category === name) e.category = n; });
  persistLocal();
  CATS[idx] = n;
  saveCategories();
  render();
  toast('עודכן ✓', 'success');
}

function resetCats() {
  if (!confirm('לאפס את הקטגוריות לברירת המחדל?')) return;
  CATS = CATS_DEFAULT.slice();
  saveCategories();
  render();
  toast('קטגוריות אופסו ✓', 'success');
}

function clearPendingQueue() {
  const n = PENDING.length;
  if (!n) return;
  if (!confirm(`לנקות ${n} פעולות ממתינות?\n\nהנתונים יישמרו מקומית. הסנכרון יתחיל מחדש בצורה נקייה.`)) return;
  PENDING.length = 0;
  localStorage.setItem('tari_pending_v1', '[]');
  render();
  toast('תור הסנכרון נוקה ✓', 'success');
  if (CFG.webAppUrl) syncAll();
}

function saveWebApp() {
  const val = document.getElementById('urlInput').value.trim();
  CFG.webAppUrl = val;
  localStorage.setItem('tari_webapp_url', val);
  toast('נשמר', 'success');
  if (val) syncAll();
  else render();
}

async function testConnection() {
  const val = document.getElementById('urlInput').value.trim();
  if (!val) { toast('הדבק כתובת קודם', 'error'); return; }
  CFG.webAppUrl = val;
  try {
    setSyncStatus('syncing');
    await cloudCall('ping', {});
    setSyncStatus('ok');
    toast('✅ החיבור עובד!', 'success');
  } catch(e) {
    setSyncStatus('offline');
    toast('❌ ' + e.message, 'error');
  }
}

async function clearCacheAndReload() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  location.reload(true);
}

function saveApiKey() {
  CFG.apiKey = document.getElementById('keyInput').value.trim();
  localStorage.setItem('tari_apikey_v1', CFG.apiKey);
  toast('המפתח נשמר', 'success');
  render();
}

function exportJSON() {
  const data = { expenses: DB.expenses, fixed: DB.fixed, installments: DB.installments, exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ייצוא הושלם', 'success');
}

function exportCSV() {
  const headers = ['תאריך','ספק','סכום כולל','מע"מ','לפני מע"מ','קטגוריה','סוג מסמך','מספר מסמך','הערות'];
  const rows = DB.expenses.map(e => [
    e.date, e.supplier, e.total_amount, e.vat_amount, e.amount_before_vat,
    e.category, e.document_type, e.document_number, e.notes
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`));
  const csv = '﻿' + [headers.join(','), ...rows.map(r=>r.join(','))].join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ייצוא CSV הושלם', 'success');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.expenses || !Array.isArray(data.expenses)) throw new Error('קובץ לא תקין');
      if (!confirm(`ייבוא יחליף את הנתונים הקיימים. יש ${data.expenses.length} הוצאות בקובץ. להמשיך?`)) return;
      DB.expenses = data.expenses || [];
      DB.fixed = data.fixed || [];
      DB.installments = data.installments || [];
      persistLocal();
      render();
      toast(`יובאו ${DB.expenses.length} הוצאות`, 'success');
    } catch(err) {
      toast('שגיאת ייבוא: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

  // Sync button: only admin/user
  const syncBtn = document.getElementById('sync-top-btn');
  if (syncBtn) syncBtn.style.display = (role === 'scanner') ? 'none' : '';
}

function render() {
  // Guard: redirect to first allowed tab if current is not permitted
  if (!canAccessTab(state.tab)) {
    state.tab = getAllowedTabs()[0] || 'scan';
  }
  const main = document.getElementById('main');
  let content = '';
  switch(state.tab) {
    case 'scan': content = renderScan(); break;
    case 'list': content = renderList(); break;
    case 'fixed': content = renderFixed(); break;
    case 'installments': content = renderInstallments(); break;
    case 'reports': content = renderReports(); break;
    case 'income': content = renderIncome(); break;
    case 'credits': content = renderCredits(); break;
    case 'workers': content = renderWorkers(); break;
    case 'checks': content = renderChecks(); break;
    case 'add': content = renderAdd(); break;
    case 'settings': content = renderSettings(); break;
  }
  main.innerHTML = content;
  // Scroll to top when switching tabs
  if (state.tab !== _prevTab) { main.scrollTop = 0; _prevTab = state.tab; }
  document.getElementById('modal-container').innerHTML = state.viewCreditImage ? renderImageLightbox() : (state.editId ? renderEditModal() : '');
  renderNav();
  updateHeader();
  // Auto-focus supplier edit input if in edit mode
  if (state.supplierEditId) {
    const el = document.getElementById('sup-edit-inp');
    if (el) { el.focus(); el.select(); }
  }
}

// ─── Theme ──────────────────────────────────────────────────────────────────
function initTheme() {
  const t = localStorage.getItem('app-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('app-theme', next);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
  render(); // re-render to update settings button label
}

// ─── Google Auth ────────────────────────────────────────────────────────────
const GOOGLE_CLIENT_ID = '536002139707-9r2ruube0h3p5g8vau42e4ltnrj58vma.apps.googleusercontent.com';
// רשימת המשתמשים הקבועים (הראשון = מנהל ראשי שלא ניתן לשנות)
const ALLOWED_EMAILS = [
  'tomermazor@gmail.com',
  'limor1987@gmail.com',
  'tari@taribakfar.co.il',
];

// ── Role definitions ──────────────────────────────────────────────────────
const ROLE_DEFS = {
  admin:   { label: 'מנהל',  icon: '👑', color: 'var(--accent)',  desc: 'גישה מלאה + ניהול משתמשים' },
  user:    { label: 'משתמש', icon: '👤', color: 'var(--textDim)', desc: 'גישה מלאה לכל הטאבים' },
  scanner: { label: 'סורק',  icon: '📷', color: 'var(--amber)',   desc: 'סריקת הוצאות בלבד', tabs: ['scan'] },
};

function getUserRole() {
  const u = getStoredUser();
  if (!u) return 'scanner';
  const e = (u.email||'').trim().toLowerCase();
  if (ALLOWED_EMAILS[0].trim().toLowerCase() === e) return 'admin';
  const users = getDynamicUsers();
  const found = users.find(x => x.email === e);
  return found?.role || 'user';
}
function getAllowedTabs() {
  const def = ROLE_DEFS[getUserRole()];
  return def?.tabs || TABS.map(t => t.id); // null/missing = all tabs
}
function canAccessTab(tabId) {
  if (tabId === 'settings') return getUserRole() !== 'scanner';
  return getAllowedTabs().includes(tabId);
}

// ── Dynamic User Management ────────────────────────────────────────────────
function getDynamicUsers() {
  try {
    const stored = JSON.parse(localStorage.getItem('tari_users_v1') || 'null');
    if (stored && Array.isArray(stored)) return stored;
  } catch(e) {}
  // Seed from hardcoded list on first run
  const seeded = ALLOWED_EMAILS.map((email, i) => ({
    email: email.trim().toLowerCase(),
    role: i === 0 ? 'admin' : 'user'
  }));
  localStorage.setItem('tari_users_v1', JSON.stringify(seeded));
  return seeded;
}
function saveDynamicUsers(users) {
  localStorage.setItem('tari_users_v1', JSON.stringify(users));
}

function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('google-user') || 'null'); } catch(e) { return null; }
}
function isAllowed(email) {
  const e = (email||'').trim().toLowerCase();
  const users = getDynamicUsers();
  return users.some(u => u.email === e) || ALLOWED_EMAILS.some(a => a.trim().toLowerCase() === e);
}
function isAdmin() { return getUserRole() === 'admin'; }
function addUser() {
  const emailEl = document.getElementById('new-user-email');
  const roleEl = document.getElementById('new-user-role');
  const email = (emailEl?.value || '').trim().toLowerCase();
  const role = roleEl?.value || 'user';
  if (!email || !email.includes('@')) { toast('נא להזין כתובת Gmail תקינה', 'error'); return; }
  const users = getDynamicUsers();
  if (users.some(u => u.email === email)) { toast('משתמש כבר קיים', 'error'); return; }
  users.push({ email, role });
  saveDynamicUsers(users);
  if (emailEl) emailEl.value = '';
  render();
  toast('משתמש נוסף ✓', 'success');
}
function removeUser(idx) {
  const users = getDynamicUsers();
  const u = users[idx];
  if (!u) return;
  const myEmail = (getStoredUser()?.email||'').trim().toLowerCase();
  if (u.email === myEmail) { toast('לא ניתן למחוק את עצמך', 'error'); return; }
  if (ALLOWED_EMAILS[0].trim().toLowerCase() === u.email) { toast('לא ניתן למחוק את המנהל הראשי', 'error'); return; }
  if (!confirm('למחוק גישה של ' + u.email + '?')) return;
  users.splice(idx, 1);
  saveDynamicUsers(users);
  render();
  toast('משתמש הוסר ✓', 'success');
}
function toggleUserRole(idx) {
  const users = getDynamicUsers();
  const u = users[idx];
  if (!u) return;
  if (ALLOWED_EMAILS[0].trim().toLowerCase() === u.email) { toast('לא ניתן לשנות הרשאות המנהל הראשי', 'error'); return; }
  const cycle = ['user', 'scanner', 'admin'];
  const cur = cycle.indexOf(u.role) >= 0 ? cycle.indexOf(u.role) : 0;
  u.role = cycle[(cur + 1) % cycle.length];
  saveDynamicUsers(users);
  render();
  toast('הרשאה שונתה ל' + (ROLE_DEFS[u.role]?.label||u.role) + ' ✓', 'success');
}
function handleCredentialResponse(response) {
  try {
    const b64 = response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const payload = JSON.parse(atob(b64));
    if (!isAllowed(payload.email)) {
      document.getElementById('login-err').textContent = '🚫 ' + payload.email + ' — אין הרשאה';
      return;
    }
    localStorage.setItem('google-user', JSON.stringify({
      email: payload.email, name: payload.name || payload.email, picture: payload.picture || '',
    }));
    document.getElementById('login-screen').hidden = true;
    initApp();
  } catch(e) {
    document.getElementById('login-err').textContent = 'שגיאה בהתחברות, נסה שנית';
  }
}
function initGoogleSignIn() {
  var loginScreen = document.getElementById('login-screen');
  if (!loginScreen || loginScreen.hidden) return;
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    document.getElementById('login-err').textContent = '⚙️ יש להגדיר Client ID של Google';
    return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton(document.getElementById('google-signin-btn'), { type:'standard', theme:'outline', size:'large', width:260 });
  google.accounts.id.prompt();
}
function onGoogleScriptLoad() {
  if (!document.getElementById('login-screen').hidden) initGoogleSignIn();
}

function initApp() {
  document.getElementById('app').hidden = false;

  // Check for pending expense passed from orders app
  const pendingRaw = localStorage.getItem('pending-expense');
  if (pendingRaw) {
    localStorage.removeItem('pending-expense');
    try {
      const p = JSON.parse(pendingRaw);
      // Pre-fill the add form
      addForm.supplier = p.supplier || '';
      addForm.notes = p.notes || '';
      addForm.date = p.date || todayStr();
      if (p.image) {
        // Open scan tab with delivery note image loaded → user can run AI or enter manually
        const b64 = p.image.split(',')[1] || p.image;
        const mime = p.image.startsWith('data:') ? p.image.split(';')[0].split(':')[1] : 'image/jpeg';
        state.tab = 'scan';
        state.scanImg = p.image;
        state.scanB64 = b64;
        state.scanMime = mime;
        state.scanStage = 'preview';
      } else {
        state.tab = 'add';
      }
    } catch(e) {}
  }

  mergeAccFlags(DB.expenses); // restore any flags saved before this session
  migrateCategoryNames();
  seedSuppliersFromExpenses();
  applyRoleUI();
  render();
  setSyncStatus(CFG.webAppUrl ? 'syncing' : 'local');
  if (CFG.webAppUrl && getUserRole() !== 'scanner') syncAll();
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && CFG.webAppUrl && getUserRole() !== 'scanner') syncAll();
  });
}

function checkAuth() {
  var user = getStoredUser();
  if (user && isAllowed(user.email)) {
    initApp();
  } else {
    document.getElementById('login-screen').hidden = false;
    if (typeof google !== 'undefined' && google.accounts) initGoogleSignIn();
    // else: onGoogleScriptLoad() יטפל בזה כשהסקריפט ייטען
  }
}

function logout() {
  if (!confirm('להתנתק מהאפליקציה?')) return;
  var user = getStoredUser();
  localStorage.removeItem('google-user');
  if (typeof google !== 'undefined' && user) google.accounts.id.revoke(user.email, function(){});
  document.getElementById('app').hidden = true;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('login-err').textContent = '';
  setTimeout(initGoogleSignIn, 100);
}

// ─── Initial render + sync ──────────────────────────────────────────────────
initTheme();
checkAuth();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    // Force-check for a newer SW on every load
    reg.update();
    // When a new SW takes over → reload the page automatically to get latest code
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  }).catch(() => {});
}
