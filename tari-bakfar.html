}
function handleCredentialResponse(response) {
  try {
    const b64 = response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const payload = JSON.parse(atob(b64));
    if (!isAllowed(payload.email)) {
      document.getElementById('login-err').textContent = '🚫 ' + payload.email + ' — אין הרשאה';
      return;
    }
    localStorage.setItem('google-user', JSON.stringify({
      email: payload.email, name: payload.name || payload.email, picture: payload.picture || '',
    }));
    document.getElementById('login-screen').hidden = true;
    initApp();
  } catch(e) {
    document.getElementById('login-err').textContent = 'שגיאה בהתחברות, נסה שנית';
  }
}
function initGoogleSignIn() {
  var loginScreen = document.getElementById('login-screen');
  if (!loginScreen || loginScreen.hidden) return;
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    document.getElementById('login-err').textContent = '⚙️ יש להגדיר Client ID של Google';
    return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton(document.getElementById('google-signin-btn'), { type:'standard', theme:'outline', size:'large', width:260 });
  google.accounts.id.prompt();
}
function onGoogleScriptLoad() {
  if (!document.getElementById('login-screen').hidden) initGoogleSignIn();
}

function initApp() {
  document.getElementById('app').hidden = false;

  // Check for pending expense passed from orders app
  const pendingRaw = localStorage.getItem('pending-expense');
  if (pendingRaw) {
    localStorage.removeItem('pending-expense');
    try {
      const p = JSON.parse(pendingRaw);
      // Pre-fill the add form
      addForm.supplier = p.supplier || '';
      addForm.notes = p.notes || '';
      addForm.date = p.date || todayStr();
      if (p.image) {
        // Open scan tab with delivery note image loaded → user can run AI or enter manually
        const b64 = p.image.split(',')[1] || p.image;
        const mime = p.image.startsWith('data:') ? p.image.split(';')[0].split(':')[1] : 'image/jpeg';
        state.tab = 'scan';
        state.scanImg = p.image;
        state.scanB64 = b64;
        state.scanMime = mime;
        state.scanStage = 'preview';
      } else {
        state.tab = 'add';
      }
    } catch(e) {}
  }

  mergeAccFlags(DB.expenses); // restore any flags saved before this session
  migrateCategoryNames();
  seedSuppliersFromExpenses();
  dedupeExactExpenses();
  migrateApprovedSuppliers();
  seedSupplierProfiles();
  auditApprovedSuppliers();
  if (pdb.products.length === 0) importProductsFromOrders();
  loadOdb();
  applyRoleUI();
  render();
  setSyncStatus(CFG.webAppUrl ? 'syncing' : 'local');
  startLiveSyncLoop();
  if (CFG.webAppUrl && canRunFullSync()) syncAll();
  if (CFG.webAppUrl && canRunOrdersSync()) { syncOrders(); syncActiveOrders(); }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && CFG.webAppUrl) {
      if (canRunFullSync()) syncAll();
      if (canRunOrdersSync()) { syncOrders(); syncActiveOrders(); }
    }
  });
}

function checkAuth() {
  var user = getStoredUser();
  if (user && isAllowed(user.email)) {
    initApp();
  } else {
    document.getElementById('login-screen').hidden = false;
    if (typeof google !== 'undefined' && google.accounts) initGoogleSignIn();
    // else: onGoogleScriptLoad() יטפל בזה כשהסקריפט ייטען
  }
}

function logout() {
  if (!confirm('להתנתק מהאפליקציה?')) return;
  var user = getStoredUser();
  localStorage.removeItem('google-user');
  if (typeof google !== 'undefined' && user) google.accounts.id.revoke(user.email, function(){});
  document.getElementById('app').hidden = true;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('login-err').textContent = '';
  setTimeout(initGoogleSignIn, 100);
}

// ═══════════════════════════════════════════════════════════════════════════
// ORDERS — הזמנות (shared storage with orders.html via orders-v1)
// ═══════════════════════════════════════════════════════════════════════════
const ORDERS_KEY = 'orders-v1';
const ORDERS_ALL_DRAFTS_KEY = 'orders-all-drafts';
const ORDERS_ICONS = ['🍎','🥦','🍋','🧅','🥕','🍇','🥬','🍓','🌽','🧄','🧀','🥚','🐟','🥩','🫙'];
let odb = { suppliers: [], history: [], activeOrders: [], _localModified: 0, _lastSynced: 0 };

function loadOdb() {
  try { const s = localStorage.getItem(ORDERS_KEY); if (s) odb = JSON.parse(s); } catch(e) {}
  if (!odb.suppliers) odb.suppliers = [];
  if (!odb.history) odb.history = [];
  if (!odb.activeOrders) odb.activeOrders = [];
  if (!odb._localModified) {
    const hasData = odb.suppliers.length || odb.history.length || odb.activeOrders.length;
    odb._localModified = hasData ? Date.now() : 0;
  }
  if (!odb._lastSynced) odb._lastSynced = odb._localModified ? 0 : Date.now();
}
function saveOdb(dirty) {
  if (dirty) odb._localModified = Date.now();
  localStorage.setItem(ORDERS_KEY, JSON.stringify(odb));
  if (dirty) scheduleAutoSync();
}
loadOdb();

async function ordersCloudCall(action, payload) {
  const url = CFG.webAppUrl;
  if (!url) throw new Error('No cloud URL');
  const res = await fetch(url, {
    method: 'POST',
    body: JSON.stringify({ action, ...payload }),
    headers: { 'Content-Type': 'text/plain' }
  });
  const json = JSON.parse(await res.text());
  if (!json.ok) throw new Error(json.error || 'Cloud error');
  return json.data;
}

function ordersSetSyncDot(status) {
  const el = document.getElementById('orders-sync-dot');
  if (!el) return;
  el.style.background = status === 'ok' ? 'var(--accent)' : status === 'syncing' ? 'var(--amber)' : 'var(--danger)';
  el.title = status === 'ok' ? 'מסונכרן' : status === 'syncing' ? 'מסנכרן...' : 'שגיאת סנכרון';
}

async function syncOrders() {
  try {
    ordersSetSyncDot('syncing');
    const hasPending = odb._localModified > odb._lastSynced;
    if (hasPending) {
      await ordersCloudCall('save_suppliers', { payload: odb.suppliers });
      odb._lastSynced = Date.now();
      saveOdb();
    } else {
      const cloud = await ordersCloudCall('list_suppliers', {});
      if (cloud && cloud.length > 0) {
        const prevStr = JSON.stringify(odb.suppliers);
        odb.suppliers = cloud;
        odb._lastSynced = Date.now();
        odb._localModified = odb._lastSynced;
        saveOdb();
        if (state.tab === 'orders' && state.ordersView === 'home' && JSON.stringify(odb.suppliers) !== prevStr) render();
      } else if (odb.suppliers.length > 0) {
        await ordersCloudCall('save_suppliers', { payload: odb.suppliers });
        odb._lastSynced = Date.now();
        odb._localModified = odb._lastSynced;
        saveOdb();
      }
    }
    ordersSetSyncDot('ok');
  } catch(e) {
    ordersSetSyncDot('err');
    console.log('syncOrders failed:', e.message);
  }
}

async function pushOrders() {
  try {
    ordersSetSyncDot('syncing');
    await ordersCloudCall('save_suppliers', { payload: odb.suppliers });
    odb._lastSynced = Date.now();
    saveOdb();
    ordersSetSyncDot('ok');
  } catch(e) {
    ordersSetSyncDot('err');
    console.warn('pushOrders failed:', e.message);
  }
}

async function pushActiveOrders() {
  try {
    const payload = (odb.activeOrders || []).map(o => ({
      id: o.id, supplierId: o.supplierId, supplierName: o.supplierName,
      dateOrdered: o.dateOrdered, timestamp: o.timestamp, items: o.items,
      deliveryNoteIds: o.deliveryNoteIds || []
    }));
    await ordersCloudCall('save_active_orders', { payload });
  } catch(e) { console.log('pushActiveOrders failed:', e.message); }
}

async function syncActiveOrders() {
  try {
    const cloud = await ordersCloudCall('list_active_orders', {});
    if (!cloud) return;
    const localImgMap = {};
    const localDnMap = {};
    (odb.activeOrders || []).forEach(o => {
      if (o.deliveryNoteImage) localImgMap[o.id] = o.deliveryNoteImage;
      if (o.deliveryNoteIds) localDnMap[o.id] = o.deliveryNoteIds;
    });
    odb.activeOrders = cloud.map(o => ({ ...o, deliveryNoteImage: localImgMap[o.id] || null, deliveryNoteIds: localDnMap[o.id] || o.deliveryNoteIds || [] }));
    saveOdb();
    if (state.tab === 'orders') render();
  } catch(e) { console.log('syncActiveOrders failed:', e.message); }
}

// ── Draft helpers ──────────────────────────────────────────────────────────
function ordersGetAllDrafts() {
  try { return JSON.parse(localStorage.getItem(ORDERS_ALL_DRAFTS_KEY) || '{}'); } catch(e) { return {}; }
}
function ordersSaveDraft() {
  const drafts = ordersGetAllDrafts();
  drafts[state.ordersSupplierId] = { state: state.ordersState, ts: Date.now() };
  localStorage.setItem(ORDERS_ALL_DRAFTS_KEY, JSON.stringify(drafts));
}
function ordersClearDraft() {
  const drafts = ordersGetAllDrafts();
  delete drafts[state.ordersSupplierId];
  localStorage.setItem(ORDERS_ALL_DRAFTS_KEY, JSON.stringify(drafts));
}
function ordersLoadDraft(supplierId) {
  const drafts = ordersGetAllDrafts();
  return (drafts[supplierId] && drafts[supplierId].state) ? drafts[supplierId].state : null;
}
function ordersHasDraftFor(supplierId) {
  const drafts = ordersGetAllDrafts();
  if (!drafts[supplierId]) return false;
  const st = drafts[supplierId].state || {};
  return Object.keys(st).some(function(pid) {
    const v = st[pid];
    if (!v) return false;
    if (v.isManual) return (parseInt(v.qty)||0) > 0;
    if (v.unit === 'both') return (parseInt(v.carton)||0) > 0 || (parseInt(v.units)||0) > 0;
    return (parseInt(v.qty)||0) > 0;
  });
}

// ── findSupplierOdb ────────────────────────────────────────────────────────
function findSupplierOdb(id) { return odb.suppliers.find(s => s.id === id); }

// ── getOrderedItems ────────────────────────────────────────────────────────
function ordersGetOrderedItems() {
  const sup = findSupplierOdb(state.ordersSupplierId);
  if (!sup) return [];
  const items = [];
  sup.products.forEach(p => {
    const st = state.ordersState[p.id];
    if (!st) return;
    if (st.unit === 'both') {
      const qc = parseInt(st.carton) || 0;
      const qu = parseInt(st.units) || 0;
      if (qc > 0) items.push({ name: p.name, qty: String(qc), unit: 'קרטון', notes: st.notes || '' });
      if (qu > 0) items.push({ name: p.name, qty: String(qu), unit: 'יחידות', notes: st.notes || '' });
    } else {
      const qty = parseInt(st.qty) || 0;
      if (qty > 0) items.push({ name: p.name, qty: st.qty, unit: st.unit, notes: st.notes || '' });
    }
  });
  Object.keys(state.ordersState).filter(k => k.startsWith('manual_')).forEach(k => {
    const st = state.ordersState[k];
    if (!st || !st.isManual) return;
    const qty = parseInt(st.qty) || 0;
    if (qty > 0) items.push({ name: st.name, qty: String(qty), unit: st.unit, notes: st.notes || '' });
  });
  return items;
}

function ordersUpdateOrderCounter() {
  const el = document.getElementById('orders-counter');
  if (!el) return;
  let totalCartons = 0, totalUnits = 0;

  // Count catalog products
  const sup = findSupplierOdb(state.ordersSupplierId);
  if (sup) {
    sup.products.forEach(function(p) {
      const st = state.ordersState[p.id];
      if (!st) return;
      if (st.unit === 'both') {
        totalCartons += parseInt(st.carton) || 0;
        totalUnits += parseInt(st.units) || 0;
      } else if (st.unit === 'קרטון') {
        totalCartons += parseInt(st.qty) || 0;
      } else {
        totalUnits += parseInt(st.qty) || 0;
      }
    });
  }

  // Always count manual items directly from state
  Object.keys(state.ordersState || {}).filter(function(k){ return k.startsWith('manual_'); }).forEach(function(k) {
    const st = state.ordersState[k];
    if (!st || !st.isManual) return;
    const qty = parseInt(st.qty) || 0;
    if (st.unit === 'קרטון') totalCartons += qty;
    else totalUnits += qty;
  });

  const parts = [];
  if (totalCartons > 0) parts.push('📦 ' + totalCartons + ' קרטון');
  if (totalUnits > 0) parts.push('🔢 ' + totalUnits + ' יחידות');
  if (parts.length) {
    el.textContent = parts.join('  ·  ');
    el.hidden = false;
  } else {
    el.textContent = '';
    el.hidden = true;
  }
}

// ── Stepper actions (direct DOM update, no re-render) ─────────────────────
function ordersStepQty(pid, delta) {
  const st = state.ordersState[pid];
  if (!st) return;
  const next = Math.max(0, (parseInt(st.qty) || 0) + delta);
  st.qty = String(next);
  const el = document.getElementById('oqd-' + pid);
  if (el) { el.textContent = next; el.className = 'o-step-val' + (next === 0 ? ' zero' : ''); }
  ordersSaveDraft();
  ordersUpdateOrderCounter();
}

function ordersStepQtyBoth(pid, type, delta) {
  const st = state.ordersState[pid];
  if (!st) return;
  const next = Math.max(0, (parseInt(st[type]) || 0) + delta);
  st[type] = String(next);
  const elId = type === 'carton' ? 'oqc-' : 'oqu-';
  const el = document.getElementById(elId + pid);
  if (el) { el.textContent = next; el.className = 'o-step-val' + (next === 0 ? ' zero' : ''); }
  ordersSaveDraft();
  ordersUpdateOrderCounter();
}

function ordersClearOrder() {
  const sup = findSupplierOdb(state.ordersSupplierId);

function ordersOpenWhatsAppText(text) {

  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(()=>{});
  } catch(e) {}
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  const win = window.open(url, '_blank', 'noopener,noreferrer');
  if (!win) window.location.href = url;
}

function ordersConfirmOrderSent() {

  if (!orderedItems.length) { toast('אין פריטים בהזמנה', 'error'); return; }
  const dateStr = fmtOrdersDate(new Date());
  const lines = orderedItems.map(it => `${it.name}: ${it.qty} ${it.unit}${it.notes ? ' — ' + it.notes : ''}`);
  const text = `📋 הזמנה - ${sup.name}\n📅 ${dateStr}\n\n${lines.join('\n')}\n\nתודה!`;
  if (!odb.history) odb.history = [];
  odb.history.unshift({ id: uid(), supplierId: sup.id, supplierName: sup.name,
    dateStr, timestamp: Date.now(), items: orderedItems, text });
  if (odb.history.length > 200) odb.history = odb.history.slice(0, 200);
  if (!odb.activeOrders) odb.activeOrders = [];
  odb.activeOrders.unshift({ id: uid(), supplierId: sup.id, supplierName: sup.name,
    dateOrdered: dateStr, timestamp: Date.now(), items: orderedItems, deliveryNoteImage: null });

  pushActiveOrders();

function ordersExecuteTransfer(targetSupplierId) {
  if (!state.ordersTransferData) return;
  const { pid, name } = state.ordersTransferData;
  const st = state.ordersState[pid];
  if (!st) { setState({ ordersModal: '', ordersTransferData: null }); return; }
  const totalQty = st.unit === 'both'
    ? (parseInt(st.carton)||0) + (parseInt(st.units)||0)
    : (parseInt(st.qty)||0);
  if (totalQty === 0) {
    setState({ ordersModal: '', ordersTransferData: null });
    toast('אין כמות להעברה — הזן כמות קודם', 'error');
    return;
  }
  const drafts = ordersGetAllDrafts();
  const targetState = (drafts[targetSupplierId] && drafts[targetSupplierId].state) || {};
  if (st.unit === 'both') {
    const qc = parseInt(st.carton) || 0;
    const qu = parseInt(st.units) || 0;
    if (qc > 0) targetState['manual_' + uid()] = { isManual:true, name, unit:'קרטון', qty:String(qc), notes:'' };
    if (qu > 0) targetState['manual_' + uid()] = { isManual:true, name, unit:'יחידות', qty:String(qu), notes:'' };
    st.carton = '0'; st.units = '0';
  } else {
    targetState['manual_' + uid()] = { isManual:true, name, unit:st.unit, qty:String(parseInt(st.qty)), notes:'' };
    st.qty = '0';
  }
  if (pid.startsWith('manual_')) delete state.ordersState[pid];
  drafts[targetSupplierId] = { state: targetState, ts: Date.now() };
  localStorage.setItem(ORDERS_ALL_DRAFTS_KEY, JSON.stringify(drafts));
  ordersSaveDraft();
  const targetSup = findSupplierOdb(targetSupplierId);
  setState({ ordersModal: '', ordersTransferData: null });
  // Update counter after DOM settles
  requestAnimationFrame(() => requestAnimationFrame(() => ordersUpdateOrderCounter()));
  toast(`⇄ הועבר ל${targetSup?.name||''} ✓`, 'success');
}

function ordersGetLinkedDeliveryNotes(orderId) {
  const order = (odb.activeOrders||[]).find(o => o.id === orderId);
  const ids = new Set([...(order?.deliveryNoteIds||[])]);
  (DB.expenses||[]).forEach(e => { if (e.linkedOrderId === orderId) ids.add(e.id); });
  return [...ids].map(id => ordersGetDeliveryNoteById(id)).filter(Boolean);
}

  return (DB.expenses||[]).filter(e =>

function ordersLinkDeliveryNote(orderId, dnId) {

  (odb.activeOrders||[]).forEach(o => {

function ordersUploadDeliveryNote(event, orderId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const order = (odb.activeOrders || []).find(o => o.id === orderId);
      if (!order) return;
      order.deliveryNoteImage = canvas.toDataURL('image/jpeg', 0.75);
      saveOdb(); render();
      toast('תמונה נשמרה ✓', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function ordersInitDragDrop() {
  var _dragging = null;
  document.querySelectorAll('#o-product-list .o-manage-row').forEach(function(row) {
    var handle = row.querySelector('.o-drag-handle');
    if (!handle) return;
    handle.addEventListener('touchstart', function(e) {
      e.preventDefault();
      startDragO(row, e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      startDragO(row, e.clientX, e.clientY);
    });
  });

  function startDragO(row, startX, startY) {
    if (_dragging) return;
    _dragging = row;
    row.classList.add('dragging');
    function swapToPosition(clientX, clientY) {
      _dragging.style.pointerEvents = 'none';
      var el = document.elementFromPoint(clientX, clientY);
      _dragging.style.pointerEvents = '';
      if (!el) return;
      var target = el.closest('#o-product-list .o-manage-row');
      if (!target || target === _dragging) return;
      var parent = document.getElementById('o-product-list');
      var rows = Array.from(parent.querySelectorAll('.o-manage-row'));
      var fromIdx = rows.indexOf(_dragging);
      var toIdx = rows.indexOf(target);
      if (fromIdx < toIdx) parent.insertBefore(_dragging, target.nextSibling);
      else parent.insertBefore(_dragging, target);
    }
    function endDragO() {
      if (!_dragging) return;
      _dragging.classList.remove('dragging');
      var parent = document.getElementById('o-product-list');
      var domRows = Array.from(parent.querySelectorAll('.o-manage-row'));
      var sup = findSupplierOdb(state.ordersSupplierId);
      if (sup) {
        var oldProducts = sup.products.slice();
        var newOrder = domRows.map(function(r) { return r.id.replace('omr-', ''); });
        sup.products = newOrder.map(function(id) {
          return oldProducts.find(function(p) { return p.id === id; });
        }).filter(Boolean);
        saveOdb(true); pushOrders();
      }
      _dragging = null;
      render();
    }
    function onTouchMove(e) { e.preventDefault(); swapToPosition(e.touches[0].clientX, e.touches[0].clientY); }
    function onTouchEnd() {
      document.removeEventListener('touchmove', onTouchMove);
      document.removeEventListener('touchend', onTouchEnd);
      endDragO();
    }
    function onMouseMove(e) { swapToPosition(e.clientX, e.clientY); }
    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      endDragO();
    }
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onTouchEnd);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  }
}

function fmtOrdersDate(d) {
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  return `יום ${days[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function renderDesktopOrdersDrawer(supplier, activeOrder) {
  if (activeOrder) {
    const supName = (typeof ordersGetSupplierName === 'function') ? ordersGetSupplierName(activeOrder.supplierId) : activeOrder.supplierName;
    const items = activeOrder.items || [];
    return `<aside class="desktop-drawer">
      <div class="desktop-section-head">
        <div><div class="desktop-section-title">${esc(supName||'הזמנה')}</div><div class="desktop-muted">${fmtDate(activeOrder.dateOrdered || activeOrder.timestamp)}</div></div>
        <button class="desktop-mini-btn" onclick="setState({ordersDesktopOrderId:''})">סגור</button>
      </div>
      <div class="desktop-section-pad">
        <div style="margin-bottom:12px">${desktopStatus(activeOrder.deliveryNoteIds&&activeOrder.deliveryNoteIds.length?'קושרה תעודת משלוח':'ממתינה לתעודה', activeOrder.deliveryNoteIds&&activeOrder.deliveryNoteIds.length?'ok':'warn')}</div>
        <div class="desktop-section-title" style="margin-bottom:8px">מוצרים בהזמנה</div>
        ${items.map(i=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span>${esc(i.name||'')}</span><b>${esc(i.qty||i.quantity||'')} ${esc(i.unit||'')}</b></div>`).join('') || '<div class="desktop-muted">אין פריטים בהזמנה.</div>'}
        <button class="desktop-mini-btn primary" style="width:100%;margin-top:12px" onclick="setState({ordersView:'active'})">פתח מסך טיפול</button>
      </div>
    </aside>`;
  }
  if (!supplier) return `<aside class="desktop-drawer">${desktopEmpty('🚚','בחר ספק או הזמנה','פרטי הזמנה, מוצרים ותעודות משלוח יופיעו כאן')}</aside>`;
  const draft = ordersHasDraftFor(supplier.id);
  return `<aside class="desktop-drawer">
    <div class="desktop-section-head">
      <div><div class="desktop-section-title">${esc(supplier.name)}</div><div class="desktop-muted">${supplier.products.length} מוצרים</div></div>
      <button class="desktop-mini-btn" onclick="setState({ordersDesktopSupplierId:''})">סגור</button>
    </div>
    <div class="desktop-section-pad">
      <div style="margin-bottom:12px">${desktopStatus(draft?'יש טיוטה':'מוכן להזמנה', draft?'warn':'ok')}</div>

      <button class="desktop-mini-btn" style="width:100%;margin-bottom:12px" onclick="ordersOpenManage('${supplier.id}','home')">נהל מוצרים</button>
      <div class="desktop-section-title" style="margin-bottom:8px">מוצרים פעילים</div>
      ${supplier.products.filter(p=>p.active!==false).slice(0,12).map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span>${esc(p.name)}</span><span class="desktop-muted">${esc(p.defaultUnit||'')}</span></div>`).join('') || '<div class="desktop-muted">אין מוצרים פעילים.</div>'}
    </div>
  </aside>`;
}

function renderDesktopOrders() {
  const suppliers = odb.suppliers || [];
  const activeOrders = odb.activeOrders || [];
  const selectedOrder = activeOrders.find(o=>o.id===state.ordersDesktopOrderId);
  const selectedSupplier = suppliers.find(s=>s.id===state.ordersDesktopSupplierId) || suppliers[0] || null;
  const q = (state.ordersSearch || '').trim().toLowerCase();
  const filteredSuppliers = q ? suppliers.filter(s => [s.name, ...(s.products||[]).map(p=>p.name)].join(' ').toLowerCase().includes(q)) : suppliers;
  const supplierRows = filteredSuppliers.map(s => `<tr class="${!selectedOrder && selectedSupplier && selectedSupplier.id===s.id?'desktop-row-selected':''}" onclick="setState({ordersDesktopSupplierId:'${s.id}',ordersDesktopOrderId:''})" style="cursor:pointer">
    <td><b>${esc(s.name)}</b><div class="desktop-muted">${s.products.length} מוצרים</div></td>
    <td>${ordersHasDraftFor(s.id)?desktopStatus('טיוטה','warn'):desktopStatus('מוכן','ok')}</td>
    <td><button class="desktop-mini-btn primary" onclick="event.stopPropagation();ordersOpenOrder('${s.id}')">הזמן</button></td>
  </tr>`).join('');
  const activeRows = activeOrders.map(o => {
    const sup = (typeof ordersGetSupplierName === 'function') ? ordersGetSupplierName(o.supplierId) : (o.supplierName || '');
    return `<tr class="${selectedOrder&&selectedOrder.id===o.id?'desktop-row-selected':''}" onclick="setState({ordersDesktopOrderId:'${o.id}',ordersDesktopSupplierId:''})" style="cursor:pointer">
      <td><b>${esc(sup||'הזמנה')}</b><div class="desktop-muted">${fmtDate(o.dateOrdered || o.timestamp)}</div></td>
      <td>${(o.items||[]).length}</td>
      <td>${desktopStatus(o.deliveryNoteIds&&o.deliveryNoteIds.length?'קושרה תעודה':'פתוחה', o.deliveryNoteIds&&o.deliveryNoteIds.length?'ok':'warn')}</td>
    </tr>`;
  }).join('');
  return `<div class="desktop-page fade-up">
    ${desktopPageHead('הזמנות', 'עבודה מהירה מול ספקים, טיוטות והזמנות פתוחות', `<button class="desktop-mini-btn primary" onclick="setState({ordersModal:'add-supplier'})">+ ספק להזמנות</button><button class="desktop-mini-btn" onclick="setState({ordersView:'history'})">היסטוריה</button>`)}
    <div class="desktop-kpi-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      ${desktopKpi('ספקים להזמנות', suppliers.length, 'כרטיסי הזמנה')}
      ${desktopKpi('הזמנות פתוחות', activeOrders.length, 'בתהליך', activeOrders.length?'warn':'ok')}
      ${desktopKpi('טיוטות', suppliers.filter(s=>ordersHasDraftFor(s.id)).length, 'הזמנות שמורות', 'info')}
      ${desktopKpi('מוצרים פעילים', suppliers.reduce((n,s)=>n+s.products.filter(p=>p.active!==false).length,0), 'בכל הספקים')}
    </div>
    <div class="desktop-work-grid">
      <div style="display:grid;gap:16px">
        <section class="desktop-section">
          <div class="desktop-filterbar"><input class="input" placeholder="חיפוש ספק או מוצר" value="${esc(state.ordersSearch||'')}" oninput="state.ordersSearch=this.value;render()"></div>
          <div class="desktop-section-head"><div class="desktop-section-title">ספקים להזמנה</div></div>
          <div class="desktop-table-wrap">${supplierRows ? `<table class="desktop-table"><thead><tr><th>ספק</th><th>סטטוס</th><th>פעולה</th></tr></thead><tbody>${supplierRows}</tbody></table>` : desktopEmpty('📦','אין ספקים','הוסף ספק ראשון להזמנות')}</div>
        </section>
        <section class="desktop-section">
          <div class="desktop-section-head"><div class="desktop-section-title">הזמנות פתוחות</div><button class="desktop-mini-btn" onclick="setState({ordersView:'active'})">טיפול</button></div>
          <div class="desktop-table-wrap">${activeRows ? `<table class="desktop-table"><thead><tr><th>ספק</th><th>פריטים</th><th>סטטוס</th></tr></thead><tbody>${activeRows}</tbody></table>` : desktopEmpty('✅','אין הזמנות פתוחות','הכול נקי כרגע')}</div>
        </section>
      </div>
      ${renderDesktopOrdersDrawer(selectedSupplier, selectedOrder)}
    </div>
  </div>`;
}

function renderOrdersTab() {
  if (isDesktopMode() && !['order','manage'].includes(state.ordersView)) return renderDesktopOrders();
  switch(state.ordersView) {
    case 'order':   return renderOrdersOrderView();
    case 'manage':  return renderOrdersManageView();
    case 'history': return renderOrdersHistoryView();
    case 'active':  return renderOrdersActiveView();
    default:        return renderOrdersHomeView();
  }
}

  let productsHtml = '';

    productsHtml = `<div style="text-align:center;padding:60px 20px">

          <button onclick="ordersAddManualProduct()" style="flex:1;border:none;border-radius:var(--r-md);padding:12px 8px;background:linear-gradient(135deg,var(--accent),#52a428);color:#051201;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer">+ הוסף</button>

        <button onclick="setState({ordersModal:'',ordersModalData:null})" style="width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--textDim);margin-top:12px">סגור</button>

                <div style="font-size:13px;font-weight:800">${esc(o.supplierName)}</div>
                <div style="font-size:11px;color:var(--textDim);margin-top:2px">הוזמן ${esc(o.dateOrdered)} · ${(o.items||[]).length} פריטים</div>

        <button onclick="setState({ordersModal:'',ordersModalData:null})" style="width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--textDim);margin-top:12px">סגור</button>

  if (m === 'transfer') {
    const td = state.ordersTransferData;
    const others = (odb.suppliers || []).filter(s => s.id !== state.ordersSupplierId);
    return `<div class="o-overlay" onclick="setState({ordersModal:'',ordersTransferData:null})">
      <div class="o-modal" onclick="event.stopPropagation()">
        <div class="o-modal-handle"></div>

        <p style="margin:0 0 4px;color:var(--accent);font-weight:700;font-size:14px">"${esc(td?.name||'')}"</p>
        <p style="margin:0 0 12px;font-size:12px;color:var(--textDim)">הכמות תתאפס אצל הספק הנוכחי</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:50vh;overflow-y:auto">
          ${others.length ? others.map(s => `
            <button onclick="ordersExecuteTransfer('${s.id}')"
              style="display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer;font-family:inherit;text-align:right">
              <span style="font-size:22px">${ORDERS_ICONS[odb.suppliers.indexOf(s) % ORDERS_ICONS.length]}</span>
              <span style="font-size:14px;font-weight:700;color:var(--text)">${esc(s.name)}</span>

            `<div style="text-align:center;padding:20px;color:var(--textDim);font-size:13px">אין ספקים אחרים במערכת</div>`}

  return '';

// ═══════════════════════════════════════════════════════════════════════════
// PAYABLES — חובות ספקים
// ═══════════════════════════════════════════════════════════════════════════
const PAYABLES_KEY = 'payables-v1';
let pv = { taxInvoices: [], debts: [], cancelledDNIds: [], _lastSynced: 0, _localModified: 0 };

function loadPv() {
  try { const s = localStorage.getItem(PAYABLES_KEY); if (s) pv = JSON.parse(s); } catch(e) {}
  if (!pv.taxInvoices) pv.taxInvoices = [];
  if (!pv.debts) pv.debts = [];
  if (!pv.cancelledDNIds) pv.cancelledDNIds = [];
  if (!pv.suppliers) pv.suppliers = [];
  if (!pv.supplierInvoices) pv.supplierInvoices = [];
  if (!pv.supplierInvoicePayments) pv.supplierInvoicePayments = [];
  if (!pv.supplierInvoiceDeliveryNotes) pv.supplierInvoiceDeliveryNotes = [];
  if (!pv.supplierInvoiceFiles) pv.supplierInvoiceFiles = [];
  if (!pv.supplierInvoiceActivityLog) pv.supplierInvoiceActivityLog = [];
  if (!pv._localModified) {
    const hasData = pv.taxInvoices.length || pv.debts.length || pv.cancelledDNIds.length || pv.supplierInvoices.length;
    pv._localModified = hasData ? Date.now() : 0;
  }
  if (!pv._lastSynced) pv._lastSynced = pv._localModified ? 0 : Date.now();
  pvEnsureSupplierInvoiceMigration();
}
function savePv(dirty) {
  if (dirty) pv._localModified = Date.now();
  try {
    localStorage.setItem(PAYABLES_KEY, JSON.stringify(pv));
  } catch(e) {
    if (!isStorageQuotaError(e)) throw e;
    console.warn('[local-save] storage quota exceeded while saving payables; stripping stored invoice images', e);
    const compact = {
      ...pv,
      debts: (pv.debts || []).map(d => ({...d, invoiceImage: ''})),
      taxInvoices: (pv.taxInvoices || []).map(t => ({...t, invoiceImage: ''})),
      supplierInvoices: (pv.supplierInvoices || []).map(inv => ({
        ...inv,
        invoice_file: '',
        legacy_data: inv.legacy_data?.expense ? {
          ...inv.legacy_data,
          expense: {...inv.legacy_data.expense, image: ''}
        } : inv.legacy_data
      })),
    };
    localStorage.setItem(PAYABLES_KEY, JSON.stringify(compact));
    pv = compact;
    toast('נשמר. האחסון בטלפון היה מלא ולכן תמונות ישנות הוסרו מהמטמון.', 'info');
  }
  if (dirty) scheduleAutoSync();
}
loadPv();

function pvCurrentUserName() {
  try {
    const u = getCurrentUser && getCurrentUser();
    return u?.email || u?.name || 'local-user';
  } catch(e) { return 'local-user'; }
}

function pvCreateMigrationBackup() {
  const key = 'payables-v1-backup-before-supplier-invoices';
  if (localStorage.getItem(key)) return;
  try {
    localStorage.setItem(key, JSON.stringify({
      createdAt: new Date().toISOString(),
      reason: 'safe migration before supplier_invoices model',
      payables: pv
    }));
    console.info('[supplier-invoices] migration backup created', key);
  } catch(e) {
    console.warn('[supplier-invoices] could not create local migration backup', e);
  }
}

function pvInvoiceLog(invoiceId, action, field, oldValue, newValue, meta) {
  if (!pv.supplierInvoiceActivityLog) pv.supplierInvoiceActivityLog = [];
  pv.supplierInvoiceActivityLog.unshift({
    id: uid(),
    invoice_id: invoiceId || '',
    action,
    field: field || '',
    old_value: oldValue == null ? '' : oldValue,
    new_value: newValue == null ? '' : newValue,
    meta: meta || null,
    created_at: new Date().toISOString(),
    created_by: pvCurrentUserName()
  });
  if (pv.supplierInvoiceActivityLog.length > 1200) pv.supplierInvoiceActivityLog = pv.supplierInvoiceActivityLog.slice(0, 1200);
}

function pvSupplierIdByName(name) {
  const sup = findApprovedSupplier(name || '');
  return sup?.id || supplierKey(name || '');
}

function pvCalcInvoiceStatus(inv) {
  if (inv?.deleted) return 'נמחקה';
  if (!inv || inv.archived) return inv?.payment_status || 'לא שולם';
  if (inv.payment_status === 'טיוטה לבדיקה') return 'טיוטה לבדיקה';
  if (inv.payment_status === 'מאושרת כחוב פתוח') return 'מאושרת כחוב פתוח';
  if (inv.payment_status === 'שולם') return 'שולם';
  const total = +inv.total_amount || 0;
  const paid = pvInvoicePaidAmount(inv.id);
  if (paid > 0 && paid < total) return 'שולם חלקית';
  if (paid >= total && total > 0) {
    if (pvIsCheckMethod(inv.payment_method) && inv.check_cleared !== true) return 'ממתין לפירעון צ׳ק';
    return 'שולם';
  }
  if (pvIsCheckMethod(inv.payment_method)) return 'ממתין לפירעון צ׳ק';
  const due = pvDateISO(inv.due_date);
  if (due && due < todayISO()) return 'באיחור';
  return inv.payment_status || 'לא שולם';
}

function pvInvoicePaidAmount(invoiceId) {
  return (pv.supplierInvoicePayments || [])
    .filter(p => p.invoice_id === invoiceId && p.cancelled !== true)
    .reduce((s,p)=>s+(+p.amount||0),0);
}

function pvInvoiceOpenAmount(inv) {
  return Math.max(0, (+inv.total_amount || 0) - pvInvoicePaidAmount(inv.id));
}

function pvIsInvoiceOpen(inv) {
  return !inv.deleted && !inv.archived && !['שולם','טיוטה לבדיקה','נמחקה'].includes(pvCalcInvoiceStatus(inv));
}

function pvNormalizeInvoice(inv) {
  const supplierName = inv.supplier_name || inv.supplierName || inv.supplier || '';
  const total = +inv.total_amount || +inv.amount || 0;
  const vat = +inv.vat_amount || 0;
  const beforeVat = +inv.amount_before_vat || Math.max(0, total - vat);
  const now = new Date().toISOString();
  return {
    id: inv.id || uid(),
    supplier_id: inv.supplier_id || pvSupplierIdByName(supplierName),
    supplier_name: supplierName,
    supplier_tax_id: inv.supplier_tax_id || '',
    invoice_number: inv.invoice_number || inv.invoiceNumber || '',
    invoice_date: heToISO(inv.invoice_date || inv.date || todayStr()),
    amount_before_vat: beforeVat,
    vat_amount: vat,
    total_amount: total,
    payment_status: inv.payment_status || inv.paymentStatus || 'לא שולם',
    payment_method: inv.payment_method || inv.paymentMethod || "צ'ק",
    due_date: inv.due_date || inv.dueDate || '',
    paid_at: inv.paid_at || inv.paidDate || '',
    check_number: inv.check_number || inv.checkNumber || '',
    check_due_date: inv.check_due_date || inv.checkDueDate || inv.due_date || inv.dueDate || '',
    check_bank: inv.check_bank || '',
    check_note: inv.check_note || '',
    check_cleared: !!inv.check_cleared,
    accounting_sent: !!(inv.accounting_sent || inv.accountingPassed),
    accounting_sent_at: inv.accounting_sent_at || '',
    invoice_file: inv.invoice_file || inv.invoiceImage || '',
    notes: inv.notes || '',
    delivery_note_ids: Array.isArray(inv.delivery_note_ids) ? inv.delivery_note_ids : (inv.deliveryNoteIds || []),
    archived: !!inv.archived,
    archived_at: inv.archived_at || '',
    deleted: !!inv.deleted,
    deleted_at: inv.deleted_at || '',
    delete_reason: inv.delete_reason || '',
    legacy_data: inv.legacy_data || null,
    legacy_debt_id: inv.legacy_debt_id || inv.legacyDebtId || '',
    legacy_tax_invoice_id: inv.legacy_tax_invoice_id || inv.legacyTaxInvoiceId || '',
    created_at: inv.created_at || inv.createdAt || now,
    updated_at: inv.updated_at || inv.updatedAt || now,
    created_by: inv.created_by || 'migration',
    updated_by: inv.updated_by || 'migration'
  };
}

function pvEnsureSupplierInvoiceMigration() {
  if (pv._supplierInvoicesMigrationV1) return;
  pvCreateMigrationBackup();
  if (!pv.supplierInvoices) pv.supplierInvoices = [];
  if (!pv.supplierInvoicePayments) pv.supplierInvoicePayments = [];
  if (!pv.supplierInvoiceDeliveryNotes) pv.supplierInvoiceDeliveryNotes = [];
  if (!pv.supplierInvoiceFiles) pv.supplierInvoiceFiles = [];
  if (!pv.supplierInvoiceActivityLog) pv.supplierInvoiceActivityLog = [];
  let created = 0;

  (pv.taxInvoices || []).forEach(ti => {
    if (pv.supplierInvoices.some(inv => inv.legacy_tax_invoice_id === ti.id)) return;
    const inv = pvNormalizeInvoice({
      supplier_name: ti.supplierName,
      invoice_number: ti.invoiceNumber,
      invoice_date: ti.date,
      total_amount: ti.amount,
      payment_status: 'לא שולם',
      payment_method: "צ'ק",
      invoice_file: ti.invoiceImage || '',
      delivery_note_ids: ti.deliveryNoteIds || [],
      notes: ti.notes || '',
      legacy_tax_invoice_id: ti.id,
      legacy_data: {...ti}
    });
    pv.supplierInvoices.push(inv);
    (inv.delivery_note_ids || []).forEach(dnId => {
      if (!pv.supplierInvoiceDeliveryNotes.some(x => x.invoice_id === inv.id && x.delivery_note_id === dnId)) {
        pv.supplierInvoiceDeliveryNotes.push({id:uid(), invoice_id:inv.id, delivery_note_id:dnId, created_at:inv.created_at, created_by:'migration'});
      }
    });
    pvInvoiceLog(inv.id, 'יצירת חשבונית', 'migration', '', 'from taxInvoices', {legacy_tax_invoice_id: ti.id});
    created++;
  });

  (pv.debts || []).forEach(d => {
    if (pv.supplierInvoices.some(inv => inv.legacy_debt_id === d.id)) return;
    const inv = pvNormalizeInvoice({
      supplier_name: d.supplierName,
      invoice_number: d.invoiceNumber,
      invoice_date: d.date,
      total_amount: d.amount,
      payment_status: d.paymentStatus || (d.status === 'paid' ? 'שולם' : 'לא שולם'),
      payment_method: d.paymentMethod,
      due_date: d.dueDate,
      paid_at: d.paidDate || '',
      check_number: d.checkNumber || '',
      accounting_sent: !!d.accountingPassed,
      invoice_file: d.invoiceImage || '',
      notes: d.notes || '',
      legacy_debt_id: d.id,
      legacy_tax_invoice_id: d.taxInvoiceId || '',
      legacy_data: {...d}
    });
    pv.supplierInvoices.push(inv);
    if ((+d.paidAmount || 0) > 0 || d.status === 'paid') {
      const amount = +d.paidAmount || +d.amount || 0;
      pv.supplierInvoicePayments.push({
        id: uid(),
        invoice_id: inv.id,
        amount,
        date: d.paidDate || d.closedAt || inv.updated_at,
        method: d.paymentMethod || '',
        reference: d.checkNumber || '',
        notes: 'legacy payment migration',
        created_at: inv.updated_at,
        created_by: 'migration',
        legacy_data: {legacy_debt_id: d.id}
      });
    }
    pvInvoiceLog(inv.id, 'יצירת חשבונית', 'migration', '', 'from debts', {legacy_debt_id: d.id});
    created++;
  });

  pv.supplierInvoices = pv.supplierInvoices.map(pvNormalizeInvoice);
  pv._supplierInvoicesMigrationV1 = {
    migratedAt: new Date().toISOString(),
    created,
    preserved: {
      debts: (pv.debts || []).length,
      taxInvoices: (pv.taxInvoices || []).length,
      cancelledDNIds: (pv.cancelledDNIds || []).length
    }
  };
  pv._localModified = Date.now();
  try { localStorage.setItem(PAYABLES_KEY, JSON.stringify(pv)); } catch(e) { console.warn('[supplier-invoices] migration save deferred', e); }
  console.info('[supplier-invoices] migration complete', pv._supplierInvoicesMigrationV1);
}

function pvCreateSupplierInvoiceFromDebt(debt, extra) {
  if (!debt) return null;
  if (!pv.supplierInvoices) pv.supplierInvoices = [];
  if (!pv.supplierInvoicePayments) pv.supplierInvoicePayments = [];
  if (!pv.supplierInvoiceDeliveryNotes) pv.supplierInvoiceDeliveryNotes = [];
  const existing = pv.supplierInvoices.find(inv => inv.legacy_debt_id === debt.id || (debt.taxInvoiceId && inv.legacy_tax_invoice_id === debt.taxInvoiceId));
  if (existing) return existing;
  const opts = extra || {};
  const inv = pvNormalizeInvoice({
    supplier_name: debt.supplierName,
    invoice_number: debt.invoiceNumber,
    invoice_date: debt.date || todayISO(),
    total_amount: debt.amount,
    payment_status: debt.paymentStatus || (debt.status === 'paid' ? 'שולם' : 'לא שולם'),
    payment_method: debt.paymentMethod,
    due_date: debt.dueDate || '',
    paid_at: debt.paidDate || '',
    check_number: debt.checkNumber || '',
    accounting_sent: !!debt.accountingPassed,
    invoice_file: debt.invoiceImage || '',
    notes: debt.notes || '',
    delivery_note_ids: opts.delivery_note_ids || opts.deliveryNoteIds || [],
    legacy_debt_id: debt.id,
    legacy_tax_invoice_id: debt.taxInvoiceId || opts.legacy_tax_invoice_id || '',
    legacy_data: { debt: {...debt}, ...(opts.legacy_data || {}) },
    created_by: pvCurrentUserName(),
    updated_by: pvCurrentUserName()
  });
  pv.supplierInvoices.push(inv);
  (inv.delivery_note_ids || []).forEach(dnId => {
    if (!pv.supplierInvoiceDeliveryNotes.some(x => x.invoice_id === inv.id && x.delivery_note_id === dnId)) {
      pv.supplierInvoiceDeliveryNotes.push({id:uid(), invoice_id:inv.id, delivery_note_id:dnId, created_at:new Date().toISOString(), created_by:pvCurrentUserName()});
    }
  });
  pvInvoiceLog(inv.id, 'יצירת חשבונית', 'source', '', opts.source || 'legacy-debt-flow', {legacy_debt_id: debt.id, legacy_tax_invoice_id: inv.legacy_tax_invoice_id});
  return inv;
}

function pvCreateDraftSupplierInvoiceFromExpense(item) {
  if (!item || !['חשבונית מס','חשבונית מס קבלה'].includes(item.document_type)) return null;
  if (!pv.supplierInvoices) pv.supplierInvoices = [];

    invoice_number: item.document_number || '',

function pvRegisterDeliveryNoteFromExpense(item) {

function pvSyncSupplierInvoiceFromDebt(debt, action) {
  if (!debt) return null;
  const inv = pvCreateSupplierInvoiceFromDebt(debt, {source: action || 'sync-debt'});
  if (!inv) return null;
  const updates = {
    supplier_name: debt.supplierName || '',
    supplier_id: pvSupplierIdByName(debt.supplierName || ''),
    invoice_number: debt.invoiceNumber || '',
    total_amount: +debt.amount || 0,
    amount_before_vat: +debt.amount || 0,
    due_date: debt.dueDate || '',
    payment_method: debt.paymentMethod || "צ'ק",
    check_number: debt.checkNumber || '',
    accounting_sent: !!debt.accountingPassed,
    invoice_file: debt.invoiceImage || '',
    notes: debt.notes || '',
    legacy_tax_invoice_id: debt.taxInvoiceId || inv.legacy_tax_invoice_id || ''
  };
  Object.entries(updates).forEach(([field, value]) => {
    if (inv[field] !== value) {
      const old = inv[field];
      inv[field] = value;
      pvInvoiceLog(inv.id, 'עריכת חשבונית', field, old, value, {source: action || 'sync-debt'});
    }
  });

  const legacyPayments = (pv.supplierInvoicePayments || []).filter(p => p.invoice_id === inv.id && p.legacy_data?.legacy_debt_id === debt.id);
  const debtPaymentIds = new Set((debt.payments || []).map(p => p.id));
  legacyPayments.forEach(p => {
    if (p.legacy_data?.legacy_debt_payment_id && !debtPaymentIds.has(p.legacy_data.legacy_debt_payment_id) && p.cancelled !== true) {
      p.cancelled = true;
      p.cancelled_at = new Date().toISOString();
      pvInvoiceLog(inv.id, 'עריכת חשבונית', 'payment_cancelled', p.amount, '', {legacy_debt_payment_id:p.legacy_data.legacy_debt_payment_id});
    }
  });
  (debt.payments || []).forEach(p => {
    if (!pv.supplierInvoicePayments.some(x => x.invoice_id === inv.id && x.legacy_data?.legacy_debt_payment_id === p.id)) {
      pv.supplierInvoicePayments.push({
        id: uid(),
        invoice_id: inv.id,
        amount: +p.amount || 0,
        date: p.date || todayISO(),
        method: p.method || debt.paymentMethod || '',
        reference: p.reference || debt.checkNumber || '',
        notes: p.notes || '',
        created_at: new Date().toISOString(),
        created_by: pvCurrentUserName(),
        legacy_data: {legacy_debt_id: debt.id, legacy_debt_payment_id: p.id}
      });
      pvInvoiceLog(inv.id, p.finalStatus ? 'סימון שולם' : 'תשלום חלקי', 'payment', '', +p.amount || 0, {legacy_debt_payment_id:p.id});
    }
  });
  if ((+debt.paidAmount || 0) > 0 && !(debt.payments || []).length && !pv.supplierInvoicePayments.some(x => x.invoice_id === inv.id && x.legacy_data?.legacy_debt_summary === debt.id)) {
    pv.supplierInvoicePayments.push({
      id: uid(),
      invoice_id: inv.id,
      amount: +debt.paidAmount || 0,
      date: debt.paidDate || todayISO(),
      method: debt.paymentMethod || '',
      reference: debt.checkNumber || '',
      notes: 'legacy paid amount',
      created_at: new Date().toISOString(),
      created_by: pvCurrentUserName(),
      legacy_data: {legacy_debt_id: debt.id, legacy_debt_summary: debt.id}
    });
  }
  const oldStatus = inv.payment_status;
  if (debt.status === 'cancelled') {
    inv.payment_status = 'בוטל';
    inv.archived = true;
    inv.archived_at = inv.archived_at || new Date().toISOString();
  } else if (debt.status === 'paid') inv.payment_status = 'שולם';
  else if ((+debt.paidAmount || 0) > 0) inv.payment_status = 'שולם חלקית';
  else inv.payment_status = pvIsCheckMethod(inv.payment_method) ? 'ממתין לפירעון צ׳ק' : 'לא שולם';
  inv.paid_at = debt.paidDate || (inv.payment_status === 'שולם' ? todayISO() : '');
  if (oldStatus !== inv.payment_status) pvInvoiceLog(inv.id, 'עריכת חשבונית', 'payment_status', oldStatus, inv.payment_status, {source: action || 'sync-debt'});
  pvTouchInvoice(inv);
  return inv;
}

const PRODUCTS_KEY = 'products-v1';
let pdb = { products: [], pending: [], orderHistory: [], _lastSynced: 0, _localModified: 0 };

function loadPdb() {
  try { const s = localStorage.getItem(PRODUCTS_KEY); if (s) pdb = JSON.parse(s); } catch(e) {}
  if (!pdb.products) pdb.products = [];
  if (!pdb.pending) pdb.pending = [];
  if (!pdb.orderHistory) pdb.orderHistory = [];
  if (!pdb.aliases) pdb.aliases = {};

  if (!pdb.settings) pdb.settings = {};
  if (!pdb.settings.defaultTargetMargin) pdb.settings.defaultTargetMargin = 40;
  if (!pdb.settings.defaultMinMargin) pdb.settings.defaultMinMargin = 25;
  normalizeProductCommandData();

    const hasData = pdb.products.length || pdb.pending.length || pdb.orderHistory.length;
    pdb._localModified = hasData ? Date.now() : 0;
  }
  if (!pdb._lastSynced) pdb._lastSynced = pdb._localModified ? 0 : Date.now();
}
function savePdb(dirty) {
  if (dirty) pdb._localModified = Date.now();

function importProductsFromOrders() {
  try {
    const ordersData = JSON.parse(localStorage.getItem('orders-v1') || '{}');
    const suppliers = ordersData.suppliers || [];
    const seen = {};
    let added = 0;
    suppliers.forEach(sup => {
      (sup.products || []).forEach(p => {
        const key = (p.name || '').trim().toLowerCase();
        if (!seen[key]) {
          seen[key] = true;
          pdb.products.push({
            id: uid(), name: p.name, category: '', sellPrice: null,
            sellPriceUpdated: null, active: true, aliases: [],
            supplierPrices: [{ supplierId: sup.id, supplierName: sup.name, buyPrice: null, updatedAt: null, history: [] }],
            createdAt: new Date().toISOString()
          });
          added++;
        } else {
          const existing = pdb.products.find(x => (x.name||'').trim().toLowerCase() === key);
          if (existing && !existing.supplierPrices.find(sp => sp.supplierId === sup.id)) {
            existing.supplierPrices.push({ supplierId: sup.id, supplierName: sup.name, buyPrice: null, updatedAt: null, history: [] });
          }
        }
      });
    });
    if (added > 0) { savePdb(true); toast('יובאו ' + added + ' מוצרים מהספקים ✓', 2000); }
  } catch(e) {}
}

// ── Products helpers ──────────────────────────────────────────────────────────
function calcMargin(p) {
  if (!p.sellPrice) return null;
  const prices = (p.supplierPrices||[]).map(sp=>sp.buyPrice).filter(x=>x>0);
  if (!prices.length) return null;
  const bestBuy = Math.min(...prices);
  return Math.round((p.sellPrice - bestBuy) / p.sellPrice * 100);
}
function marginClass(m) { return m==null?'gray':m>=30?'green':m>=15?'yellow':'red'; }
function filterProductsList() {
  let list = [...pdb.products];
  const q = (state.productsSearch||'').trim().toLowerCase();
  if (q) list = list.filter(p => [p.name,p.category,p.subCategory,p.barcode,p.unitType].some(v=>String(v||'').toLowerCase().includes(q)) || (p.aliases||[]).some(a=>a.toLowerCase().includes(q)) || (p.supplierPrices||[]).some(sp=>String(sp.supplierName||'').toLowerCase().includes(q)));
  if (state.productsCategory==='ללא קטגוריה') list = list.filter(p=>!p.category||!p.category.trim());
  else if (state.productsCategory && state.productsCategory!=='הכל') list = list.filter(p=>p.category===state.productsCategory);
  if (state.productsSort==='name') list.sort(sortProductsByCategoryThenName);
  else if (state.productsSort==='margin') list.sort((a,b)=>{const ma=calcMargin(a),mb=calcMargin(b);if(ma==null&&mb==null)return 0;if(ma==null)return 1;if(mb==null)return -1;return mb-ma;});
  else if (state.productsSort==='recent') list.sort((a,b)=>{const ta=a.sellPriceUpdated||a.createdAt||'',tb=b.sellPriceUpdated||b.createdAt||'';return tb.localeCompare(ta);});
  return list;
}
function getProductCategories() {
  return getApprovedProductCategories();
}

function getApprovedProductCategories() {
  return (Array.isArray(CATS) ? CATS : []).map(c => String(c || '').trim()).filter(Boolean).sort(sortProductCategories);
}
function normalizeProductCategoryValue(cat) {
  const val = String(cat || '').trim();
  if (!val) return '';
  return getApprovedProductCategories().find(c => c === val) || '';
}
function requireApprovedProductCategory(cat) {
  const approved = normalizeProductCategoryValue(cat);
  if (!approved) toast('בחר קטגוריה מורשית מרשימת ההוצאות', 'error');
  return approved;
}
function productCategoryLabel(p) {
  return normalizeProductCategoryValue(p?.category) || 'ללא קטגוריה';
}
function productCategoryRank(cat) {
  const c = String(cat || '').trim();
  if (!c || c === 'ללא קטגוריה') return 999;
  if (/ירק|ירקות/.test(c)) return 0;
  if (/פרי|פירות/.test(c)) return 1;
  return 10;
}
function sortProductCategories(a, b) {
  const ra = productCategoryRank(a), rb = productCategoryRank(b);
  if (ra !== rb) return ra - rb;
  return String(a||'').localeCompare(String(b||''), 'he');
}
function sortProductsByCategoryThenName(a, b) {
  const c = sortProductCategories(productCategoryLabel(a), productCategoryLabel(b));
  if (c) return c;
  return (a.name||'').localeCompare(b.name||'', 'he');
}
function groupProductsByCategory(rows) {
  const groups = [];
  const by = new Map();
  rows.forEach(p => {
    const label = productCategoryLabel(p);
    if (!by.has(label)) {
      const group = {label, items: []};
      by.set(label, group);
      groups.push(group);
    }
    by.get(label).items.push(p);
  });
  groups.sort((a,b)=>sortProductCategories(a.label,b.label));
  groups.forEach(g => g.items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')));
  return groups;
}

function normalizeProductCommandData() {
  (pdb.products || []).forEach(p => {
    if (!p.id) p.id = uid();
    if (!Array.isArray(p.aliases)) p.aliases = [];
    if (!Array.isArray(p.supplierPrices)) p.supplierPrices = [];
    if (!Array.isArray(p.costHistory)) p.costHistory = [];
    if (!p.channels) p.channels = {};
    if (p.channels.store == null && p.sellPrice != null) p.channels.store = +p.sellPrice || 0;
    if (p.storePrice == null && p.channels.store != null) p.storePrice = +p.channels.store || 0;
    p.channels.store = +((p.channels.store != null ? p.channels.store : p.storePrice) || 0);
    p.channels.website = +((p.channels.website != null ? p.channels.website : p.websitePrice) || 0);
    p.channels.wolt = +((p.channels.wolt != null ? p.channels.wolt : p.woltPrice) || 0);
    p.channels.promo = +((p.channels.promo != null ? p.channels.promo : p.promotionPrice) || 0);
    p.sellPrice = p.channels.store || p.sellPrice || null;
    if (!p.unitType) p.unitType = p.unit || 'kg';
    if (!p.status) p.status = p.active === false ? 'inactive' : 'active';
    if (p.active == null) p.active = p.status !== 'inactive';
    if (!p.inventory) p.inventory = {};
    p.inventory.current = +(p.inventory.current || p.currentStock || 0);
    p.inventory.minimum = +(p.inventory.minimum || p.minimumStock || 0);
    p.inventory.recommended = +(p.inventory.recommended || p.recommendedStock || 0);
    if (!p.pricing) p.pricing = {};
    p.pricing.targetMargin = +(p.pricing.targetMargin || p.targetMargin || pdb.settings?.defaultTargetMargin || 40);
    p.pricing.minMargin = +(p.pricing.minMargin || p.minMargin || pdb.settings?.defaultMinMargin || 25);
    p.supplierPrices.forEach(sp => {
      if (!Array.isArray(sp.history)) sp.history = [];
      if (sp.buyPrice > 0 && !p.costHistory.some(h => h.supplierName === sp.supplierName && +h.cost === +sp.buyPrice && h.date === sp.updatedAt)) {
        p.costHistory.push({id: uid(), date: sp.updatedAt || p.createdAt || new Date().toISOString(), supplierName: sp.supplierName || '', quantity: '', cost: +sp.buyPrice, invoiceNumber: ''});
      }
      (sp.history || []).forEach(h => {
        const cost = +(h.cost || h.price || 0);
        if (cost > 0 && !p.costHistory.some(x => x.supplierName === sp.supplierName && +x.cost === cost && x.date === h.date)) {
          p.costHistory.push({id: uid(), date: h.date || sp.updatedAt || '', supplierName: sp.supplierName || '', quantity: h.quantity || '', cost, invoiceNumber: h.invoiceNumber || ''});
        }
      });
    });
    p.costHistory = dedup(p.costHistory).sort((a,b)=>productEventTime(b.date)-productEventTime(a.date));
  });
}

function productEventTime(date) {
  const d = parseD(date) || new Date(date);
  return d && !isNaN(d) ? d.getTime() : 0;
}
function productCostEvents(p) {
  return (p?.costHistory || []).filter(h => +h.cost > 0).sort((a,b)=>productEventTime(b.date)-productEventTime(a.date));
}
function productLastCost(p) { const ev = productCostEvents(p)[0]; return ev ? +ev.cost || 0 : null; }
function productAvgCost(p, days) {
  const now = Date.now();
  const ev = productCostEvents(p).filter(h => {
    const d = parseD(h.date) || new Date(h.date);
    return d && !isNaN(d) && (now - d.getTime()) <= days * 86400000;
  });
  if (!ev.length) return null;
  return ev.reduce((s,h)=>s+(+h.cost||0),0) / ev.length;
}
function productLowestCost(p) {
  const ev = productCostEvents(p);
  return ev.length ? Math.min(...ev.map(h=>+h.cost||0).filter(Boolean)) : null;
}
function productHighestCost(p) {
  const ev = productCostEvents(p);
  return ev.length ? Math.max(...ev.map(h=>+h.cost||0).filter(Boolean)) : null;
}
function productChannelPrice(p, channel) {
  return +((p.channels && p.channels[channel]) || (channel === 'store' ? p.sellPrice : 0) || 0);
}
function productGrossMargin(p, channel='store') {
  const price = productChannelPrice(p, channel);
  const cost = productLastCost(p);
  if (!price || !cost) return null;
  return ((price - cost) / price) * 100;
}
function productGrossProfitNis(p, channel='store') {
  const price = productChannelPrice(p, channel);
  const cost = productLastCost(p);
  if (!price || !cost) return null;
  return price - cost;
}
function productRecommendedPrice(p) {
  const cost = productLastCost(p);
  const target = +(p.pricing?.targetMargin || 40);
  if (!cost || target >= 99) return null;
  return cost / (1 - target / 100);
}
function productHealth(p) {
  const margin = productGrossMargin(p);
  const min = +(p.pricing?.minMargin || 25);
  const target = +(p.pricing?.targetMargin || 40);
  if (p.status === 'inactive' || p.active === false) return {tone:'neutral', label:'לא פעיל'};
  if (!productLastCost(p) || !productChannelPrice(p,'store')) return {tone:'warn', label:'חסר מחיר'};
  if (margin < 0) return {tone:'critical', label:'נמכר בהפסד'};
  if (margin < min) return {tone:'danger', label:'רווח נמוך'};
  if (margin < target) return {tone:'attention', label:'דורש תשומת לב'};
  if ((p.inventory?.minimum || 0) && +(p.inventory?.current || 0) <= +(p.inventory?.minimum || 0)) return {tone:'attention', label:'מלאי נמוך'};
  return {tone:'healthy', label:'בריא'};
}
function productStatusColor(tone) {
  return {
    healthy:['#15803d','rgba(21,128,61,.10)'],
    attention:['#ca8a04','rgba(202,138,4,.12)'],
    danger:['#ea580c','rgba(234,88,12,.12)'],
    critical:['#dc2626','rgba(220,38,38,.12)'],
    warn:['#d97706','rgba(217,119,6,.12)'],
    neutral:['#64748b','rgba(100,116,139,.12)']
  }[tone] || ['var(--textDim)','var(--surfaceHi)'];
}
function productSupplierStats(p) {
  const by = {};
  productCostEvents(p).forEach(h => {
    const name = h.supplierName || 'לא ידוע';
    if (!by[name]) by[name] = [];
    by[name].push(+h.cost || 0);
  });
  return Object.entries(by).map(([supplier, costs]) => ({
    supplier,
    avg: costs.reduce((s,x)=>s+x,0) / costs.length,
    min: Math.min(...costs),
    max: Math.max(...costs),
    count: costs.length
  })).sort((a,b)=>a.avg-b.avg);
}
function productAlerts() {
  const alerts = [];
  (pdb.products || []).filter(p=>p.active!==false && p.status!=='inactive').forEach(p => {
    const last = productLastCost(p);
    const avg7 = productAvgCost(p, 7);
    const margin = productGrossMargin(p);
    const h = productHealth(p);
    if (h.tone === 'critical') alerts.push({tone:'critical', product:p, title:`${p.name} נמכר בהפסד`, sub:'מחיר המכירה נמוך מעלות הקנייה', action:'price'});
    else if (h.tone === 'danger') alerts.push({tone:'danger', product:p, title:`${p.name} מתחת לרווח מינימום`, sub:`רווח ${Math.round(margin || 0)}%`, action:'price'});
    else if (h.tone === 'warn') alerts.push({tone:'warn', product:p, title:`${p.name} חסר מחיר`, sub:'חסר מחיר קנייה או מחיר מכירה', action:'profile'});
    if (last && avg7 && avg7 > 0 && last > avg7 * 1.12) alerts.push({tone:'attention', product:p, title:`${p.name} התייקר השבוע`, sub:`עלות אחרונה גבוהה בכ-${Math.round((last/avg7-1)*100)}% מהממוצע`, action:'suppliers'});
    if ((p.inventory?.minimum || 0) && +(p.inventory?.current || 0) <= +(p.inventory?.minimum || 0)) alerts.push({tone:'attention', product:p, title:`${p.name} מתחת למלאי מינימום`, sub:'כדאי לבדוק הזמנה', action:'inventory'});
  });
  return alerts.slice(0, 50);
}
function productInsights() {
  const products = (pdb.products || []).filter(p=>p.active!==false);
  const byMargin = products.map(p => ({p, margin: productGrossMargin(p)})).filter(x=>x.margin!=null);
  const costIncrease = products.map(p => {
    const last = productLastCost(p), avg30 = productAvgCost(p, 30);
    return {p, increase: last && avg30 ? ((last / avg30) - 1) * 100 : null};
  }).filter(x=>x.increase!=null).sort((a,b)=>b.increase-a.increase);
  return {
    highestMargin: byMargin.slice().sort((a,b)=>b.margin-a.margin).slice(0,10),
    lowestMargin: byMargin.slice().sort((a,b)=>a.margin-b.margin).slice(0,10),
    biggestCostIncrease: costIncrease.slice(0,10),
    reorder: products.filter(p => (p.inventory?.minimum || 0) && +(p.inventory?.current || 0) <= +(p.inventory?.minimum || 0)).slice(0,10),
    belowTarget: byMargin.filter(x => x.margin < +(x.p.pricing?.targetMargin || 40)).sort((a,b)=>a.margin-b.margin).slice(0,10)
  };
}

function productCommandNorm(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[״"׳']/g, '')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function productTokens(s) {
  return productCommandNorm(s).split(' ').filter(Boolean);
}
function productSimilarity(a, b) {
  const na = productCommandNorm(a), nb = productCommandNorm(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  if (na.includes(nb) || nb.includes(na)) return 0.88;
  const at = new Set(productTokens(na));
  const bt = new Set(productTokens(nb));
  if (!at.size || !bt.size) return 0;
  let hit = 0;
  at.forEach(t => { if (bt.has(t)) hit++; });
  return hit / Math.max(at.size, bt.size);
}
function matchProductLine(name) {
  const lineName = productCommandNorm(name);
  if (!lineName) return {product:null, confidence:0, reason:'empty'};
  let best = {product:null, confidence:0, reason:'none'};
  (pdb.products || []).forEach(p => {
    [p.name, ...(p.aliases || [])].forEach((candidate, idx) => {
      const score = productSimilarity(lineName, candidate);
      const adjusted = idx === 0 ? score : Math.min(1, score + 0.06);
      if (adjusted > best.confidence) best = {product:p, confidence:adjusted, reason:idx === 0 ? 'name' : 'alias'};
    });
  });
  return best;
}
function learnProductAlias(productId, alias) {
  const p = (pdb.products || []).find(x => x.id === productId);
  const clean = String(alias || '').trim();
  if (!p || !clean) return false;
  if (!Array.isArray(p.aliases)) p.aliases = [];
  const exists = [p.name, ...p.aliases].some(a => productCommandNorm(a) === productCommandNorm(clean));
  if (!exists) p.aliases.push(clean);
  if (!pdb.aliases) pdb.aliases = {};
  pdb.aliases[productCommandNorm(clean)] = productId;
  return !exists;
}
function productLineUnitCost(line) {
  const qty = +line.quantity || +line.qty || 0;
  const unitCost = +line.unit_cost || +line.unitCost || +line.price || 0;
  const total = +line.total_cost || +line.total || +line.amount || 0;
  if (unitCost > 0) return unitCost;
  if (qty > 0 && total > 0) return total / qty;
  return 0;
}
function applyProductCostFromLine(product, line, expense, confidence) {
  if (!product || !line) return false;
  const cost = productLineUnitCost(line);
  if (cost <= 0) return false;
  const supplierName = expense?.supplier || line.supplier || '';
  const date = expense?.date || line.date || todayStr();
  const invoiceNumber = expense?.document_number || line.invoiceNumber || line.invoice_number || '';
  if (!Array.isArray(product.costHistory)) product.costHistory = [];
  const exists = product.costHistory.some(h =>
    productCommandNorm(h.supplierName) === productCommandNorm(supplierName) &&
    String(h.invoiceNumber || '') === String(invoiceNumber || '') &&
    Math.abs((+h.cost || 0) - cost) < 0.001 &&
    String(h.date || '') === String(date || '')
  );
  if (!exists) {
    product.costHistory.unshift({
      id: uid(),
      date,
      supplierName,
      quantity: line.quantity || line.qty || '',
      unit: line.unit || line.unitType || product.unitType || '',
      cost,
      totalCost: +line.total_cost || +line.total || '',
      invoiceNumber,
      source: 'ocr',
      sourceExpenseId: expense?.id || '',
      confidence: Math.round((confidence || 0) * 100)
    });
  }
  if (!Array.isArray(product.supplierPrices)) product.supplierPrices = [];
  let sp = product.supplierPrices.find(x => productCommandNorm(x.supplierName) === productCommandNorm(supplierName));
  if (!sp) {
    const approved = getApprovedSuppliers().find(s => productCommandNorm(s.name) === productCommandNorm(supplierName));
    sp = {supplierId: approved?.id || uid(), supplierName, buyPrice:null, updatedAt:null, history:[]};
    product.supplierPrices.push(sp);
  }
  if (!Array.isArray(sp.history)) sp.history = [];
  if (sp.buyPrice != null && Math.abs((+sp.buyPrice || 0) - cost) > 0.001) {
    sp.history.push({price:sp.buyPrice, date:sp.updatedAt || date, invoiceNumber});
  }
  sp.buyPrice = cost;
  sp.updatedAt = date;
  product.lastSupplierUsed = supplierName;
  learnProductAlias(product.id, line.name);
  return true;
}
function processInvoiceLineItems(expense) {
  const lines = Array.isArray(expense?.line_items) ? expense.line_items : (Array.isArray(expense?.items) ? expense.items : []);
  if (!lines.length) return {matched:0, queued:0};
  if (!pdb.ocrQueue) pdb.ocrQueue = [];
  let matched = 0, queued = 0;
  lines.forEach(line => {
    const name = line.name || line.product || line.description || '';
    if (!name) return;
    const match = matchProductLine(name);
    if (match.product && match.confidence >= 0.9) {
      if (applyProductCostFromLine(match.product, {...line, name}, expense, match.confidence)) matched++;
      return;
    }
    const exists = pdb.ocrQueue.some(q =>
      !q.resolved &&
      productCommandNorm(q.name) === productCommandNorm(name) &&
      String(q.invoiceNumber || '') === String(expense?.document_number || '') &&
      productCommandNorm(q.supplierName) === productCommandNorm(expense?.supplier || '')
    );
    if (!exists) {
      pdb.ocrQueue.unshift({
        id: uid(),
        name,
        supplierName: expense?.supplier || '',
        date: expense?.date || todayStr(),
        quantity: line.quantity || line.qty || '',
        unit: line.unit || '',
        unitCost: productLineUnitCost(line),
        totalCost: +line.total_cost || +line.total || '',
        invoiceNumber: expense?.document_number || '',
        sourceExpenseId: expense?.id || '',
        suggestedProductId: match.product?.id || '',
        confidence: Math.round((match.confidence || 0) * 100),
        resolved: false
      });
      queued++;
    }
  });
  if (matched || queued) {
    normalizeProductCommandData();
    savePdb(true);
  }
  return {matched, queued};
}

function bulkProductsApplyEdit() {
  const d = state.productsModalData || {};
  const ids = state.productsBulkSelected || [];
  if (!ids.length) { toast('לא נבחרו מוצרים', 'error'); return; }
  const patch = {};
  if (d.categoryEnabled) {
    const cat = requireApprovedProductCategory(d.category);
    if (!cat) return;
    patch.category = cat;
  }
  if (d.statusEnabled) {
    patch.status = d.status || 'active';
    patch.active = patch.status !== 'inactive';
  }
  if (d.unitEnabled) patch.unitType = d.unitType || 'kg';
  const pricingPatch = {};
  if (d.targetEnabled) pricingPatch.targetMargin = +d.targetMargin || 0;
  if (d.minEnabled) pricingPatch.minMargin = +d.minMargin || 0;
  const channelsPatch = {};
  ['store','website','wolt','promo'].forEach(ch => {
    if (d[ch + 'Enabled']) channelsPatch[ch] = +d[ch] || 0;
  });
  if (!Object.keys(patch).length && !Object.keys(pricingPatch).length && !Object.keys(channelsPatch).length) {
    toast('בחר לפחות שדה אחד לעריכה', 'error');
    return;
  }
  ids.forEach(id => {
    const p = pdb.products.find(x => x.id === id);
    if (!p) return;
    Object.assign(p, patch);
    if (Object.keys(pricingPatch).length) {
      if (!p.pricing) p.pricing = {};
      Object.assign(p.pricing, pricingPatch);
    }
    if (Object.keys(channelsPatch).length) {
      if (!p.channels) p.channels = {};
      Object.assign(p.channels, channelsPatch);
      if (channelsPatch.store != null) {
        p.sellPrice = channelsPatch.store || null;
        p.storePrice = channelsPatch.store || 0;
        p.sellPriceUpdated = new Date().toISOString();
      }
    }
  });
  savePdb(true);
  setState({productsBulkMode:false, productsBulkSelected:[], productsModal:'', productsModalData:null});
  toast('עודכנו ' + ids.length + ' מוצרים ✓', 'success');
}

    ${queue.length ? queue.map(row).join('') : `<div style="text-align:center;padding:60px 16px;color:var(--textMuted)"><div style="font-size:42px">✅</div><b>אין שורות שממתינות להתאמה</b></div>`}
  </div>`;

function approveOcrProductMatch(queueId, productId) {
  const q = (pdb.ocrQueue || []).find(x => x.id === queueId);
  const p = (pdb.products || []).find(x => x.id === productId);
  if (!q || !p) { toast('בחר מוצר קיים', 'error'); return; }
  const expense = {id:q.sourceExpenseId || '', supplier:q.supplierName || '', date:q.date || todayStr(), document_number:q.invoiceNumber || ''};
  applyProductCostFromLine(p, {name:q.name, quantity:q.quantity, unit:q.unit, unit_cost:q.unitCost, total_cost:q.totalCost}, expense, 1);
  q.resolved = true;
  q.resolvedAt = new Date().toISOString();
  q.resolvedProductId = p.id;
  learnProductAlias(p.id, q.name);
  normalizeProductCommandData();
  savePdb(true);
  toast('ההתאמה נשמרה ונלמדה ✓', 'success');
  render();
}

function ignoreOcrProductLine(queueId) {
  const q = (pdb.ocrQueue || []).find(x => x.id === queueId);
  if (!q) return;
  q.resolved = true;
  q.ignored = true;
  q.resolvedAt = new Date().toISOString();
  savePdb(true);
  toast('השורה דולגה', 'success');
  render();
}
