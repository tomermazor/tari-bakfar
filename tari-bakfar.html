function pvOpenDirectDebt(sup) {
  setState({payablesModal:'add-direct', payablesModalData:{supplier:sup}});
}

function pvGetDebtInvoiceImage(debtId) {
  const debt = pv.debts.find(d => d.id === debtId);
  return debt ? (debt.invoiceImage || '') : '';
}

function pvOpenEditDebt(debtId) {
  const debt = pv.debts.find(d => d.id === debtId);
  if (!debt) return;
  setState({payablesModal:'edit-debt', payablesModalData:{
    debtId,
    supplier: debt.supplierName || '',
    invoiceNumber: debt.invoiceNumber || '',
    amount: String(+debt.amount || 0),
    dueDate: debt.dueDate || '',
    paidDate: debt.paidDate || pvTodayISO(),
    paymentMethod: debt.paymentMethod || "צ'ק",
    checkNumber: debt.checkNumber || '',
    notes: debt.notes || '',
    accountingPassed: !!debt.accountingPassed,
    invoiceImage: debt.invoiceImage || null,
    paidState: (!pvIsOpenStatus(debt.paymentStatus) || debt.status === 'paid') ? 'paid' : 'open'
  }});
}

function pvOpenDebtFromExpense(expId, supplier, amount, invoiceNumber, date) {
  setState({payablesModal:'add-direct', payablesModalData:{
    supplier: supplier, amount: String(amount), invoiceNumber: invoiceNumber,
    date: date, expenseId: expId
  }});
}

function pvToggleAccounting(debtId) {
  const debt = pv.debts.find(d => d.id === debtId);
  if (!debt) return;
  debt.accountingPassed = !debt.accountingPassed;
  savePv(true);
  setState({});
}

// ── Reconciliation sub-view ───────────────────────────────────────────────────
function renderPayablesReconcile() {
  const today = todayISO();
  const allLinkedIds = new Set(pv.taxInvoices.flatMap(ti => ti.deliveryNoteIds || []));

  // 1. ת"מ ללא חשבונית
  const openDNs = (DB.expenses||[]).filter(e =>
    e.document_type === 'תעודת משלוח' && !pv.cancelledDNIds.includes(e.id) && !allLinkedIds.has(e.id)
  ).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

  // 2. חשבוניות באיחור
  const overdueDebts = pv.debts.filter(d => pvDateISO(d.dueDate) && pvDateISO(d.dueDate) < today && !['paid','cancelled'].includes(d.status));

  // 3. צ'קים מתקרבים (7 ימים)
  const openChecks = (DB.checks||[]).filter(c => !c.cleared);
  const soonChecks = openChecks.filter(c => c.clearDate && pvDateInDays(c.clearDate, 7));

  // 4. צ'קים שעברו פירעון
  const overdueChecks = openChecks.filter(c => c.clearDate && pvIsOverdue(c.clearDate));

  // 5. הפרש סכומים — TI where linked DN sum differs >10%
  const amountDiffs = pv.taxInvoices.filter(ti => {
    if (!ti.deliveryNoteIds || ti.deliveryNoteIds.length === 0) return false;
    const dnSum = (DB.expenses||[]).filter(e => ti.deliveryNoteIds.includes(e.id)).reduce((s,e)=>s+(+e.total_amount||0),0);
    const diff = Math.abs(dnSum - (+ti.amount||0));
    return (+ti.amount||0) > 0 && diff / (+ti.amount||0) > 0.1;
  });

  const sectionHtml = (icon, title, color, items, itemHtml) => items.length === 0 ? '' : `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:13px 13px 0 0;background:${color}20;border:1px solid ${color}30;border-bottom:none">
        <span style="font-size:18px">${icon}</span>
        <span style="font-size:13px;font-weight:700;color:var(--text)">${title}</span>
        <span style="margin-right:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;background:${color}30;color:var(--text)">${items.length}</span>
      </div>
      <div style="padding:0 14px;background:var(--surface);border:1px solid ${color}30;border-top:none;border-radius:0 0 13px 13px">
        ${items.map(itemHtml).join('')}
      </div>
    </div>`;

  const dnItems = sectionHtml('📋', 'ת"מ ללא חשבונית', 'var(--amber)', openDNs, e => `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(e.supplier||'—')} · ${fmtDate(e.date)}</div>
        <div style="font-size:11px;color:var(--textDim)">${fmtCurr(e.total_amount)}</div>
      </div>
      <button onclick="setState({payablesView:'supplier',payablesSupplier:'${esc(e.supplier||'')}',payablesSupplierTab:'dns'})" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit;font-weight:700">טפל</button>
    </div>`);

  const debtItems = sectionHtml('🔴', 'חשבוניות באיחור', 'var(--danger)', overdueDebts, d => `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(d.supplierName||'—')} · ${esc(d.invoiceNumber||'—')}</div>
        <div style="font-size:11px;color:var(--danger)">תאריך פירעון: ${fmtDate(d.dueDate)}</div>
      </div>
      <div class="display" style="font-size:14px;font-weight:700;color:var(--danger)">${fmtCurr((+d.amount||0)-(+d.paidAmount||0))}</div>
      <button onclick="setState({payablesView:'debt',payablesDebtId:'${d.id}'})" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--dangerSoft);color:var(--danger);cursor:pointer;font-family:inherit;font-weight:700">טפל</button>
    </div>`);

  const soonCheckItems = sectionHtml('🟡', 'צ\'קים מתקרבים', 'var(--amber)', soonChecks, c => `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(c.supplier||'—')}</div>
        <div style="font-size:11px;color:var(--amber)">⏳ ${fmtDate(c.clearDate)}</div>
      </div>
      <div class="display" style="font-size:14px;font-weight:700;color:var(--text)">${fmtCurr(c.amount)}</div>
      <button onclick="setState({tab:'checks'})" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--amberSoft);color:var(--amber);cursor:pointer;font-family:inherit;font-weight:700">צ'קים</button>
    </div>`);

  const overdueCheckItems = sectionHtml('🔴', 'צ\'קים שעברו פירעון', 'var(--danger)', overdueChecks, c => `
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(c.supplier||'—')}</div>
        <div style="font-size:11px;color:var(--danger)">פג: ${fmtDate(c.clearDate)}</div>
      </div>
      <div class="display" style="font-size:14px;font-weight:700;color:var(--danger)">${fmtCurr(c.amount)}</div>
      <button onclick="toggleCheckCleared('${c.id}')" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit;font-weight:700">✅ מומש</button>
    </div>`);

  const diffItems = sectionHtml('⚖️', 'הפרש סכומים', 'var(--info)', amountDiffs, ti => {
    const dnSum = (DB.expenses||[]).filter(e => ti.deliveryNoteIds.includes(e.id)).reduce((s,e)=>s+(+e.total_amount||0),0);
    return `<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(ti.supplierName||'—')} · ${esc(ti.invoiceNumber||'—')}</div>
        <div style="font-size:11px;color:var(--textDim)">חשבונית: ${fmtCurr(ti.amount)} · ת"מ: ${fmtCurr(dnSum)}</div>
      </div>
    </div>`;
  });

  const allClear = !openDNs.length && !overdueDebts.length && !soonChecks.length && !overdueChecks.length && !amountDiffs.length;

  return `<div style="padding:16px 16px 90px" class="fade-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button onclick="setState({payablesView:'dashboard'})" style="width:38px;height:38px;border:none;border-radius:10px;background:var(--surfaceHi);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
      <h2 class="display" style="font-size:18px;margin:0;flex:1">🔔 מרכז התאמות</h2>
    </div>
    ${allClear
      ? `<div style="text-align:center;padding:48px 20px">
           <div style="font-size:48px;margin-bottom:12px">✅</div>
           <div style="font-size:16px;font-weight:700;color:var(--accent)">הכל מסודר!</div>
           <div style="font-size:13px;color:var(--textDim);margin-top:6px">אין פריטים הדורשים טיפול</div>
         </div>`
      : dnItems + debtItems + soonCheckItems + overdueCheckItems + diffItems
    }
  </div>`;
}

function renderDesktopPayables() {
  pvMigratePaymentStatuses();
  pvReopenMistakenPaidCommitments();
  const payments = desktopPaymentsData();
  const selectedId = state.payablesDebtId || state.payablesDesktopPaymentId;
  const selected = payments.find(p => p.id === selectedId) || payments[0] || null;
  const pf = state.pvPaymentFilter || 'הכל';
  const q = (state.payablesSearch || '').trim().toLowerCase();
  let rows = payments;
  if (pf === "צ'קים") rows = rows.filter(p => p.method.includes("צ'ק") || p.checkNumber);
  else if (pf === 'העברות') rows = rows.filter(p => p.method.includes('העברה'));
  else if (pf === 'מזומן') rows = rows.filter(p => p.method.includes('מזומן'));
  else if (pf === 'באיחור') rows = rows.filter(p => p.isOverdue);
  else if (pf === 'השבוע') rows = rows.filter(p => p.date && pvDateInDays(p.date,7));
  if (q) rows = rows.filter(p => [p.supplier,p.invoiceNumber,p.checkNumber,p.method].join(' ').toLowerCase().includes(q));
  const filters = ['הכל',"צ'קים",'העברות','מזומן','באיחור','השבוע'];
  const openSupplierNames = [...new Set(payments.map(p=>p.supplier).filter(Boolean))];
  const rowsHtml = rows.map(p => {
    const pair = desktopPaymentStatusText(p);
    return `<tr class="${selected && selected.id===p.id?'desktop-row-selected':''}" onclick="setState({payablesDesktopPaymentId:'${p.id}',payablesDebtId:'${p.type==='debt'?p.id:''}'})" style="cursor:pointer">
      <td><b>${esc(p.supplier||'ספק')}</b><div class="desktop-muted">${p.invoiceNumber?'#'+esc(p.invoiceNumber):p.checkNumber?'צ׳ק '+esc(p.checkNumber):''}</div></td>
      <td>${fmtDate(p.date)}</td>
      <td>${esc(p.method||'—')}</td>
      <td>${desktopStatus(pair[0],pair[1])}</td>

      <td><button class="desktop-mini-btn" onclick="event.stopPropagation();setState({payablesDesktopPaymentId:'${p.id}',payablesDebtId:'${p.type==='debt'?p.id:''}'})">פתח</button></td>
    </tr>`;
  }).join('');
  return `<div class="desktop-page fade-up">
    ${desktopPageHead('ספקים והתחייבויות', 'תזרים ספקים כרונולוגי, צ׳קים עתידיים ותשלומים לביצוע', `<button class="desktop-mini-btn primary" onclick="setState({payablesModal:'add-direct',payablesModalData:{}})">+ התחייבות</button><button class="desktop-mini-btn" onclick="setState({payablesView:'supplierBook'})">ספר ספקים</button>`)}
    <div class="desktop-kpi-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      ${desktopKpi('חוב פתוח', fmtCurr(payments.reduce((s,p)=>s+p.amount,0)), payments.length+' תשלומים')}
      ${desktopKpi('השבוע', fmtCurr(payments.filter(p=>p.date&&pvDateInDays(p.date,7)).reduce((s,p)=>s+p.amount,0)), 'לתשלום בקרוב', 'warn')}
      ${desktopKpi('באיחור', payments.filter(p=>p.isOverdue).length, 'דורש טיפול', payments.some(p=>p.isOverdue)?'danger':'ok')}
      ${desktopKpi('ספקים פתוחים', openSupplierNames.length, 'כרטיסים עם פעילות', 'info')}
    </div>
    <div class="desktop-work-grid">
      <section class="desktop-section">
        <div class="desktop-filterbar">
          <input class="input" placeholder="חיפוש ספק / צ׳ק / חשבונית" value="${esc(state.payablesSearch||'')}" oninput="pvInvoiceSearchInput(this.value)">
          ${filters.map(f=>`<button class="desktop-mini-btn ${pf===f?'primary':''}" onclick="setState({pvPaymentFilter:'${f}'})">${f}</button>`).join('')}

        <div class="desktop-table-wrap">${rows.length ? `<table class="desktop-table"><thead><tr><th>ספק</th><th>תאריך</th><th>אמצעי</th><th>סטטוס</th><th style="text-align:left">סכום</th><th>פעולה</th></tr></thead><tbody>${rowsHtml}</tbody></table>` : desktopEmpty('✅','אין תשלומים להצגה','הכול מסודר לפי הפילטר הנוכחי')}</div>
      </section>
      ${renderDesktopPayablesDrawer(selected)}
    </div>
  </div>`;
}

function pvInvoiceStatusColor(status) {
  if (status === 'נמחקה') return 'var(--danger)';
  if (status === 'טיוטה לבדיקה') return 'var(--amber)';
  if (status === 'שולם') return 'var(--accent)';
  if (status === 'שולם חלקית') return 'var(--amber)';
  if (status === 'באיחור') return 'var(--danger)';
  if (String(status||'').includes('צ')) return 'var(--info)';
  return 'var(--textDim)';
}

function pvInvoiceStatusBadge(inv) {
  const st = pvCalcInvoiceStatus(inv);
  const color = pvInvoiceStatusColor(st);
  return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:${color}18;color:${color};font-size:11px;font-weight:900;white-space:nowrap">${esc(st)}</span>`;
}

function pvInvoiceAccountingBadge(inv) {
  return inv.accounting_sent
    ? `<span style="color:var(--accent);font-size:11px;font-weight:800">כן</span>`
    : `<span style="color:var(--danger);font-size:11px;font-weight:800">לא</span>`;
}

function pvInvoiceDueInfo(inv) {
  const due = pvDateISO(inv?.due_date || '');
  const today = todayISO();
  if (!due) return { group: 1, days: null, due: '', label: 'חסר תאריך', title: 'חסר תאריך פירעון', tone: 'missing' };
  const days = Math.round((new Date(due + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
  if (days < 0) return { group: 0, days, due, label: `באיחור ${Math.abs(days)} ימים`, title: `תאריך פירעון: ${fmtDate(due)}`, tone: 'overdue' };
  if (days === 0) return { group: 2, days, due, label: 'היום', title: `תאריך פירעון: ${fmtDate(due)}`, tone: 'today' };
  if (days <= 7) return { group: 3, days, due, label: `בעוד ${days} ימים`, title: `תאריך פירעון: ${fmtDate(due)}`, tone: 'soon' };
  return { group: 4, days, due, label: `בעוד ${days} ימים`, title: `תאריך פירעון: ${fmtDate(due)}`, tone: 'future' };
}

function pvInvoiceDueSortValue(inv) {
  const info = pvInvoiceDueInfo(inv);
  return [info.group, info.due || '9999-12-31', String(inv.invoice_date || ''), String(inv.created_at || '')].join('|');
}

function pvInvoiceDueBadge(inv) {
  const info = pvInvoiceDueInfo(inv);
  const tones = {
    overdue: ['var(--danger)', 'var(--dangerSoft)'],
    missing: ['var(--amber)', 'rgba(245,158,11,0.12)'],
    today: ['var(--accent)', 'var(--accentSoft)'],
    soon: ['var(--info)', 'rgba(59,130,246,0.12)'],
    future: ['var(--textDim)', 'var(--surfaceHi)']
  };
  const [color, bg] = tones[info.tone] || tones.future;
  const dateText = info.due ? fmtDate(info.due) : '—';
  return `<div style="min-width:112px;text-align:center;border:1px solid rgba(148,163,184,0.24);background:${bg};border-radius:14px;padding:9px 8px">
    <div style="font-size:10px;color:${color};font-weight:900;margin-bottom:2px">תאריך פירעון</div>
    <div class="display" style="font-size:17px;color:${color};font-weight:900;line-height:1.05">${dateText}</div>
    <div style="font-size:10.5px;color:${color};font-weight:800;margin-top:3px">${info.label}</div>
  </div>`;
}

function pvSupplierInvoiceRows() {
  pvEnsureSupplierInvoiceMigration();
  let rows = [...(pv.supplierInvoices || [])];
  const q = (state.payablesSearch || '').trim().toLowerCase();
  const status = state.pvInvoiceStatus || 'הכל';
  const method = state.pvInvoiceMethod || 'הכל';
  const accounting = state.pvInvoiceAccounting || 'הכל';
  const quick = state.pvInvoiceQuick || 'פתוחות';
  if (quick !== 'מחוקות') rows = rows.filter(inv => !inv.deleted);
  if (q) rows = rows.filter(inv => [inv.supplier_name, inv.invoice_number, inv.supplier_tax_id, inv.notes].join(' ').toLowerCase().includes(q));
  if (status !== 'הכל') rows = rows.filter(inv => pvCalcInvoiceStatus(inv) === status);
  if (method !== 'הכל') rows = rows.filter(inv => (inv.payment_method || '') === method);
  if (accounting === 'הועבר') rows = rows.filter(inv => inv.accounting_sent);
  if (accounting === 'לא הועבר') rows = rows.filter(inv => !inv.accounting_sent);
  if (quick === 'הכל') rows = rows.filter(inv => !inv.archived);
  if (quick === 'פתוחות') rows = rows.filter(pvIsInvoiceOpen);
  if (quick === 'טיוטות לבדיקה') rows = rows.filter(inv => pvCalcInvoiceStatus(inv) === 'טיוטה לבדיקה');
  if (quick === 'באיחור') rows = rows.filter(inv => pvCalcInvoiceStatus(inv) === 'באיחור');
  if (quick === 'היום') rows = rows.filter(inv => pvIsInvoiceOpen(inv) && pvInvoiceDueInfo(inv).group === 2);
  if (quick === 'השבוע') rows = rows.filter(inv => pvIsInvoiceOpen(inv) && [2,3].includes(pvInvoiceDueInfo(inv).group));
  if (quick === 'חסר תאריך') rows = rows.filter(inv => pvIsInvoiceOpen(inv) && !pvDateISO(inv.due_date));
  if (quick === 'לא עבר להנה"ח') rows = rows.filter(inv => !inv.archived && !inv.accounting_sent);
  if (quick === "צ'קים פתוחים") rows = rows.filter(inv => pvIsCheckMethod(inv.payment_method) && pvCalcInvoiceStatus(inv) !== 'שולם');
  if (quick === 'שולמו') rows = rows.filter(inv => pvCalcInvoiceStatus(inv) === 'שולם');
  if (quick === 'ארכיון') rows = rows.filter(inv => inv.archived);
  if (quick === 'מחוקות') rows = rows.filter(inv => inv.deleted);
  rows.sort((a,b) => pvInvoiceDueSortValue(a).localeCompare(pvInvoiceDueSortValue(b)) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  return rows;
}

let pvInvoiceSearchTimer = null;
function pvInvoiceSearchInput(val) {
  state.payablesSearch = val || '';
  clearTimeout(pvInvoiceSearchTimer);
  pvInvoiceSearchTimer = setTimeout(() => {
    if (state.tab === 'payables' && (!state.payablesView || state.payablesView === 'dashboard')) {
      render();
      const inp = document.getElementById('pv-invoice-search-inp');
      if (inp) {
        inp.focus({preventScroll:true});
        const pos = inp.value.length;
        try { inp.setSelectionRange(pos, pos); } catch(e) {}
      }
    }
  }, 180);
}

function renderSupplierInvoicesDashboard() {
  const all = (pv.supplierInvoices || []).filter(inv => !inv.deleted);
  const today = todayISO();
  const month = today.slice(0,7);
  const open = all.filter(pvIsInvoiceOpen);
  const overdue = all.filter(inv => pvCalcInvoiceStatus(inv) === 'באיחור');
  const week = open.filter(inv => inv.due_date && pvDateInDays(inv.due_date, 7));
  const checks = all.filter(inv => pvIsCheckMethod(inv.payment_method) && pvCalcInvoiceStatus(inv) !== 'שולם');
  const paidMonth = all.filter(inv => pvCalcInvoiceStatus(inv) === 'שולם' && String(inv.paid_at || inv.updated_at || '').slice(0,7) === month);
  const notAccounting = all.filter(inv => !inv.accounting_sent && !inv.archived);
  const monthPurchases = all.filter(inv => String(inv.invoice_date || '').slice(0,7) === month).reduce((s,inv)=>s+(+inv.total_amount||0),0);
  const kpi = (label, value, sub, tone) => {
    const color = tone === 'danger' ? 'var(--danger)' : tone === 'warn' ? 'var(--amber)' : tone === 'info' ? 'var(--info)' : 'var(--accent)';
    return `<div style="padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--border)">
      <div style="font-size:10.5px;color:var(--textDim);font-weight:800;margin-bottom:5px">${label}</div>
      <div class="display" style="font-size:17px;color:${color};font-weight:800">${value}</div>
      <div style="font-size:10.5px;color:var(--textMuted);margin-top:2px">${sub||''}</div>
    </div>`;
  };
  return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px">
    ${kpi('חובות פתוחים', fmtCurr(open.reduce((s,inv)=>s+pvInvoiceOpenAmount(inv),0)), open.length+' חשבוניות', open.length?'warn':'ok')}
    ${kpi('לפירעון השבוע', fmtCurr(week.reduce((s,inv)=>s+pvInvoiceOpenAmount(inv),0)), week.length+' פריטים', 'info')}
    ${kpi('באיחור', fmtCurr(overdue.reduce((s,inv)=>s+pvInvoiceOpenAmount(inv),0)), overdue.length+' חשבוניות', overdue.length?'danger':'ok')}
    ${kpi("צ'קים פתוחים", checks.length, fmtCurr(checks.reduce((s,inv)=>s+pvInvoiceOpenAmount(inv),0)), 'info')}
    ${kpi('שולמו החודש', paidMonth.length, fmtCurr(paidMonth.reduce((s,inv)=>s+(+inv.total_amount||0),0)), 'ok')}
    ${kpi('לא הועבר להנה"ח', notAccounting.length, 'דורש טיפול', notAccounting.length?'warn':'ok')}
    ${kpi('קניות החודש', fmtCurr(monthPurchases), month, 'ok')}
    ${kpi('חשבוניות', all.length, 'כולל היסטוריה', 'info')}
  </div>`;
}

function pvInvoiceDeliveryNotesWarning(inv) {
  const ids = inv.delivery_note_ids || [];
  if (!ids.length) return '';
  const sum = (DB.expenses || []).filter(e => ids.includes(e.id)).reduce((s,e)=>s+(+e.total_amount||0),0);
  const diff = Math.abs(sum - (+inv.total_amount || 0));
  return diff > 1 ? `סכום ת"מ ${fmtCurr(sum)} שונה מחשבונית ${fmtCurr(inv.total_amount)}` : '';
}

function pvGetInvoice(invId) {
  return (pv.supplierInvoices || []).find(x => x.id === invId);
}

function pvTouchInvoice(inv) {
  inv.updated_at = new Date().toISOString();
  inv.updated_by = pvCurrentUserName();
}

function pvStartSupplierInvoiceEdit(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  setState({
    pvInvoiceEditId: inv.id,
    pvInvoiceEditDraft: {
      supplier_name: inv.supplier_name || '',
      supplier_tax_id: inv.supplier_tax_id || '',
      invoice_number: inv.invoice_number || '',
      invoice_date: pvDateISO(inv.invoice_date) || '',
      amount_before_vat: +inv.amount_before_vat || 0,
      vat_amount: +inv.vat_amount || 0,
      total_amount: +inv.total_amount || 0,
      payment_method: inv.payment_method || "צ'ק",
      payment_status: pvCalcInvoiceStatus(inv) || inv.payment_status || 'לא שולם',
      due_date: pvDateISO(inv.due_date) || '',
      accounting_sent: !!inv.accounting_sent,
      accounting_sent_at: pvDateISO(inv.accounting_sent_at) || '',
      check_number: inv.check_number || '',
      check_due_date: pvDateISO(inv.check_due_date) || '',
      check_bank: inv.check_bank || '',
      invoice_file: inv.invoice_file || '',
      invoice_file_ref: inv.invoice_file_ref || '',
      notes: inv.notes || ''
    }
  });
}

function pvCancelSupplierInvoiceEdit() {
  setState({pvInvoiceEditId:'', pvInvoiceEditDraft:null});
}

function pvSaveSupplierInvoiceEdit(invId) {
  const inv = pvGetInvoice(invId);
  const d = state.pvInvoiceEditDraft || {};
  if (!inv) return;
  try {
    const oldSnapshot = JSON.parse(JSON.stringify({
      ...inv,
      legacy_data: inv.legacy_data ? {...inv.legacy_data, edit_snapshots: undefined} : null
    }));
    const next = {
      supplier_name: String(d.supplier_name || '').trim() || inv.supplier_name || '',
      supplier_id: pvSupplierIdByName(d.supplier_name || inv.supplier_name || ''),
      supplier_tax_id: String(d.supplier_tax_id || '').trim(),
      invoice_number: String(d.invoice_number || '').trim(),
      invoice_date: pvDateISO(d.invoice_date) || inv.invoice_date || todayISO(),
      amount_before_vat: Number(d.amount_before_vat || 0),
      vat_amount: Number(d.vat_amount || 0),
      total_amount: Number(d.total_amount || 0),
      payment_method: d.payment_method || inv.payment_method || "צ'ק",
      payment_status: d.payment_status || inv.payment_status || 'לא שולם',
      due_date: pvDateISO(d.due_date) || '',
      accounting_sent: !!d.accounting_sent,
      accounting_sent_at: d.accounting_sent ? (pvDateISO(d.accounting_sent_at) || todayISO()) : (inv.accounting_sent_at || ''),
      check_number: d.check_number || '',
      check_due_date: pvDateISO(d.check_due_date) || '',
      check_bank: d.check_bank || '',
      notes: d.notes || ''
    };
    if (next.payment_status === 'שולם') {
      next.paid_at = inv.paid_at || todayISO();
      next.check_cleared = pvIsCheckMethod(next.payment_method) ? true : inv.check_cleared;
    } else if (next.payment_status === 'ממתין לפירעון צ׳ק') {
      next.check_cleared = false;
    }

    if (!Number.isFinite(next.total_amount) || next.total_amount <= 0) throw new Error('סכום כולל לא תקין');
    if (!Number.isFinite(next.amount_before_vat)) throw new Error('סכום לפני מע"מ לא תקין');
    if (!Number.isFinite(next.vat_amount)) throw new Error('מע"מ לא תקין');

    const fields = ['supplier_name','supplier_id','supplier_tax_id','invoice_number','invoice_date','amount_before_vat','vat_amount','total_amount','payment_method','payment_status','due_date','accounting_sent','accounting_sent_at','check_number','check_due_date','check_bank','notes','paid_at','check_cleared'];
    let changed = false;
    fields.forEach(field => {
      if (!Object.prototype.hasOwnProperty.call(next, field)) return;
      const oldValue = inv[field];
      const newValue = next[field];
      if (String(oldValue ?? '') !== String(newValue ?? '')) {
        inv[field] = newValue;
        pvInvoiceLog(inv.id, 'עריכת חשבונית', field, oldValue, newValue);
        changed = true;
      }
    });
    if (!changed) {
      setState({pvInvoiceEditId:'', pvInvoiceEditDraft:null});
      toast('לא היו שינויים לשמירה', 'info');
      return;
    }
    if (inv.payment_status === 'מאושרת כחוב פתוח' && !inv.legacy_debt_id) {
      const debt = {
        id: uid(),
        supplierName: inv.supplier_name || '',
        taxInvoiceId: inv.legacy_tax_invoice_id || null,
        expenseId: inv.source_expense_id || null,
        invoiceNumber: inv.invoice_number || '',
        date: inv.invoice_date || todayISO(),
        amount: +inv.total_amount || 0,
        paidAmount: 0,
        dueDate: inv.due_date || '',
        paymentMethod: inv.payment_method || "צ'ק",
        checkNumber: inv.check_number || '',
        invoiceImage: inv.invoice_file || null,
        paymentStatus: 'מאושרת כחוב פתוח',
        notes: inv.notes || '',
        status: 'open',
        payments: [],
        createdAt: Date.now(),
        sourceSupplierInvoiceId: inv.id
      };
      pv.debts.push(debt);
      inv.legacy_debt_id = debt.id;
      pvInvoiceLog(inv.id, 'אישור חשבונית', 'legacy_debt_id', '', debt.id);
    }
    inv.legacy_data = inv.legacy_data || {};
    if (!inv.legacy_data.edit_snapshots) inv.legacy_data.edit_snapshots = [];
    inv.legacy_data.edit_snapshots.push({at:new Date().toISOString(), by:pvCurrentUserName(), before:oldSnapshot});
    if (inv.legacy_data.edit_snapshots.length > 20) inv.legacy_data.edit_snapshots = inv.legacy_data.edit_snapshots.slice(-20);
    pvTouchInvoice(inv);
    savePv(true);
    setState({pvInvoiceEditId:'', pvInvoiceEditDraft:null});
    toast('השינויים נשמרו בהצלחה', 'success');
  } catch(e) {
    console.error('[supplier-invoice-edit] save failed', {invoiceId:invId, error:e, draft:d});
    toast('שמירת השינויים נכשלה. בדוק קונסול לפרטים.', 'error');
  }
}

function pvApproveSupplierInvoice(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  try {
    if (!inv.supplier_name) throw new Error('חסר ספק');
    if (!(+inv.total_amount > 0)) throw new Error('סכום כולל לא תקין');
    const oldStatus = inv.payment_status;
    inv.payment_status = 'מאושרת כחוב פתוח';
    inv.approved_at = new Date().toISOString();
    inv.approved_by = pvCurrentUserName();
    inv.supplier_match_status = inv.supplier_match_status === 'requires_manual_link' && findApprovedSupplier(inv.supplier_name) ? 'matched' : (inv.supplier_match_status || 'matched');

    if (!inv.legacy_debt_id) {
      const debt = {
        id: uid(),
        supplierName: inv.supplier_name || '',
        taxInvoiceId: inv.legacy_tax_invoice_id || null,
        expenseId: inv.source_expense_id || null,
        invoiceNumber: inv.invoice_number || '',
        date: inv.invoice_date || todayISO(),
        amount: +inv.total_amount || 0,
        paidAmount: 0,
        dueDate: inv.due_date || '',
        paymentMethod: inv.payment_method || "צ'ק",
        checkNumber: inv.check_number || '',
        invoiceImage: inv.invoice_file || null,
        paymentStatus: 'מאושרת כחוב פתוח',
        notes: inv.notes || '',
        status: 'open',
        payments: [],
        createdAt: Date.now(),
        sourceSupplierInvoiceId: inv.id
      };
      pv.debts.push(debt);
      inv.legacy_debt_id = debt.id;
      inv.legacy_data = inv.legacy_data || {};
      inv.legacy_data.approved_debt = {...debt};
      pvInvoiceLog(inv.id, 'אישור חשבונית', 'legacy_debt_id', '', debt.id);
    }
    pvTouchInvoice(inv);
    pvInvoiceLog(inv.id, 'אישור חשבונית', 'payment_status', oldStatus, inv.payment_status);
    savePv(true);
    setState({});
    toast('החשבונית אושרה כחוב פתוח', 'success');
  } catch(e) {
    console.error('[supplier-invoice-approve] failed', {invoiceId:invId, error:e});
    toast('אישור החשבונית נכשל: ' + (e.message || 'שגיאה לא ידועה'), 'error');
  }
}

function pvMarkSupplierInvoicePaid(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  if (pvIsCheckMethod(inv.payment_method) && !confirm('התשלום בצ׳ק. לסמן שהצ׳ק נפרע בפועל והחשבונית שולמה?')) return;
  const remaining = pvInvoiceOpenAmount(inv);
  if (remaining > 0) {
    pv.supplierInvoicePayments.push({id:uid(), invoice_id:inv.id, amount:remaining, date:todayISO(), method:inv.payment_method||'', reference:inv.check_number||'', notes:'סימון שולם', created_at:new Date().toISOString(), created_by:pvCurrentUserName()});
  }
  const old = inv.payment_status;
  inv.payment_status = 'שולם';
  inv.paid_at = todayISO();
  inv.check_cleared = true;
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, 'סימון שולם', 'payment_status', old, 'שולם');
  savePv(true);
  setState({});
  toast('החשבונית סומנה כשולמה ✓', 'success');
}

function pvAddSupplierInvoicePartialPayment(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  const remaining = pvInvoiceOpenAmount(inv);
  const val = prompt('סכום תשלום חלקי', remaining.toFixed(2));
  if (val == null) return;
  const amount = +val;
  if (!amount || amount <= 0) { toast('סכום לא תקין', 'error'); return; }
  pv.supplierInvoicePayments.push({id:uid(), invoice_id:inv.id, amount:Math.min(amount, remaining), date:todayISO(), method:inv.payment_method||'', reference:inv.check_number||'', notes:'תשלום חלקי', created_at:new Date().toISOString(), created_by:pvCurrentUserName()});
  const old = inv.payment_status;
  inv.payment_status = pvInvoiceOpenAmount(inv) <= 0 ? 'שולם' : 'שולם חלקית';
  if (inv.payment_status === 'שולם') inv.paid_at = todayISO();
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, 'תשלום חלקי', 'payment_status', old, inv.payment_status, {amount});
  savePv(true);
  setState({});
  toast('תשלום חלקי נרשם ✓', 'success');
}

function pvToggleSupplierInvoiceAccounting(invId, source) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  const old = inv.accounting_sent ? 'כן' : 'לא';
  inv.accounting_sent = !inv.accounting_sent;
  inv.accounting_sent_at = inv.accounting_sent ? new Date().toISOString() : '';
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, source === 'main-card' ? 'שינוי סטטוס הנה"ח מהמסך הראשי' : 'סימון הועבר להנה"ח', 'accounting_sent', old, inv.accounting_sent ? 'כן' : 'לא');
  savePv(true);
  setState({});
  toast(inv.accounting_sent ? 'סומן כהועבר להנה"ח ✓' : 'סימון הנה"ח בוטל', inv.accounting_sent ? 'success' : 'info');
}

function pvToggleSupplierInvoiceArchive(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  const old = inv.archived ? 'בארכיון' : 'פעיל';
  inv.archived = !inv.archived;
  inv.archived_at = inv.archived ? new Date().toISOString() : '';
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, inv.archived ? 'העברה לארכיון' : 'שחזור מארכיון', 'archived', old, inv.archived ? 'בארכיון' : 'פעיל');
  savePv(true);
  setState({});
}

function pvDeleteSupplierInvoice(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  const reason = prompt('סיבת מחיקה: טעות / כפילות / אחר', inv.delete_reason || 'כפילות');
  if (reason === null) return;
  if (!confirm('למחוק את החשבונית מהרשימות הרגילות? הרשומה לא תימחק פיזית ותישמר ביומן.')) return;
  const oldStatus = pvCalcInvoiceStatus(inv);
  inv.deleted = true;
  inv.deleted_at = new Date().toISOString();
  inv.delete_reason = reason || 'טעות / כפילות';
  inv.archived = true;
  inv.archived_at = inv.archived_at || inv.deleted_at;
  inv.payment_status = 'נמחקה';
  if (inv.legacy_debt_id) {
    const debt = (pv.debts || []).find(d => d.id === inv.legacy_debt_id);
    if (debt && debt.status !== 'cancelled') {
      debt.status = 'cancelled';
      debt.paymentStatus = 'בוטל';
      debt.closedAt = Date.now();
      debt.cancelReason = inv.delete_reason;
    }
  }
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, 'מחיקת חשבונית', 'payment_status', oldStatus, 'נמחקה', {reason:inv.delete_reason, legacy_debt_id:inv.legacy_debt_id || ''});
  savePv(true);
  setState({payablesView:'dashboard', payablesInvoiceId:''});
  toast('החשבונית הוסרה מהרשימות ונשמרה במחוקות', 'success');
}

function pvRestoreDeletedSupplierInvoice(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  if (!confirm('לשחזר את החשבונית לרשימות?')) return;
  const oldStatus = pvCalcInvoiceStatus(inv);
  inv.deleted = false;
  inv.deleted_at = '';
  inv.delete_reason = '';
  inv.archived = false;
  inv.payment_status = inv.source_type === 'scan' && !inv.legacy_debt_id ? 'טיוטה לבדיקה' : 'לא שולם';
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, 'שחזור מחיקה', 'payment_status', oldStatus, inv.payment_status);
  savePv(true);
  setState({});
  toast('החשבונית שוחזרה', 'success');
}

function pvOpenInvoiceLinkDN(invId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  setState({payablesModal:'supplier-invoice-link-dn',payablesModalData:{invoiceId:invId, selectedDNIds:[...(inv.delivery_note_ids||[])]}});
}

function pvUnlinkDNFromSupplierInvoice(invId, dnId) {
  const inv = pvGetInvoice(invId);
  if (!inv) return;
  if (!confirm('לבטל שיוך תעודת משלוח מהחשבונית? התעודה לא תימחק.')) return;
  inv.delivery_note_ids = (inv.delivery_note_ids || []).filter(id => id !== dnId);
  pv.supplierInvoiceDeliveryNotes = (pv.supplierInvoiceDeliveryNotes || []).filter(x => !(x.invoice_id === invId && x.delivery_note_id === dnId));
  pvTouchInvoice(inv);
  pvInvoiceLog(inv.id, 'ביטול שיוך', 'delivery_note_ids', dnId, '');
  savePv(true);
  setState({});
}

function renderPayables() {
  if (isDesktopMode()) return renderDesktopPayables();
  if (state.payablesView === 'invoice') return renderSupplierInvoiceDetail();
  if (state.payablesView === 'supplier') return renderPayablesSupplier();
  if (state.payablesView === 'debt') return renderPayablesDebt();
  if (state.payablesView === 'reconcile') return renderPayablesReconcile();
  if (state.payablesView === 'supplierBook') return renderPayablesSupplierBook();
  return renderSupplierInvoicesTab();
}

function pvToggleSupplierInvoiceDNSelection(dnId) {

    ${hasAmountGap ? `<div style="padding:10px 12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:800;margin-bottom:10px">

    ${notes.length === 0 ? `<div style="text-align:center;color:var(--textMuted);font-size:13px;padding:18px 0">לא נמצאו תעודות משלוח זמינות לספק הזה</div>` : notes.map(e => `
      <div onclick="pvToggleSupplierInvoiceDNSelection('${e.id}')" style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid ${selected.has(e.id)?'var(--accent)':'var(--border)'};background:${selected.has(e.id)?'var(--accentSoft)':'var(--surfaceHi)'};border-radius:13px;margin-bottom:8px;cursor:pointer">
        <div style="width:24px;height:24px;border-radius:8px;background:${selected.has(e.id)?'var(--accent)':'var(--surface)'};color:${selected.has(e.id)?'#fff':'var(--textDim)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900">${selected.has(e.id)?'✓':''}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;color:var(--text);font-size:13px">${esc(e.supplier || inv.supplier_name || '')}</div>
          <div style="font-size:11px;color:var(--textDim)">תעודת משלוח ${esc(e.document_number || 'ללא מספר')} · ${fmtDate(e.date)}</div>
        </div>
        <div style="font-weight:900;color:var(--text);font-size:13px">${fmtCurr(+e.total_amount || 0)}</div>
      </div>`).join('')}

    <button class="btn-ghost" onclick="setState({payablesModal:'',payablesModalData:null})">ביטול</button>`;
  return `<div onclick="setState({payablesModal:'',payablesModalData:null})" style="position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:50;display:flex;align-items:flex-end;justify-content:center">

      </div>

function pvConfirmSupplierInvoiceLinkDN() {
  const d = state.payablesModalData || {};
  const inv = pvGetInvoice(d.invoiceId);
  if (!inv) return;
  const oldIds = new Set(inv.delivery_note_ids || []);
  const newIds = new Set(d.selectedDNIds || []);
  const added = [...newIds].filter(id => !oldIds.has(id));
  const removed = [...oldIds].filter(id => !newIds.has(id));
  inv.delivery_note_ids = [...newIds];
  added.forEach(dnId => {
    if (!pv.supplierInvoiceDeliveryNotes.some(x => x.invoice_id === inv.id && x.delivery_note_id === dnId)) {
      pv.supplierInvoiceDeliveryNotes.push({id:uid(), invoice_id:inv.id, delivery_note_id:dnId, created_at:new Date().toISOString(), created_by:pvCurrentUserName()});
    }
    pvInvoiceLog(inv.id, 'שיוך תעודת משלוח', 'delivery_note_ids', '', dnId);
  });
  removed.forEach(dnId => {
    pv.supplierInvoiceDeliveryNotes = (pv.supplierInvoiceDeliveryNotes || []).filter(x => !(x.invoice_id === inv.id && x.delivery_note_id === dnId));
    pvInvoiceLog(inv.id, 'ביטול שיוך', 'delivery_note_ids', dnId, '');
  });
  pvTouchInvoice(inv);
  savePv(true);
  setState({payablesModal:'',payablesModalData:null});
  toast('שיוך התעודות נשמר ✓', 'success');
}

function pvLinkDNConfirm() {
  const d = state.payablesModalData || {};
  if (!d.invoiceNumber) { toast('נא להזין מספר חשבונית', 'error'); return; }
  const supplier = requireApprovedSupplier(d.supplier);
  if (!supplier) return;
  d.supplier = supplier.name;
  const tiId = uid();
  const ti = {
    id: tiId,
    supplierName: d.supplier || '',
    invoiceNumber: d.invoiceNumber,
    date: d.invoiceDate || todayISO(),
    amount: +(d.invoiceAmount||0),
    deliveryNoteIds: d.selectedDNIds || [],
    invoiceImage: d.invoiceImage || null,
    notes: d.notes || '',
    createdAt: Date.now(),
  };
  pv.taxInvoices.push(ti);
  // Create debt
  const debt = {
    id: uid(),
    supplierName: d.supplier || '',
    taxInvoiceId: tiId,
    invoiceNumber: d.invoiceNumber,
    amount: +(d.invoiceAmount||0),
    paidAmount: 0,
    dueDate: d.dueDate || '',
    paymentMethod: d.paymentMethod || "צ'ק",
    checkNumber: d.checkNumber || '',
    invoiceImage: d.invoiceImage || null,
    paymentStatus: pvIsCheckMethod(d.paymentMethod || "צ'ק") ? 'ממתין לפירעון' : 'ממתין',
    notes: d.notes || '',
    status: 'open',
    payments: [],
    createdAt: Date.now(),
  };
  pv.debts.push(debt);
  pvCreateSupplierInvoiceFromDebt(debt, {source:'link-delivery-notes', delivery_note_ids:d.selectedDNIds || [], legacy_tax_invoice_id:tiId, legacy_data:{tax_invoice:{...ti}}});
  savePv(true);
  setState({payablesModal:'', payablesModalData:null});
  toast('חשבונית וחוב נוצרו ✓', 'success');
}

function pvEditDebtConfirm() {
  const d = state.payablesModalData || {};
  const debt = pv.debts.find(x => x.id === d.debtId);
  if (!debt) return;
  const amount = +(d.amount||0);
  if (!d.supplier) { toast('נא להזין שם ספק', 'error'); return; }
  if (!amount || amount <= 0) { toast('נא להזין סכום', 'error'); return; }
  const supplier = requireApprovedSupplier(d.supplier);
  if (!supplier) return;
  d.supplier = supplier.name;

  debt.supplierName = d.supplier.trim();
  debt.invoiceNumber = d.invoiceNumber || '';
  debt.amount = amount;
  debt.dueDate = d.dueDate || '';
  debt.paymentMethod = d.paymentMethod || "צ'ק";
  debt.checkNumber = d.checkNumber || '';
  debt.notes = d.notes || '';
  debt.accountingPassed = !!d.accountingPassed;
  debt.invoiceImage = d.invoiceImage || null;

  if (d.paidState === 'paid') {
    const paidDate = d.paidDate || pvTodayISO();
    debt.status = 'paid';
    debt.paymentStatus = pvActionStatus(debt.paymentMethod);
    debt.paidAmount = amount;
    debt.paidDate = paidDate;
    debt.closedAt = Date.now();
    debt.payments = [{
      id: uid(),
      amount,
      date: paidDate,
      method: debt.paymentMethod,
      reference: debt.checkNumber || '',
      notes: 'עודכן בעריכה',
      finalStatus: debt.paymentStatus,
      createdAt: Date.now()
    }];
  } else {
    debt.status = 'open';
    debt.paymentStatus = pvIsCheckMethod(debt.paymentMethod) ? 'ממתין לפירעון' : 'ממתין';
    debt.paidAmount = 0;
    debt.payments = [];
    delete debt.paidDate;
    delete debt.closedAt;
  }

  if (debt.taxInvoiceId) {
    const ti = pv.taxInvoices.find(x => x.id === debt.taxInvoiceId);
    if (ti) {
      ti.supplierName = debt.supplierName;
      ti.invoiceNumber = debt.invoiceNumber;
      ti.amount = amount;
      ti.invoiceImage = debt.invoiceImage || null;
      ti.notes = debt.notes || '';
    }
  }

  pvSyncSupplierInvoiceFromDebt(debt, 'edit-debt');
  savePv(true);
  setState({payablesModal:'', payablesModalData:null, payablesView:'debt', payablesDebtId:debt.id});
  toast('התנועה עודכנה ✓', 'success');
}

function pvEditCheckConfirm() {
  const d = state.payablesModalData || {};
  const c = (DB.checks||[]).find(x => x.id === d.checkId);
  if (!c) return;
  const amount = +(d.amount||0);
  if (!d.supplier) { toast('נא להזין שם ספק', 'error'); return; }
  if (!amount || amount <= 0) { toast('נא להזין סכום', 'error'); return; }
  if (!d.clearDate) { toast('נא להזין תאריך פירעון', 'error'); return; }
  const supplier = requireApprovedSupplier(d.supplier);
  if (!supplier) return;
  d.supplier = supplier.name;

  c.supplier = d.supplier.trim();
  c.amount = amount;
  c.checkNum = d.checkNum || '';
  c.issueDate = isoToHe(d.issueDate || todayISO());
  c.clearDate = isoToHe(d.clearDate || todayISO());
  c.note = d.note || '';
  c.cleared = d.paidState === 'paid';
  if (c.cleared) c.clearedDate = d.paidDate || pvTodayISO();
  else delete c.clearedDate;

  persistLocal();
  PENDING.push({action:'delete_check', payload:{id:c.id}});
  PENDING.push({action:'add_check', payload:{payload:c}});
  localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
  if (CFG.webAppUrl) syncAll();
  setState({payablesModal:'', payablesModalData:null});
  toast('הצ׳ק עודכן ✓', 'success');
}

}

function pvRecordPaymentConfirm() {
  const d = state.payablesModalData || {};
  const debt = pv.debts.find(x => x.id === d.debtId);
  if (!debt) return;
  const amt = +(d.amount||0);
  if (!amt || amt <= 0) { toast('נא להזין סכום', 'error'); return; }
  const payment = {
    id: uid(),
    amount: amt,
    date: d.date || todayISO(),
    method: d.method || "צ'ק",
    reference: d.reference || '',
    notes: d.notes || '',
    createdAt: Date.now(),
  };
  if (!debt.payments) debt.payments = [];
  debt.payments.push(payment);
  debt.paidAmount = (+debt.paidAmount||0) + amt;
  pvUpdateDebtStatus(debt);
  if (debt.status === 'paid') {
    debt.paymentStatus = pvActionStatus(debt.paymentMethod || payment.method);
    debt.paidDate = payment.date;
    debt.closedAt = Date.now();
  }
  pvSyncSupplierInvoiceFromDebt(debt, 'record-payment');
  savePv(true);
  setState({payablesModal:'', payablesModalData:null});
  toast('תשלום נרשם ✓', 'success');
}

// Auto-create debt from expense if isOpenDebt=true and it's an invoice type
function pvAutoCreateDebtFromExpense(item) {
  if (!item) return;
  if (!['חשבונית מס','חשבונית מס קבלה'].includes(item.document_type)) return;
  if (item.isOpenDebt === false) return;
  // Don't create if debt already exists for this expense
  if (pv.debts.find(d => d.expenseId === item.id)) return;
  const debt = {
    id: uid(),
    supplierName: item.supplier || '',
    taxInvoiceId: null,
    expenseId: item.id,
    invoiceNumber: item.document_number || '',
    date: item.date || todayISO(),
    amount: +item.total_amount || 0,
    paidAmount: 0,
    dueDate: item.paymentDueDate || '',
    paymentMethod: "צ'ק",
    checkNumber: '',
    invoiceImage: item.image || null,
    paymentStatus: 'ממתין לפירעון',
    notes: item.paymentTerms ? 'תנאים: '+item.paymentTerms : '',
    status: 'open',
    payments: [],
    createdAt: Date.now(),
  };
  pv.debts.push(debt);
  pvCreateSupplierInvoiceFromDebt(debt, {source:'expense-scan', legacy_data:{expense:{...item}}});
  savePv(true);
  toast('חוב ₪' + fmt(debt.amount) + ' נוצר אוטומטית ✓', 'success');
}

function pvCancelDN(expenseId) {
  if (!confirm('לבטל תעודת משלוח זו? היא לא תוצג יותר כפתוחה.')) return;

  toast('תעודה בוטלה', 'success');
}

function pvCreateDebtFromTI(tiId) {
  const ti = pv.taxInvoices.find(x => x.id === tiId);
  if (!ti) return;
  const debt = {
    id: uid(),
    supplierName: ti.supplierName,
    taxInvoiceId: tiId,
    invoiceNumber: ti.invoiceNumber,
    date: ti.date,
    amount: ti.amount,
    paidAmount: 0,
    dueDate: '',
    paymentMethod: "צ'ק",
    checkNumber: '',
    invoiceImage: ti.invoiceImage || null,
    paymentStatus: 'ממתין לפירעון',
    notes: ti.notes || '',
    status: 'open',
    payments: [],
    createdAt: Date.now(),
  };
  pv.debts.push(debt);
  pvCreateSupplierInvoiceFromDebt(debt, {source:'create-debt-from-tax-invoice', delivery_note_ids:ti.deliveryNoteIds || [], legacy_tax_invoice_id:tiId, legacy_data:{tax_invoice:{...ti}}});
  savePv(true);
  setState({payablesView:'debt', payablesDebtId:debt.id});
  toast('חוב נוצר ✓', 'success');
}

function pvCancelDebt(debtId) {
  if (!confirm('לבטל חוב זה?')) return;
  const debt = pv.debts.find(d => d.id === debtId);
  if (!debt) return;
  debt.status = 'cancelled';
  debt.paymentStatus = 'בוטל';
  debt.closedAt = Date.now();
  pvSyncSupplierInvoiceFromDebt(debt, 'cancel-debt');
  savePv(true);
  setState({payablesView:'supplier', payablesSupplier:debt.supplierName});
  toast('חוב בוטל', 'success');
}
