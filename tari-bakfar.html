<style>
:root {
  --bg: #0a0e0a; --surface: #11161a; --surfaceHi: #1a2025;

}
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Heebo',-apple-system,sans-serif; overscroll-behavior:none; }

.app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

.sync-badge { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:100px; font-size:10px; font-weight:600; }

.sync-badge.offline { background:rgba(220,98,98,0.1); color:var(--danger); border:1px solid rgba(220,98,98,0.3); }

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const CFG = {
  webAppUrl: localStorage.getItem('tari_webapp_url') || 'https://script.google.com/macros/s/AKfycbxdXp4ZXpt2EAXYXHSKdjrNZRNFuAIiOEdyXktShtnSlRSYHXLoNlSyOf-LJYJkS7ndjw/exec',
  apiKey: localStorage.getItem('tari_apikey_v1') || '',
};

// ═══════════════════════════════════════════════════════════════════════════
// DATA LAYER — local cache + cloud sync
// ═══════════════════════════════════════════════════════════════════════════
const DB = {
  expenses: JSON.parse(localStorage.getItem('tari_expenses_v2')||'[]'),
  fixed: JSON.parse(localStorage.getItem('tari_fixed_v1')||'[]'),
  installments: JSON.parse(localStorage.getItem('tari_installments_v1')||'[]'),
};

const PENDING = JSON.parse(localStorage.getItem('tari_pending_v1')||'[]'); // pending sync operations

function persistLocal() {
  localStorage.setItem('tari_expenses_v2', JSON.stringify(DB.expenses));
  localStorage.setItem('tari_fixed_v1', JSON.stringify(DB.fixed));
  localStorage.setItem('tari_installments_v1', JSON.stringify(DB.installments));
  localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
  updateHeader();
}

let SYNC_STATUS = 'local'; // local | syncing | ok | offline
function setSyncStatus(s) {
  SYNC_STATUS = s;
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  badge.className = 'sync-badge ' + s;
  badge.innerHTML = {
    local: '⚠ לא מחובר',
    syncing: '<div class="spin" style="width:8px;height:8px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%"></div> מסנכרן',
    ok: '<div style="width:6px;height:6px;border-radius:50%;background:currentColor"></div> מסונכרן',
    offline: '⚠ אופליין',
  }[s] || s;
}

// ═══════════════════════════════════════════════════════════════════════════
// CLOUD SYNC
// ═══════════════════════════════════════════════════════════════════════════
async function cloudCall(action, payload) {
  if (!CFG.webAppUrl) throw new Error('לא הוגדר חיבור ל-Google Sheets');

  // Use text/plain to avoid CORS preflight
  const res = await fetch(CFG.webAppUrl, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload}),
    redirect: 'follow'
  });

  if (!res.ok) throw new Error(`Server ${res.status}`);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch(e) { throw new Error('תשובה לא תקינה מהשרת: ' + text.slice(0,200)); }

  if (!data.ok) throw new Error(data.error || 'שגיאה לא ידועה');
  return data.data;
}

async function syncAll() {
  if (!CFG.webAppUrl) { setSyncStatus('local'); return; }
  setSyncStatus('syncing');
  try {
    // 1. Push pending changes
    while (PENDING.length > 0) {
      const op = PENDING[0];
      await cloudCall(op.action, op.payload);
      PENDING.shift();
      localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    }

    // 2. Pull fresh data — only replace local if cloud has more records or local is empty
    const [exp, fix, ins] = await Promise.all([
      cloudCall('list_expenses', {}),
      cloudCall('list_fixed', {}),
      cloudCall('list_installments', {}),
    ]);
    if ((exp||[]).length > 0 || DB.expenses.length === 0) DB.expenses = exp || [];
    if ((fix||[]).length > 0 || DB.fixed.length === 0) DB.fixed = fix || [];
    if ((ins||[]).length > 0 || DB.installments.length === 0) DB.installments = ins || [];
    persistLocal();
    setSyncStatus('ok');
    render();
  } catch(e) {
    console.error('Sync failed:', e);
    setSyncStatus('offline');
    toast('סנכרון נכשל: ' + e.message, 'error');
  }
}

async function queueAndSync(action, payload, optimisticLocal) {
  // 1. Apply optimistically to local DB
  if (optimisticLocal) optimisticLocal();
  persistLocal();
  render();

  // 2. If no cloud configured, stop here
  if (!CFG.webAppUrl) return;

  // 3. Try to push to cloud
  setSyncStatus('syncing');
  try {
    await cloudCall(action, payload);
    setSyncStatus('ok');
  } catch(e) {
    console.error('Push failed:', e);
    // Queue for later
    PENDING.push({action, payload});
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
    setSyncStatus('offline');
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════
const CATS = ["ירקות","פירות","עשבי תיבול","פטריות","תוצרת יבשה","אריזות","ציוד","הובלה","שיווק","שירותים","אחר"];

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const todayStr = () => new Date().toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmt = n => Number(n||0).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtCurr = n => "₪" + fmt(n);
const parseD = d => { try { return new Date(String(d).split("/").reverse().join("-")); } catch { return null; } };
const isToday = d => { const p=parseD(d); const n=new Date(); return p && p.toDateString()===n.toDateString(); };
const isWeek = d => { const p=parseD(d); if(!p) return false; const sun=new Date(); sun.setDate(sun.getDate()-sun.getDay()); sun.setHours(0,0,0,0); return p>=sun && p<=new Date(); };
const isMonth = d => { const p=parseD(d); const n=new Date(); return p && p.getMonth()===n.getMonth() && p.getFullYear()===n.getFullYear(); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.style.opacity='0', 2500);
  setTimeout(()=>el.remove(), 3000);
}

// ═══════════════════════════════════════════════════════════════════════════
// AI: OpenAI
// ═══════════════════════════════════════════════════════════════════════════
async function scanInvoice(base64, mime) {
  if (!CFG.apiKey) throw new Error("חסר API Key — הכנס אותו בהגדרות");
  if (!CFG.apiKey.startsWith("sk-")) throw new Error("מפתח לא תקין — חייב להתחיל ב-sk-");

  const prompt = `אתה מערכת OCR לירקניה בכפר מעש.
קרא את המסמך והחזר JSON בלבד, בלי טקסט נוסף, בלי backticks.

{"date":"DD/MM/YYYY","supplier":"שם הספק","total_amount":0.00,"vat_amount":0.00,"amount_before_vat":0.00,"category":"ירקות","document_type":"חשבונית מס","document_number":"","notes":""}

קטגוריות: ירקות, פירות, עשבי תיבול, פטריות, תוצרת יבשה, אריזות, ציוד, הובלה, שיווק, שירותים, אחר
סוגי מסמך: חשבונית מס, חשבונית מס קבלה, תעודת משלוח, קבלה.`;

  let r;
  try {
    r = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.apiKey},
      body: JSON.stringify({
        model:"gpt-4o", max_tokens:600,
        messages:[{role:"user",content:[
          {type:"text",text:prompt},
          {type:"image_url",image_url:{url:`data:${mime};base64,${base64}`}}
        ]}]
      })
    });
  } catch(netErr) {
    throw new Error("בעיית רשת: "+netErr.message);
  }

  if (!r.ok) {
    let errMsg;
    try { errMsg = (await r.json()).error?.message || 'unknown'; } catch { errMsg = await r.text(); }
    if (r.status === 401) throw new Error("מפתח שגוי (401)");
    if (r.status === 429) throw new Error("חרגת ממכסה (429)");
    if (errMsg.includes("quota") || errMsg.includes("billing")) throw new Error("אין יתרה ב-OpenAI");
    throw new Error(`OpenAI ${r.status}: ${errMsg.slice(0,150)}`);
  }

  const d = await r.json();
  const txt = (d.choices?.[0]?.message?.content || "").trim();
  if (!txt) throw new Error("תשובה ריקה");

  let depth=0, start=-1;
  for (let i=0;i<txt.length;i++) {
    if(txt[i]==="{"){if(start<0)start=i; depth++;}
    else if(txt[i]==="}"){depth--;if(depth===0)return JSON.parse(txt.slice(start,i+1));}
  }
  throw new Error("לא נמצא JSON: "+txt.slice(0,80));
}

const ICONS = {

function handleFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const full = e.target.result;
    setState({scanImg:full,scanB64:full.split(',')[1],scanMime:file.type,scanStage:'preview',scanErr:''});
  };
  rd.readAsDataURL(file);
}

async function runScan() {
  setState({scanStage:'scanning',scanErr:''});
  try {
    const data = await scanInvoice(state.scanB64, state.scanMime);
    setState({
      scanStage:'confirm',
      scanForm: {
        id: uid(), image: state.scanImg,
        date: data.date||todayStr(), supplier: data.supplier||'',
        total_amount: +data.total_amount||0, vat_amount: +data.vat_amount||0,
        amount_before_vat: +data.amount_before_vat||0,
        category: data.category||'אחר', document_type: data.document_type||'חשבונית מס',
        document_number: data.document_number||'', notes: data.notes||'',
      }
    });
  } catch(e) { setState({scanErr:e.message,scanStage:'preview'}); }
}

function manualForm() {
  setState({scanStage:'confirm', scanForm:{id:uid(),image:state.scanImg,date:todayStr(),supplier:'',total_amount:0,vat_amount:0,amount_before_vat:0,category:'אחר',document_type:'חשבונית מס',document_number:'',notes:''}});
}

async function saveScanResult() {
  const item = state.scanForm;
  // Store without base64 locally — Drive URL arrives on next syncAll()
  const localItem = {...item, image: item.image?.startsWith('data:') ? '' : (item.image || '')};
  await queueAndSync('add_expense', {payload: item}, () => {
    DB.expenses.unshift(localItem);
  });
  toast('נשמר בהצלחה', 'success');
  setState({tab:'list', scanStage:'idle', scanImg:null, scanForm:null});
}

        <button onclick="setState({editId:null,editForm:null})" style="width:100%;border:1px solid var(--border);border-radius:14px;padding:13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--textDim)">ביטול</button>

}

async function saveEditExpense() {
  if (!state.editForm || !state.editId) return;
  const f = state.editForm;
  const updated = {
    ...(DB.expenses.find(e => e.id === state.editId) || {}),
    supplier: f.supplier, date: f.date, category: f.category,
    document_type: f.document_type, document_number: f.document_number,
    total_amount: +f.total_amount||0, vat_amount: +f.vat_amount||0,
    amount_before_vat: (+f.total_amount||0)-(+f.vat_amount||0), notes: f.notes
  };
  await queueAndSync('delete_expense', {id: state.editId}, () => {
    DB.expenses = DB.expenses.map(e => e.id === state.editId ? updated : e);
  });
  if (CFG.webAppUrl) await queueAndSync('add_expense', {payload: updated}, () => {});
  setState({editId: null, editForm: null, listOpen: null});
  toast('עודכן ✓', 'success');
}

async function deleteExpense(id) {
  await queueAndSync('delete_expense', {id}, () => {
    DB.expenses = DB.expenses.filter(e=>e.id!==id);
  });
  setState({listOpen:null});
  toast('נמחק', 'success');
}

let addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:""};

function renderAdd() {
  return `

      <h2 class="display" style="font-size:24px;margin:0 0 18px">הוספה ידנית</h2>

      <div class="row">
        <div class="field"><label class="label">סכום כולל ₪ *</label><input class="input" type="number" placeholder="0.00" value="${addForm.total_amount}" oninput="addTotal(this.value)"></div>
        <div class="field"><label class="label">מע"מ</label><input class="input" type="number" placeholder="אוטו" value="${addForm.vat_amount}" oninput="addForm.vat_amount=this.value"></div>
      </div>
      <div class="field"><label class="label">קטגוריה</label><select class="input" onchange="addForm.category=this.value">${CATS.map(c=>`<option ${c===addForm.category?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="label">סוג מסמך</label><select class="input" onchange="addForm.document_type=this.value">${DTYPES.map(d=>`<option ${d===addForm.document_type?'selected':''}>${d}</option>`).join('')}</select></div>

      <div class="field"><label class="label">הערות</label><input class="input" value="${esc(addForm.notes)}" oninput="addForm.notes=this.value"></div>
      <button class="btn-primary" onclick="submitAdd()" ${!addForm.supplier||!addForm.total_amount?'disabled':''}>שמור הוצאה</button>
    </div>`;
}

function addTotal(v) {
  addForm.total_amount = v;
  if (v) {
    const t = +v; const vat = Math.round(t/1.17*0.17*100)/100;
    addForm.vat_amount = vat; addForm.amount_before_vat = Math.round((t-vat)*100)/100;
    render();
  }
}

async function submitAdd() {
  if (!addForm.supplier || !addForm.total_amount) return;
  const item = {...addForm, id:uid(), total_amount:+addForm.total_amount, vat_amount:+addForm.vat_amount||0, amount_before_vat:+addForm.amount_before_vat||0};
  await queueAndSync('add_expense', {payload: item}, () => DB.expenses.unshift(item));
  addForm = {date:todayStr(),supplier:"",total_amount:"",vat_amount:"",amount_before_vat:"",category:"אחר",document_type:"חשבונית מס",document_number:"",notes:""};
  toast('נשמר!', 'success');
  setState({tab:'list'});
}

function startFixed() { setState({fixedAdding:true, fixedForm:{name:"",amount:"",category:"שכירות",frequency:"חודשי",day:"1",supplier:"",notes:"",active:true}}); }
function editFixed(id) { const item = DB.fixed.find(x=>x.id===id); if(item) setState({fixedAdding:true, fixedForm:{...item,amount:String(item.amount)}}); }

async function saveFixed() {
  const f = state.fixedForm;
  if (!f.name||!f.amount) return;
  const item = {...f, amount:+f.amount};
  if (f.id) {
    await queueAndSync('update_fixed', {payload: item}, () => DB.fixed = DB.fixed.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_fixed', {payload: item}, () => DB.fixed.unshift(item));
  }
  setState({fixedAdding:false, fixedForm:null});
  toast('נשמר', 'success');
}

async function toggleFixed(id) {
  const item = DB.fixed.find(x=>x.id===id);
  if (!item) return;
  const updated = {...item, active: !item.active};
  await queueAndSync('update_fixed', {payload: updated}, () => DB.fixed = DB.fixed.map(x=>x.id===id?updated:x));
}

async function delFixed(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_fixed', {id}, () => DB.fixed = DB.fixed.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

function startInstall() { setState({installAdding:true, installForm:{name:"",total:"",installments:"",paid:"0",first_date:todayStr(),supplier:"",notes:""}}); }
function editInstall(id) { const item = DB.installments.find(x=>x.id===id); if(item) setState({installAdding:true, installForm:{...item,total:String(item.total),installments:String(item.installments),paid:String(item.paid)}}); }

async function saveInstall() {
  const f = state.installForm;
  if (!f.name||!f.total||!f.installments) return;
  const item = {...f, total:+f.total, installments:+f.installments, paid:+f.paid||0};
  if (f.id) {
    await queueAndSync('update_installment', {payload: item}, () => DB.installments = DB.installments.map(x=>x.id===f.id?item:x));
  } else {
    item.id = uid();
    await queueAndSync('add_installment', {payload: item}, () => DB.installments.unshift(item));
  }
  setState({installAdding:false, installForm:null});
  toast('נשמר', 'success');
}

async function markPaid(id, delta) {
  const item = DB.installments.find(x=>x.id===id);
  if (!item) return;
  const np = Math.max(0, Math.min(+item.installments, (+item.paid||0)+delta));
  const updated = {...item, paid: np};
  await queueAndSync('update_installment', {payload: updated}, () => DB.installments = DB.installments.map(x=>x.id===id?updated:x));
}

async function delInstall(id, name) {
  if (!confirm("למחוק את "+name+"?")) return;
  await queueAndSync('delete_installment', {id}, () => DB.installments = DB.installments.filter(x=>x.id!==id));
  toast('נמחק', 'success');
}

// VIEWS — REPORTS
// ═══════════════════════════════════════════════════════════════════════════
function renderReports() {
  const rows = DB.expenses.filter(e=>{
    if(state.reportPer==='הכל') return true;
    if(state.reportPer==='היום') return isToday(e.date);
    if(state.reportPer==='שבוע') return isWeek(e.date);
    if(state.reportPer==='חודש') return isMonth(e.date);
    if(state.reportPer==='מותאם'){const p=parseD(e.date);if(!p)return false;const from=state.reportDateFrom?new Date(state.reportDateFrom):null;const to=state.reportDateTo?new Date(state.reportDateTo):null;return(!from||p>=from)&&(!to||p<=to);}
    return true;
  });
  const total = rows.reduce((s,e)=>s+(+e.total_amount||0),0);
  const totalVat = rows.reduce((s,e)=>s+(+e.vat_amount||0),0);
  const byCat = CATS.map(c=>({name:c,v:rows.filter(e=>e.category===c).reduce((s,e)=>s+(+e.total_amount||0),0)})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  const suppMap = {};
  rows.forEach(e=>{const s=e.supplier||"לא ידוע"; suppMap[s]=(suppMap[s]||0)+(+e.total_amount||0);});
  const bySupp = Object.entries(suppMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxC = byCat[0]?.v||1;
  const maxS = bySupp[0]?.[1]||1;
  const _today = new Date();
  const _fmt = d => d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
  const _fmtS = d => d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  let dateLabel = '';
  if(state.reportPer==='היום') dateLabel = _fmt(_today);
  else if(state.reportPer==='שבוע'){const sun=new Date();sun.setDate(sun.getDate()-sun.getDay());sun.setHours(0,0,0,0);dateLabel=_fmtS(sun)+' — '+_fmt(_today);}
  else if(state.reportPer==='חודש') dateLabel = _today.toLocaleDateString('he-IL',{month:'long',year:'numeric'});

  return `
    <div style="padding:16px 16px 90px" class="fade-up">
      <div style="display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:${state.reportPer==='מותאם'?'8px':'18px'}">
        ${['היום','שבוע','חודש','הכל','מותאם'].map(p=>`<button onclick="setState({reportPer:'${p}'})" style="flex:1;padding:9px 2px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;background:${state.reportPer===p?'linear-gradient(135deg,var(--accent),#6fa83a)':'transparent'};color:${state.reportPer===p?'#0a1505':'var(--textDim)'}">${p}</button>`).join('')}
      </div>
      ${state.reportPer==='מותאם'?`<div style="display:flex;gap:8px;margin-bottom:18px"><div style="flex:1"><div style="font-size:11px;color:var(--textDim);font-weight:600;margin-bottom:4px">מ-</div><input type="date" value="${state.reportDateFrom}" onchange="setState({reportDateFrom:this.value})" style="width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surfaceHi);color:var(--text);font-size:14px;font-family:inherit"></div><div style="flex:1"><div style="font-size:11px;color:var(--textDim);font-weight:600;margin-bottom:4px">עד-</div><input type="date" value="${state.reportDateTo}" onchange="setState({reportDateTo:this.value})" style="width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surfaceHi);color:var(--text);font-size:14px;font-family:inherit"></div></div>`:''}
      ${dateLabel?`<div style="text-align:center;font-size:12px;color:var(--textMuted);margin:-6px 0 14px;letter-spacing:0.02em">${dateLabel}</div>`:''}
      <div style="padding:24px 20px;margin-bottom:14px;border-radius:18px;background:linear-gradient(135deg,var(--surface),var(--surfaceHi));border:1px solid var(--border);position:relative;overflow:hidden">
        <div style="position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(143,198,80,0.13),transparent 70%)"></div>
        <div style="font-size:11px;color:var(--textDim);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;position:relative">סה״כ הוצאות</div>
        <div class="display" style="font-size:38px;color:var(--text);margin-bottom:4px;position:relative">${fmtCurr(total)}</div>
        <div style="font-size:12px;color:var(--textDim);position:relative">${rows.length} רשומות · ${fmtCurr(totalVat)} מע"מ</div>
      </div>
      <div class="row" style="margin-bottom:18px">
        <div style="padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)"><div style="font-size:18px;margin-bottom:6px">💰</div><div style="font-size:10px;color:var(--textDim);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:3px">לפני מע״מ</div><div style="font-size:15px;font-weight:700;color:var(--accent2)">${fmtCurr(total-totalVat)}</div></div>
        <div style="padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)"><div style="font-size:18px;margin-bottom:6px">🧾</div><div style="font-size:10px;color:var(--textDim);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:3px">מע"מ</div><div style="font-size:15px;font-weight:700;color:var(--amber)">${fmtCurr(totalVat)}</div></div>
      </div>
      ${byCat.length>0 ? `
        <div style="padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div style="width:4px;height:18px;background:var(--accent);border-radius:2px"></div><h3 class="display" style="font-size:16px;color:var(--text);margin:0">לפי קטגוריה</h3></div>
          ${byCat.map(c=>{const color = CAT_COLORS[c.name]||'var(--accent)'; return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;color:var(--text);font-weight:500">${c.name}</span><span style="font-size:13px;font-weight:700;color:var(--text)">${fmtCurr(c.v)}</span></div><div style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(c.v/maxC)*100}%;background:linear-gradient(90deg,${color},${color}cc);border-radius:4px"></div></div></div>`;}).join('')}
        </div>` : ''}
      ${bySupp.length>0 ? `
        <div style="padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div style="width:4px;height:18px;background:var(--accent2);border-radius:2px"></div><h3 class="display" style="font-size:16px;color:var(--text);margin:0">ספקים מובילים</h3></div>
          ${bySupp.map(([name,v],i)=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:rgba(212,165,116,0.13);color:var(--accent2);font-size:10px;font-weight:700;text-align:center;line-height:18px;margin-left:6px">${i+1}</span>${esc(name)}</span><span style="font-size:13px;font-weight:700;color:var(--text)">${fmtCurr(v)}</span></div><div style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(v/maxS)*100}%;background:linear-gradient(90deg,var(--accent2),rgba(212,165,116,0.8));border-radius:4px"></div></div></div>`).join('')}
        </div>` : ''}
      ${rows.length===0 ? `<div style="text-align:center;padding:60px 20px;color:var(--textMuted)"><div style="font-size:48px;margin-bottom:10px;opacity:0.4">📉</div><div style="font-size:14px">אין נתונים</div></div>` : ''}
    </div>`;
}

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">

        <input class="input" type="password" id="keyInput" value="${esc(CFG.apiKey)}" placeholder="sk-proj-...">
        <button class="btn-primary" style="margin-top:12px" onclick="saveApiKey()">💾 &nbsp;שמור מפתח</button>
        ${CFG.apiKey ? `<div style="margin-top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(143,198,80,0.07)"><div style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></div><span style="font-size:12px;color:var(--accent);font-family:monospace">${CFG.apiKey.slice(0,7)}···${CFG.apiKey.slice(-4)}</span></div>` : ''}

      <div style="padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-bottom:14px">

        <div class="display" style="font-size:26px;color:var(--text)">${DB.expenses.length} רשומות</div>
        <div style="font-size:12px;color:var(--textDim);margin-top:4px;margin-bottom:14px">${DB.fixed.length} קבועות · ${DB.installments.length} תשלומים · ${PENDING.length} ממתינות לסנכרון</div>

function saveWebApp() {
  const val = document.getElementById('urlInput').value.trim();
  CFG.webAppUrl = val;
  localStorage.setItem('tari_webapp_url', val);
  toast('נשמר', 'success');
  if (val) syncAll();
  else render();
}

async function testConnection() {
  const val = document.getElementById('urlInput').value.trim();
  if (!val) { toast('הדבק כתובת קודם', 'error'); return; }
  CFG.webAppUrl = val;
  try {
    setSyncStatus('syncing');
    await cloudCall('ping', {});
    setSyncStatus('ok');
    toast('✅ החיבור עובד!', 'success');
  } catch(e) {
    setSyncStatus('offline');
    toast('❌ ' + e.message, 'error');
  }
}

async function clearCacheAndReload() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  location.reload(true);
}

function saveApiKey() {
  CFG.apiKey = document.getElementById('keyInput').value.trim();
  localStorage.setItem('tari_apikey_v1', CFG.apiKey);
  toast('המפתח נשמר', 'success');
  render();
}

function exportJSON() {
  const data = { expenses: DB.expenses, fixed: DB.fixed, installments: DB.installments, exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ייצוא הושלם', 'success');
}

function exportCSV() {
  const headers = ['תאריך','ספק','סכום כולל','מע"מ','לפני מע"מ','קטגוריה','סוג מסמך','מספר מסמך','הערות'];
  const rows = DB.expenses.map(e => [
    e.date, e.supplier, e.total_amount, e.vat_amount, e.amount_before_vat,
    e.category, e.document_type, e.document_number, e.notes
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`));
  const csv = '﻿' + [headers.join(','), ...rows.map(r=>r.join(','))].join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tari-bakfar-${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ייצוא CSV הושלם', 'success');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.expenses || !Array.isArray(data.expenses)) throw new Error('קובץ לא תקין');
      if (!confirm(`ייבוא יחליף את הנתונים הקיימים. יש ${data.expenses.length} הוצאות בקובץ. להמשיך?`)) return;
      DB.expenses = data.expenses || [];
      DB.fixed = data.fixed || [];
      DB.installments = data.installments || [];
      persistLocal();
      render();
      toast(`יובאו ${DB.expenses.length} הוצאות`, 'success');
    } catch(err) {
      toast('שגיאת ייבוא: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════
function render() {
  const main = document.getElementById('main');
  let content = '';
  switch(state.tab) {
    case 'scan': content = renderScan(); break;
    case 'list': content = renderList(); break;
    case 'fixed': content = renderFixed(); break;
    case 'installments': content = renderInstallments(); break;
    case 'reports': content = renderReports(); break;
    case 'add': content = renderAdd(); break;
    case 'settings': content = renderSettings(); break;
  }
  main.innerHTML = content;
  document.getElementById('modal-container').innerHTML = state.editId ? renderEditModal() : '';
  renderNav();
  updateHeader();
}

// Initial render + sync
render();
setSyncStatus(CFG.webAppUrl ? 'syncing' : 'local');
if (CFG.webAppUrl) syncAll();

// Re-sync whenever the user returns to the app (tab focus, phone unlock, etc.)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CFG.webAppUrl) syncAll();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
