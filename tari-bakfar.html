      <button onclick="bulkProductsSetActive(true)" style="padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--accent);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">✓ הפעל</button>
      <button onclick="bulkProductsSetActive(false)" style="padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--textDim);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">✗ השבת</button>
      <button onclick="bulkProductsDelete()" style="padding:5px 10px;border:1px solid rgba(217,79,79,0.3);border-radius:8px;background:transparent;color:var(--danger);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">🗑 מחק</button>
    </div>` : `<button onclick="setState({productsModal:'add'})" style="position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:20;padding:14px 28px;border:none;border-radius:50px;background:var(--accent);color:#071302;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-accent);white-space:nowrap">+ הוסף מוצר</button>`;

  return `<div style="padding:14px 14px 120px" class="fade-up">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="position:relative;flex:1">
        <input class="input" id="prod-search-inp" type="search" placeholder="חיפוש מוצר..." value="${esc(state.productsSearch||'')}"
          oninput="setProductsSearch(this.value,'prod-search-inp')" style="padding-right:36px">
        <svg style="position:absolute;top:50%;right:12px;transform:translateY(-50%);pointer-events:none" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--textDim)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <button onclick="toggleProductsSelectMode()" style="padding:8px 12px;border:1.5px solid ${state.productsBulkMode?'var(--accent)':'var(--border)'};border-radius:var(--r-md);background:${state.productsBulkMode?'var(--accentSoft)':'transparent'};color:${state.productsBulkMode?'var(--accent)':'var(--textDim)'};font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0">✓ בחר</button>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:10px">${catChips}</div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px">
      <span style="font-size:10.5px;color:var(--textDim);font-weight:600;letter-spacing:0.04em">מיון:</span>
      ${sortBtn('name','א-ב')}
      ${sortBtn('margin','מרג\'ין')}
      ${sortBtn('recent','עדכני')}
      <span style="margin-right:auto;font-size:11px;color:var(--textMuted)">${allFiltered.length} מוצרים</span>
    </div>
    ${mainList.length===0&&nutsList.length===0 ? `<div style="text-align:center;padding:48px 20px;color:var(--textDim)"><div style="font-size:32px;margin-bottom:10px">🏷️</div><div style="font-size:14px;font-weight:600">אין מוצרים עדיין</div><div style="font-size:12px;margin-top:6px">לחץ "+ הוסף מוצר" להתחיל</div></div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px">
      ${mainList.map(productCard).join('')}
    </div>
    ${nutsList.length>0 ? `<div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 10px;padding:14px 4px 10px;border-top:1px solid var(--border)">🥜 אגוזים ופיצוחים (${nutsList.length})</div><div style="display:flex;flex-direction:column;gap:8px">${nutsList.map(productCard).join('')}</div>` : ''}
    ${bulkBar}
  </div>`;
}

function renderProductDetail() {
  return renderProductLivingProfile();
  const p = pdb.products.find(x => x.id === state.productsDetailId);
  if (!p) return `<div style="padding:20px;color:var(--danger)">מוצר לא נמצא</div>`;
  const m = calcMargin(p);
  const marginColor = m==null?'var(--textDim)':m>=30?'#15803d':m>=15?'#d97706':'#dc2626';
  const cats = getProductCategories();
  const catDl = 'prod-cat-dl-' + p.id;
  const supRows = (p.supplierPrices||[]).map((sp, idx) => {
    const histHtml = (sp.history||[]).slice(-5).reverse().map(h=>`<div style="font-size:10.5px;color:var(--textDim);display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)"><span>${fmtDate(h.date)}</span><span style="color:var(--text);font-weight:600">${fmtCurr(h.price)}</span></div>`).join('');
    return `<div style="background:var(--surfaceHi);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(sp.supplierName||'ספק')}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${sp.buyPrice!=null?`<span style="font-size:13px;font-weight:700;color:var(--accent)">${fmtCurr(sp.buyPrice)}</span>`:'<span style="font-size:12px;color:var(--textMuted)">אין מחיר</span>'}
          <button onclick="document.getElementById('sp-input-${idx}').style.display='flex';this.style.display='none'" style="padding:4px 10px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--textDim);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">עדכן</button>
        </div>
      </div>
      ${sp.updatedAt?`<div style="font-size:10px;color:var(--textMuted);margin-top:3px">עודכן: ${fmtDate(sp.updatedAt)}</div>`:''}
      <div id="sp-input-${idx}" style="display:none;align-items:center;gap:8px;margin-top:8px">
        <input class="input" type="number" inputmode="decimal" placeholder="מחיר חדש" id="sp-val-${idx}" style="flex:1">
        <button onclick="updateSupplierPrice('${p.id}',${idx},document.getElementById('sp-val-${idx}').value)" style="padding:8px 14px;border:none;border-radius:9px;background:var(--accent);color:#071302;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">שמור</button>
      </div>
      ${histHtml?`<details style="margin-top:6px"><summary style="font-size:10.5px;color:var(--textDim);cursor:pointer;list-style:none">◂ היסטוריית מחיר</summary><div style="margin-top:6px">${histHtml}</div></details>`:''}
    </div>`;
  }).join('');

  return `<div style="padding:14px 14px 80px" class="fade-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <button onclick="setState({productsView:'list',productsDetailId:''})" style="width:38px;height:38px;border:none;border-radius:10px;background:var(--surfaceHi);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:18px;font-weight:800;color:var(--text);cursor:pointer" onclick="editProductName('${p.id}')">${esc(p.name||'')}</div>
        <div style="font-size:11px;color:var(--textMuted);margin-top:2px">לחץ לשינוי שם</div>
      </div>
      <button onclick="toggleProductActive('${p.id}')" style="padding:6px 12px;border:1.5px solid ${p.active?'rgba(110,198,58,0.4)':'var(--border)'};border-radius:8px;background:${p.active?'var(--accentSoft)':'var(--surfaceHi)'};color:${p.active?'var(--accent)':'var(--textDim)'};font-size:11px;font-weight:700;font-family:inherit;cursor:pointer">${p.active?'✓ פעיל':'✗ לא פעיל'}</button>
    </div>

    <!-- מחירי מכירה -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">מחירים</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:11px;color:var(--textDim)">מחיר מכירה</div>
          <div style="font-size:28px;font-weight:800;color:var(--text);line-height:1.1;cursor:pointer" onclick="editSellPrice('${p.id}')">${p.sellPrice!=null?fmtCurr(p.sellPrice):'—'}</div>
          <div style="font-size:10px;color:var(--textMuted);margin-top:2px">לחץ לעריכה</div>
        </div>
        ${m!=null?`<div style="text-align:center"><div style="font-size:32px;font-weight:800;color:${marginColor}">${m}%</div><div style="font-size:10px;color:var(--textDim)">מרג'ין</div></div>`:''}
      </div>
      ${m!=null?`<div style="height:6px;border-radius:3px;background:var(--surfaceHi);overflow:hidden"><div style="height:100%;width:${Math.min(m,100)}%;background:${marginColor};border-radius:3px;transition:width 0.3s ease"></div></div>`:''}
    </div>

    <!-- מחיר קניה לפי ספק -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase">מחיר קניה לפי ספק</div>
        <button onclick="setState({productsModal:'add-supplier-price',productsModalData:{productId:'${p.id}'}})" style="font-size:11px;font-weight:700;padding:4px 10px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit">+ ספק</button>
      </div>
      ${supRows || '<div style="font-size:12px;color:var(--textMuted);text-align:center;padding:10px 0">לא הוגדרו ספקים</div>'}
    </div>

    <!-- קטגוריה -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">קטגוריה</div>
      <datalist id="${catDl}">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <input class="input" list="${catDl}" placeholder="קטגוריה (לא חובה)" value="${esc(p.category||'')}"
        onchange="updateProductField('${p.id}','category',this.value)" style="font-size:14px">
    </div>

    <!-- שמות חלופיים -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">שמות חלופיים</div>
      <input class="input" placeholder="שם1, שם2, שם3..." value="${esc((p.aliases||[]).join(', '))}"
        onchange="updateProductField('${p.id}','aliases',this.value.split(',').map(x=>x.trim()).filter(Boolean))" style="font-size:14px">
    </div>

    <!-- Danger zone -->
    <div style="background:var(--dangerSoft);border:1px solid rgba(217,79,79,0.25);border-radius:var(--r-lg);padding:14px">
      <button onclick="deleteProduct('${p.id}')" style="width:100%;padding:11px;border:1.5px solid rgba(217,79,79,0.4);border-radius:var(--r-md);background:transparent;color:var(--danger);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">🗑 מחק מוצר</button>
    </div>
  </div>`;
}

function renderProductLivingProfile() {
  const p = pdb.products.find(x => x.id === state.productsDetailId);
  if (!p) return `<div style="padding:20px;color:var(--danger)">מוצר לא נמצא</div>`;
  normalizeProductCommandData();
  const tab = state.productDetailTab || 'overview';
  const health = productHealth(p);
  const colors = productStatusColor(health.tone);
  const cost = productLastCost(p);
  const margin = productGrossMargin(p);
  const profit = productGrossProfitNis(p);
  const rec = productRecommendedPrice(p);
  const avg7 = productAvgCost(p,7), avg30 = productAvgCost(p,30), avg90 = productAvgCost(p,90);
  const tabs = [
    ['overview','Overview'],['pricing','Pricing'],['costs','Costs'],['inventory','Inventory'],['suppliers','Suppliers'],['history','History'],['insights','Insights']
  ];
  const metric = (label, value, sub, tone) => {
    const c = tone ? productStatusColor(tone)[0] : 'var(--text)';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px"><div style="font-size:10px;color:var(--textDim);font-weight:800">${label}</div><div style="font-size:20px;font-weight:950;color:${c};line-height:1.2;margin-top:3px">${value}</div>${sub?`<div style="font-size:10px;color:var(--textMuted);margin-top:3px">${sub}</div>`:''}</div>`;
  };
  const field = (label, html) => `<label style="display:block;margin-bottom:10px"><span style="display:block;font-size:11px;color:var(--textDim);font-weight:850;margin-bottom:5px">${label}</span>${html}</label>`;
  const input = (fieldName, value, type='text') => `<input class="input" type="${type}" value="${esc(value||'')}" onchange="updateProductField('${p.id}','${fieldName}',this.value)">`;
  const categorySelect = `<select class="input" onchange="updateProductField('${p.id}','category',this.value)"><option value="">בחר קטגוריה מורשית...</option>${getApprovedProductCategories().map(c=>`<option value="${esc(c)}" ${normalizeProductCategoryValue(p.category)===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  const updateChannels = (ch) => `updateProductChannel('${p.id}','${ch}',this.value)`;
  const overview = `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px">
      ${metric('עלות אחרונה', cost?fmtCurr(cost):'--', p.costHistory?.[0]?.supplierName || '', cost?'':'warn')}
      ${metric('מחיר חנות', productChannelPrice(p,'store')?fmtCurr(productChannelPrice(p,'store')):'--', 'מחיר ראשי', productChannelPrice(p,'store')?'':'warn')}
      ${metric('רווח גולמי', margin!=null?Math.round(margin)+'%':'--', profit!=null?fmtCurr(profit):'', margin==null?'warn':margin<0?'critical':margin<(p.pricing?.minMargin||25)?'danger':'healthy')}
      ${metric('מחיר מומלץ', rec?fmtCurr(rec):'--', `יעד ${p.pricing?.targetMargin||40}%`, 'attention')}
    </div>
    <div style="background:${colors[1]};border:1px solid ${colors[0]}33;color:${colors[0]};border-radius:16px;padding:12px;margin-bottom:12px;font-weight:900">${health.label}</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px">
      ${field('שם מוצר', input('name', p.name))}
      ${field('קטגוריה', categorySelect)}
      ${field('תת קטגוריה', input('subCategory', p.subCategory))}
      ${field('יחידה', `<select class="input" onchange="updateProductField('${p.id}','unitType',this.value)">${['kg','unit','box','carton'].map(u=>`<option value="${u}" ${p.unitType===u?'selected':''}>${u}</option>`).join('')}</select>`)}
      ${field('ברקוד', input('barcode', p.barcode))}
      ${field('כינויים למנוע התאמה', `<input class="input" value="${esc((p.aliases||[]).join(', '))}" onchange="updateProductField('${p.id}','aliases',this.value.split(',').map(x=>x.trim()).filter(Boolean))">`)}
    </div>`;
  const pricing = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px">
      ${field('מחיר חנות', `<input class="input" type="number" value="${productChannelPrice(p,'store')||''}" onchange="${updateChannels('store')}">`)}
      ${field('מחיר אתר Shopify', `<input class="input" type="number" value="${productChannelPrice(p,'website')||''}" onchange="${updateChannels('website')}">`)}
      ${field('מחיר Wolt', `<input class="input" type="number" value="${productChannelPrice(p,'wolt')||''}" onchange="${updateChannels('wolt')}">`)}
      ${field('מחיר מבצע', `<input class="input" type="number" value="${productChannelPrice(p,'promo')||''}" onchange="${updateChannels('promo')}">`)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${field('יעד רווח %', `<input class="input" type="number" value="${p.pricing?.targetMargin||40}" onchange="updateProductPricing('${p.id}','targetMargin',this.value)">`)}
        ${field('מינימום רווח %', `<input class="input" type="number" value="${p.pricing?.minMargin||25}" onchange="updateProductPricing('${p.id}','minMargin',this.value)">`)}
      </div>
    </div>
    ${metric('מחיר מומלץ לפי יעד', rec?fmtCurr(rec):'--', 'Cost / (1 - Target Margin)', 'attention')}
    ${rec && productChannelPrice(p,'store') ? metric('פער מהמחיר הנוכחי', fmtCurr(rec - productChannelPrice(p,'store')), 'המלצה בלבד, לא מעדכן אוטומטית', Math.abs(rec-productChannelPrice(p,'store'))>1?'warn':'healthy') : ''}`;
  const costs = `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      ${metric('ממוצע 7 ימים', avg7?fmtCurr(avg7):'--')}
      ${metric('ממוצע 30 ימים', avg30?fmtCurr(avg30):'--')}
      ${metric('ממוצע 90 ימים', avg90?fmtCurr(avg90):'--')}
      ${metric('נמוך/גבוה', `${productLowestCost(p)?fmtCurr(productLowestCost(p)):'--'} / ${productHighestCost(p)?fmtCurr(productHighestCost(p)):'--'}`)}
    </div>
    <button onclick="setState({productsModal:'add-cost-event',productsModalData:{productId:'${p.id}'}})" class="btn-primary">+ הוסף עלות מחשבונית</button>
    ${renderProductCostTimeline(p)}`;
  const inventory = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px">
      ${field('מלאי נוכחי', `<input class="input" type="number" value="${p.inventory?.current||''}" onchange="updateProductInventory('${p.id}','current',this.value)">`)}
      ${field('מלאי מינימום', `<input class="input" type="number" value="${p.inventory?.minimum||''}" onchange="updateProductInventory('${p.id}','minimum',this.value)">`)}
      ${field('מלאי מומלץ', `<input class="input" type="number" value="${p.inventory?.recommended||''}" onchange="updateProductInventory('${p.id}','recommended',this.value)">`)}
      ${metric('ימי מלאי משוערים', estimateProductDaysRemaining(p), 'לפי נתונים ידניים כרגע', 'attention')}
    </div>`;
  const suppliers = `
    <button onclick="setState({productsModal:'add-supplier-price',productsModalData:{productId:'${p.id}'}})" class="btn-primary">+ הוסף/עדכן ספק</button>
    ${(productSupplierStats(p).length ? productSupplierStats(p).map((s,i)=>`<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:9px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.supplier)}</b><b style="color:${i===0?'var(--accent)':'var(--text)'}">${fmtCurr(s.avg)}</b></div><div style="font-size:11px;color:var(--textDim);margin-top:4px">נמוך ${fmtCurr(s.min)} · גבוה ${fmtCurr(s.max)} · ${s.count} רכישות</div></div>`).join('') : '<div style="color:var(--textMuted);padding:20px;text-align:center">אין נתוני ספקים עדיין</div>')}`;
  const history = renderProductCostTimeline(p);
  const insights = `
    ${productAlerts().filter(a=>a.product.id===p.id).map(a=>`<div style="background:var(--surface);border:1px solid ${productStatusColor(a.tone)[0]}33;border-radius:16px;padding:13px;margin-bottom:9px"><b>${esc(a.title)}</b><div style="font-size:12px;color:var(--textDim)">${esc(a.sub)}</div></div>`).join('') || '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;color:var(--textMuted)">אין תובנות חריגות למוצר הזה</div>'}
    ${metric('ספק הכי זול', productSupplierStats(p)[0]?.supplier || '--', productSupplierStats(p)[0]?.avg ? fmtCurr(productSupplierStats(p)[0].avg) : '')}`;
  const body = {overview, pricing, costs, inventory, suppliers, history, insights}[tab] || overview;
  return `<div style="padding:12px 12px 96px" class="fade-up">
    <div style="position:sticky;top:0;z-index:30;background:var(--bg);padding:4px 0 10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <button onclick="setState({productsView:'list',productsDetailId:''})" style="width:42px;height:42px;border:none;border-radius:13px;background:var(--surface);color:var(--text);font-size:22px">‹</button>

function estimateProductDaysRemaining(p) {
  if (!p.inventory || !p.inventory.current) return '--';
  const daily = +(p.inventory.dailySales || 0);
  if (!daily) return 'לא ידוע';
  return Math.max(0, Math.floor(+p.inventory.current / daily));
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function pvTodayISO() { return todayISO(); }
function pvDateInDays(isoDate, days) {
  if (!isoDate) return false;
  const d = new Date(isoDate); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = (d - t) / 86400000;
  return diff >= 0 && diff <= days;
}
function pvIsOverdue(isoDate) {
  if (!isoDate) return false;
  const d = new Date(isoDate); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return d < t;
}
function pvSupplierNorm(name) { return (name||'').trim().toLowerCase(); }

function pvGetOpenDNsForSupplier(supplierName) {
  const norm = pvSupplierNorm(supplierName);
  const linkedIds = new Set(pv.taxInvoices.flatMap(ti => ti.deliveryNoteIds || []));
  return (DB.expenses || []).filter(e =>
    e.document_type === 'תעודת משלוח' &&
    pvSupplierNorm(e.supplier) === norm &&
    !pv.cancelledDNIds.includes(e.id) &&
    !linkedIds.has(e.id)
  );
}

function pvGetAllSuppliers() {
  // Collect from expenses (delivery notes + tax invoices) and existing debts
  const names = new Set();
  (DB.expenses || []).forEach(e => {
    if (e.document_type === 'תעודת משלוח' || e.document_type === 'חשבונית מס') {
      if (e.supplier) names.add(e.supplier.trim());
    }
  });
  pv.debts.forEach(d => { if (d.supplierName) names.add(d.supplierName.trim()); });
  pv.taxInvoices.forEach(ti => { if (ti.supplierName) names.add(ti.supplierName.trim()); });
  return Array.from(names).sort();
}

function pvSupplierStats(supplierName) {
  const norm = pvSupplierNorm(supplierName);
  const debts = pv.debts.filter(d => pvSupplierNorm(d.supplierName) === norm && !['paid','cancelled'].includes(d.status));
  const total = debts.reduce((s,d) => s + (+d.amount||0), 0);
  const paid = debts.reduce((s,d) => s + (+d.paidAmount||0), 0);
  const outstanding = total - paid;
  const openDNs = pvGetOpenDNsForSupplier(supplierName).length;
  let status = 'none';
  if (debts.length > 0) {
    if (debts.some(d => pvIsOverdue(d.dueDate) && !['paid','cancelled'].includes(d.status))) status = 'overdue';
    else if (debts.some(d => pvDateInDays(d.dueDate, 7) && !['paid','cancelled'].includes(d.status))) status = 'soon';
    else status = 'ok';
  }
  return { outstanding, openDNs, status, debtCount: debts.length };
}

function pvStatusBadge(status) {
  if (status === 'overdue') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--dangerSoft);color:var(--danger)">מאחר</span>`;
  if (status === 'soon') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--amberSoft);color:var(--amber)">השבוע</span>`;
  if (status === 'ok') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--accentSoft);color:var(--accent)">בסדר</span>`;
  return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surfaceHi);color:var(--textDim)">אין חוב</span>`;
}

function pvDebtStatusBadge(debt) {
  const s = debt.status || 'open';
  if (s === 'paid') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--accentSoft);color:var(--accent)">שולם</span>`;
  if (s === 'partial') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--amberSoft);color:var(--amber)">חלקי</span>`;
  if (s === 'cancelled') return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surfaceHi);color:var(--textDim)">בוטל</span>`;
  if (pvIsOverdue(debt.dueDate)) return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--dangerSoft);color:var(--danger)">מאחר</span>`;
  if (pvDateInDays(debt.dueDate, 7)) return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--amberSoft);color:var(--amber)">השבוע</span>`;
  return `<span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--infoSoft);color:var(--info)">פתוח</span>`;
}

function pvUpdateDebtStatus(debt) {
  const paid = +debt.paidAmount || 0;
  const total = +debt.amount || 0;
  if (paid >= total && total > 0) debt.status = 'paid';
  else if (paid > 0) debt.status = 'partial';
  else if (!debt.status || debt.status === 'paid' || debt.status === 'partial') debt.status = 'open';
}

function pvPickInvoiceImage(source) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (source === 'camera') inp.capture = 'environment';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = () => {
    pvHandleInvoiceImage(inp.files && inp.files[0]);
    document.body.removeChild(inp);
  };
  inp.click();
}

function pvHandleInvoiceImage(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        const r = Math.min(max / w, max / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.payablesModalData = state.payablesModalData || {};
      state.payablesModalData.invoiceImage = canvas.toDataURL('image/jpeg', 0.74);
      render();
      toast('צילום נשמר ✓', 'success');
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

function pvActionLabel(method) {
  return 'לא שולם';
}
function pvActionStatus(method) {
  return 'שולם';
}
function pvIsOpenStatus(s) {
  return !s || !['נפרע','שולם','בוטל'].includes(s);
}
function pvSetPaymentStatus(debtId, newStatus) {
  const debt = pv.debts.find(d => d.id === debtId);
  if (!debt) return;
  debt.paymentStatus = newStatus;
  if (newStatus === 'שולם' || newStatus === 'נפרע') {
    debt.status = 'paid';
    debt.paidAmount = debt.amount;
    debt.paidDate = pvTodayISO();
    debt.closedAt = Date.now();
    if (!debt.payments) debt.payments = [];
    const totalPaid = debt.payments.reduce((s,p)=>s+(+p.amount||0),0);
    if (totalPaid < (+debt.amount||0)) {
      debt.payments.push({
        id:uid(),
        amount:(+debt.amount||0)-totalPaid,
        date:debt.paidDate,
        method:debt.paymentMethod||'',
        reference:debt.checkNumber||'',
        notes:newStatus,
        finalStatus:newStatus,
        createdAt:Date.now()
      });
    }
  } else if (newStatus === 'בוטל') {
    debt.status = 'cancelled';
    debt.closedAt = Date.now();
  }
  pvSyncSupplierInvoiceFromDebt(debt, 'payment-status');
  savePv(true);
  setState({});
  toast(newStatus==='שולם'?'✅ סומן כשולם':'סטטוס עודכן', 'success');
}
function pvNextStatus(debt) {
  const cur = debt.paymentStatus || 'ממתין';
  const method = debt.paymentMethod || '';
  if (pvIsCheckMethod(method)) {
    const checkFlow = ['ממתין','נמסר','ממתין לפירעון','נפרע'];
    const idx = checkFlow.indexOf(cur);
    return idx >= 0 && idx < checkFlow.length-1 ? checkFlow[idx+1] : null;
  } else {
    return cur === 'ממתין' ? 'שולם' : null;
  }
}
function pvMigratePaymentStatuses() {
  (pv.debts||[]).forEach(d => {
    if (!d.paymentStatus) {
      if (d.status === 'paid') d.paymentStatus = 'שולם';
      else if (d.status === 'cancelled') d.paymentStatus = 'בוטל';
      else if (pvIsCheckMethod(d.paymentMethod)) d.paymentStatus = 'ממתין לפירעון';
      else d.paymentStatus = 'ממתין';
    }
  });
}

function pvReopenMistakenPaidCommitments() {
  if (pv._reopenedMistakenPaidCommitmentsV1) return;
  let changed = false;
  const reopenedChecks = [];

  (pv.debts||[]).forEach(d => {
    if (d.status === 'cancelled' || d.paymentStatus === 'בוטל') return;
    if (d.status === 'paid' || !pvIsOpenStatus(d.paymentStatus)) {
      const lastPaymentDate = pvDateISO(d.paidDate || (d.payments||[]).slice(-1)[0]?.date || '');
      if (lastPaymentDate && !pvDateISO(d.dueDate)) d.dueDate = lastPaymentDate;
      d.status = 'open';
      d.paymentStatus = pvIsCheckMethod(d.paymentMethod) ? 'ממתין לפירעון' : 'ממתין';
      d.paidAmount = 0;
      d.payments = [];
      delete d.paidDate;
      delete d.closedAt;
      changed = true;
    }
  });

  (DB.checks||[]).forEach(c => {
    if (!c.cleared) return;
    c.cleared = false;
    delete c.clearedDate;
    reopenedChecks.push(c);
    changed = true;
  });

  pv._reopenedMistakenPaidCommitmentsV1 = true;
  if (reopenedChecks.length) {
    reopenedChecks.forEach(c => {
      PENDING.push({action:'delete_check', payload:{id:c.id}});
      PENDING.push({action:'add_check', payload:{payload:c}});
    });
    localStorage.setItem('tari_pending_v1', JSON.stringify(PENDING));
  }
  if (changed) {
    savePv(true);
    persistLocal();
  } else {
    savePv(false);
  }
}

function pvDateISO(dateValue) {
  if (!dateValue) return '';
  const s = String(dateValue).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const parts = s.split(/[\/\.]/);
  if (parts.length === 3) {
    const dd = parts[0].padStart(2,'0');
    const mm = parts[1].padStart(2,'0');
    const yyyy = parts[2].length === 2 ? '20' + parts[2] : parts[2];
    if (/^\d{4}$/.test(yyyy) && /^\d{2}$/.test(mm) && /^\d{2}$/.test(dd)) return `${yyyy}-${mm}-${dd}`;
  }
  const parsed = parseD(s);
  return parsed && !isNaN(parsed) ? toISO(parsed) : '';
}

function renderPayablesDashboard() {
  const today = pvTodayISO();
  if (!DB.checks) DB.checks = [];
  pvMigratePaymentStatuses();
  pvReopenMistakenPaidCommitments();
  const activeDebts = pv.debts.filter(d => !['paid','cancelled'].includes(d.status) && pvIsOpenStatus(d.paymentStatus));
  const openChecks  = DB.checks.filter(c => !c.cleared);
  const linkedOpenDebtIds = new Set(openChecks.map(c => c.linkedDebtId).filter(Boolean));

  // ── 1. Compute summary numbers ──────────────────────────────────────────
  function addDaysISO(n) {
    const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);
  }
  const d30 = addDaysISO(30), d60 = addDaysISO(60), d90 = addDaysISO(90);

  let tot30=0, tot60=0, tot90=0, totOverdue=0, totAll=0;
  activeDebts.forEach(d => {
    if (linkedOpenDebtIds.has(d.id)) return;
    const rem = (+d.amount||0)-(+d.paidAmount||0);
    totAll += rem;
    if (pvIsOverdue(d.dueDate)) totOverdue += rem;
    if (d.dueDate && d.dueDate >= today && d.dueDate <= d30) tot30 += rem;
    if (d.dueDate && d.dueDate >= today && d.dueDate <= d60) tot60 += rem;
    if (d.dueDate && d.dueDate >= today && d.dueDate <= d90) tot90 += rem;
  });
  openChecks.forEach(c => {
    const amt = +c.amount||0;
    const clearISO = pvDateISO(c.clearDate);
    if (clearISO >= today && clearISO <= d30) tot30 += amt;
    if (clearISO >= today && clearISO <= d60) tot60 += amt;
    if (clearISO >= today && clearISO <= d90) tot90 += amt;
  });

  const allLinkedIds = new Set(pv.taxInvoices.flatMap(ti=>ti.deliveryNoteIds||[]));
  const openDNCount = (DB.expenses||[]).filter(e =>
    e.document_type==='תעודת משלוח' && !pv.cancelledDNIds.includes(e.id) && !allLinkedIds.has(e.id)
  ).length;
  const overdueChecksCount = openChecks.filter(c=>checkUrgency(c.clearDate)==='overdue').length;

  // ── 2. Summary header ───────────────────────────────────────────────────
  function chip(label, val, color, onClick) {
    return `<div onclick="${onClick||''}" style="flex-shrink:0;min-width:72px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border);text-align:center;cursor:${onClick?'pointer':'default'}">
      <div style="font-size:9px;color:var(--textDim);font-weight:600;letter-spacing:.04em;margin-bottom:2px;white-space:nowrap">${label}</div>
      <div class="display" style="font-size:14px;font-weight:700;color:${color};white-space:nowrap">${val}</div>
    </div>`;
  }
  const summaryHtml = `
    <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch">
      ${chip('30 יום',fmtCurr(tot30),tot30>0?'var(--text)':'var(--textMuted)')}
      ${chip('60 יום',fmtCurr(tot60),tot60>0?'var(--text)':'var(--textMuted)')}
      ${chip('90 יום',fmtCurr(tot90),tot90>0?'var(--text)':'var(--textMuted)')}
      ${chip('סה"כ חוב',fmtCurr(totAll),'var(--text)')}
      ${overdueChecksCount>0?chip('צ\'קים פג',String(overdueChecksCount),'var(--danger)',`setState({payablesView:'reconcile'})`): ''}
      ${openDNCount>0?chip('ת"מ פתוחות',String(openDNCount),'var(--blue)',`setState({payablesView:'reconcile'})`): ''}
    </div>`;

  // ── 3. Overdue alert ────────────────────────────────────────────────────
  const overdueItems = activeDebts.filter(d=>!linkedOpenDebtIds.has(d.id) && pvIsOverdue(d.dueDate));
  const overdueAmt = overdueItems.reduce((s,d)=>(s+(+d.amount||0)-(+d.paidAmount||0)),0);
  const overdueAlert = (overdueItems.length > 0 || overdueChecksCount > 0) ? `
    <div onclick="setState({payablesView:'reconcile'})" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:rgba(220,98,98,0.08);border:1px solid rgba(220,98,98,0.35);margin-bottom:12px;cursor:pointer">
      <span style="font-size:20px">🔴</span>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--danger)">${overdueItems.length} חובות באיחור${overdueChecksCount>0?` · ${overdueChecksCount} צ'קים פגו פירעון`:''}</div>
        <div style="font-size:11px;color:var(--textDim)">${fmtCurr(overdueAmt)} · לחץ לטיפול</div>
      </div>
      <span style="color:var(--danger)">›</span>
    </div>` : '';

  // Accounting alert
  const notPassed = pv.debts.filter(d=>!d.accountingPassed&&!['cancelled','paid'].includes(d.status));
  const accountingAlert = notPassed.length>0 ? `
    <div onclick="setState({payablesView:'reconcile'})" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(244,185,66,0.07);border:1px solid rgba(244,185,66,0.3);margin-bottom:12px;cursor:pointer">
      <span style="font-size:18px">📋</span>
      <div style="flex:1;font-size:12px;font-weight:700;color:var(--amber)">${notPassed.length} חשבוניות טרם עברו להנה"ח</div>
      <span style="color:var(--amber)">›</span>
    </div>` : '';

  // ── 4. Payment timeline ─────────────────────────────────────────────────
  const pf = state.pvPaymentFilter || 'הכל';

  const payments = [];
  activeDebts.forEach(d => {
    if (!pvIsOpenStatus(d.paymentStatus)) return;
    if (linkedOpenDebtIds.has(d.id)) return;
    const dateToUse = pvDateISO(d.dueDate);
    payments.push({
      date: dateToUse,
      supplier: d.supplierName || '',
      amount: (+d.amount||0)-(+d.paidAmount||0),
      method: d.paymentMethod || '',
      checkNumber: d.checkNumber || '',
      paymentStatus: d.paymentStatus || 'ממתין',
      debtId: d.id,
      invoiceNumber: d.invoiceNumber || '',
      isOverdue: dateToUse ? dateToUse < today : false,
    });
  });

  openChecks.forEach(c => {
    payments.push({
      date: pvDateISO(c.clearDate),
      supplier: c.supplier || '',
      amount: +c.amount || 0,
      method: "צ'ק",
      checkNumber: c.checkNum || '',
      paymentStatus: 'ממתין לפירעון',
      checkId: c.id,
      isOverdue: pvDateISO(c.clearDate) ? pvDateISO(c.clearDate) < today : false,
    });
  });

  // Apply filter
  let filteredPayments = payments;
  if (pf === "צ'קים") filteredPayments = payments.filter(p => pvIsCheckMethod(p.method) || p.checkId || p.checkNumber || String(p.paymentStatus||'').includes('פירעון'));
  else if (pf === 'העברות') filteredPayments = payments.filter(p => p.method.includes('העברה'));
  else if (pf === 'מזומן') filteredPayments = payments.filter(p => p.method.includes('מזומן'));
  else if (pf === 'אשראי') filteredPayments = payments.filter(p => p.method.includes('אשראי'));
  else if (pf === 'אחר') filteredPayments = payments.filter(p => p.method.includes('אחר'));
  else if (pf === 'באיחור') filteredPayments = payments.filter(p => p.isOverdue || (p.date && p.date < today));
  else if (pf === 'השבוע') filteredPayments = payments.filter(p => p.date && p.date >= today && pvDateInDays(p.date,7));
  else if (pf === 'החודש') filteredPayments = payments.filter(p => p.date && p.date >= today && pvDateInDays(p.date,30));

  // Sort: no-date items last, overdue first, then future asc
  const noDate = filteredPayments.filter(p => !p.date);
  const withDate = filteredPayments.filter(p => p.date);
  const overdueP = withDate.filter(p=>p.date<today).sort((a,b)=>b.date.localeCompare(a.date));
  const futureP  = withDate.filter(p=>p.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  const sortedPayments = [...overdueP, ...futureP, ...noDate];

  // ── Filter bar ──────────────────────────────────────────────────────────
  const filterOptions = ['הכל',"צ'קים",'העברות','מזומן','אשראי','אחר','באיחור','השבוע','החודש'];
  const filterBar = `
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none">
      ${filterOptions.map(f=>`
        <button onclick="setState({pvPaymentFilter:'${f}'})"
          style="flex-shrink:0;padding:5px 11px;border-radius:20px;border:none;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;
            background:${pf===f?'var(--accent)':'var(--surface)'};
            color:${pf===f?'#071302':'var(--textDim)'};
            outline:1px solid ${pf===f?'transparent':'var(--border)'}">
          ${f}
        </button>`).join('')}
    </div>`;

  // ── Group by date + render ──────────────────────────────────────────────
  const byDate = new Map();
  const undatedItems = [];
  sortedPayments.forEach(p => {
    if (!p.date) { undatedItems.push(p); return; }
    if (!byDate.has(p.date)) byDate.set(p.date, []);
    byDate.get(p.date).push(p);
  });

  let timelineRows = '';
  let prevWeek = -999;
  let weekNum = 0;
  let weekTotal = 0;
  const baseDate = new Date(today);

  [...byDate.entries()].forEach(([date, items], idx) => {
    const dayTotal = items.reduce((s,p)=>s+p.amount, 0);
    const isOverdueGroup = date < today;
    // Red = overdue, Green = future
    const borderColor = isOverdueGroup ? 'rgba(220,98,98,0.3)' : 'rgba(143,198,80,0.25)';
    const bgTint     = isOverdueGroup ? 'rgba(220,98,98,0.04)' : 'rgba(143,198,80,0.03)';
    const dateColor  = isOverdueGroup ? 'var(--danger)' : 'var(--accent)';

    if (!isOverdueGroup) {
      const d = new Date(date);
      const wk = Math.floor((d - baseDate) / (7*86400000));
      if (wk !== prevWeek) {
        if (idx > 0 && weekTotal > 0) {
          timelineRows += `<div style="display:flex;align-items:center;gap:8px;margin:12px 0 8px">
            <div style="flex:1;height:1px;background:var(--border)"></div>
            <span style="font-size:10px;font-weight:700;color:var(--textDim);white-space:nowrap">שבוע ${weekNum} · ${fmtCurr(weekTotal)}</span>
            <div style="flex:1;height:1px;background:var(--border)"></div>
          </div>`;
        }
        weekNum++; weekTotal = 0; prevWeek = wk;
      }
    }
    weekTotal += dayTotal;

    timelineRows += `<div style="border-radius:13px;border:1px solid ${borderColor};background:${bgTint};margin-bottom:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surfaceHi)">
        <div style="font-size:13px;font-weight:800;color:${dateColor}">${isOverdueGroup?'🔴 ':'🟢 '} ${fmtDate(date)}</div>
        <div class="display" style="font-size:14px;font-weight:700;color:${dateColor}">${fmtCurr(dayTotal)}</div>
      </div>`;

    items.forEach(p => {
      const onclick = p.debtId
        ? `setState({payablesView:'debt',payablesDebtId:'${p.debtId}'})`
        : `pvOpenEditCheck('${p.checkId}')`;

      const openLbl = pvOpenLabel(p.method);
      const itemOverdue = p.date && p.date < today;
      const itemColor = itemOverdue ? 'var(--danger)' : 'var(--accent)';
      const itemBg = itemOverdue ? 'rgba(220,98,98,0.08)' : 'rgba(143,198,80,0.08)';
      const itemBorder = itemOverdue ? 'rgba(220,98,98,0.28)' : 'rgba(143,198,80,0.28)';
      // Use encoded IDs to avoid onclick breakage with special chars
      const safeId = encodeURIComponent(p.debtId || p.checkId || '');
      const pendingType = p.debtId ? 'debt' : 'check';

      timelineRows += `
        <div onclick="${onclick}" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid ${itemBorder};background:${itemBg};cursor:pointer">
          <div style="font-size:22px;flex-shrink:0">${pvGetMethodIcon(p.method)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.supplier)}</div>
            <div style="font-size:11px;color:${itemColor};font-weight:700;margin-top:2px">${openLbl}${p.date?` · ${fmtDate(p.date)}`:''}${p.checkNumber?` · מס' ${esc(p.checkNumber)}`:''}${p.invoiceNumber?` · #${esc(p.invoiceNumber)}`:''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
            <div class="display" style="font-size:15px;font-weight:700;color:${itemColor}">${fmtCurr(p.amount)}</div>
            <button type="button" onclick="event.preventDefault();event.stopPropagation();pvOpenConfirm(decodeURIComponent('${safeId}'),'${pendingType}')"
              style="padding:4px 10px;border:1px solid ${itemBorder};border-radius:999px;background:var(--surface);color:${itemColor};font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap">
              ${pvActionLabel(p.method)}
            </button>
          </div>
        </div>`;
    });
    timelineRows += '</div>';
  });

  if (weekTotal > 0 && weekNum > 0 && byDate.size > 0) {
    timelineRows += `<div style="display:flex;align-items:center;gap:8px;margin:12px 0 8px">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:10px;font-weight:700;color:var(--textDim);white-space:nowrap">שבוע ${weekNum} · ${fmtCurr(weekTotal)}</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>`;
  }

  const undatedHtml = undatedItems.length > 0 ? `
    <div style="padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--border);margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:var(--textDim);margin-bottom:8px">📋 ללא תאריך (${undatedItems.length})</div>
      ${undatedItems.map(p=>`
        <div onclick="${p.debtId?`setState({payablesView:'debt',payablesDebtId:'${p.debtId}'})`:''}" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer">
          <span style="font-size:18px">${pvGetMethodIcon(p.method)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(p.supplier)}</div>
            <div style="font-size:11px;color:var(--accent);font-weight:700;margin-top:2px">${pvOpenLabel(p.method)}${p.checkNumber?` · מס' ${esc(p.checkNumber)}`:''}${p.invoiceNumber?` · #${esc(p.invoiceNumber)}`:''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
            <div class="display" style="font-size:14px;font-weight:700;color:var(--accent)">${fmtCurr(p.amount)}</div>
            <button type="button" onclick="event.preventDefault();event.stopPropagation();pvOpenConfirm(decodeURIComponent('${encodeURIComponent(p.debtId || p.checkId || '')}'),'${p.debtId?'debt':'check'}')"
              style="padding:4px 10px;border:1px solid rgba(143,198,80,0.28);border-radius:999px;background:var(--surface);color:var(--accent);font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap">
              ${pvActionLabel(p.method)}
            </button>
          </div>
        </div>`).join('')}
    </div>` : '';

  const noItems = sortedPayments.length === 0;
  const timelineHtml = `
    <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <span>📅 התחייבויות פתוחות</span>
      <div style="display:flex;gap:5px">
        <button onclick="setState({payablesView:'supplierBook'})" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--textDim);font-family:inherit;cursor:pointer">📒</button>
      </div>
    </div>
    ${filterBar}
    ${noItems
      ? `<div style="text-align:center;padding:28px 16px;color:var(--textMuted)"><div style="font-size:28px;margin-bottom:6px">✅</div><div style="font-size:13px;font-weight:600">אין התחייבויות פתוחות${pf!=='הכל'?' בפילטר הנוכחי':''}</div></div>`
      : timelineRows + undatedHtml}`;

  // ── 5. FAB ───────────────────────────────────────────────────────────────
  const fabItems = [
    {icon:'📦', label:'תעודת משלוח'},
    {icon:'🧾', label:'חשבונית'},
    {icon:'💳', label:'תשלום'},
    {icon:'📝', label:"צ'ק"},
    {icon:'📒', label:'ספר ספקים', action:`setState({pvFabOpen:false,payablesView:'supplierBook'})`},
    {icon:'🏢', label:'ספק חדש', action:`pvOpenDirectDebt('')`},
  ];
  const fabHtml = `
    ${state.pvFabOpen ? `
      <div onclick="pvCloseFab()" style="position:fixed;inset:0;z-index:29"></div>
      <div style="position:fixed;bottom:calc(146px + env(safe-area-inset-bottom,0px));left:16px;z-index:30;display:flex;flex-direction:column-reverse;gap:8px">
        ${fabItems.map(it=>`
          <button onclick="${it.action||`pvQuickAddDoc('${it.label}')`}"
            style="display:flex;align-items:center;gap:10px;padding:9px 16px;border:none;border-radius:24px;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);white-space:nowrap">
            <span style="font-size:16px">${it.icon}</span>${it.label}
          </button>`).join('')}
      </div>` : ''}
    <button onclick="pvToggleFab()"
      style="position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:16px;z-index:30;width:52px;height:52px;border:none;border-radius:50%;background:var(--accent);color:#071302;font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(143,198,80,0.5);display:flex;align-items:center;justify-content:center;transition:transform 0.2s;transform:rotate(${state.pvFabOpen?'45':'0'}deg)">+</button>`;

  return `<div style="padding:14px 14px 140px" class="fade-up" onclick="${state.pvFabOpen?'pvCloseFab()':''}">
    ${accountingAlert}
    ${overdueAlert}
    ${summaryHtml}
    ${timelineHtml}
    ${renderPaidPaymentsSection()}
    ${fabHtml}
  </div>`;
}

function renderPayablesSupplierBook() {
  const suppliers = pvGetAllSuppliers();
  const q = (state.payablesSearch||'').trim().toLowerCase();
  const filtered = q ? suppliers.filter(s=>s.toLowerCase().includes(q)) : suppliers;
  const stats = filtered.map(s=>({name:s,...pvSupplierStats(s)})).sort((a,b)=>b.outstanding-a.outstanding);

  const rows = stats.length ? stats.map(s => {
    const dotColor = s.status==='overdue'?'var(--danger)':s.status==='soon'?'var(--amber)':s.outstanding>0?'var(--accent)':'var(--textMuted)';
    return `<div onclick="setState({payablesView:'supplier',payablesSupplier:decodeURIComponent('${encodeURIComponent(s.name)}')})"
      style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);cursor:pointer;margin-bottom:7px">
      <div style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
        <div style="font-size:11px;color:var(--textDim);margin-top:2px">${s.openDNs>0?`${s.openDNs} ת"מ · `:''}${s.debtCount} חובות · ${pvStatusBadge(s.status)}</div>
      </div>
      <div style="flex-shrink:0;text-align:left">
        <div class="display" style="font-size:14px;font-weight:700;color:${s.outstanding>0?dotColor:'var(--textMuted)'}">${s.outstanding>0?fmtCurr(s.outstanding):'—'}</div>
      </div>
      <div style="color:var(--textMuted)">›</div>
    </div>`;
  }).join('') : `<div style="text-align:center;padding:30px;color:var(--textMuted);font-size:13px">אין ספקים</div>`;

  return `<div style="padding:14px 14px 100px" class="fade-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <button onclick="setState({payablesView:'dashboard'})" style="width:36px;height:36px;border:none;border-radius:10px;background:var(--surfaceHi);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">‹</button>
      <h2 class="display" style="font-size:18px;margin:0;flex:1">📒 ספר ספקים</h2>
    </div>
    <div style="position:relative;margin-bottom:12px">
      <input type="search" placeholder="🔍 חיפוש ספק..." value="${esc(state.payablesSearch||'')}"
        oninput="pvSearchInput(this.value)"
        style="width:100%;padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:14px;font-family:inherit;outline:none;box-sizing:border-box">
    </div>
    <div id="pv-supplier-list">${rows}</div>
  </div>`;
}

function pvBuildSupplierListHtml(q) {
  let suppliers = pvGetAllSuppliers();
  if (q) suppliers = suppliers.filter(s => s.toLowerCase().includes(q.toLowerCase()));
  const sorted = suppliers.map(s => ({ name: s, ...pvSupplierStats(s) }))
    .sort((a,b) => b.outstanding - a.outstanding);
  if (!sorted.length) return `<div style="text-align:center;padding:20px;color:var(--textMuted);font-size:13px">לא נמצאו ספקים</div>`;
  return sorted.map(s => `
    <div onclick="setState({payablesView:'supplier',payablesSupplier:decodeURIComponent('${encodeURIComponent(s.name)}')})" style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;background:var(--surface);border:1px solid var(--border);cursor:pointer;margin-bottom:8px">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px">${esc(s.name)}</div>
        <div style="font-size:12px;color:var(--textDim)">${s.openDNs > 0 ? `${s.openDNs} ת"מ פתוחות · ` : ''}${s.debtCount} חובות</div>
      </div>
      <div style="text-align:left">
        <div class="display" style="font-size:16px;font-weight:700;color:${s.outstanding>0?'var(--danger)':'var(--textDim)'}">${fmtCurr(s.outstanding)}</div>
        <div style="margin-top:3px;text-align:left">${pvStatusBadge(s.status)}</div>
      </div>
      <div style="color:var(--textMuted);font-size:18px">›</div>
    </div>`).join('');
}

function pvSearchInput(val) {
  state.payablesSearch = val;
  const el = document.getElementById('pv-supplier-list');
  if (el) el.innerHTML = pvBuildSupplierListHtml(val);
}

function _renderPayablesSupplierInner() {
  const sup = state.payablesSupplier;
  const norm = pvSupplierNorm(sup);
  const profile = getOrCreateSupplierProfile(sup);

    { id: 'summary', label: 'סיכום' },

    <div style="display:flex;gap:4px;margin-bottom:16px;background:var(--surfaceHi);border-radius:12px;padding:4px">
      ${tabs.map(t => `<button onclick="setState({payablesSupplierTab:'${t.id}'})"
        style="flex:1;padding:7px 4px;border:none;border-radius:9px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.12s;
          background:${activeTab===t.id?'var(--surface)':'transparent'};
          color:${activeTab===t.id?'var(--accent)':'var(--textDim)'};
          box-shadow:${activeTab===t.id?'var(--shadow-sm)':'none'}">${t.label}</button>`).join('')}
    </div>`;

  // ── TAB: סיכום ──
  let tabContent = '';
  if (activeTab === 'summary') {
    const debts = pv.debts.filter(d => pvSupplierNorm(d.supplierName) === norm && !['paid','cancelled'].includes(d.status));
    const openDebt = debts.reduce((s,d) => s + Math.max(0, (+d.amount||0)-(+d.paidAmount||0)), 0);
    // Stats
    const now = new Date();
    const monthExpenses = (DB.expenses||[]).filter(e => pvSupplierNorm(e.supplier)===norm && isMonth(e.date)).reduce((s,e)=>s+(+e.total_amount||0),0);
    const yearExpenses  = (DB.expenses||[]).filter(e => pvSupplierNorm(e.supplier)===norm && isYear(e.date)).reduce((s,e)=>s+(+e.total_amount||0),0);
    const openDebtsForDue = debts.filter(d => d.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const nextDue = openDebtsForDue.length ? fmtDate(openDebtsForDue[0].dueDate) : '—';

    tabContent = `

        <div class="display" style="font-size:30px;color:${openDebt>0?'var(--danger)':'var(--accent)'};font-weight:700">${fmtCurr(openDebt)}</div>
        <div style="font-size:11px;color:var(--textDim);margin-top:4px">${debts.length} חובות פעילים</div>
      </div>
      <!-- Stats row -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div style="padding:11px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);text-align:center">
          <div style="font-size:9.5px;color:var(--textDim);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px">החודש</div>
          <div class="display" style="font-size:14px;color:var(--text);font-weight:700">${fmtCurr(monthExpenses)}</div>
        </div>
        <div style="padding:11px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);text-align:center">
          <div style="font-size:9.5px;color:var(--textDim);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px">השנה</div>
          <div class="display" style="font-size:14px;color:var(--text);font-weight:700">${fmtCurr(yearExpenses)}</div>
        </div>
        <div style="padding:11px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);text-align:center">
          <div style="font-size:9.5px;color:var(--textDim);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px">תשלום הבא</div>
          <div style="font-size:12px;color:var(--amber);font-weight:700;line-height:1.2">${nextDue}${nextDueAmt?'<br>'+nextDueAmt:''}</div>
        </div>
      </div>
      <!-- Profile fields -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">פרטי ספק</div>
        <div style="margin-bottom:10px">
          <div style="font-size:10px;color:var(--textDim);font-weight:600;margin-bottom:4px">תנאי תשלום</div>
          <input class="input" style="font-size:13px;padding:8px 12px" placeholder="שוטף+30, 60 יום, מזומן..." value="${esc(profile.paymentTerms||'')}"
            onchange="saveSupplierProfileField('${esc(sup).replace(/'/g,'&apos;')}','paymentTerms',this.value);toast('נשמר ✓','success')">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div>
            <div style="font-size:10px;color:var(--textDim);font-weight:600;margin-bottom:4px">איש קשר</div>
            <input class="input" style="font-size:13px;padding:8px 12px" placeholder="שם" value="${esc(profile.contactPerson||'')}"
              onchange="saveSupplierProfileField('${esc(sup).replace(/'/g,'&apos;')}','contactPerson',this.value)">
          </div>
          <div>
            <div style="font-size:10px;color:var(--textDim);font-weight:600;margin-bottom:4px">טלפון</div>
            <input class="input" style="font-size:13px;padding:8px 12px" type="tel" placeholder="050-..." value="${esc(profile.contactPhone||'')}"
              onchange="saveSupplierProfileField('${esc(sup).replace(/'/g,'&apos;')}','contactPhone',this.value)">
          </div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--textDim);font-weight:600;margin-bottom:4px">הערות</div>
          <input class="input" style="font-size:13px;padding:8px 12px" placeholder="הערות..." value="${esc(profile.notes||'')}"
            onchange="saveSupplierProfileField('${esc(sup).replace(/'/g,'&apos;')}','notes',this.value)">
        </div>
      </div>
      <!-- Quick actions -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <button onclick="setState({payablesModal:'add-direct',payablesModalData:{supplier:decodeURIComponent('${encodeURIComponent(sup)}')}})" style="padding:10px 4px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.4">🧾 + ת"מ</button>
        <button onclick="setState({tab:'scan',scanStage:'idle'})" style="padding:10px 4px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.4">📄 + חשבונית</button>
        <button onclick="pvOpenDirectDebt(decodeURIComponent('${encodeURIComponent(sup)}'))" style="padding:10px 4px;border:1.5px solid var(--accentSoft);border-radius:12px;background:var(--accentSoft);color:var(--accent);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.4">💳 + תשלום</button>
      </div>`;
  }

  // ── TAB: תעודות משלוח ──
  if (activeTab === 'dns') {
    const linkedIds = new Set(pv.taxInvoices.flatMap(ti => ti.deliveryNoteIds || []));
    const allDNs = (DB.expenses||[]).filter(e =>
      e.document_type === 'תעודת משלוח' && pvSupplierNorm(e.supplier) === norm
    ).sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
    const dnTotal = allDNs.reduce((s,e)=>s+(+e.total_amount||0),0);

    const getDNStatus = e => {
      if (pv.cancelledDNIds.includes(e.id)) return { label: 'בוטלה', color: 'var(--textDim)', bg: 'var(--surfaceHi)' };
      if (linkedIds.has(e.id)) return { label: 'שויכה', color: 'var(--info)', bg: 'var(--infoSoft)' };
      return { label: 'פתוחה', color: 'var(--amber)', bg: 'var(--amberSoft)' };
    };

    const dnsHtml = allDNs.length === 0
      ? `<div style="text-align:center;padding:20px;color:var(--textMuted);font-size:13px">אין תעודות משלוח</div>`
      : allDNs.map(e => {
          const st = getDNStatus(e);
          const isOpen = st.label === 'פתוחה';
          const linkedOrder = e.linkedOrderId ? (odb.activeOrders||[]).find(o => o.id === e.linkedOrderId) : null;
          return `<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text)">${fmtDate(e.date)} · ${esc(e.document_number||'ללא מספר')}</div>
              <div style="font-size:11px;color:var(--textDim)">${fmtCurr(e.total_amount)}${linkedOrder?' · קשורה להזמנה':''}</div>
            </div>
            <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:${st.bg};color:${st.color}">${st.label}</span>
            <button onclick="ordersOpenLinkOrderForDN('${e.id}')" style="font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--textDim);cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap">🔗</button>
            ${isOpen ? `<button onclick="setState({payablesModal:'link-dn',payablesModalData:{supplier:'${esc(sup)}'}})" style="font-size:11px;padding:4px 8px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap">שייך</button>` : ''}
            ${isOpen ? `<button onclick="pvCancelDN('${e.id}')" style="width:26px;height:26px;border:none;border-radius:7px;background:var(--dangerSoft);color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">✕</button>` : ''}
          </div>`;
        }).join('');

    tabContent = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px">
        ${dnsHtml}
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:4px;border-top:1px solid var(--border)">
          <span style="font-size:12px;color:var(--textDim);font-weight:600">${allDNs.length} תעודות</span>
          <span class="display" style="font-size:16px;color:var(--text);font-weight:700">${fmtCurr(dnTotal)}</span>
        </div>
      </div>`;
  }

  // ── TAB: חשבוניות ──
  if (activeTab === 'invoices') {
    const tis = pv.taxInvoices.filter(ti => pvSupplierNorm(ti.supplierName) === norm);
    let expTis = [];
    try {
      const tiLinkedExpIds = new Set(pv.debts.filter(d=>d.expenseId).map(d=>d.expenseId));
      expTis = (DB.expenses||[]).filter(e =>
        ['חשבונית מס','חשבונית מס קבלה'].includes(e.document_type) &&
        pvSupplierNorm(e.supplier) === norm &&
        !tiLinkedExpIds.has(e.id)
      );
    } catch(ex) { expTis = []; }

    const invHtml = (tis.length===0 && expTis.length===0)
      ? `<div style="text-align:center;padding:20px;color:var(--textMuted);font-size:13px">אין חשבוניות</div>`
      : [
          ...tis.map(ti => {
            const linkedDebt = pv.debts.find(d => d.taxInvoiceId === ti.id);
            return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(ti.invoiceNumber||'ללא מספר')} · ${fmtDate(ti.date)}</div>
                  <div style="font-size:11px;color:var(--textDim)">${(ti.deliveryNoteIds||[]).length} ת"מ · ${fmtCurr(ti.amount)}${ti.invoiceImage?' · 📷':''}</div>
                </div>
                ${linkedDebt
                  ? `<div onclick="setState({payablesView:'debt',payablesDebtId:'${linkedDebt.id}'})" style="cursor:pointer">${pvDebtStatusBadge(linkedDebt)}</div>`
                  : `<button onclick="pvCreateDebtFromTI('${ti.id}')" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit;font-weight:700">צור חוב</button>`}
              </div>
            </div>`;
          }),
          ...expTis.map(e => {
            const linkedDebt = pv.debts.find(d => d.expenseId === e.id);
            const eNum = esc(String(e.document_number||'ללא מספר'));
            const eDate = esc(String(e.date||''));
            const eId = esc(String(e.id||''));
            const eAmt = +e.total_amount || 0;
            const eSup = esc(sup).replace(/'/g,'&apos;');
            const accBadge = !e.sentToAccountant ? `<span style="font-size:10px;font-weight:700;color:var(--amber)">⚠️ טרם הנה"ח</span>` : '';
            return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;color:var(--text)">${eNum} · ${fmtDate(e.date)}</div>
                  <div style="font-size:11px;color:var(--textDim)">${fmtCurr(eAmt)}${e.image?' · 📷':''} ${accBadge}</div>
                </div>
                ${linkedDebt
                  ? `<div onclick="setState({payablesView:'debt',payablesDebtId:'${linkedDebt.id}'})" style="cursor:pointer">${pvDebtStatusBadge(linkedDebt)}</div>`
                  : `<button onclick="pvOpenDebtFromExpense('${eId}','${eSup}','${eAmt}','${eNum}','${eDate}')" style="font-size:11px;padding:4px 10px;border:none;border-radius:7px;background:var(--accentSoft);color:var(--accent);cursor:pointer;font-family:inherit;font-weight:700">צור חוב</button>`}
              </div>
            </div>`;
          })
        ].join('');

    tabContent = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px">
        ${invHtml}
      </div>`;
  }

  // ── TAB: תשלומים וצ'קים ──
  if (activeTab === 'payments') {
    const supChecks = (DB.checks||[]).filter(c => pvSupplierNorm(c.supplier)===norm);
    const debts = pv.debts.filter(d => pvSupplierNorm(d.supplierName)===norm);
    const openChecks = supChecks.filter(c => !c.cleared);
    const clearedChecks = supChecks.filter(c => c.cleared);

    const checksHtml = openChecks.length === 0 ? '' : `
      <div style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">💳 צ'קים לפירעון</div>
        ${openChecks.sort((a,b)=>parseD(a.clearDate)-parseD(b.clearDate)).map(c => {
          const u = checkUrgency(c.clearDate);
          const urgColor = u==='overdue'?'var(--danger)':'var(--accent)';
          const urgBorder = u==='overdue'?'rgba(220,98,98,0.28)':'rgba(143,198,80,0.28)';
          const badge = u==='overdue' ? `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--dangerSoft);color:var(--danger)">🔴 עבר פירעון</span>`
            : `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--accentSoft);color:var(--accent)">💳 צ'ק לפירעון</span>`;
          const linkBtn = !c.linkedDebtId ? `<button onclick="pvOpenLinkCheckToDebt('${c.id}')" style="font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--textDim);cursor:pointer;font-family:inherit;white-space:nowrap">🔗 קשר לחוב</button>` : `<span style="font-size:10px;color:var(--accent)">🔗 קשור</span>`;
          return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text)">${fmtCurr(c.amount)}</div>
              <div style="font-size:11px;color:${urgColor};margin-top:1px">⏳ ${fmtDate(c.clearDate)}${c.checkNum?' · #'+esc(c.checkNum):''}</div>
            </div>
            ${badge}
            <button type="button" onclick="event.preventDefault();event.stopPropagation();pvOpenConfirm('${c.id}','check')" style="font-size:11px;padding:4px 9px;border:1px solid ${urgBorder};border-radius:999px;background:var(--surface);color:${urgColor};cursor:pointer;font-family:inherit;font-weight:800">שולם</button>
            ${linkBtn}
          </div>`;
        }).join('')}
      </div>`;

    pvMigratePaymentStatuses();
    const openDebts = debts.filter(d => !['paid','cancelled'].includes(d.status) && pvIsOpenStatus(d.paymentStatus));
    const closedDebts = debts.filter(d => !pvIsOpenStatus(d.paymentStatus));

    const openDebtsHtml = openDebts.length === 0 ? `<div style="font-size:12px;color:var(--textMuted);padding:6px 0">אין חובות פתוחים</div>` :
      openDebts.sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||''))).map(d => {
        const rem = (+d.amount||0)-(+d.paidAmount||0);
        const debtOverdue = pvDateISO(d.dueDate) && pvDateISO(d.dueDate) < todayISO();
        const debtColor = debtOverdue ? 'var(--danger)' : 'var(--accent)';
        const debtBorder = debtOverdue ? 'rgba(220,98,98,0.28)' : 'rgba(143,198,80,0.28)';
        const actionBtn = `<button type="button" onclick="event.preventDefault();event.stopPropagation();pvOpenConfirm('${d.id}','debt')" style="font-size:10px;padding:4px 9px;border:1px solid ${debtBorder};border-radius:999px;background:var(--surface);color:${debtColor};cursor:pointer;font-family:inherit;font-weight:800;white-space:nowrap">שולם</button>`;
        return `<div onclick="setState({payablesView:'debt',payablesDebtId:'${d.id}'})" style="display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer">
          <span style="font-size:18px;flex-shrink:0;margin-top:1px">${pvGetMethodIcon(d.paymentMethod||'')}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
              <span style="font-size:10px;font-weight:700;color:${debtColor};background:${debtColor}18;padding:2px 7px;border-radius:20px;white-space:nowrap">${pvOpenLabel(d.paymentMethod)}</span>
              ${d.dueDate?`<span style="font-size:10px;color:${debtColor};font-weight:700">${fmtDate(d.dueDate)}</span>`:''}
            </div>
            <div style="font-size:11px;color:var(--textDim)">${d.checkNumber?`מס' ${esc(d.checkNumber)} · `:''}${d.invoiceNumber?'חשבונית '+esc(d.invoiceNumber):''}</div>
            <div style="margin-top:5px">${actionBtn}</div>
          </div>
          <div class="display" style="font-size:14px;font-weight:700;color:${debtColor};flex-shrink:0">${fmtCurr(rem)}</div>
        </div>`;
      }).join('');

    const historyPayments = [
      ...closedDebts.flatMap(d => (d.payments||[]).map(p => ({...p, invoiceNumber: d.invoiceNumber, paymentStatus: d.paymentStatus, debtId: d.id, checkNumber: d.checkNumber}))),
      ...clearedChecks.map(c => ({
        id: c.id,
        amount: +c.amount||0,
        date: c.clearedDate || c.clearDate || '',
        method: "צ'ק",
        reference: c.checkNum || '',
        paymentStatus: 'שולם',
        checkNumber: c.checkNum || '',
      })),
    ].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const historyHtml = historyPayments.length === 0 ? '' : `
      <div style="margin-top:14px">
        <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">היסטוריית תשלומים</div>
        ${historyPayments.map(p=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:16px">${pvGetMethodIcon(p.method||'')}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text)">${fmtDate(p.date)} · ${esc(p.method||'')}</div>
              <div style="font-size:11px;color:var(--textDim)">${p.invoiceNumber?'חשבונית: '+esc(p.invoiceNumber):'צ׳ק'}${p.reference?' · מס\' '+esc(p.reference):''}</div>
            </div>
            <div class="display" style="font-size:14px;font-weight:700;color:var(--accent)">${fmtCurr(p.amount)}</div>
          </div>`).join('')}
      </div>`;

    tabContent = `
      ${checksHtml}
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px">
        <div style="font-size:11px;font-weight:700;color:var(--textDim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">חובות פתוחים</div>
        ${openDebtsHtml}
        ${historyHtml}
      </div>`;
  }

  return `<div style="padding:16px 16px 90px" class="fade-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button onclick="setState({payablesView:'dashboard'})" style="width:38px;height:38px;border:none;border-radius:10px;background:var(--surfaceHi);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
      <h2 class="display" style="font-size:18px;margin:0;flex:1">${esc(sup)}</h2>
      <button onclick="pvOpenDirectDebt(decodeURIComponent('${encodeURIComponent(sup)}'))" style="padding:7px 14px;border:none;border-radius:9px;background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer">+ חוב</button>
    </div>
    ${tabNav}
    ${tabContent}
  </div>`;
} // end _renderPayablesSupplierInner

// ── Debt sub-view ────────────────────────────────────────────────────────────
function renderPayablesDebt() {
  const debt = pv.debts.find(d => d.id === state.payablesDebtId);
  if (!debt) return `<div style="padding:20px;color:var(--danger)">חוב לא נמצא</div>`;
  const remaining = (+debt.amount||0) - (+debt.paidAmount||0);
  const pct = debt.amount > 0 ? Math.min(100, Math.round((debt.paidAmount||0) / debt.amount * 100)) : 0;
  const dueDateColor = pvIsOverdue(debt.dueDate) ? 'var(--danger)' : pvDateInDays(debt.dueDate, 7) ? 'var(--amber)' : 'var(--text)';

  const paymentsHtml = (debt.payments||[]).length === 0
    ? `<div style="font-size:12px;color:var(--textMuted);padding:6px 0">אין תשלומים עדיין</div>`
    : (debt.payments||[]).map(p => `
      <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--text)">${fmtDate(p.date)} · ${esc(p.method||'')}</div>
          ${p.reference ? `<div style="font-size:11px;color:var(--textDim)">אסמכתא: ${esc(p.reference)}</div>` : ''}
          ${p.notes ? `<div style="font-size:11px;color:var(--textDim)">${esc(p.notes)}</div>` : ''}
        </div>
        <div class="display" style="font-size:14px;font-weight:700;color:var(--accent)">${fmtCurr(p.amount)}</div>
      </div>`).join('');

  return `<div style="padding:16px 16px 90px" class="fade-up">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button onclick="setState({payablesView:'supplier',payablesSupplier:decodeURIComponent('${encodeURIComponent(debt.supplierName)}')})" style="width:38px;height:38px;border:none;border-radius:10px;background:var(--surfaceHi);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
      <div style="flex:1;min-width:0">
        <h2 class="display" style="font-size:17px;margin:0">${esc(debt.supplierName)}</h2>
        <div style="font-size:12px;color:var(--textDim)">חשבונית: ${esc(debt.invoiceNumber||'ללא מספר')}</div>
      </div>
      <button onclick="pvOpenEditDebt('${debt.id}')" style="border:1px solid var(--border);border-radius:10px;padding:7px 12px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer">ערוך</button>
      ${pvDebtStatusBadge(debt)}
    </div>

    <!-- Amounts card -->
    <div style="padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--textDim);margin-bottom:2px">סה"כ</div>
          <div class="display" style="font-size:16px;font-weight:700">${fmtCurr(debt.amount)}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--textDim);margin-bottom:2px">שולם</div>
          <div class="display" style="font-size:16px;font-weight:700;color:var(--accent)">${fmtCurr(debt.paidAmount||0)}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--textDim);margin-bottom:2px">נותר</div>
          <div class="display" style="font-size:16px;font-weight:700;color:${remaining>0?'var(--danger)':'var(--accent)'}">${fmtCurr(remaining)}</div>
        </div>
      </div>
      <!-- Progress bar -->
      <div style="height:8px;border-radius:4px;background:var(--surfaceHi);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px;transition:width 0.3s ease"></div>
      </div>
      <div style="font-size:11px;color:var(--textDim);text-align:center;margin-top:4px">${pct}% שולם</div>
    </div>

    <!-- Details card -->
    <div style="padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--textDim)">תאריך פירעון</span>
        <span style="font-size:13px;font-weight:600;color:${dueDateColor}">${debt.dueDate ? fmtDate(debt.dueDate) : '—'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--textDim)">אמצעי תשלום</span>
        <span style="font-size:13px;font-weight:600">${esc(debt.paymentMethod||'—')}</span>
      </div>
      ${debt.checkNumber ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--textDim)">מספר צ'ק / אסמכתא</span>
        <span style="font-size:13px;font-weight:600">${esc(debt.checkNumber)}</span>
      </div>` : ''}
      ${debt.notes ? `<div style="padding:6px 0">
        <span style="font-size:13px;color:var(--textDim)">הערות: </span>
        <span style="font-size:13px">${esc(debt.notes)}</span>
      </div>` : ''}
      ${debt.invoiceImage ? `
