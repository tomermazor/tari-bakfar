<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניהול העסק">
<link rel="manifest" href="manifest.json">
<title>ניהול העסק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0e0a; --surface:#11161a; --surfaceHi:#1a2025;
  --border:#1f2a30; --borderHi:#2a3640;
  --text:#e8efe5; --textDim:#7a8a82; --textMuted:#475259;
  --accent:#8fc650; --accent2:#d4a574; --amber:#f4b942; --blue:#5b9cf6;
}
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Heebo',-apple-system,sans-serif; overscroll-behavior:none; }
.display { font-family:'Frank Ruhl Libre',serif; font-weight:700; letter-spacing:-0.02em; }
.app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

.header { padding:20px 20px 16px; background:rgba(10,14,10,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
.header-greeting { font-size:12px; color:var(--textDim); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
.header-title { font-size:26px; color:var(--text); margin:0; line-height:1.1; }

.main { flex:1; padding:24px 16px; display:flex; flex-direction:column; gap:14px; }

.app-card { display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 18px; text-decoration:none; color:inherit; transition:border-color 0.15s, background 0.15s; cursor:pointer; }
.app-card:active { background:var(--surfaceHi); border-color:var(--borderHi); }
.app-card:nth-child(1) { border-left:3px solid var(--accent); }
.app-card:nth-child(2) { border-left:3px solid var(--accent2); }

.app-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.app-card:nth-child(1) .app-icon { background:rgba(143,198,80,0.12); }
.app-card:nth-child(2) .app-icon { background:rgba(212,165,116,0.12); }

.app-info { flex:1; min-width:0; }
.app-name { font-size:18px; font-weight:800; margin-bottom:4px; }
.app-desc { font-size:13px; color:var(--textDim); line-height:1.4; }
.app-arrow { font-size:20px; color:var(--textMuted); flex-shrink:0; }

.footer-note { text-align:center; font-size:12px; color:var(--textMuted); padding:24px 16px; }

.fade-up { animation:fadeUp 0.35s ease-out backwards; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-greeting">ברוך הבא</div>
    <h1 class="display header-title">ניהול העסק</h1>
  </div>
  <div class="main">
    <a href="orders.html" class="app-card fade-up" style="animation-delay:0.05s">
      <div class="app-icon">📦</div>
      <div class="app-info">
        <div class="app-name">הזמנות</div>
        <div class="app-desc">ניהול ספקים, רשימות הזמנה יומיות והיסטוריה</div>
      </div>
      <div class="app-arrow">←</div>
    </a>
    <a href="tari-bakfar.html" class="app-card fade-up" style="animation-delay:0.12s">
      <div class="app-icon">🌿</div>
      <div class="app-info">
        <div class="app-name">ניהול הוצאות</div>
        <div class="app-desc">סריקת קבלות, מעקב הוצאות, סנכרון לגוגל שיטס</div>
      </div>
      <div class="app-arrow">←</div>
    </a>
  </div>
  <div class="footer-note">גרסה 1.0 · כל הנתונים שמורים במכשיר</div>
</div>
</body>
</html>
