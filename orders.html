<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הזמנות">
<link rel="manifest" href="manifest.json">
<title>הזמנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="onGoogleScriptLoad()"></script>
<style>
:root {
  --bg:#0a0e0a; --surface:#11161a; --surfaceHi:#1a2025;
  --border:#1f2a30; --borderHi:#2a3640;
  --text:#e8efe5; --textDim:#7a8a82; --textMuted:#475259;
  --accent:#8fc650; --accent2:#d4a574; --amber:#f4b942; --danger:#dc6262; --blue:#5b9cf6;
}
[data-theme="light"] {
  --bg:#f0f5ee; --surface:#ffffff; --surfaceHi:#e6ede1;
  --border:#c4d4bc; --borderHi:#a8c09a;
  --text:#1a2a14; --textDim:#4a6040; --textMuted:#7a9470;
  --accent:#4a8818; --accent2:#9a5e20; --amber:#a87008; --danger:#b83030; --blue:#1a5cb8;
}
[data-theme="light"] .app-switcher { background:rgba(240,246,238,0.97); padding-top:calc(6px + env(safe-area-inset-top,0px)); }
[data-theme="light"] .header { background:rgba(240,246,238,0.95); }
[data-theme="light"] .order-footer { background:rgba(240,246,238,0.97); }
[data-theme="light"] .modal { background:var(--surface); }
[data-theme="light"] .overlay { background:rgba(0,0,0,0.45); }
[data-theme="light"] .toast { box-shadow:0 4px 20px rgba(0,0,0,0.15); }
.theme-toggle-btn { background:transparent; border:none; padding:7px 10px; cursor:pointer; font-size:17px; flex-shrink:0; border-radius:10px; line-height:1; }
.sw-icon-btn { background:transparent; border:none; padding:7px 8px; cursor:pointer; font-size:16px; flex-shrink:0; border-radius:10px; line-height:1; color:var(--textDim); }
.sw-icon-btn:active { background:rgba(255,255,255,0.08); }
[data-theme="light"] .sw-icon-btn:active { background:rgba(0,0,0,0.05); }
.sw-icon-btn.spinning { animation:fadeUp 0s, spin 0.8s linear infinite; display:inline-block; }
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Heebo',-apple-system,sans-serif; overscroll-behavior:none; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.display { font-family:'Frank Ruhl Libre',serif; font-weight:700; letter-spacing:-0.02em; }
.app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }

/* App switcher */
.app-switcher { display:flex; gap:6px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top,0px)); background:rgba(10,14,10,0.97); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
.sw-btn { flex:1; text-align:center; padding:9px 8px; border-radius:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--textDim); border:1px solid transparent; display:block; }
.sw-btn.active { background:rgba(143,198,80,0.1); color:var(--accent); border-color:rgba(143,198,80,0.3); }

/* Header */
.header { padding:14px 20px 12px; position:sticky; top:calc(44px + env(safe-area-inset-top,0px)); z-index:10; background:rgba(10,14,10,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.header-logo { width:40px; height:40px; border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; box-shadow:0 4px 12px -4px rgba(143,198,80,0.4),0 0 0 1px var(--border); }
.header-title { flex:1; min-width:0; }
.header-title h1 { font-size:17px; margin:0; line-height:1.1; }
.header-title .sub { font-size:11px; color:var(--textDim); margin-top:1px; }
.icon-btn { width:36px; height:36px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:var(--textDim); }
.icon-btn:active { background:var(--surfaceHi); }

/* Main */
.main { flex:1; overflow-y:auto; padding:16px; padding-bottom:100px; }
#order-main { padding-bottom:200px; }

/* Supplier cards */
.supplier-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.supplier-card:active { background:var(--surfaceHi); }
.supplier-card.dragging { background:var(--surfaceHi); border-color:rgba(143,198,80,0.45); box-shadow:0 10px 32px rgba(0,0,0,0.45); position:relative; z-index:20; }
.supplier-drag { color:var(--textMuted); font-size:18px; cursor:grab; padding:4px 6px 4px 0; flex-shrink:0; touch-action:none; user-select:none; -webkit-user-select:none; }
.supplier-drag:active { cursor:grabbing; color:var(--textDim); }
.supplier-body { display:flex; align-items:center; gap:14px; flex:1; min-width:0; cursor:pointer; }
.supplier-icon { width:44px; height:44px; border-radius:12px; background:rgba(143,198,80,0.12); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.supplier-info { flex:1; min-width:0; }
.supplier-name { font-size:16px; font-weight:700; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.supplier-meta { font-size:12px; color:var(--textDim); }

/* FAB */
.fab { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(480px - 32px); width:calc(100% - 32px); border:none; border-radius:14px; padding:15px 20px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--accent) 0%,#6fa83a 100%); color:#0a1505; box-shadow:0 8px 24px -8px rgba(143,198,80,0.5); display:flex; align-items:center; justify-content:center; gap:8px; z-index:10; }
.fab:active { transform:translateX(-50%) scale(0.98); }

/* Product rows (order screen) */
.product-row { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:10px; }
.product-row-name { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.product-row-name-text { flex:1; min-width:0; }
.transfer-btn { flex-shrink:0; border:1px solid var(--borderHi); border-radius:8px; padding:3px 8px; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; background:transparent; color:var(--textDim); transition:all 0.12s; white-space:nowrap; }
.transfer-btn:active { background:var(--borderHi); color:var(--text); }
.manual-item-row { background:var(--surface); border:1.5px dashed var(--borderHi); border-radius:16px; padding:12px 16px; margin-bottom:8px; }
.manual-add-box { margin-top:16px; padding:14px 16px; background:var(--surface); border:1.5px dashed rgba(143,198,80,0.35); border-radius:14px; }
.manual-section-header { font-size:10.5px; font-weight:700; color:var(--textDim); letter-spacing:.06em; text-transform:uppercase; margin:18px 0 10px; padding-top:16px; border-top:1px solid var(--border); }
/* Transfer bottom sheet */
.transfer-sheet-list { display:flex; flex-direction:column; gap:8px; margin-top:14px; max-height:50vh; overflow-y:auto; }
.product-row-controls { display:flex; align-items:center; gap:10px; }
.unit-toggle { flex-shrink:0; border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.unit-toggle.is-carton { background:rgba(212,165,116,0.12); color:var(--accent2); border-color:rgba(212,165,116,0.35); }
.unit-toggle.is-units { background:rgba(91,156,246,0.12); color:var(--blue); border-color:rgba(91,156,246,0.35); }
.stepper { display:flex; align-items:center; margin-right:auto; background:var(--surfaceHi); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.step-btn { width:44px; height:44px; border:none; background:transparent; cursor:pointer; font-size:22px; font-weight:300; color:var(--textDim); font-family:inherit; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.step-btn:active { background:var(--border); color:var(--text); }
.step-val { width:42px; text-align:center; font-size:18px; font-weight:800; color:var(--text); border-left:1px solid var(--border); border-right:1px solid var(--border); line-height:44px; }
.step-val.zero { color:var(--textMuted); font-weight:400; }

/* Order footer */
.order-footer { position:fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto; padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); background:rgba(10,14,10,0.97); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; gap:10px; z-index:10; }
.btn-primary { flex:1; border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--accent) 0%,#6fa83a 100%); color:#0a1505; box-shadow:0 6px 20px -6px rgba(143,198,80,0.4); }
.btn-primary:active { transform:scale(0.98); }
.btn-secondary { border:1px solid var(--border); border-radius:14px; padding:14px 16px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; background:var(--surface); color:var(--text); flex-shrink:0; }
.btn-secondary:active { background:var(--surfaceHi); }
.btn-save-draft { border:1px solid rgba(244,185,66,0.4); border-radius:14px; padding:14px 13px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; background:rgba(244,185,66,0.1); color:var(--amber); flex-shrink:0; white-space:nowrap; }
.btn-save-draft:active { background:rgba(244,185,66,0.2); }
.btn-order-sent { width:100%; border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,#4fc46a 0%,#2f9e4a 100%); color:#fff; box-shadow:0 6px 20px -6px rgba(47,158,74,0.5); letter-spacing:0.01em; }
.btn-order-sent:active { transform:scale(0.98); }
.order-counter { width:100%; text-align:center; font-size:12px; font-weight:700; color:var(--accent); padding-bottom:9px; letter-spacing:.02em; }
.supplier-draft-badge { display:inline-block; background:rgba(244,185,66,0.12); border:1px solid rgba(244,185,66,0.3); border-radius:6px; padding:2px 7px; font-size:10px; font-weight:700; color:var(--amber); margin-right:5px; vertical-align:middle; }

/* Manage */
.input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px; font-family:inherit; outline:none; }
.input:focus { border-color:var(--borderHi); }
.label { font-size:11px; color:var(--textDim); margin-bottom:6px; display:block; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
.field { margin-bottom:14px; }
.section-title { font-size:11px; color:var(--textDim); font-weight:600; letter-spacing:0.05em; text-transform:uppercase; margin:20px 0 10px; }
.manage-row { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.manage-row-name { flex:1; font-size:14px; font-weight:600; cursor:pointer; }
.manage-row-name:hover { color:var(--accent); }
.unit-badge { font-size:11px; font-weight:700; padding:4px 9px; border-radius:7px; cursor:pointer; flex-shrink:0; }
.unit-badge.carton { background:rgba(212,165,116,0.12); color:var(--accent2); border:1px solid rgba(212,165,116,0.3); }
.unit-badge.units { background:rgba(91,156,246,0.12); color:var(--blue); border:1px solid rgba(91,156,246,0.3); }
.unit-badge.both { background:rgba(143,198,80,0.1); color:var(--accent); border:1px solid rgba(143,198,80,0.3); }
.product-row-both { display:flex; flex-direction:column; gap:8px; }
.both-unit-row { display:flex; align-items:center; justify-content:space-between; }
.both-unit-label { font-size:13px; font-weight:700; color:var(--textDim); flex-shrink:0; }
.product-row-note { display:block; width:100%; border:none; border-top:1px solid var(--border); background:transparent; color:var(--text); font-size:12px; font-family:inherit; padding:9px 2px 2px; margin-top:10px; outline:none; box-sizing:border-box; }
.product-row-note::placeholder { color:var(--textMuted); font-style:italic; }
.product-row-note:focus { border-top-color:var(--borderHi); }
.product-row-note:not(:placeholder-shown) { color:var(--accent2); font-weight:600; }
.del-btn { width:30px; height:30px; border:none; border-radius:8px; background:rgba(220,98,98,0.1); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--danger); flex-shrink:0; }
.del-btn:active { background:rgba(220,98,98,0.2); }
.active-toggle { width:30px; height:30px; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.active-toggle.on  { background:rgba(143,198,80,0.12); color:var(--accent); }
.active-toggle.off { background:rgba(120,120,120,0.1); color:var(--textMuted); }
.active-toggle:active { opacity:0.7; }
.manage-row.inactive { opacity:0.45; }
.drag-handle { color:var(--textMuted); font-size:17px; letter-spacing:1px; cursor:grab; padding:4px 10px 4px 2px; flex-shrink:0; touch-action:none; user-select:none; -webkit-user-select:none; line-height:1; }
.drag-handle:active { cursor:grabbing; color:var(--textDim); }
.manage-row.dragging { background:var(--surfaceHi); border-color:rgba(143,198,80,0.45); box-shadow:0 10px 32px rgba(0,0,0,0.55); position:relative; z-index:20; }
.draft-banner { background:rgba(143,198,80,0.07); border:1px solid rgba(143,198,80,0.22); border-radius:12px; padding:9px 14px; font-size:12px; color:var(--accent); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.draft-banner-text { flex:1; }
.draft-clear-btn { background:none; border:none; color:var(--textMuted); font-size:13px; cursor:pointer; padding:2px 4px; border-radius:6px; font-family:inherit; }
.draft-clear-btn:active { background:rgba(0,0,0,0.08); }
.manage-search { position:relative; margin-bottom:10px; }
.manage-search input { width:100%; padding:10px 42px 10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; font-family:inherit; outline:none; }
.manage-search input:focus { border-color:var(--accent); }
.manage-search input::placeholder { color:var(--textMuted); }
.manage-search-icon { position:absolute; left:auto; right:14px; top:50%; transform:translateY(-50%); color:var(--textMuted); font-size:14px; pointer-events:none; }
.add-form { background:rgba(143,198,80,0.04); border:1px dashed rgba(143,198,80,0.2); border-radius:14px; padding:16px; margin-top:4px; }
.unit-pills { display:flex; gap:8px; margin-bottom:12px; }
.unit-pill { flex:1; border:1px solid var(--border); border-radius:10px; padding:10px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:transparent; color:var(--textDim); text-align:center; }
.unit-pill.sel { background:rgba(143,198,80,0.1); color:var(--accent); border-color:rgba(143,198,80,0.4); }
.btn-add-product { width:100%; border:1px solid rgba(143,198,80,0.3); border-radius:12px; padding:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; background:rgba(143,198,80,0.08); color:var(--accent); }
.btn-add-product:active { background:rgba(143,198,80,0.15); }
.reorder-zone { margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
.reorder-btns { display:flex; align-items:center; gap:10px; margin-top:10px; }
.reorder-btn { flex:1; border:1px solid var(--border); border-radius:12px; padding:12px 8px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--surface); color:var(--text); }
.reorder-btn:active { background:var(--surfaceHi); }
.reorder-btn:disabled { opacity:0.3; cursor:default; }
.reorder-pos { color:var(--textDim); font-size:13px; font-weight:600; white-space:nowrap; flex-shrink:0; text-align:center; min-width:60px; }
.danger-zone { margin-top:32px; padding-top:20px; border-top:1px solid rgba(220,98,98,0.15); }
.btn-danger { width:100%; border:1px solid rgba(220,98,98,0.3); border-radius:14px; padding:14px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; background:rgba(220,98,98,0.06); color:var(--danger); }
.btn-danger:active { background:rgba(220,98,98,0.12); }

/* Overlay / Modal */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.modal { background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-width:480px; padding:20px 20px; padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto; border-top:1px solid var(--border); }
.modal-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
.modal h2 { font-size:18px; margin:0 0 4px; }
.modal .hint { font-size:13px; color:var(--textDim); margin:0 0 16px; }
.export-text { background:var(--surfaceHi); border:1px solid var(--border); border-radius:12px; padding:16px; font-size:13px; line-height:1.8; white-space:pre-wrap; direction:rtl; color:var(--text); margin-bottom:14px; font-family:inherit; user-select:all; -webkit-user-select:all; }
.btn-copy { width:100%; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--accent) 0%,#6fa83a 100%); color:#0a1505; margin-bottom:10px; }
.btn-copy:active { transform:scale(0.98); }
.btn-close-modal { width:100%; border:1px solid var(--border); border-radius:14px; padding:13px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; background:transparent; color:var(--textDim); }

/* Active orders button on home */
.active-orders-banner { background:linear-gradient(135deg,rgba(244,185,66,0.1),rgba(244,185,66,0.05)); border:1px solid rgba(244,185,66,0.3); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:14px; cursor:pointer; }
.active-orders-banner:active { background:rgba(244,185,66,0.14); }
.ao-banner-icon { font-size:22px; flex-shrink:0; }
.ao-banner-text { flex:1; min-width:0; }
.ao-banner-title { font-size:14px; font-weight:700; color:var(--amber); }
.ao-banner-sub { font-size:12px; color:var(--textDim); margin-top:1px; }
.ao-banner-arrow { color:var(--textMuted); font-size:16px; }

/* Active order cards */
.ao-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:12px; overflow:hidden; }
.ao-card-header { padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px; }
.ao-card-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
.ao-card-info { flex:1; min-width:0; }
.ao-card-supplier { font-size:15px; font-weight:700; margin-bottom:2px; }
.ao-card-date { font-size:11px; color:var(--textDim); }
.ao-card-del { width:28px; height:28px; border:none; background:rgba(220,98,98,0.1); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--danger); flex-shrink:0; }
.ao-card-del:active { background:rgba(220,98,98,0.2); }
.ao-items { padding:0 16px 10px; font-size:12px; color:var(--textDim); line-height:1.7; }
.ao-img-wrap { margin:0 16px 12px; border-radius:10px; overflow:hidden; border:1px solid var(--border); max-height:180px; }
.ao-img-wrap img { width:100%; max-height:180px; object-fit:contain; background:#000; display:block; }
.ao-actions { padding:10px 16px 14px; border-top:1px solid var(--border); display:flex; gap:8px; }
.ao-photo-btn { flex:1; border:1px solid var(--border); border-radius:11px; padding:10px 8px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--surfaceHi); color:var(--textDim); text-align:center; position:relative; overflow:hidden; }
.ao-photo-btn:active { background:var(--border); }
.ao-photo-btn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.ao-expense-btn { flex:1; border:none; border-radius:11px; padding:10px 8px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; background:linear-gradient(135deg,var(--accent),#6fa83a); color:#0a1505; }
.ao-expense-btn:active { transform:scale(0.98); }

/* Empty state */
.empty { text-align:center; padding:60px 20px; }
.empty-icon { font-size:52px; margin-bottom:16px; }
.empty-title { font-size:18px; font-weight:700; margin-bottom:8px; }
.empty-desc { font-size:14px; color:var(--textDim); line-height:1.6; }

/* Toast */
.toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--surfaceHi); border:1px solid var(--border); border-radius:12px; padding:12px 18px; color:var(--text); font-weight:600; font-size:13px; z-index:200; box-shadow:0 8px 32px rgba(0,0,0,0.4); max-width:90vw; pointer-events:none; animation:fadeUp 0.3s ease; transition:opacity 0.4s ease; }
.toast.success { border-color:rgba(143,198,80,0.4); color:var(--accent); }
.toast.error { border-color:rgba(220,98,98,0.4); color:var(--danger); }

/* Animations */
.fade-up { animation:fadeUp 0.3s ease-out backwards; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* History */
.hist-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; }
.hist-header { padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; }
.hist-header:active { background:var(--surfaceHi); }
.hist-supplier { font-size:14px; font-weight:700; }
.hist-date { font-size:11px; color:var(--textDim); margin-top:2px; }
.hist-badge { font-size:11px; font-weight:700; padding:4px 9px; border-radius:7px; background:rgba(143,198,80,0.1); color:var(--accent); border:1px solid rgba(143,198,80,0.25); flex-shrink:0; margin-right:auto; }
.hist-chevron { color:var(--textMuted); font-size:14px; flex-shrink:0; transition:transform 0.2s; }
.hist-chevron.open { transform:rotate(90deg); }
.hist-body { padding:0 16px 14px; border-top:1px solid var(--border); display:none; }
.hist-body.open { display:block; }
.hist-text { font-size:13px; line-height:1.8; white-space:pre-wrap; color:var(--text); padding-top:12px; user-select:all; -webkit-user-select:all; }
.hist-copy-btn { margin-top:10px; width:100%; border:1px solid rgba(143,198,80,0.3); border-radius:10px; padding:9px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; background:rgba(143,198,80,0.07); color:var(--accent); }
.hist-copy-btn:active { background:rgba(143,198,80,0.14); }

/* Inline save button row */
.inline-save { display:flex; gap:8px; }
.inline-save .input { flex:1; }
.btn-save-inline { flex-shrink:0; border:none; border-radius:12px; padding:0 18px; background:var(--accent); color:#0a1505; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; }
.btn-save-inline:active { transform:scale(0.97); }

/* Login screen */
.login-screen { position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; }
.login-logo { width:76px; height:76px; border-radius:22px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:42px; margin-bottom:20px; box-shadow:0 8px 32px rgba(143,198,80,0.3),0 0 0 1px rgba(143,198,80,0.15); }
.login-title { font-size:28px; font-weight:800; font-family:'Frank Ruhl Libre',serif; margin-bottom:4px; text-align:center; }
.login-sub { font-size:14px; color:var(--textDim); margin-bottom:28px; text-align:center; }
.login-err { color:var(--danger); font-size:13px; text-align:center; margin-top:14px; min-height:20px; font-weight:600; }
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-logo">🌿</div>
  <div class="login-title">טרי בכפר</div>
  <div class="login-sub">הזמנות לספקים</div>
  <div id="google-signin-btn"></div>
  <div class="login-err" id="login-err"></div>
</div>

<div class="app" id="app" hidden>

  <div class="app-switcher">
    <span class="sw-btn active">📦 הזמנות</span>
    <a href="tari-bakfar.html" class="sw-btn">💰 הוצאות</a>
    <button class="sw-icon-btn" id="sync-top-btn" onclick="triggerTopSync()" title="סנכרן עכשיו">🔄</button>
    <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="עיצוב"></button>
    <button class="sw-icon-btn" onclick="logout()" title="התנתק">🔒</button>
  </div>

  <!-- ═══ VIEW: HOME ═══ -->
  <div id="view-home">
    <header class="header">
      <div class="header-title">
        <h1 class="display">הזמנות</h1>
        <div class="sub" id="home-sub">ניהול ספקים</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="sync-dot" title="מסנכרן..." style="width:8px;height:8px;border-radius:50%;background:#f4b942;flex-shrink:0"></div>
        <button class="icon-btn" onclick="openHistory()" title="היסטוריה">📋</button>

  <!-- ═══ VIEW: ORDER ═══ -->

    <header class="header">

      <div class="header-title">
        <h1 class="display" id="order-title"></h1>

    <div class="main" id="order-main"></div>
    <div class="order-footer" style="flex-direction:column;align-items:stretch;gap:8px">
      <div id="order-counter" class="order-counter" hidden></div>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" onclick="clearOrder()">נקה</button>

        <button class="btn-secondary" onclick="summaryOrder()">סיכום</button>
        <button class="btn-primary" onclick="exportOrder()">📤 ייצא לוואטסאפ</button>
      </div>
      <button class="btn-order-sent" onclick="confirmOrderSent()">✓ הזמנה נשלחה לספק</button>
    </div>
  </div>

  <!-- ═══ VIEW: MANAGE ═══ -->
  <div id="view-manage" hidden>
    <header class="header">
      <button class="icon-btn" onclick="backFromManage()">←</button>
      <div class="header-title">
        <h1 class="display" style="font-size:17px">ניהול ספק</h1>
      </div>
    </header>
    <div class="main" id="manage-main"></div>
  </div>

  <!-- ═══ VIEW: HISTORY ═══ -->
  <div id="view-history" hidden>
    <header class="header">
      <button class="icon-btn" onclick="show('home')">←</button>
      <div class="header-title">
        <h1 class="display" style="font-size:17px">היסטוריית הזמנות</h1>
        <div class="sub" id="history-sub"></div>
      </div>
      <button class="icon-btn" onclick="clearHistory()" title="מחק הכל" style="color:var(--danger)">🗑</button>
    </header>
    <div class="main" id="history-main"></div>
  </div>

  <!-- ═══ VIEW: ACTIVE ORDERS ═══ -->
  <div id="view-active" hidden>
    <header class="header">
      <button class="icon-btn" onclick="goHome()">←</button>
      <div class="header-title">
        <h1 class="display" style="font-size:17px">הזמנות בתהליך</h1>
        <div class="sub" id="active-sub"></div>

    <div class="main" id="active-main"></div>

</div>

<!-- ═══ MODAL: Add Supplier ═══ -->

  <div class="modal" onclick="event.stopPropagation()">

<!-- ═══ MODAL: Export ═══ -->

  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2 class="display">טקסט לוואטסאפ 📤</h2>
    <p class="hint">העתק ושלח. ההזמנה נשמרת — לחץ ✓ נשלחה רק אחרי שהספק קיבל.</p>
    <div class="export-text" id="export-text"></div>
    <button class="btn-copy" onclick="openWhatsAppExport()" style="background:#25D366;color:#06240f">פתח בוואטסאפ</button>
    <button class="btn-copy" onclick="copyExport()">📋 העתק טקסט</button>
    <button class="btn-close-modal" onclick="closeModal('modal-export')">המשך לערוך</button>

<!-- ═══ MODAL: Transfer Item ═══ -->

  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>

    <p class="hint" id="transfer-item-name" style="margin:0 0 4px;color:var(--accent);font-weight:700;font-size:14px"></p>
    <p class="hint" style="margin:0 0 2px;font-size:12px">הכמות תתאפס אצל הספק הנוכחי</p>
    <div class="transfer-sheet-list" id="transfer-supplier-list"></div>
    <button class="btn-close-modal" onclick="closeModal('modal-transfer')" style="margin-top:10px">ביטול</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" hidden></div>

<script>
// ─── Storage ───────────────────────────────────────────────────────────────
const STORE_KEY = 'orders-v1';
let db = { suppliers: [] };

function loadDb() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) db = JSON.parse(s); } catch {}
  if (!db.history) db.history = [];
  if (!db.activeOrders) db.activeOrders = [];
  if (!db._localModified) db._localModified = 0;
  // First time with new sync code: treat as synced so we PULL, not push
  if (!db._lastSynced) db._lastSynced = db._localModified || Date.now();
}
function saveDb(dirty) {
  if (dirty) db._localModified = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
}

// ─── Cloud Sync (Google Sheets) ────────────────────────────────────────────
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxdXp4ZXpt2EAXYXHSKdjrNZRNFuAIiOEdyXktShtnSlRSYHXLoNlSyOf-LJYJkS7ndjw/exec';

async function cloudCallOrders(action, payload) {
  const res = await fetch(WEB_APP_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...payload }),
    headers: { 'Content-Type': 'text/plain' }
  });
  const json = JSON.parse(await res.text());
  if (!json.ok) throw new Error(json.error || 'Cloud error');
  return json.data;
}

async function pushSuppliers() {
  try {
    setSyncDot('syncing');
    await cloudCallOrders('save_suppliers', { payload: db.suppliers });
    db._lastSynced = Date.now();
    saveDb();
    setSyncDot('ok');
  } catch(e) {
    setSyncDot('err');
    console.warn('Push failed:', e.message);
    // Don't show error toast — local save succeeded, dot turns red silently
  }
}

async function syncSuppliers() {
  try {
    setSyncDot('syncing');
    // If local has unsaved changes, push to cloud instead of pulling
    const hasPending = db._localModified > db._lastSynced;
    if (hasPending) {
      await cloudCallOrders('save_suppliers', { payload: db.suppliers });
      db._lastSynced = Date.now();
      saveDb();
    } else {
      const cloud = await cloudCallOrders('list_suppliers', {});
      if (cloud && cloud.length > 0) {
        const prevStr = JSON.stringify(db.suppliers);
        db.suppliers = cloud;
        db._lastSynced = Date.now();
        db._localModified = db._lastSynced; // mark as in sync
        saveDb();
        // Only re-render if data actually changed, and without animation to avoid jump
        if (currentView === 'home' && JSON.stringify(db.suppliers) !== prevStr) renderHome(false);
      } else if (db.suppliers.length > 0) {
        await cloudCallOrders('save_suppliers', { payload: db.suppliers });
        db._lastSynced = Date.now();
        db._localModified = db._lastSynced;
        saveDb();
      }
    }
    setSyncDot('ok');
  } catch(e) {
    setSyncDot('err');
    console.log('Sync failed:', e.message);
  }
}

function setSyncDot(status) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.style.background = status === 'ok' ? '#8fc650' : status === 'syncing' ? '#f4b942' : '#dc6262';
  dot.title = status === 'ok' ? 'מסונכרן' : status === 'syncing' ? 'מסנכרן...' : 'שגיאת סנכרון';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ─── Active Orders Cloud Sync ──────────────────────────────────────────────
async function pushActiveOrders() {
  try {
    const payload = (db.activeOrders || []).map(o => ({
      id: o.id, supplierId: o.supplierId, supplierName: o.supplierName,
      dateOrdered: o.dateOrdered, timestamp: o.timestamp, items: o.items
      // deliveryNoteImage intentionally omitted — stays local only
    }));
    await cloudCallOrders('save_active_orders', { payload });
  } catch(e) { console.log('Push active orders failed:', e.message); }
}

async function syncActiveOrders() {
  try {
    const cloud = await cloudCallOrders('list_active_orders', {});
    if (!cloud) return;
    // Preserve local delivery-note images (they're not synced to cloud)
    const localImgMap = {};
    (db.activeOrders || []).forEach(o => { if (o.deliveryNoteImage) localImgMap[o.id] = o.deliveryNoteImage; });
    db.activeOrders = cloud.map(o => ({ ...o, deliveryNoteImage: localImgMap[o.id] || null }));
    saveDb();
    if (currentView === 'home')   renderHome(false);
    if (currentView === 'active') renderActiveOrders();
  } catch(e) { console.log('Sync active orders failed:', e.message); }
}

// ─── App State ─────────────────────────────────────────────────────────────
let currentSupplierId = null;
let manageFrom = 'home';       // 'home' | 'order'
let orderState = {};           // { productId: {qty,unit} | 'manual_xxx': {isManual,name,qty,unit} }
let newProductUnit = 'קרטון'; // selected default unit in add-product form
let _transferData = null;      // { pid, name } — item being transferred
let manualAddState = { name: '', qty: 1, unit: 'קרטון' }; // free-text add form

// ─── View Routing ──────────────────────────────────────────────────────────
var currentView = 'home';
function show(view) {
  currentView = view;
  ['home','order','manage','history','active'].forEach(v =>
    document.getElementById('view-' + v).hidden = (v !== view)
  );
}

// ─── HOME ──────────────────────────────────────────────────────────────────
const ICONS = ['🍎','🥦','🍋','🧅','🥕','🍇','🥬','🍓','🌽','🧄','🧀','🥚','🐟','🥩','🫙'];

function renderHome(animated) {
  if (animated === undefined) animated = true;
  show('home');
  const { suppliers } = db;
  document.getElementById('home-sub').textContent =
    suppliers.length ? suppliers.length + ' ספקים' : 'אין ספקים עדיין';

  const main = document.getElementById('home-main');
  const savedScroll = main.scrollTop; // preserve scroll position

  if (!suppliers.length) {
    main.innerHTML = `
      <div class="empty${animated ? ' fade-up' : ''}">
        <div class="empty-icon">📦</div>
        <div class="empty-title">אין ספקים עדיין</div>
        <div class="empty-desc">הוסף ספק ראשון כדי<br>להתחיל לרשום הזמנות</div>
      </div>`;
    return;
  }

  const activeCount = (db.activeOrders || []).length;
  const banner = activeCount > 0 ? `
    <div class="active-orders-banner${animated ? ' fade-up' : ''}" onclick="openActiveOrders()">
      <div class="ao-banner-icon">🚚</div>
      <div class="ao-banner-text">
        <div class="ao-banner-title">${activeCount} הזמנ${activeCount === 1 ? 'ה' : 'ות'} בתהליך</div>
        <div class="ao-banner-sub">לחץ לסימון קבלה ותיעוד</div>
      </div>
      <div class="ao-banner-arrow">←</div>
    </div>` : '';

  main.innerHTML = banner + suppliers.map((s, i) => `
    <div class="supplier-card${animated ? ' fade-up' : ''}" id="sc-${s.id}"${animated ? ` style="animation-delay:${i*.05}s"` : ''}>
      <div class="supplier-body" onclick="openOrder('${s.id}')">
        <div class="supplier-icon">${ICONS[i % ICONS.length]}</div>
        <div class="supplier-info">
          <div class="supplier-name">${esc(s.name)}${hasDraftFor(s.id) ? ' <span class="supplier-draft-badge">📋 טיוטא</span>' : ''}</div>
          <div class="supplier-meta">${s.products.length} מוצרים</div>
        </div>
      </div>
      <button class="icon-btn" onclick="openManageFrom('${s.id}','home')" title="נהל">⚙</button>
    </div>
  `).join('');
  main.scrollTop = savedScroll; // restore scroll position
}

function goHome() { renderHome(); }

// ─── Order Draft (persist across navigation, per supplier) ─────────────────
var ALL_DRAFTS_KEY = 'orders-all-drafts';
var OLD_DRAFT_KEY  = 'order-draft'; // legacy — migrate on first load

function migrateOldDraft() {
  try {
    var raw = localStorage.getItem(OLD_DRAFT_KEY);
    if (!raw) return;
    var old = JSON.parse(raw);
    if (!old || !old.supplierId || !old.state) return;
    var drafts = getAllDrafts();
    if (!drafts[old.supplierId]) {          // only migrate if no new draft exists
      drafts[old.supplierId] = { state: old.state, ts: old.ts || Date.now() };
      localStorage.setItem(ALL_DRAFTS_KEY, JSON.stringify(drafts));
    }
    localStorage.removeItem(OLD_DRAFT_KEY); // clean up old key
  } catch(e) {}
}

function getAllDrafts() {
  try { return JSON.parse(localStorage.getItem(ALL_DRAFTS_KEY) || '{}'); } catch(e) { return {}; }
}
function saveDraft() {
  var drafts = getAllDrafts();
  drafts[currentSupplierId] = { state: orderState, ts: Date.now() };
  localStorage.setItem(ALL_DRAFTS_KEY, JSON.stringify(drafts));
}
function clearDraft() {
  var drafts = getAllDrafts();
  delete drafts[currentSupplierId];
  localStorage.setItem(ALL_DRAFTS_KEY, JSON.stringify(drafts));
}
function loadDraft(supplierId) {
  var drafts = getAllDrafts();
  return (drafts[supplierId] && drafts[supplierId].state) ? drafts[supplierId].state : null;
}
function hasDraftFor(supplierId) {
  var drafts = getAllDrafts();
  if (!drafts[supplierId]) return false;
  var st = drafts[supplierId].state || {};
  return Object.keys(st).some(function(pid) {
    var v = st[pid];
    if (!v) return false;
    if (v.isManual) return (parseInt(v.qty)||0) > 0;
    if (v.unit === 'both') return (parseInt(v.carton)||0) > 0 || (parseInt(v.units)||0) > 0;
    return (parseInt(v.qty)||0) > 0;
  });
}

// ─── Order Counter ──────────────────────────────────────────────────────────
function updateOrderCounter() {
  var el = document.getElementById('order-counter');
  if (!el) return;
  var items = getOrderedItems();
  var totalCartons = 0, totalUnits = 0;
  items.forEach(function(it) {
    if (it.unit === 'קרטון') totalCartons += parseInt(it.qty) || 0;
    else totalUnits += parseInt(it.qty) || 0;
  });
  var parts = [];
  if (totalCartons > 0) parts.push('📦 ' + totalCartons + ' קרטון');
  if (totalUnits > 0) parts.push('🔢 ' + totalUnits + ' יחידות');
  if (parts.length) {
    el.textContent = parts.join('  ·  ');
    el.hidden = false;
  } else {
    el.textContent = '';
    el.hidden = true;
  }
}

function saveDraftAndGo() {
  saveDraft();
  goHome();
  toast('טיוטא נשמרה ✓', 'success');
}

// ─── ORDER ─────────────────────────────────────────────────────────────────
function openOrder(supplierId) {
  currentSupplierId = supplierId;
  const sup = findSupplier(supplierId);
  if (!sup) return;

  // Try to restore saved draft for this supplier
  const draft = loadDraft(supplierId);
  if (draft) {
    orderState = draft;
    // Add any new active products missing from draft
    sup.products.filter(p => p.active !== false).forEach(p => {
      if (!orderState[p.id]) {
        orderState[p.id] = p.defaultUnit === 'both'
          ? { unit: 'both', carton: '0', units: '0' }
          : { qty: '0', unit: p.defaultUnit };
      }
    });
  } else {
    orderState = {};
    sup.products.filter(p => p.active !== false).forEach(p => {
      orderState[p.id] = p.defaultUnit === 'both'
        ? { unit: 'both', carton: '0', units: '0' }
        : { qty: '0', unit: p.defaultUnit };
    });
  }

  document.getElementById('order-title').textContent = sup.name;
  document.getElementById('order-date').textContent = fmtDate(new Date());
  show('order');
  renderOrderProducts(sup, !!draft);
  updateOrderCounter();
}

function renderOrderProducts(sup, hasDraft) {
  const main = document.getElementById('order-main');
  const activeProducts = sup.products.filter(p => p.active !== false);

  if (!activeProducts.length) {
    main.innerHTML = `
      <div class="empty fade-up">
        <div class="empty-icon">🛒</div>
        <div class="empty-title">אין מוצרים פעילים</div>
        <div class="empty-desc">לחץ ⚙ למעלה כדי להוסיף או להפעיל מוצרים</div>
      </div>`;
    return;
  }

  main.innerHTML = `

function toggleUnit(pid) {
  const st = orderState[pid];
  if (!st) return;
  st.unit = st.unit === 'קרטון' ? 'יחידות' : 'קרטון';
  const btn = document.getElementById('ut-' + pid);
  if (btn) {
    const isCarton = st.unit === 'קרטון';
    btn.textContent = isCarton ? '📦 קרטון' : '🔢 יחידות';
    btn.className = 'unit-toggle ' + (isCarton ? 'is-carton' : 'is-units');
  }
  saveDraft();
  updateOrderCounter();
}

function stepQty(pid, delta) {
  const st = orderState[pid];
  if (!st) return;
  const cur = parseInt(st.qty) || 0;
  const next = Math.max(0, cur + delta);
  st.qty = String(next);
  const el = document.getElementById('qd-' + pid);
  if (el) {
    el.textContent = next;
    el.className = 'step-val' + (next === 0 ? ' zero' : '');
  }
  saveDraft();
  updateOrderCounter();
}

function setProductNote(pid, value) {
  if (orderState[pid]) { orderState[pid].notes = value; saveDraft(); }
}

function stepQtyBoth(pid, type, delta) {
  const st = orderState[pid];
  if (!st) return;
  const cur = parseInt(st[type]) || 0;
  const next = Math.max(0, cur + delta);
  st[type] = String(next);
  const elId = type === 'carton' ? 'qc-' : 'qu-';
  const el = document.getElementById(elId + pid);
  if (el) {
    el.textContent = next;
    el.className = 'step-val' + (next === 0 ? ' zero' : '');
  }
  saveDraft();
  updateOrderCounter();
}

// ─── Helper: collect ALL ordered items (catalog + manual) ───────────────────
function getOrderedItems() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return [];
  const items = [];
  // Catalog products
  sup.products.forEach(p => {
    const st = orderState[p.id];
    if (!st) return;
    if (st.unit === 'both') {
      const qc = parseInt(st.carton) || 0;
      const qu = parseInt(st.units) || 0;
      if (qc > 0) items.push({ name: p.name, qty: String(qc), unit: 'קרטון', notes: st.notes || '' });
      if (qu > 0) items.push({ name: p.name, qty: String(qu), unit: 'יחידות', notes: st.notes || '' });
    } else {
      const qty = parseInt(st.qty) || 0;
      if (qty > 0) items.push({ name: p.name, qty: st.qty, unit: st.unit, notes: st.notes || '' });
    }
  });
  // Manual items
  Object.keys(orderState).filter(k => k.startsWith('manual_')).forEach(k => {
    const st = orderState[k];
    if (!st || !st.isManual) return;
    const qty = parseInt(st.qty) || 0;
    if (qty > 0) items.push({ name: st.name, qty: String(qty), unit: st.unit, notes: st.notes || '' });
  });
  return items;
}

function getFullSummaryItems() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return [];
  const items = [];
  sup.products.filter(p => p.active !== false).forEach(p => {
    const st = orderState[p.id] || (p.defaultUnit === 'both'
      ? { unit:'both', carton:'0', units:'0', notes:'' }
      : { qty:'0', unit:p.defaultUnit, notes:'' });
    if (st.unit === 'both') {
      items.push({ name: p.name, qty: String(parseInt(st.carton)||0), unit: 'קרטון', notes: st.notes || '' });
      items.push({ name: p.name, qty: String(parseInt(st.units)||0), unit: 'יחידות', notes: st.notes || '' });
    } else {
      items.push({ name: p.name, qty: String(parseInt(st.qty)||0), unit: st.unit || p.defaultUnit || 'קרטון', notes: st.notes || '' });
    }
  });
  Object.keys(orderState||{}).filter(k => k.startsWith('manual_')).forEach(k => {
    const st = orderState[k];
    if (!st || !st.isManual) return;
    items.push({ name: st.name, qty: String(parseInt(st.qty)||0), unit: st.unit || 'קרטון', notes: st.notes || '' });
  });
  return items;
}

// ─── Manual items CRUD ──────────────────────────────────────────────────────
function addManualProduct() {
  const name = manualAddState.name.trim();
  if (!name) { toast('הזן שם מוצר', 'error'); return; }
  const qty = parseInt(manualAddState.qty) || 0;
  if (qty <= 0) { toast('הזן כמות', 'error'); return; }

  const sup = findSupplier(currentSupplierId);
  if (!sup) return;

  // Add permanently to supplier catalog
  const newProduct = { id: uid(), name, defaultUnit: manualAddState.unit, active: true };
  sup.products.push(newProduct);

  // Set initial quantity in this order
  orderState[newProduct.id] = { qty: String(qty), unit: manualAddState.unit, notes: '' };

  manualAddState.name = '';
  manualAddState.qty = 1;

  saveDb(true);
  pushSuppliers();
  saveDraft();
  renderOrderProducts(sup, true);
  toast('מוצר נוסף לרשימה ✓', 'success');
  setTimeout(() => { const inp = document.getElementById('manual-name-inp'); if (inp) inp.focus(); }, 80);
}

function removeManualItem(mid) {
  delete orderState[mid];
  saveDraft();
  updateOrderCounter();
  renderOrderProducts(findSupplier(currentSupplierId), hasDraftFor(currentSupplierId));
}

function stepManualItem(mid, delta) {
  const st = orderState[mid];
  if (!st) return;
  const next = Math.max(0, (parseInt(st.qty) || 0) + delta);
  st.qty = String(next);
  const el = document.getElementById('qd-' + mid);
  if (el) { el.textContent = next; el.className = 'step-val' + (next === 0 ? ' zero' : ''); }
  saveDraft();
  updateOrderCounter();
}

function toggleManualItemUnit(mid) {
  const st = orderState[mid];
  if (!st) return;
  st.unit = st.unit === 'קרטון' ? 'יחידות' : 'קרטון';
  const btn = document.getElementById('ut-' + mid);
  if (btn) {
    const isC = st.unit === 'קרטון';
    btn.textContent = isC ? '📦 קרטון' : '🔢 יחידות';
    btn.className = 'unit-toggle ' + (isC ? 'is-carton' : 'is-units');
  }
  saveDraft();
}

// ─── Transfer item to another supplier ─────────────────────────────────────
function openTransferSheet(pid, name) {
  _transferData = { pid, name };
  document.getElementById('transfer-item-name').textContent = `"${name}"`;
  const others = (db.suppliers || []).filter(s => s.id !== currentSupplierId);
  document.getElementById('transfer-supplier-list').innerHTML = others.length
    ? others.map(s => `
        <button onclick="executeTransfer('${s.id}')"
          style="display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-family:inherit;text-align:right;transition:background 0.12s"
          onmouseenter="this.style.background='var(--surfaceHi)'" onmouseleave="this.style.background='var(--surface)'">
          <span style="font-size:22px">${s.icon||'🏭'}</span>
          <span style="font-size:14px;font-weight:700;color:var(--text)">${esc(s.name)}</span>
        </button>`).join('')
    : `<div style="text-align:center;padding:20px;color:var(--textDim);font-size:13px">אין ספקים אחרים במערכת</div>`;
  document.getElementById('modal-transfer').hidden = false;
}

function executeTransfer(targetSupplierId) {
  if (!_transferData) return;
  const { pid, name } = _transferData;
  const st = orderState[pid];
  if (!st) { closeModal('modal-transfer'); _transferData = null; return; }

  // Guard: nothing to transfer if qty = 0
  const totalQty = st.unit === 'both'
    ? (parseInt(st.carton)||0) + (parseInt(st.units)||0)
    : (parseInt(st.qty)||0);
  if (totalQty === 0) {
    closeModal('modal-transfer');
    _transferData = null;
    toast('אין כמות להעברה — הזן כמות קודם', 'error');
    return;
  }

  const drafts = getAllDrafts();
  const targetState = (drafts[targetSupplierId] && drafts[targetSupplierId].state) || {};
  const fromName = findSupplier(currentSupplierId)?.name || '';

  // Create manual item(s) in target draft + zero source
  if (st.unit === 'both') {
    const qc = parseInt(st.carton) || 0;
    const qu = parseInt(st.units) || 0;
    if (qc > 0) targetState['manual_' + uid()] = { isManual:true, name, unit:'קרטון', qty:String(qc), notes:'' };
    if (qu > 0) targetState['manual_' + uid()] = { isManual:true, name, unit:'יחידות', qty:String(qu), notes:'' };
    st.carton = '0'; st.units = '0';
  } else {
    targetState['manual_' + uid()] = { isManual:true, name, unit:st.unit, qty:String(parseInt(st.qty)), notes:'' };
    st.qty = '0';
  }

  // If source was a manual item — remove it from orderState entirely
  if (pid.startsWith('manual_')) delete orderState[pid];

  // Persist both source and target drafts
  drafts[targetSupplierId] = { state: targetState, ts: Date.now() };
  localStorage.setItem(ALL_DRAFTS_KEY, JSON.stringify(drafts));
  saveDraft(); // saves current supplier with zeroed qty

  closeModal('modal-transfer');
  // renderOrderProducts calls updateOrderCounter() internally now
  renderOrderProducts(findSupplier(currentSupplierId), hasDraftFor(currentSupplierId));

  // Also update the badge on the target supplier's card on home screen (if visible)
  const targetCard = document.getElementById('sc-' + targetSupplierId);
  if (targetCard) {
    const nameEl = targetCard.querySelector('.supplier-name');
    if (nameEl && !nameEl.querySelector('.supplier-draft-badge')) {
      nameEl.insertAdjacentHTML('beforeend', ' <span class="supplier-draft-badge">📋 טיוטא</span>');
    }
  }

  toast(`⇄ הועבר ל${findSupplier(targetSupplierId)?.name||''} ✓`, 'success');
  _transferData = null;
}

function clearOrder() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return;
  sup.products.forEach(p => {
    if (p.defaultUnit === 'both') {
      orderState[p.id] = { unit: 'both', carton: '0', units: '0', notes: '' };
      ['qc-','qu-'].forEach(pre => {
        const el = document.getElementById(pre + p.id);
        if (el) { el.textContent = '0'; el.className = 'step-val zero'; }
      });
    } else {
      orderState[p.id] = { qty: '0', unit: p.defaultUnit, notes: '' };
      const el = document.getElementById('qd-' + p.id);
      if (el) { el.textContent = '0'; el.className = 'step-val zero'; }
      const btn = document.getElementById('ut-' + p.id);
      if (btn) {
        const isCarton = p.defaultUnit === 'קרטון';
        btn.textContent = isCarton ? '📦 קרטון' : '🔢 יחידות';
        btn.className = 'unit-toggle ' + (isCarton ? 'is-carton' : 'is-units');
      }
    }
    const noteEl = document.getElementById('note-' + p.id);
    if (noteEl) noteEl.value = '';
  });
  // Remove manual items
  Object.keys(orderState).filter(k => k.startsWith('manual_')).forEach(k => delete orderState[k]);
  manualAddState = { name: '', qty: 1, unit: 'קרטון' };
  clearDraft();
  updateOrderCounter();
  toast('ההזמנה נוקתה');
}

function exportOrder() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return;
  const orderedItems = getOrderedItems();
  if (!orderedItems.length) { toast('אין פריטים בהזמנה', 'error'); return; }

  const dateStr = fmtDate(new Date());
  const lines = orderedItems.map(it => `${it.name}: ${it.qty} ${it.unit}${it.notes ? ' — ' + it.notes : ''}`);
  const text = `📋 הזמנה - ${sup.name}\n📅 ${dateStr}\n\n${lines.join('\n')}\n\nתודה!`;

  openWhatsAppText(text);
  // Just show the text — draft stays alive until user confirms "נשלחה"
  document.getElementById('export-text').textContent = text;
  document.getElementById('modal-export').hidden = false;
}

function summaryOrder() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return;
  const summaryItems = getOrderedItems();
  if (!summaryItems.length) { toast('אין פריטים בהזמנה', 'error'); return; }
  const dateStr = fmtDate(new Date());
  const lines = summaryItems.map(it => `${it.name}: ${it.qty} ${it.unit}${it.notes ? ' — ' + it.notes : ''}`);
  const text = `סיכום הזמנה - ${sup.name}\n${dateStr}\n\n${lines.join('\n')}`;
  document.getElementById('export-text').textContent = text;
  document.getElementById('modal-export').hidden = false;
}

function openWhatsAppText(text) {
  if (!text) return;
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(()=>{});
  } catch(e) {}
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  const win = window.open(url, '_blank', 'noopener,noreferrer');
  if (!win) window.location.href = url;
}

function confirmOrderSent() {
  const sup = findSupplier(currentSupplierId);
  if (!sup) return;
  const orderedItems = getOrderedItems();
  if (!orderedItems.length) { toast('אין פריטים בהזמנה', 'error'); return; }

  const dateStr = fmtDate(new Date());
  const lines = orderedItems.map(it => `${it.name}: ${it.qty} ${it.unit}${it.notes ? ' — ' + it.notes : ''}`);
  const text = `📋 הזמנה - ${sup.name}\n📅 ${dateStr}\n\n${lines.join('\n')}\n\nתודה!`;

  // Save to history
  if (!db.history) db.history = [];
  db.history.unshift({ id: uid(), supplierId: sup.id, supplierName: sup.name,
    dateStr, timestamp: Date.now(), items: orderedItems, text });
  if (db.history.length > 200) db.history = db.history.slice(0, 200);

  // Add to active orders for delivery tracking
  if (!db.activeOrders) db.activeOrders = [];
  db.activeOrders.unshift({ id: uid(), supplierId: sup.id, supplierName: sup.name,
    dateOrdered: dateStr, timestamp: Date.now(), items: orderedItems, deliveryNoteImage: null });

  saveDb();
  pushActiveOrders();
  clearDraft();
  closeModal('modal-export');
  goHome();
  toast('הזמנה נשלחה ✓', 'success');
}

function copyExport() {
  const text = document.getElementById('export-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    toast('הועתק ✓', 'success');
    closeModal('modal-export');
  }).catch(() => {
    const el = document.getElementById('export-text');
    const r = document.createRange(); r.selectNode(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    toast('סמן את הטקסט והעתק ידנית');
  });
}

// ─── Drag & Drop reorder ──────────────────────────────────────────────────
var _dragging = null;

function initDragDrop() {
  document.querySelectorAll('#product-list .manage-row').forEach(function(row) {
    var handle = row.querySelector('.drag-handle');
    if (!handle) return;
    handle.addEventListener('touchstart', function(e) {
      e.preventDefault();
      startDrag(row, e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      startDrag(row, e.clientX, e.clientY);
    });
  });
}

function startDrag(row, startX, startY) {
  if (_dragging) return;
  _dragging = row;
  row.classList.add('dragging');

  function swapToPosition(clientX, clientY) {
    _dragging.style.pointerEvents = 'none';
    var el = document.elementFromPoint(clientX, clientY);
    _dragging.style.pointerEvents = '';
    if (!el) return;
    var target = el.closest('#product-list .manage-row');
    if (!target || target === _dragging) return;
    var parent = document.getElementById('product-list');
    var rows = Array.from(parent.querySelectorAll('.manage-row'));
    var fromIdx = rows.indexOf(_dragging);
    var toIdx = rows.indexOf(target);
    if (fromIdx < toIdx) {
      parent.insertBefore(_dragging, target.nextSibling);
    } else {
      parent.insertBefore(_dragging, target);
    }
  }

  function endDrag() {
    if (!_dragging) return;
    _dragging.classList.remove('dragging');
    var parent = document.getElementById('product-list');
    var domRows = Array.from(parent.querySelectorAll('.manage-row'));
    var sup = findSupplier(currentSupplierId);
    if (sup) {
      var oldProducts = sup.products.slice();
      var newOrder = domRows.map(function(r) { return r.id.replace('mr-', ''); });
      sup.products = newOrder.map(function(id) {
        return oldProducts.find(function(p) { return p.id === id; });
      }).filter(Boolean);
      saveDb(true);
      pushSuppliers();
    }
    _dragging = null;
    renderManage();
  }

  function onTouchMove(e) { e.preventDefault(); swapToPosition(e.touches[0].clientX, e.touches[0].clientY); }
  function onTouchEnd() {
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onTouchEnd);
    endDrag();
  }
  function onMouseMove(e) { swapToPosition(e.clientX, e.clientY); }
  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    endDrag();
  }

  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd);
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
}

function filterManageProducts(query) {
  const q = (query || '').trim().toLowerCase();
  document.querySelectorAll('#product-list .manage-row').forEach(function(row) {
    const name = (row.querySelector('.manage-row-name') || {}).textContent || '';
    row.hidden = !!(q && !name.toLowerCase().includes(q));
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  return `יום ${days[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  el.hidden = false;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => { el.hidden = true; }, 400);
  }, 2200);
}

function deleteActiveOrder(id) {
  if (!confirm('למחוק הזמנה זו מהרשימה?')) return;
  db.activeOrders = (db.activeOrders || []).filter(o => o.id !== id);
  saveDb();
  pushActiveOrders();
  renderActiveOrders();
}

function uploadDeliveryNote(event, orderId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const order = (db.activeOrders || []).find(o => o.id === orderId);
    if (!order) return;
    // Compress image if large
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      order.deliveryNoteImage = canvas.toDataURL('image/jpeg', 0.75);
      saveDb();
      renderActiveOrders();
      toast('תמונה נשמרה ✓', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function addOrderToExpenses(orderId) {
  const order = (db.activeOrders || []).find(o => o.id === orderId);
  if (!order) return;
  const pending = {
    supplier: order.supplierName,
    date: new Date().toISOString().split('T')[0],
    image: order.deliveryNoteImage || null,
    notes: order.items.map(it => `${it.name}: ${it.qty} ${it.unit}`).join(', ')
  };
  localStorage.setItem('pending-expense', JSON.stringify(pending));
  // Remove from active orders after passing to expenses
  db.activeOrders = (db.activeOrders || []).filter(o => o.id !== orderId);
  saveDb();
  pushActiveOrders();
  window.location.href = 'tari-bakfar.html';
}

// ↓↓ אותם ערכים כמו ב-tari-bakfar.html ↓↓
const GOOGLE_CLIENT_ID = '536002139707-9r2ruube0h3p5g8vau42e4ltnrj58vma.apps.googleusercontent.com';
const ALLOWED_EMAILS = [
  'tomermazor@gmail.com',
  'limor1987@gmail.com',
  'tari@taribakfar.co.il',
];

function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('google-user') || 'null'); } catch(e) { return null; }
}
function isAllowed(email) {
  const e = (email||'').trim().toLowerCase();
  // בדיקה ברשימה הדינמית (מנוהלת בהגדרות tari-bakfar)
  try {
    const dynUsers = JSON.parse(localStorage.getItem('tari_users_v1') || 'null');
    if (dynUsers && Array.isArray(dynUsers)) {
      const u = dynUsers.find(x => x.email === e);
      if (u) return u.role !== 'scanner'; // סורק = אין גישה להזמנות
    }
  } catch(ex) {}
  return ALLOWED_EMAILS.some(a => a.trim().toLowerCase() === e);
}
function handleCredentialResponse(response) {
  try {
    const b64 = response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const payload = JSON.parse(atob(b64));
    if (!isAllowed(payload.email)) {
      document.getElementById('login-err').textContent = '🚫 ' + payload.email + ' — אין הרשאה לאפליקציה זו';
      return;
    }
    localStorage.setItem('google-user', JSON.stringify({ email: payload.email, name: payload.name || payload.email, picture: payload.picture || '' }));
    document.getElementById('login-screen').hidden = true;
    initApp();
  } catch(e) {
    document.getElementById('login-err').textContent = 'שגיאה בהתחברות, נסה שנית';
  }
}
function initGoogleSignIn() {
  var loginScreen = document.getElementById('login-screen');
  if (!loginScreen || loginScreen.hidden) return;
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    document.getElementById('login-err').textContent = '⚙️ יש להגדיר Client ID של Google';
    return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton(document.getElementById('google-signin-btn'), { type:'standard', theme:'outline', size:'large', width:260 });
  google.accounts.id.prompt();
}
function onGoogleScriptLoad() {
  if (!document.getElementById('login-screen').hidden) initGoogleSignIn();
}

function initApp() {
  loadDb();
  migrateOldDraft();
  renderHome();
  syncSuppliers();
  syncActiveOrders();
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) { syncSuppliers(); syncActiveOrders(); }
  });
  document.getElementById('app').hidden = false;
}

function checkAuth() {
  var user = getStoredUser();
  if (user && isAllowed(user.email)) {
    initApp();
  } else {
    document.getElementById('login-screen').hidden = false;
    if (typeof google !== 'undefined' && google.accounts) initGoogleSignIn();
  }
}

function logout() {
  if (!confirm('להתנתק מהאפליקציה?')) return;
  var user = getStoredUser();
  localStorage.removeItem('google-user');
  if (typeof google !== 'undefined' && user) google.accounts.id.revoke(user.email, function(){});
  document.getElementById('app').hidden = true;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('login-err').textContent = '';
  setTimeout(initGoogleSignIn, 100);
}

// ─── Init ──────────────────────────────────────────────────────────────────
initTheme();
checkAuth();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    reg.update();
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  }).catch(function() {});
}
